id: xpscript-conflicting-content-length

info:
  name: XPScript Conflicting Content Length Accepted
  author: xpscript
  severity: critical
  description: Detects acceptance of conflicting duplicate Content-Length headers.

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Length: 4
        Content-Length: 5
        Connection: close

        ABCDE

    unsafe: true
    matchers:
      - type: status
        status:
          - 200
