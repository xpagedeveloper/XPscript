id: xpscript-server-header

info:
  name: XPScript Server Header Exposure
  author: xpscript
  severity: low
  description: Detects disclosure of the HTTP server implementation header.

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: regex
        part: header
        regex:
          - "(?im)^Server:"
