openapi: 3.1.0
info:
  title: Pet Store Generator Smoke
  version: 1.0.0
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: includeHistory
          in: query
          required: false
          schema:
            type: boolean
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Pet returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /pets:
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePet'
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        ownerEmail:
          type: string
          format: email
        age:
          type: integer
          format: int32
          minimum: 0
          maximum: 40
    CreatePet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        ownerEmail:
          type: [string, 'null']
          format: email
    ApiError:
      type: object
      required: [message]
      properties:
        message:
          type: string
