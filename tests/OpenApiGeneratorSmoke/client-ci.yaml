openapi: 3.1.0
info:
  title: Client CI
  version: 1.0.0
servers:
  - url: https://api.example.invalid
components:
  schemas:
    Item:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    ItemState:
      type: string
      enum: [new, active, archived]
    NullableLabel:
      type: [string, "null"]
    ItemChoice:
      oneOf:
        - $ref: '#/components/schemas/Item'
        - $ref: '#/components/schemas/Error'
    ItemEnvelope:
      allOf:
        - type: object
          properties:
            source: { type: string }
        - type: object
          properties:
            item: { $ref: '#/components/schemas/Item' }
    Error:
      type: object
      properties:
        message: { type: string }
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer }
paths:
  /items/{id}:
    get:
      operationId: getItem
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: expand, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        default:
          description: error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /items:
    post:
      operationId: createItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Item' }
      responses:
        '200':
          description: items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
