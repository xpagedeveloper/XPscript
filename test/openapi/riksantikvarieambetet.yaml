components:
  schemas:

    PagedLamningResponse:
      type: object
      properties:
        content:
          type: array
          description: Innehåller framsökta poster.
          items:
            $ref: '#/components/schemas/Lamning'
        pageable:
          type: object
          properties:
            sort:
              type: object
              properties:
                sorted:
                  type: boolean
                  description: Anger om något sorteringskriterie angavs i sökningen
                    eller ej.
                  example: false
                unsorted:
                  type: boolean
                  description: Anger om något sorteringskriterie angavs i sökningen
                    eller om tjänstens defaultsortering användes.
                  example: false
                empty:
                  type: boolean
                  example: false
              description: Objektrepresentation avseende sortering av sökresultat.
            pageSize:
              type: number
              description: Anger antalet sökresultat på aktuell sida. Defaultvärde;
                20
              example: 10.0
            pageNumber:
              type: number
              description: Anger aktuell sökresultatsida i sökresultatet. Notera att
                sidnumreringen är nollbaserad.
              example: 1.0
            offset:
              type: number
              description: Anger offset för vilken post(ordningsnummer) som visas
                i aktuell sökresultatsida. Används som index för att generera nästa
                sökresultatsida
              example: 7.0
            paged:
              type: boolean
            unpaged:
              type: boolean
          description: Objektrepresentation av ett paginerat sökresultatsvar.
        totalPages:
          type: integer
          description: Anger det totala antalet resultatsidor för sökresultatet.
        totalElements:
          type: integer
          description: Anger det totala antalet objekt i sökresultatet.
        last:
