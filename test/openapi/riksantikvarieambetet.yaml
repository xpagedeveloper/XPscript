    Lamning:
      type: object
      properties:
        id:
          type: string
          description: Anger lämningens tekniska identitet (uuid).
          format: uuid
          example: 00004af1-67e0-45a4-91d4-d374dbb98ad7
        lamningsnummer:
          type: string
          description: Anger lämningsnumret för lämningen. Lämningsnumret är en människoläsbar
            identitet för lämningen.
          example: L1947:8930
        publiceringsdatum:
          type: string
          description: Anger tidpunkt då lämningen senast publicerades. Tidpunkt angiven
            som Internet Date/Time Format, se RFC3339 (https://xml2rfc.ietf.org/public/rfc/html/rfc3339.html#anchor14")
          format: dateTime
          example: 2019-12-10T16:15:40.1156457+01:00
        version:
          type: number
          description: Anger lämningens aktuella versionsnummer.
          example: 597505.0
        uppdateringstyp:
          type: array
          description: |
            Anger uppdateringstypen som gjorts på en lämning inom angiven period.
            Följande uppdateringstyper kan förekomma:
            - NY - Anger att lämningen är ny och inte förekommer sedan tidigare.
            - UTGAR - Anger att lämningen har makulerats och tagits bort.
            - UPPDATERAD_ANTIKVARISK_BEDOMNING - Anger att lämningens antikvariska bedömning förändrats.
            - UPPDATERAD_GEOMETRI - Anger att lämningens utbredning (geometri) förändrats.
            - UPPDATERAD_LAMNINGSTYP - Anger att att lämningens lämningstyp förändrats.
            - UPPDATERAD_LAGE - Anger att lämningens läge har förändrats. Lämningen kan t ex ha flyttats och fått ett nytt läge. Händelsen bör hanteras som UPPDATERAD_GEOMETRI.
            - UPPDATERAD_PLACERING - Anger att lämningens placering förändrats. Inträffar t ex om en lämning blivit överväxt och därmed blivit 'ej synlig ovan mark' istället för 'synlig ovan mark'.
            - OVRIG_UPPDATERING - Anger att lämningen har genomgått en ospecificerad ändring, t ex att stavfel rättats i ev. beskrivningstext eller liknande.
          items:
            type: string
            enum:
              - NY
              - UTGAR
              - UPPDATERAD_ANTIKVARISK_BEDOMNING
              - UPPDATERAD_GEOMETRI
              - UPPDATERAD_LAMNINGSTYP
              - UPPDATERAD_LAGE
              - UPPDATERAD_PLACERING
              - OVRIG_UPPDATERING
            example: "UTGAR"
        lamningstyp:
          type: object
          properties:
            id:
              type: number
              description: Anger identitet för lämningstypen.
              example: 1037.0
            namn:
              type: string
              description: Anger namnet för lämningstypen.
              example: Fångstgrop
            undertyp:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: number
                    description: Anger identitet för undertypen.
                    example: 316.0
                  namn:
                    type: string
                    description: Anger namnet för undertypen.
                    example: Torp
              description: Anger objektrepresentation för lämningstypens ev. förekommande
                subtyp.
          description: Anger objektrepresentation för lämningstypen.
        antikvariskBedomning:
          type: object
          properties:
            id:
              type: number
              description: Anger identiteten för lämningens antikvariska bedömningstyp.
              example: 1.0
            namn:
              type: string
              description: Anger namnet för lämningens antikvariska bedöming.
              example: Fornlämning
        oforandratLage:
          type: boolean
          description: Anger att lämningens läge är oförändrat. Dvs - lämningen är
            inte flyttad från sin ursprungsplats.
          example: true
        placering:
          type: object
          properties:
            id:
              type: number
              description: Anger identiteten för lämningens placeringstyp.
              example: 1.0
            namn:
              type: string
              description: Anger namnet för lämningens placering.
              example: Synlig ovan mark
        ruin:
          type: boolean
          description: Anger om lämningen är en ruin eller ej utifrån beräknade kriterier
            baserat på lämningstyp, placering och antikvarisk bedömning.
          example: true
        geometri:
          $ref: '#/components/schemas/FeatureCollectionLamning'
        centrumpunkt:
          type: object
          properties:
            type:
              type: string
              example: FeatureCollection
            crs:
              type: object
              properties:
                type:
                  type: string
                  example: name
                properties:
                  type: object
                  properties:
                    name:
                      type: string
                      example: urn:ogc:def:crs:EPSG::3006
            features:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: Feature
                  geometry:
                    $ref: '#/components/schemas/Point'
          description: Anger lämningen beräknade centrumpunkt i GeoJson[2008] format.
        lan:
          type: array
          description: Anger lista av de län lämningen är belägen inom.
          items:
            type: object
            properties:
              id:
                type: string
                description: Anger identitet för länet.
                example: "23"
              namn:
                type: string
                description: Anger namnet för länet.
                example: jämtland
        registreringsunderlag:
          type: object
          properties:
            id:
              type: integer
              description: Anger identitet för den registreringsunderlagstyp som användes
                vid inmätningen.
              example: 101
            namn:
              type: string
              description: Anger namnet för den registreringsunderlagstyp som användes
                vid inmätningen.
              example: Fastighetskartan/utskrivet ortofoto
            kvalitettyp:
              type: object
              properties:
                id:
                  type: number
                  description: Anger identitet för den registreringsunderlagskvalitetstyp
                    som användes vid inmätningen. Registreringsunderlagskvalittetypen
                    är alltid kopplad till det registreringsunderlag som användes
                    vid inmätningen.
                  example: 204.0
                namn:
                  type: string
                  description: Anger namnet för den registreringsunderlagskvalitetstyp
                    som användes vid inmätningen.
                  example: Skala 1:10000
              description: Anger objektrepresentation för den kvalitet som användes
                vid inmätningen av lämningen.
          description: Anger objektrepresentation för det registreringsunderlag som
            användes vid inmätningen av lämningen.
        matmetod:
          type: object
          properties:
            id:
              type: integer
              description: Anger identitet för den mätmetodtyp som användes vid inmätningen.
              example: 5
            namn:
              type: string
              description: Anger namnet för den mätmetod som användes vid inmätningen.
              example: Manuell inprickning
          description: Objektrepresentation av den mätmetod som användes vid inmätning
            av lämningen.
        medelfel:
          type: string
          description: Anger inmätningens felmarginal uttryckt i meter.
          example: "10.0"
        url:
          type: string
          description: Anger url till websida som visar objektet.
          example: https://pub.raa.se/visa/objekt/lamning/dedfd906-a811-4b91-b9ab-64685eb152c2
      description: Lämning modell
