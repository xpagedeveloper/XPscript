    ErrorModel:
      type: object
      properties:
        timestamp:
          type: string
          description: Anger tidpunkten när felet inträffade. Tidpunkt angiven som
            date-time, se RFC3339 (Internet Date/Time Format)
          format: date-time
          example: '2020-01-16T15:57:44.167+01:00'
        status:
          type: integer
          description: Anger http statuskod.
          format: int32
          example: 400
        message:
          type: string
          description: Innehåller ett felmeddelande tänkt att presenteras för slutanvändare.
          example: Ogiltig indata
        errorCode:
          type: string
          nullable: true
          description: Anger ett unikt felmeddelande för aktuellt fel.
          example: null
        errorGroup:
          type: string
          nullable: true
          description: Anger typ av fel. Skapas genom att en hash tas av stacktracen.
        path:
          type: string
          description: Anger den resourcepath där felet uppstod.
          example: /bebyggelse/byggnader
        errorFields:
          type: object
          nullable: true
          properties:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ErrorField'
          description: |
            Innehåller information om vad som gått fel vid validering av indata
            till tjänsten.
            
            objektet består av attribut namnsatta efter namnet på indata-fältet
            som inte kunde valideras.
            
            Varje attribut består i sin tur av en array av objekt av typen
            ErrorField som beskrivet ett unikt fel för attributet. För varje
            sådant fel som uppstått skapas en post i arrayen.
        errorParse:
          type: object
          nullable: true
          #          properties: {}
          description: Anger ev. parsningsfel som uppstått vid parsning av indata.
            Om inget fel uppstått är värdet null.
        developerMessage:
          type: string
          nullable: true
          description: Innehåller information om felet som inträffat. Avsett för utvecklare.
            Det som returernas är e.getMessage(). Per default är denna inaktiverad
            i produktion men aktiv i övriga miljöer.
        developerTrace:
          type: string
          nullable: true
          description: Innehåller stacktracen för felet som inträffat. Det som returneras
            är stacktracen filtrerad på fel av typen "se.raa.*" fel.
      description: Objektrepresentation av felmeddelanden.
    ErrorField:
      type: object
      properties:
        field:
          type: string
          description: Anger namnet på htmlformulärsfält som var felaktigt.
          example: page
        rejectedValue:
          type: object
          properties: {}
          description: Innehåller ett objekt där vad felet bestod i framgår. Notera
            attdatatyp skiljer sig åt beroende  på typ av fel.
          example: abc123
        message:
          type: string
          description: Innehåller beskrivande felmeddelande avsett att visa upp för
            slutanvändare.
          example: Måste vara ett heltal
      description: Objekt som beskriver ett unikt fel från servern.

    FeatureCollectionLamning:
      description: |
        Anger lämningens utbredning (geometri) i GeoJson[2008] format.
        "https://geojson.org/geojson-spec.html#feature-collection-objects".
        De geometrityper som kan förekomma är av någon av typerna:
        - Point ("https://geojson.org/geojson-spec.html#point")
        - LineString ("https://geojson.org/geojson-spec.html#linestring")
        - Polygon ("https://geojson.org/geojson-spec.html#polygon")
      type: object
      required:
        - type
      additionalProperties: true
      properties:
        type:
          type: string
          enum:
            - FeatureCollection
        crs:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - name
            properties:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: 'urn:ogc:def:crs:EPSG::3006'
                  description: Anger koordinatsystemet för geometrin.
        features:
          type: array
          items:
            type: object
            required:
              - type
            properties:
              type:
                type: string
                enum:
                  - Feature
              id:
                type: string
                description: Anger unik och stabil identitet (geometrinummer) för aktuell feature.
                example: 'L2017:105-4'
              geometry:
                oneOf:
                  - $ref: '#/components/schemas/Point'
                  - $ref: '#/components/schemas/Polygon'
                  - $ref: '#/components/schemas/LineString'
                example:
                  type: 'Polygon'
                  coordinates: '[[[490109.3,6229117.8],[490154.8,6229148.0],[490123.5,6229155.9],[490109.3,6229117.8]]]'
                  properties: {}

    Point:
      description: >-
        Point ("https://geojson.org/geojson-spec.html#point")
      type: object
      required:
