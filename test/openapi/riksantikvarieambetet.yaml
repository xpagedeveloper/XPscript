  parameters:
    pageParameter:
      name: page
      in: query
      description: Anger index för önskad resultatsida. Notera att indexet är nollbaserat.
        Dvs vill man hämta första sidan anger man page=0.
      schema:
        type: number
        format: number
    sizeParameter:
      name: size
      in: query
      description: Anger antalet sökresultat per sida (begränsas till max antal 10000
        objekt).
      schema:
