openapi: 3.0.3
info:
  title: Datauttag
  description: |
    API dokumentation för Riksantikvarieämbetets Direktåtkomsttjänster inom Öppna data.
    Med Direktåtkomsttjänster avses här REST-baserade tjänster avsedda att användas vid maskin-till-maskin integration.
    
    # Datamängder
    Direkttjänster finns framtagna för nedanstående datamängder.
    
    ## Lämningsinformation
    När en klient hämtar data ur tjänsten anger klienten en tidsperiod och får då reda på summan av förändringar som skett för en entitet i den aktuella tidsperioden.
    Man får alltså inte ut en ändringspost per förändring från tjänsten.
    Endast summan av alla ev. förekommande förändringar inom tidsperioden jämfört med hur lämningen såg ut INNAN angiven tidsperiod!
    
    ## Klassificering-lämningsinformation
    Tjänster för metadataklassificeringar för lämningsinformation
    
    # Rekommenderad användning av Riksantikvarieämbetets direktåtkomsttjänster
    Riksantikvarieämbetets direktåtkomsttjänster är i första hand avsedda att användas enligt följande integrationsmönster.
    Tanken här är att en klient använder först någon av Riksantikvarieämbetets nedladdningstjänster för en given datamängd.
    Klienten laddar då ned ett datauttag (geopackage format) som används för att grundladda klientens eget system.
    Därefter anropar klienten direktåtkomsttjänster för att hämta de förändringar som skett inom datamängden ”sen sist”.
    Klienten kan därmed själv styra över hur ofta klientens system ska uppdateras med de förändringar som skett i Riksantikvarieämbetet källsystem.
    
    När en förändring skett för t ex en viss lämning är rekommendationen att klienten först raderar all befintlig information för lämningen i sitt system
    och ersätter sedan med informationen som kom med i förändringen för lämningen.
    
    ### Uppdateringsintervall
    Data i tjänsten uppdateras varje natt mellan 00:00 - 04:00 för föregående dag.
    Detta innebär att en klient måste alltid anropa efter kl 04:00 varje natt för att hämta gårdagens förändringar.

  termsOfService: N/A.
  contact:
    name: Frågor kring Riksantikvarieämbetets Direktåtkomsttjänster skickas till support@raa.se.
      Ange "Publiceringsplattform, Direktåtkomsttjänster" som rubrik i ditt meddelande.
    email: support@raa.se
  license:
    name: CC0 1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  version: 1.2.0
servers:
  - url: /datauttag
tags:
  - name: Lämningar
    description: Tjänster kopplade till Riksantikvarieämbetets lämningsinformation.
  - name: Klassificering-lämningsinformation
    description: Information om Riksantikvarieämbetets befintliga metadataklassificeringar
      avseende lämningsinformation.

paths:
  /lamningar:
    get:
      tags:
        - Lämningar
      summary: Hämtar information om uppdaterade lämningar
      description: Hämtar information om uppdaterade lämningar.
      operationId: lamning
      parameters:
        - name: from
          in: query
          description: Parameter som anger från och med vilket datum (yyyy-MM-dd) valda
            ändringar ska ha gjorts. Endast förflutna datum är tillåtna.
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Parameter som anger till och med vilket datum (yyyy-MM-dd) valda
            ändringar ska ha gjorts. Endast förflutna datum är tillåtna.
          required: true
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Anger index för önskad resultatsida. Notera att indexet är nollbaserat.
            Dvs vill man hämta första sidan anger man page=0.
          schema:
            type: number
            format: number
        - name: size
          in: query
          description: Anger antalet sökresultat per sida (begränsas till max antal
            10000 objekt).
          schema:
            type: number
            format: number
        - name: sort
          in: query
          description: |
            Anger sorteringsordningen för sökresultat.
            Sorteringsordning anges genom att skriva ett attributnamn i responsen sökresultatet ska sorteras efter.
            Även ordningsföljden för sortering kan anges. Tillåtna värden för sorteringsordningen är 'asc' (stigande) samt 'desc' (fallande).
            Antag att ett sökresultat innehåller attributen 'namn', 'skostorlek'.
            En klient kan då göra en sökning och sortera sökresultatet i önskad sorteringsordning.
            Exempel 1: 'namn' (sorterar på namn i alfabetisk ordning, default är fallande sorteringsordning)
            Exempel 2: 'skostorlek,desc'  (sorterar på skostorlek, stigande sorteringsordning)
            Nedanstående fält kan anges för sortering&#58;
            * id
            * lamningsnummer
            * publiceringsdatum
            * lamningstyp
            * antikvariskBedomning
            * oforandratLage
            * placering
            * ruin
          schema:
            type: string
            format: sort
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLamningResponse'
        400:
          description: (Bad request). Felaktigt indata angavs till tjänsten (typiskt
            valideringsfel).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        500:
          description: (Internal server error). Ett oväntat fel inträffade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        503:
          description: (Service Unavailable). Inträffar typiskt när tjänsten har ett
            externt beroende till en tjänst som inte svarade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
