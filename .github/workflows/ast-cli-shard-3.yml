name: AST CLI Shard 3 (Windows)

on:
  push:
    branches: [investigate-ast-compiler]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-shard-3:
    name: Native JSON and XML surfaces
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run CLI shard 3
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/ast-compile-probe/run-ast-cli-shard-3.ps1
