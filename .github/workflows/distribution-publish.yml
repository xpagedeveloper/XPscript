name: Distribution Publish

on:
  pull_request:
    paths:
      - 'src/XPScript.Cli/**'
      - 'src/XPScript.Compiler/XPScript.Compiler.csproj'
      - 'src/XPScript.UI.Desktop/**'
      - 'src/XPScript.Web.Cgi/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Web.FastCgi/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'scripts/publish-distributions.ps1'
      - 'docs/getting-started.md'
      - '.github/workflows/distribution-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish distributions
        shell: pwsh
        run: ./scripts/publish-distributions.ps1 -Package all
      - name: Verify distribution outputs
        shell: pwsh
        run: |
          $required = @(
            'artifacts/distributions/compiler',
            'artifacts/distributions/desktop-runtime',
            'artifacts/distributions/cgi',
            'artifacts/distributions/fastcgi',
            'artifacts/distributions/kestrel'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing distribution folder: $path" }
            if (-not (Get-ChildItem $path -File -ErrorAction SilentlyContinue)) { throw "Distribution is empty: $path" }
          }

          if (-not (Get-ChildItem 'artifacts/distributions/compiler' -File | Where-Object Name -Match '^xpscriptc(\.exe)?$|^xpscriptc\.dll$')) {
            throw 'Compiler distribution does not contain xpscriptc.'
          }
          if (-not (Get-ChildItem 'artifacts/distributions/cgi' -File | Where-Object Name -Match '^XPScript\.Web\.Cgi(\.exe)?$|^XPScript\.Web\.Cgi\.dll$')) {
            throw 'CGI distribution does not contain the CGI host.'
          }
          foreach ($path in @('artifacts/distributions/fastcgi','artifacts/distributions/kestrel')) {
            if (-not (Get-ChildItem $path -File | Where-Object Name -Match '^xpscript(\.exe)?$|^xpscript\.dll$')) {
              throw "Web distribution does not contain xpscript: $path"
            }
          }
