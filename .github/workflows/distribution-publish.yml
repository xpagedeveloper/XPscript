name: Distribution Publish

on:
  pull_request:
    paths:
      - 'src/XPScript.Cli/**'
      - 'src/XPScript.Compiler/XPScript.Compiler.csproj'
      - 'src/XPScript.Compiler/Program.cs'
      - 'src/XPScript.Compiler.Core/**'
      - 'src/XPScript.UI.Desktop/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Web.FastCgi/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'scripts/publish-distributions.ps1'
      - '.github/workflows/distribution-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish unified toolchain
        shell: pwsh
        run: ./scripts/publish-distributions.ps1
      - name: Verify unified publish output
        shell: pwsh
        run: |
          $path = 'publish/xpscript'
          if (-not (Test-Path $path)) { throw "Missing publish folder: $path" }
          if (-not (Get-ChildItem $path -File -ErrorAction SilentlyContinue)) { throw "Publish folder is empty: $path" }
          if (-not (Get-ChildItem $path -File | Where-Object Name -Match '^xpscript(\.exe)?$|^xpscript\.dll$')) {
            throw 'Unified publish output does not contain xpscript.'
          }
      - name: Verify CLI version output
        shell: pwsh
        run: |
          $expected = 'XPScript Version 1.0 - (c) XPageDeveloper.com 2026'
          foreach ($option in @('--version', '--info', '--debug')) {
            $output = & ./publish/xpscript/xpscript $option
            if ($LASTEXITCODE -ne 0) { throw "xpscript $option exited with code $LASTEXITCODE." }
            if (($output -join "`n").Trim() -ne $expected) { throw "Unexpected xpscript $option output: $($output -join ' | ')" }
          }

          $defaultOutput = & ./publish/xpscript/xpscript
          if ($LASTEXITCODE -ne 0) { throw "xpscript without arguments exited with code $LASTEXITCODE." }
          if ($defaultOutput[0] -ne $expected) { throw "Expected version banner as first line without arguments." }
      - name: Upload XPscript toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpscript-toolchain
          path: publish/xpscript/
          if-no-files-found: error
          retention-days: 14
