name: Patch ByRef Overload Once

on:
  push:
    branches: [todo-overload-byref]
    paths:
      - '.github/workflows/patch-byref-overload-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-overload-byref
      - name: Patch overload-aware ByRef lowering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/XPScript.Compiler/CoreCompatibilityTranspiler.cs')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('private readonly Dictionary<string, ProcedureInfo> _procedures = new(StringComparer.OrdinalIgnoreCase);',
               'private readonly List<ProcedureInfo> _procedures = [];'),
              ('_procedures[ProcedureKey(proc.Name, currentClass)] = proc;',
               '_procedures.Add(proc);'),
              ('return _procedures.TryGetValue(ProcedureKey(match.Groups[1].Value, className), out var info) ? info : null;',
               'return ParseProcedureHeader(line, className);'),
              ('foreach (var proc in _procedures.Values.Where(x => x.Parameters.Any(p => p.ByRef && !p.IsArray && !p.IsList)))',
               'foreach (var proc in _procedures.Where(x => x.Parameters.Any(p => p.ByRef && !p.IsArray && !p.IsList)))'),
              ('throw new CompilerException($"ByRef argument {i + 1} for {proc.Name} must be assignable.");',
               'return proc.Name + "(" + argsRaw + ")";'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected source fragment not found: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "xpagedeveloper"
          git config user.email "fredrik@xpagedeveloper.com"
          git add src/XPScript.Compiler/CoreCompatibilityTranspiler.cs
          git diff --cached --quiet && exit 0
          git commit -m "Make scalar ByRef lowering overload-aware"
          git push origin HEAD:todo-overload-byref
