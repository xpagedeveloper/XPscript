name: Patch ByRef Overload Once

on:
  push:
    branches: [todo-overload-byref]
    paths:
      - '.github/workflows/patch-byref-overload-once.yml'
      - 'scripts/patch-byref-overload.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-overload-byref
      - name: Patch typed member ByRef call lowering
        run: python3 scripts/patch-byref-overload.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "xpagedeveloper"
          git config user.email "fredrik@xpagedeveloper.com"
          git add src/XPScript.Compiler/CoreCompatibilityTranspiler.cs
          git diff --cached --quiet && exit 0
          git commit -m "Lower typed member scalar ByRef overload calls"
          git push origin HEAD:todo-overload-byref
