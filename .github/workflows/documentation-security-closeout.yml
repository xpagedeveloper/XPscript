name: Documentation Security Closeout

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'tools/validate_docs.py'
      - '.github/workflows/documentation-security-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate documentation structure
        run: python tools/validate_docs.py

      - name: Verify security guidance remains present
        shell: pwsh
        run: |
          $evaluate = Get-Content -Raw 'docs/evaluate.md'
          $web = Get-Content -Raw 'docs/web.md'
          $gettingStarted = Get-Content -Raw 'docs/getting-started.md'
          $rules = Get-Content -Raw 'docs/documentation-rules.md'

          if (-not $evaluate.Contains('Do not pass untrusted user input directly to `Evaluate`')) {
            throw 'Evaluate security guidance is missing.'
          }
          foreach ($fragment in @('web root','request','CGI','FastCGI','Kestrel')) {
            if (-not (($web + "`n" + $gettingStarted).Contains($fragment))) {
              throw "Web documentation is missing security/hosting context: $fragment"
            }
          }
          if (-not $rules.Contains('English')) { throw 'Documentation language policy is missing.' }
