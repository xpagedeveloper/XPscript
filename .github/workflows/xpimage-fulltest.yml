name: XPImage FullTest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xpimage:
    name: XPImage (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile and run XPImage
        shell: pwsh
        run: |
          $compiler = (Resolve-Path './src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll').Path
          New-Item -ItemType Directory -Force ./out/xpimage | Out-Null
          dotnet $compiler ./samples/xpimage-runtime.xps -o ./out/xpimage/xpimage-runtime --runtime=false --debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plain = './out/xpimage/xpimage-runtime'
          $win = "$plain.exe"
          if (Test-Path $win -PathType Leaf) {
            $exe = (Resolve-Path $win).Path
          } elseif (Test-Path $plain -PathType Leaf) {
            $exe = (Resolve-Path $plain).Path
          } else {
            throw 'XPImage executable was not generated.'
          }
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $exe
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $psi
          if (-not $process.Start()) { throw 'Failed to start XPImage executable.' }
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          $output = $stdout + $stderr
          Write-Host $output
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if ($output -notmatch 'XPIMAGE-RUNTIME=OK') { throw 'XPImage runtime marker missing.' }
          $notice = Get-Content ./out/xpimage/Third-party-license.txt -Raw
          if ($notice -notmatch 'Magick.NET-Q16-AnyCPU') { throw 'Generated XPImage third-party notice is missing Magick.NET.' }

      - name: Verify non-XPImage app excludes Magick.NET
        shell: pwsh
        run: |
          $compiler = (Resolve-Path './src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll').Path
          New-Item -ItemType Directory -Force ./out/no-xpimage | Out-Null
          @'
          Sub Main()
              Print "NO-XPIMAGE=OK"
          End Sub
          '@ | Set-Content -Encoding utf8 ./out/no-xpimage/no-xpimage.xps
          dotnet $compiler ./out/no-xpimage/no-xpimage.xps -o ./out/no-xpimage/app --runtime=false
          if ($LASTEXITCODE -ne 0) { throw 'Non-XPImage compile failed.' }
          $magickFiles = Get-ChildItem ./out/no-xpimage -Recurse -File | Where-Object { $_.Name -match 'Magick' }
          if ($magickFiles) { $magickFiles | ForEach-Object { Write-Host $_.FullName }; throw 'Non-XPImage application acquired Magick.NET files.' }
          Get-ChildItem ./out/no-xpimage -Recurse -File -Filter 'Third-party-license.txt' | ForEach-Object {
            if ((Get-Content $_.FullName -Raw) -match 'Magick.NET|ImageMagick') { throw "Non-XPImage third-party notice contains Magick.NET: $($_.FullName)" }
          }

      - name: Run XPImage on plain Kestrel web
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/xpimage-kestrel | Out-Null
          @'
          [Anonymous]
          [Get:/construct]
          Sub Construct()
              Dim img As XPImage
              Set img = New XPImage(8, 8, "#336699")
              Response.ContentType = "text/plain"
              Response.Write("XPIMAGE-CONSTRUCT=" & CStr(img.Width) & "x" & CStr(img.Height))
          End Sub

          [Anonymous]
          [Get:/bytes]
          Sub Bytes()
              Dim img As XPImage
              Set img = New XPImage(8, 8, "#336699")
              Dim bytes As Byte[]
              bytes = img.ToBytes("png")
              Response.ContentType = "text/plain"
              Response.Write("XPIMAGE-BYTES=" & CStr(Len(bytes)))
          End Sub

          [Anonymous]
          [Get:/binary]
          Sub Binary()
              Dim img As XPImage
              Set img = New XPImage(8, 8, "#336699")
              Dim bytes As Byte[]
              bytes = img.ToBytes("png")
              Response.ContentType = "image/png"
              Response.WriteBinary(bytes)
          End Sub
          '@ | Set-Content -Encoding utf8 ./out/xpimage-kestrel/index.xps

          $port = Get-Random -Minimum 20000 -Maximum 45000
          $stdout = Join-Path (Resolve-Path ./out/xpimage-kestrel).Path 'kestrel.stdout.log'
          $stderr = Join-Path (Resolve-Path ./out/xpimage-kestrel).Path 'kestrel.stderr.log'
          $args = @(
            'run', '--project', './src/XPScript.Cli/XPScript.Cli.csproj',
            '-c', 'Release', '-p:SkipUnifiedPublish=true', '--',
            'web', '--debug', '--root', './out/xpimage-kestrel',
            '--address', '127.0.0.1', '--port', [string]$port, '--host', '127.0.0.1',
            '--log-directory', './out/xpimage-kestrel-logs'
          )
          $previousConsoleErrors = $env:XPSCRIPT_WEB_CONSOLE_ERRORS
          $env:XPSCRIPT_WEB_CONSOLE_ERRORS = '1'
          $server = Start-Process dotnet -ArgumentList $args -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($null -eq $previousConsoleErrors) { Remove-Item Env:XPSCRIPT_WEB_CONSOLE_ERRORS -ErrorAction SilentlyContinue } else { $env:XPSCRIPT_WEB_CONSOLE_ERRORS = $previousConsoleErrors }

          function Dump-KestrelDiagnostics {
            Write-Host '--- Kestrel stdout ---'
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host '--- Kestrel stderr ---'
            if (Test-Path $stderr) { Get-Content $stderr }
            Write-Host '--- Kestrel application/error logs ---'
            if (Test-Path './out/xpimage-kestrel-logs') {
              Get-ChildItem './out/xpimage-kestrel-logs' -File | ForEach-Object {
                Write-Host "--- $($_.Name) ---"
                Get-Content $_.FullName
              }
            }
          }

          function Invoke-XPImageCheckpoint([string]$Path, [string]$Expected) {
            $uri = "http://127.0.0.1:$port$Path"
            Write-Host "XPImage Kestrel checkpoint: $Path"
            try {
              $response = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 20
            } catch {
              Dump-KestrelDiagnostics
              throw "XPImage Kestrel checkpoint '$Path' failed: $($_.Exception.Message)"
            }
            if ($response.StatusCode -ne 200) {
              Dump-KestrelDiagnostics
              throw "XPImage Kestrel checkpoint '$Path' returned HTTP $($response.StatusCode)."
            }
            if ($Expected -and ([string]$response.Content) -notmatch $Expected) {
              Dump-KestrelDiagnostics
              throw "XPImage Kestrel checkpoint '$Path' did not return '$Expected'."
            }
            return $response
          }

          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              $server.Refresh()
              if ($server.HasExited) { break }
              try {
                $probe = Invoke-WebRequest -Uri "http://127.0.0.1:$port/construct" -UseBasicParsing -TimeoutSec 5
                if ($probe.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) {
              Dump-KestrelDiagnostics
              $server.Refresh()
              if ($server.HasExited) { throw "XPImage Kestrel exited with code $($server.ExitCode)." }
              throw 'XPImage Kestrel did not become ready at /construct.'
            }

            $construct = Invoke-XPImageCheckpoint '/construct' 'XPIMAGE-CONSTRUCT=8x8'
            $bytes = Invoke-XPImageCheckpoint '/bytes' 'XPIMAGE-BYTES=[1-9][0-9]*'
            $binary = Invoke-XPImageCheckpoint '/binary' ''
            if ($binary.Headers['Content-Type'] -notmatch '^image/png') {
              throw "XPImage Kestrel MIME type was '$($binary.Headers['Content-Type'])', expected image/png."
            }
            $body = [byte[]]$binary.Content
            if ($body.Length -lt 8 -or $body[0] -ne 0x89 -or $body[1] -ne 0x50 -or $body[2] -ne 0x4e -or $body[3] -ne 0x47) {
              throw 'XPImage Kestrel /binary response is not PNG data.'
            }
          } finally {
            if ($null -ne $server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Compile XPImage CLI desktop and web targets
        shell: pwsh
        run: |
          $compiler = (Resolve-Path './src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll').Path
          New-Item -ItemType Directory -Force ./out/xpimage-targets | Out-Null

          $desktopSource = @'
          Function MakeDesktopImage() As XPImage
              Dim localOnly As XPImage
              Set localOnly = New XPImage(4, 4, "#112233")
              Dim returned As XPImage
              Set returned = New XPImage(8, 8, "#336699")
              Set MakeDesktopImage = returned
          End Function

          Sub Main()
              Dim img As XPImage
              Set img = MakeDesktopImage()
              Set img = New XPImage(8, 8, "#663399")
              Set img = Nothing
              Dim form As New UIForm("XPImage Desktop Compile")
          End Sub
          '@
          $desktopSource | Set-Content -Encoding utf8 ./out/xpimage-targets/xpimage-desktop.xps
          dotnet $compiler ./out/xpimage-targets/xpimage-desktop.xps -o ./out/xpimage-targets/desktop --runtime=false
          if ($LASTEXITCODE -ne 0) { throw 'XPImage desktop compile failed.' }

          New-Item -ItemType Directory -Force ./out/xpimage-targets/web-source | Out-Null
          @'
          Function MakeWebImage() As XPImage
              Dim localOnly As XPImage
              Set localOnly = New XPImage(4, 4, "#112233")
              Dim returned As XPImage
              Set returned = New XPImage(8, 8, "#336699")
              Set MakeWebImage = returned
          End Function

          Sub Main()
              Dim img As XPImage
              Set img = MakeWebImage()
              Set img = New XPImage(8, 8, "#663399")
              Set img = Nothing
              Print "XPIMAGE-WEB-COMPILE=OK"
          End Sub
          '@ | Set-Content -Encoding utf8 ./out/xpimage-targets/web-source/main.xps
          dotnet $compiler ./out/xpimage-targets/web-source/main.xps --target webiis --runtime=false --output ./out/xpimage-targets/web
          if ($LASTEXITCODE -ne 0) { throw 'XPImage web compile failed.' }

          dotnet $compiler ./samples/xpimage-runtime.xps -o ./out/xpimage-targets/cli --runtime=false
          if ($LASTEXITCODE -ne 0) { throw 'XPImage CLI compile failed.' }

          foreach ($noticePath in @(
            './out/xpimage-targets/Third-party-license.txt',
            './out/xpimage-targets/web/Third-party-license.txt'
          )) {
            if (Test-Path $noticePath) {
              $targetNotice = Get-Content $noticePath -Raw
              if ($targetNotice -notmatch 'Magick.NET-Q16-AnyCPU') {
                throw "XPImage target notice is missing Magick.NET: $noticePath"
              }
            }
          }
