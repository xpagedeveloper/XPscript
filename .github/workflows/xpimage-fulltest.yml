name: XPImage FullTest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xpimage:
    name: XPImage (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify XPImage profile resource limit
        shell: pwsh
        run: |
          $runtimeSource = Get-Content ./src/XPScript.Compiler/XPImageRuntimeSource.cs -Raw
          if ($runtimeSource -notmatch 'MaxProfileBytes\s*=\s*8\s*\*\s*1024\s*\*\s*1024') {
            throw 'XPImage must keep its per-profile size limit at 8 MiB.'
          }
          if ($runtimeSource -notmatch 'ResourceLimits\.MaxProfileSize\s*=\s*\(ulong\)MaxProfileBytes') {
            throw 'XPImage must apply MaxProfileBytes through ImageMagick ResourceLimits.MaxProfileSize.'
          }
      - name: Compile and run XPImage
        shell: pwsh
        run: |
          $fontCandidates = if ($IsWindows) {
            @('C:/Windows/Fonts/arial.ttf', 'C:/Windows/Fonts/segoeui.ttf')
          } elseif ($IsMacOS) {
            @('/System/Library/Fonts/Supplemental/Arial.ttf', '/System/Library/Fonts/Supplemental/Helvetica.ttc')
          } else {
            @('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf')
          }
          $fontSource = $fontCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $fontSource) { throw 'No test font was found for XPImage.DrawText.' }
          Copy-Item $fontSource ./samples/xpimage-test-font.ttf -Force
          New-Item -ItemType Directory -Force ./samples/assets | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path (Resolve-Path './samples/assets').Path 'xpimage-asset.png'),
            [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=')
          )
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -- compile ./samples/xpimage-runtime.xps -o ./out/xpimage
          if ($LASTEXITCODE -ne 0) { throw "XPImage compile failed with exit code $LASTEXITCODE." }
          $xpImageOutput = (Resolve-Path './out/xpimage').Path
          $xpImageExe = Get-ChildItem $xpImageOutput -File |
            Where-Object { $IsWindows -or (($_.UnixFileMode -band [IO.UnixFileMode]::UserExecute) -ne 0) } |
            Select-Object -First 1
          if (-not $xpImageExe) { throw "Could not locate the compiled XPImage application in $xpImageOutput." }
          & $xpImageExe.FullName
          if ($LASTEXITCODE -ne 0) { throw "XPImage runtime failed with exit code $LASTEXITCODE." }
      - name: Verify concurrent XPImage instance isolation
        shell: pwsh
        run: |
          dotnet run --project ./tests/XPImageConcurrencyProbe/XPImageConcurrencyProbe.csproj -c Release
      - name: Verify non-XPImage app excludes Magick.NET
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -- compile ./samples/hello.xps -o ./out/hello-no-image
          if ($LASTEXITCODE -ne 0) { throw "Non-XPImage compile failed with exit code $LASTEXITCODE." }
          $deps = Get-Content ./out/hello-no-image/hello.deps.json -Raw
          if ($deps -match 'Magick\.NET') { throw 'Non-XPImage app unexpectedly references Magick.NET.' }
          $magickFiles = Get-ChildItem ./out/hello-no-image -Recurse -File | Where-Object { $_.Name -match '^Magick\.NET' }
          if ($magickFiles) { throw "Non-XPImage app unexpectedly copied Magick.NET files: $($magickFiles.FullName -join ', ')" }
      - name: Run XPImage on plain Kestrel web
        shell: pwsh
        run: |
          dotnet run --project ./tests/XPImageWebHostProbe/XPImageWebHostProbe.csproj -c Release
      - name: Install browser WASM workload
        shell: pwsh
        run: dotnet workload install wasm-tools
      - name: Verify XPImage Browser-WASM ServerSide boundary
        shell: pwsh
        run: |
          dotnet run --project ./tests/XPImageBrowserWasmProbe/XPImageBrowserWasmProbe.csproj -c Release
      - name: Compile XPImage CLI desktop and web targets
        shell: pwsh
        run: |
          dotnet run --project ./tests/XPImageCliTargetProbe/XPImageCliTargetProbe.csproj -c Release
 -and
              ($IsWindows -or $_.UnixFileMode -band [IO.UnixFileMode]::UserExecute)
            } |
            Select-Object -First 1
          if (-not $xpImageExe) { throw "Could not locate the compiled XPImage application in $xpImageOutput." }
          & $xpImageExe.FullName
          if ($LASTEXITCODE -ne 0) { throw "XPImage runtime failed with exit code $LASTEXITCODE." }
      - name: Verify concurrent XPImage instance isolation
        shell: pwsh
        run: |
          dotnet run --project ./tests/XPImageConcurrencyProbe/XPImageConcurrencyProbe.csproj -c Release
      - name: Verify non-XPImage app excludes Magick.NET
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -- compile ./samples/hello.xps -o ./out/hello-no-image
          if ($LASTEXITCODE -ne 0) { throw "Non-XPImage compile failed with exit code $LASTEXITCODE." }
          $deps = Get-Content ./out/hello-no-image/hello.deps.json -Raw
          if ($deps -match 'Magick\.NET') { throw 'Non-XPImage app unexpectedly references Magick.NET.' }
          $magickFiles = Get-ChildItem ./out/hello-no-image -Recurse -File | Where-Object { $_.Name -match '^Magick\.NET' }
          if ($magickFiles) { throw "Non-XPImage app unexpectedly copied Magick.NET files: $($magickFiles.FullName -join ', ')" }
      - name: Run XPImage on plain Kestrel web
        shell: pwsh
        run: |
          dotnet run --project ./tests/XPImageWebHostProbe/XPImageWebHostProbe.csproj -c Release
      - name: Install browser WASM workload
        shell: pwsh
        run: dotnet workload install wasm-tools
      - name: Verify XPImage Browser-WASM ServerSide boundary
        shell: pwsh
        run: |
          dotnet run --project ./tests/XPImageBrowserWasmProbe/XPImageBrowserWasmProbe.csproj -c Release
      - name: Compile XPImage CLI desktop and web targets
        shell: pwsh
        run: |
          dotnet run --project ./tests/XPImageCliTargetProbe/XPImageCliTargetProbe.csproj -c Release
