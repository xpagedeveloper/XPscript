name: Notes Rich Text and MIME Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/**'
      - 'samples/notes-richtext-mime-surface.xps'
      - 'docs/notes-c-api.md'
      - 'todo/HCLNotes.md'
      - '.github/workflows/notes-richtext-mime-build.yml'
  workflow_dispatch:

jobs:
  notes-richtext-mime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile Notes rich text and MIME surface
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = if ($IsWindows) { './out/notes-richtext-mime-surface.exe' } else { './out/notes-richtext-mime-surface' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/notes-richtext-mime-surface.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Notes rich text/MIME surface compilation failed.' }
