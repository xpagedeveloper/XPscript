name: Patch If Layout Ordering

on:
  push:
    branches: [todo-if-layouts]
    paths:
      - 'tools/patch-if-layout-order.py'
      - '.github/workflows/patch-if-layout-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-if-layouts
      - name: Move If layout normalization before source markers
        run: python ./tools/patch-if-layout-order.py
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'xpagedeveloper'
          git config user.email 'fredrik@xpagedeveloper.com'
          git add src/XPScript.Compiler/XPScriptTranspiler.cs
          git commit -m 'Preserve split If layout before source markers'
          git push origin HEAD:todo-if-layouts
