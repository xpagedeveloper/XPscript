          Path("docs/uiform-webview.md").write_text(r'''# UIForm WebView

Desktop UIForms can embed a native browser control on Windows, Linux and macOS with `AddWebView`.

```xpscript
Dim form As New UIForm("Browser", 1000, 720, True)
Dim browser As Variant

Set browser = form.AddWebView("browser")
browser.Source = "https://example.com/"
Call form.Show(False)

Call browser.Navigate("https://docs.avaloniaui.net/")
Print browser.Source
Print CStr(browser.CanGoBack)
```

## Properties

`Source` gets or sets the absolute URI. Supported schemes are `http`, `https`, `file`, `about` and `data`.

`Html` gets or sets inline HTML. Setting it navigates the active WebView with `NavigateToString`.

`UserAgent` gets or sets the browser user agent.

`Background` gets or sets the Avalonia background color string.

`CanGoBack` and `CanGoForward` are read-only live history state.

`AdapterInfo` returns information about the active native WebView adapter.

`PlatformHandle` returns the active native platform handle as a hexadecimal string for diagnostics and advanced integration.

## Navigation and scripting

`Navigate(url)`, `NavigateToString(html)`, `InvokeScript(script)`, `GoBack()`, `GoForward()`, `Refresh()` and `Stop()` map to the Avalonia NativeWebView APIs.

Live functions require the form to be visible. Configure `Source`, `Html`, `UserAgent` and `Background` before calling `Show` or `ShowDialog`.

## Printing

`ShowPrintUI()` opens the native print UI when supported.

`PrintToPdf(path)` writes the current page as PDF when the active platform supports Avalonia WebView PDF output. Avalonia currently supports print/PDF on Windows and macOS; Linux does not currently implement these functions.

## Editing

`Copy()`, `Cut()`, `Paste()`, `SelectAll()`, `Undo()` and `Redo()` use Avalonia's `NativeWebViewCommandManager`. The command manager is not currently implemented by Avalonia on Linux, so those calls are no-ops there.

## Cookies

`GetCookies()` returns a JSON array of cookies.

`SetCookie(name, value, domain, path)` creates or updates a cookie.

`DeleteCookie(name, domain, path)` deletes a cookie.

`ClearCookies()` deletes all cookies visible to the WebView cookie manager.

## Platform prerequisites

Windows uses Edge WebView2. Windows 11 normally includes the runtime; Windows 10 may require the WebView2 runtime.

macOS uses the system WKWebView and needs no additional runtime.

Linux uses WPE WebKit when available and can fall back to WebKitGTK. Install the appropriate WPE WebKit or WebKitGTK runtime packages for the target distribution.

Browser-WASM UIForms do not use NativeWebView. `AddWebView` is a desktop UIForm feature.
''')

          replace_once(
              "docs/uiform.md",
              '# UIForm\n',
              '# UIForm\n\nDesktop UIForms also support an embedded native browser control. See [UIForm WebView](uiform-webview.md).\n')

          # Compile the WebView surface on all desktop CI platforms without opening a GUI.
          workflow = Path(".github/workflows/compile.yml")
          text = workflow.read_text()
          text = text.replace(
              '      - name: Compile web application\n',
              '      - name: Compile WebView UIForm application\n        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-webview.xps -o ./out/uiform-webview --framework-dependent\n      - name: Compile web application\n')
          workflow.write_text(text)

          Path(".github/workflows/apply-uiform-webview.yml").unlink()
      - name: Commit implementation
        run: |
          git config user.name "xpagedeveloper"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement desktop UIForm WebView"
          git push origin HEAD:feature/uiform-webview
