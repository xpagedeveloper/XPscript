name: Apply UIForm WebView implementation

on:
  push:
    branches:
      - feature/uiform-webview

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/uiform-webview
      - name: Apply implementation
        run: python scripts/apply-uiform-webview.py
      - name: Commit implementation
        run: |
          git config user.name "xpagedeveloper"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement desktop UIForm WebView"
          git push origin HEAD:feature/uiform-webview
