name: HTTP Database Clients

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/HttpDbRuntimeSource.cs'
      - 'src/XPScript.Compiler/DatabaseUiDataSourceRuntimeSource.cs'
      - 'src/XPScript.Compiler/DatabaseAttachmentRuntimeSource.cs'
      - 'src/XPScript.Compiler/DatabaseAttachmentRuntimeV2Source.cs'
      - 'src/XPScript.Compiler/DatabaseAttachmentRuntimeV3Source.cs'
      - 'src/XPScript.Compiler/NativeHttpJsonPreprocessor.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'samples/httpdb-supabase-domino.xps'
      - 'tests/httpdb_mock_server.py'
      - 'docs/httpdb.md'
      - 'docs/database-ui-datasources.md'
      - 'docs/index.md'
      - '.github/workflows/httpdb-clients.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Start HTTP database mock API
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList './tests/httpdb_mock_server.py' -PassThru
          $server.Id | Set-Content ./httpdb-server.pid
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $client = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 18082)
              $client.Dispose()
              exit 0
            } catch { Start-Sleep -Milliseconds 200 }
          }
          throw 'HTTP database mock server did not start.'
      - name: Compile and run HTTP database sample
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = if ($IsWindows) { './out/httpdb-clients.exe' } else { './out/httpdb-clients' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/httpdb-supabase-domino.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'HTTP database sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "HTTP database regression failed.`n$output" }
          $output | ForEach-Object { Write-Host $_ }
          $required = @(
            'SUPA_EQ=id=eq.42','SUPA_SELECT_TYPE=Array','SUPA_QUERYARRAY_COUNT=1','SUPA_GETROW_HIDDEN=KEEP-ME','SUPA_SAVEROW=1',
            'SUPA_ATTACH_EMPTY=0','SUPA_ATTACH_COUNT=2','SUPA_ATTACH_DUPLICATE_IDS=True','SUPA_ATTACH_NAME=contracts.pdf','SUPA_ATTACH_CREATED_BY=creator@example','SUPA_ATTACH_FIND_NAME=2','SUPA_ATTACH_METADATA_ID=True','SUPA_ATTACH_SAME_LENGTH=True','SUPA_ATTACH_MODIFIED_BY=editor@example','SUPA_ATTACH_DELETE_FIRST=True','SUPA_ATTACH_DELETE_SECOND=True','SUPA_ATTACH_AFTER_DELETE=0',
            'SUPA_INSERT_TYPE=Array','SUPA_UPDATE_TYPE=Array','SUPA_UPSERT_TYPE=Array','SUPA_RPC_TYPE=Object','SUPA_DELETE_TYPE=Array','SUPA_SQL=select 1 as ok','SUPA_DDL=create table demo(id int)',
            'DOMINO_LOGIN=login-token','DOMINO_CREATE_FORM=Customer','DOMINO_GET_FORM=Customer','DOMINO_GETROW_HIDDEN=KEEP-ME','DOMINO_GETROW_META=True','DOMINO_SAVEROW=True','DOMINO_META_AFTER_SAVE=True',
            'DOMINO_ATTACH_EMPTY=0','DOMINO_ATTACH_COUNT=2','DOMINO_ATTACH_DUPLICATE_IDS=True','DOMINO_ATTACH_NAME=contracts.pdf','DOMINO_ATTACH_CREATED_BY=creator@example','DOMINO_ATTACH_FIND_NAME=2','DOMINO_ATTACH_METADATA_ID=True','DOMINO_ATTACH_SAME_LENGTH=True','DOMINO_ATTACH_MODIFIED_BY=editor@example','DOMINO_ATTACH_DELETE_FIRST=True','DOMINO_ATTACH_DELETE_SECOND=True','DOMINO_ATTACH_AFTER_DELETE=0',
            'DOMINO_UPDATE_TYPE=Object','DOMINO_PATCH_TYPE=Object','DOMINO_VIEWS_TYPE=Array','DOMINO_VIEW_TYPE=Array','DOMINO_VIEWARRAY_COUNT=1','DOMINO_QUERY_TYPE=Array','DOMINO_QUERYARRAY_COUNT=1','DOMINO_FORMS_TYPE=Array','DOMINO_DELETE=True','HTTPDB_CLIENTS=OK'
          )
          foreach ($value in $required) {
            if ($output -notcontains $value) { throw "HTTP database output missing: $value`n$output" }
          }
      - name: Stop HTTP database mock API and clean attachment copies
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./httpdb-server.pid) {
            $pidValue = [int](Get-Content ./httpdb-server.pid)
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
          Remove-Item ./httpdb-supabase-attachment-copy.xps -Force -ErrorAction SilentlyContinue
          Remove-Item ./httpdb-domino-attachment-copy.xps -Force -ErrorAction SilentlyContinue
