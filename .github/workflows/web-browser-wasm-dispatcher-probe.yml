name: Web Browser WASM Dispatcher Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.UI.Browser/**'
      - 'tests/WebBrowserWasmDispatcherProbe/**'
      - '.github/workflows/web-browser-wasm-dispatcher-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools
      - name: Run dispatcher probe
        run: dotnet run --project ./tests/WebBrowserWasmDispatcherProbe/WebBrowserWasmDispatcherProbe.csproj -c Release
