name: ByRef Linux and macOS

on:
  push:
    branches: [investigate-ast-compiler]

permissions:
  contents: read

jobs:
  byref:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Run focused ByRef regressions
        shell: pwsh
        run: ./tests/ast-compile-probe/run-ast-byref-cross-platform.ps1
