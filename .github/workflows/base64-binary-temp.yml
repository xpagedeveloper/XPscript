name: Base64 Binary Regression Temp

on:
  push:
    branches: [todo-base64-binary]
    paths:
      - '.github/workflows/base64-binary-temp.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify Base64DecodeBinary
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/base64-binary.xps -o ./out/base64-binary.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Base64 binary sample compilation failed.' }
          $output = & ./out/base64-binary.exe
          foreach ($value in @('LOW=0','HIGH=3','B0=1','B1=2','B2=3','B3=255')) {
            if ($output -notcontains $value) { throw "Base64 binary output missing: $value`n$output" }
          }
