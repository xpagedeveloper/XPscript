name: Apply XP prefixes to Astro docs

on:
  push:
    branches:
      - docs/astro-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/astro-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply canonical XP names
        run: python scripts/apply-xp-prefixes-docs.py
      - name: Commit documentation migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset -- .github/workflows/apply-xp-prefixes-docs.yml scripts/apply-xp-prefixes-docs.py
          if git diff --cached --quiet; then
            echo "No documentation changes"
            exit 0
          fi
          git commit -m "Use XP-prefixed native object names in Astro docs"
          git push origin HEAD:docs/astro-foundation
