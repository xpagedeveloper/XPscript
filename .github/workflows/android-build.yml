name: Android Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Android debug APK
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Keep the smallest Android compiler/host regression first.
      - name: Run Android compiler probe first
        run: dotnet run --project ./tests/AndroidCompilerProbe/AndroidCompilerProbe.csproj -c Release

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release

      - name: Build minimal XPScript Android APK
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/android-debug-print.xps -o ./out/android-debug-print --runtime=false --rid android-arm64

      - name: Verify debug APK exists
        shell: pwsh
        run: |
          $apks = @(Get-ChildItem ./out -Recurse -Filter *.apk -File)
          if ($apks.Count -eq 0) {
            throw 'Android compiler did not produce an APK.'
          }
          $apks | ForEach-Object { Write-Host "ANDROID_APK=$($_.FullName)" }
