name: Android Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Keep the smallest Android compiler/host regression first.
      - name: Run Android compiler probe first
        run: dotnet run --project ./tests/AndroidCompilerProbe/AndroidCompilerProbe.csproj -c Release

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release

      - name: Build minimal XPScript Android APK
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/android-debug-print.xps -o ./out/android-debug-print --runtime=false --rid android-arm64 --debug

      - name: Build x64 emulator APK
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/android-debug-print.xps -o ./out/android-debug-print-emulator --runtime=false --rid android-x64 --debug

      - name: Verify debug APKs exist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find ./out -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -lt 2 ]; then
            echo 'Android compiler did not produce both ARM64 device and x64 emulator APKs.' >&2
            exit 1
          fi
          printf 'ANDROID_APK=%s\n' "${apks[@]}"

      - name: Run x64 emulator smoke test
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name xpscript-ci --package "system-images;android-35;google_apis;x86_64" --device pixel
          emulator -avd xpscript-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > ./out/emulator.log 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          apk="$(find ./out -type f -name '*emulator*.apk' -print -quit)"
          test -n "$apk"
          adb install -r "$apk"
          adb logcat -c
          adb shell monkey -p com.xpscript.debugapp -c android.intent.category.LAUNCHER 1
          found=0
          for i in {1..30}; do
            if adb logcat -d -s XPScript:I '*:S' | grep -Fq 'Hello from XPScript on Android'; then
              found=1
              break
            fi
            sleep 1
          done
          adb logcat -d -s XPScript:I '*:S'
          if [ "$found" -ne 1 ]; then
            echo 'Android emulator did not emit the expected XPScript log output.' >&2
            exit 1
          fi
