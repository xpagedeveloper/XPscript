name: Application Runtime Compatibility

on:
  push:
    branches: [main, runtime-development-no-ci]
    paths:
      - 'src/XPScript.Compiler/**'
      - 'samples/application-runtime*.xps'
      - '.github/workflows/application-runtime-build.yml'
      - 'todo/application-runtime-todo.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/**'
      - 'samples/application-runtime*.xps'
      - '.github/workflows/application-runtime-build.yml'
      - 'todo/application-runtime-todo.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Compile Application runtime sample
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-runtime.xps -o ./out/application-runtime.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Application runtime compilation failed.' }

      - name: Verify zero arguments
        shell: pwsh
        run: |
          $output = & ./out/application-runtime.exe
          if ($LASTEXITCODE -ne 0) { throw "Application runtime exited with code $LASTEXITCODE." }
          if ($output -notcontains 'ARGCOUNT=0') { throw 'Expected ARGCOUNT=0.' }
          if ($output | Where-Object { $_ -like 'ARG0=*' }) { throw 'Unexpected ARG0 output for zero arguments.' }

      - name: Verify one argument
        shell: pwsh
        run: |
          $output = & ./out/application-runtime.exe 'one'
          if ($LASTEXITCODE -ne 0) { throw "Application runtime exited with code $LASTEXITCODE." }
          foreach ($value in @('ARGCOUNT=1','ARG0=one')) {
            if ($output -notcontains $value) { throw "Application runtime output missing: $value" }
          }

      - name: Verify multiple quoted Unicode and empty arguments
        shell: pwsh
        run: |
          $output = & ./out/application-runtime.exe 'first' 'two words' 'ÅÄÖ-漢字' ''
          if ($LASTEXITCODE -ne 0) { throw "Application runtime exited with code $LASTEXITCODE." }
          foreach ($value in @('ARGCOUNT=4','ARG0=first','ARG1=two words','ARG2=ÅÄÖ-漢字','ARG3=')) {
            if ($output -notcontains $value) { throw "Application runtime output missing: $value" }
          }

      - name: Verify executable and temp properties
        shell: pwsh
        run: |
          $output = & ./out/application-runtime.exe
          $exePath = ($output | Where-Object { $_ -like 'EXEPATH=*' } | Select-Object -First 1).Substring(8)
          $exeFile = ($output | Where-Object { $_ -like 'EXEFILE=*' } | Select-Object -First 1).Substring(8)
          $exeDir = ($output | Where-Object { $_ -like 'EXEDIR=*' } | Select-Object -First 1).Substring(7)
          $tempPath = ($output | Where-Object { $_ -like 'TEMPPATH=*' } | Select-Object -First 1).Substring(9)
          if ([string]::IsNullOrWhiteSpace($exePath) -or -not (Test-Path -LiteralPath $exePath)) { throw 'ExecutablePath is invalid.' }
          if ($exeFile -ne [System.IO.Path]::GetFileName($exePath)) { throw 'ExecutableFileName does not match ExecutablePath.' }
          if ($exeDir -ne [System.IO.Path]::GetDirectoryName($exePath)) { throw 'ExecutableDirectory does not match ExecutablePath.' }
          if ([string]::IsNullOrWhiteSpace($tempPath) -or -not (Test-Path -LiteralPath $tempPath -PathType Container)) { throw 'TempPath is invalid.' }

      - name: Verify out-of-range argument error
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-runtime-out-of-range.xps -o ./out/application-runtime-out-of-range.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Out-of-range sample compilation failed unexpectedly.' }
          $output = & ./out/application-runtime-out-of-range.exe 2>&1
          $runtimeExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($runtimeExitCode -eq 0) { throw 'Expected out-of-range Application.Args access to fail.' }
          if (($output -join "`n") -notmatch '(^|\D)9(\D|$)') { throw 'Expected XPScript error 9 for out-of-range Application.Args access.' }

      - name: Verify Application arguments are read-only
        shell: pwsh
        run: |
          $resultText = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-runtime-readonly-error.xps -o ./out/application-runtime-readonly-error.exe --framework-dependent --result-format json
          $compilerExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($compilerExitCode -eq 0) { throw 'Expected assignment to Application.Args to fail compilation.' }
          $result = $resultText | ConvertFrom-Json
          if ($result.result -ne 'error' -or $result.errors.Count -lt 1) { throw 'Expected structured compiler error for read-only Application.Args assignment.' }
