name: Application Runtime Compatibility

on:
  push:
    branches: [main, runtime-development-no-ci, todo-application-filename-alias]
    paths:
      - 'src/XPScript.Compiler/ApplicationRuntimeSource.cs'
      - 'src/XPScript.Compiler/ApplicationObjectPreprocessor.cs'
      - 'src/XPScript.Compiler/ReservedIdentifierPreprocessor.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'samples/application-runtime*.xps'
      - 'samples/application-reserved-identifier-error.xps'
      - '.github/workflows/application-runtime-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/ApplicationRuntimeSource.cs'
      - 'src/XPScript.Compiler/ApplicationObjectPreprocessor.cs'
      - 'src/XPScript.Compiler/ReservedIdentifierPreprocessor.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'samples/application-runtime*.xps'
      - 'samples/application-reserved-identifier-error.xps'
      - '.github/workflows/application-runtime-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Compile Application runtime sample
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-runtime.xps -o ./out/application-runtime.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Application runtime compilation failed.' }

      - name: Verify zero arguments and default exit code
        shell: pwsh
        run: |
          $output = & ./out/application-runtime.exe
          if ($LASTEXITCODE -ne 0) { throw "Application runtime exited with code $LASTEXITCODE." }
          if ($output -notcontains 'EXITCODE=0') { throw 'Expected default Application.ExitCode=0.' }
          if ($output -notcontains 'ARGCOUNT=0') { throw 'Expected ARGCOUNT=0.' }
          if ($output -notcontains 'COMMANDLINE=') { throw 'Expected empty Application.CommandLine for zero arguments.' }
          if ($output | Where-Object { $_ -like 'ARG0=*' }) { throw 'Unexpected ARG0 output for zero arguments.' }

      - name: Verify one argument
        shell: pwsh
        run: |
          $output = & ./out/application-runtime.exe 'one'
          if ($LASTEXITCODE -ne 0) { throw "Application runtime exited with code $LASTEXITCODE." }
          foreach ($value in @('ARGCOUNT=1','ARG0=one','COMMANDLINE=one')) {
            if ($output -notcontains $value) { throw "Application runtime output missing: $value" }
          }

      - name: Verify multiple quoted Unicode and empty arguments
        shell: pwsh
        run: |
          $output = & ./out/application-runtime.exe 'first' 'two words' 'ÅÄÖ-漢字' ''
          if ($LASTEXITCODE -ne 0) { throw "Application runtime exited with code $LASTEXITCODE." }
          foreach ($value in @('ARGCOUNT=4','ARG0=first','ARG1=two words','ARG2=ÅÄÖ-漢字','ARG3=','COMMANDLINE=first two words ÅÄÖ-漢字 ')) {
            if ($output -notcontains $value) { throw "Application runtime output missing: $value" }
          }

      - name: Verify executable and temp properties
        shell: pwsh
        run: |
          $output = & ./out/application-runtime.exe
          $exePath = ($output | Where-Object { $_ -like 'EXEPATH=*' } | Select-Object -First 1).Substring(8)
          $pathAlias = ($output | Where-Object { $_ -like 'PATH=*' } | Select-Object -First 1).Substring(5)
          $exeFile = ($output | Where-Object { $_ -like 'EXEFILE=*' } | Select-Object -First 1).Substring(8)
          $fileNameAlias = ($output | Where-Object { $_ -like 'FILENAME=*' } | Select-Object -First 1).Substring(9)
          $exeDir = ($output | Where-Object { $_ -like 'EXEDIR=*' } | Select-Object -First 1).Substring(7)
          $tempPath = ($output | Where-Object { $_ -like 'TEMPPATH=*' } | Select-Object -First 1).Substring(9)
          $tempFolder = ($output | Where-Object { $_ -like 'TEMPFOLDER=*' } | Select-Object -First 1).Substring(11)
          if ([string]::IsNullOrWhiteSpace($exePath) -or -not (Test-Path -LiteralPath $exePath)) { throw 'ExecutablePath is invalid.' }
          if ($pathAlias -ne $exePath) { throw "Application.Path alias mismatch. ExecutablePath='$exePath' Path='$pathAlias'." }
          if ($exeFile -ne [System.IO.Path]::GetFileName($exePath)) { throw 'ExecutableFileName does not match ExecutablePath.' }
          if ($fileNameAlias -ne $exeFile) { throw "Application.FileName alias mismatch. ExecutableFileName='$exeFile' FileName='$fileNameAlias'." }
          if ($exeDir -ne [System.IO.Path]::GetDirectoryName($exePath)) { throw 'ExecutableDirectory does not match ExecutablePath.' }
          if ([string]::IsNullOrWhiteSpace($tempPath) -or -not (Test-Path -LiteralPath $tempPath -PathType Container)) { throw 'TempPath is invalid.' }
          if ($tempFolder -ne $tempPath) { throw "TempFolder alias mismatch. TempPath='$tempPath' TempFolder='$tempFolder'." }

      - name: Verify console Application.ExitCode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-runtime-exit-code.xps -o ./out/application-runtime-exit-code.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Console exit-code sample compilation failed.' }
          $output = & ./out/application-runtime-exit-code.exe
          $exitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($exitCode -ne 7) { throw "Expected console exit code 7, got $exitCode." }
          if ($output -notcontains 'EXITCODE=7') { throw 'Application.ExitCode getter did not return 7.' }

      - name: Verify desktop Application.ExitCode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-runtime-exit-code-desktop.xps -o ./out/application-runtime-exit-code-desktop.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Desktop exit-code sample compilation failed.' }
          $output = & ./out/application-runtime-exit-code-desktop.exe
          $exitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($exitCode -ne 9) { throw "Expected desktop exit code 9, got $exitCode." }
          if ($output -notcontains 'EXITCODE=9') { throw 'Desktop Application.ExitCode getter did not return 9.' }

      - name: Verify out-of-range argument error
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-runtime-out-of-range.xps -o ./out/application-runtime-out-of-range.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Out-of-range sample compilation failed unexpectedly.' }
          $output = & ./out/application-runtime-out-of-range.exe
          if ($LASTEXITCODE -ne 0) { throw "Out-of-range sample exited with code $LASTEXITCODE." }
          if ($output -notcontains 'ERR=9') { throw 'Expected Err=9 for out-of-range Application.Args access.' }

      - name: Verify Application arguments are read-only
        shell: pwsh
        run: |
          $resultText = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-runtime-readonly-error.xps -o ./out/application-runtime-readonly-error.exe --framework-dependent --result-format json
          $compilerExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($compilerExitCode -eq 0) { throw 'Expected assignment to Application.Args to fail compilation.' }
          $result = $resultText | ConvertFrom-Json
          if ($result.result -ne 'error' -or $result.errors.Count -lt 1) { throw 'Expected structured compiler error for read-only Application.Args assignment.' }

      - name: Verify Application properties are read-only
        shell: pwsh
        run: |
          $resultText = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-runtime-property-readonly-error.xps -o ./out/application-runtime-property-readonly-error.exe --framework-dependent --result-format json
          $compilerExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($compilerExitCode -eq 0) { throw 'Expected assignment to Application.TempPath to fail compilation.' }
          $result = $resultText | ConvertFrom-Json
          if ($result.result -ne 'error' -or $result.errors.Count -lt 1) { throw 'Expected structured compiler error for read-only Application property assignment.' }

      - name: Verify Application identifier is reserved
        shell: pwsh
        run: |
          $resultText = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-reserved-identifier-error.xps -o ./out/application-reserved-identifier-error.exe --framework-dependent --result-format json
          $compilerExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($compilerExitCode -eq 0) { throw 'Expected redeclaration of Application to fail compilation.' }
          $result = $resultText | ConvertFrom-Json
          if ($result.result -ne 'error' -or $result.errors.Count -lt 1) { throw 'Expected structured compiler error for reserved Application identifier.' }
          if (($result.errors | ConvertTo-Json -Depth 8) -notmatch 'reserved') { throw 'Expected reserved identifier diagnostic.' }
