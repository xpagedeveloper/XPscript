name: Evaluate Security Closeout

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/XPScriptEvaluate*.cs'
      - 'src/XPScript.Compiler/Evaluate*.cs'
      - 'samples/evaluate-object-callvar-rejection.xps'
      - 'samples/evaluate-nested-unavailable.xps'
      - 'todo/security-review-todo.md'
      - '.github/workflows/evaluate-security-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-security:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        shell: pwsh
        run: |
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }
      - name: Verify unsupported mutable ByVal object rejection
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/evaluate-closeout | Out-Null
          $exe = if ($IsWindows) { './out/evaluate-closeout/object.exe' } else { './out/evaluate-closeout/object' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/evaluate-object-callvar-rejection.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Evaluate object rejection sample failed to compile.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          $exit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Evaluate object rejection failed: $exit" }
          if ($output -notcontains 'OBJECT-CALLVAR-REJECTED=OK') { throw 'Object rejection marker missing.' }
          if ($output -notcontains 'OBJECT-CALLVAR-DIAGNOSTIC-REDACTED=OK') { throw 'Object redaction marker missing.' }
      - name: Verify nested Evaluate remains unavailable and isolated
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { './out/evaluate-closeout/nested.exe' } else { './out/evaluate-closeout/nested' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/evaluate-nested-unavailable.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Nested Evaluate boundary sample failed to compile.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          $exit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Nested Evaluate boundary sample failed: $exit" }
          if ($output -notcontains 'NESTED-EVALUATE-UNAVAILABLE=OK') { throw 'Nested Evaluate unavailable marker missing.' }
          if ($output -notcontains 'NESTED-EVALUATE-CALLER-UNCHANGED=OK') { throw 'Nested Evaluate caller isolation marker missing.' }
