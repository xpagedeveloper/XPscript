name: Hash Functions

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/HashFunctionsPreprocessor.cs'
      - 'src/XPScript.Compiler/HashFunctionsRuntimeSource.cs'
      - 'src/XPScript.Compiler/HclSelectedCompatibilityPreprocessor.cs'
      - 'src/XPScript.Compiler/HclSelectedCompatibilityRuntimeSource.cs'
      - 'samples/hash-functions.xps'
      - 'docs/hash-functions.md'
      - '.github/workflows/hash-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile and run hash regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = if ($IsWindows) { './out/hash-functions.exe' } else { './out/hash-functions' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hash-functions.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Hash function sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Hash function regression failed.`n$output" }
          $output | ForEach-Object { Write-Host $_ }
          if ($output -notcontains 'HASH_FUNCTIONS=OK') { throw "Hash function regression output missing success marker.`n$output" }
