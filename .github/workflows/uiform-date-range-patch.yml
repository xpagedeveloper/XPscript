name: UIForm Date Range Patch

on:
  push:
    branches: [uiform-date-range-validation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[date-range-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: uiform-date-range-validation
      - name: Apply date range integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              if new in text:
                  return
              raise SystemExit(f'{label} patch target not found in {path}')

          replace_once(
              'src/XPScript.Compiler/UIExtensionDesktopPostProcessor.cs',
              '        replaced = new UIFormRegexValidationPostProcessor().Transform(replaced);\n        replaced = new UIWebBootstrapPostProcessor().Transform(replaced);',
              '        replaced = new UIFormRegexValidationPostProcessor().Transform(replaced);\n        replaced = new UIFormDateRangeValidationPostProcessor().Transform(replaced);\n        replaced = new UIWebBootstrapPostProcessor().Transform(replaced);',
              'postprocessor wiring')

          replace_once(
              'src/XPScript.UI.Desktop/DesktopBridgeContracts.cs',
              '    public string RegexPattern { get; init; } = string.Empty;\n    public IReadOnlyList<string> Values { get; init; } = Array.Empty<string>();',
              '    public string RegexPattern { get; init; } = string.Empty;\n    public string DateMinimum { get; init; } = string.Empty;\n    public string DateMaximum { get; init; } = string.Empty;\n    public IReadOnlyList<string> Values { get; init; } = Array.Empty<string>();',
              'desktop contract')

          replace_once(
              'src/XPScript.Web.Compiler/XpsBrowserWasmCompiler.cs',
              "  if (field.maximum != null && 'max' in editor) editor.max = String(field.maximum);\n  if (field.placeholder && 'placeholder' in editor) editor.placeholder = String(field.placeholder);",
              "  if (field.maximum != null && 'max' in editor) editor.max = String(field.maximum);\n  if (field.dateMinimum && 'min' in editor) editor.min = String(field.dateMinimum);\n  if (field.dateMaximum && 'max' in editor) editor.max = String(field.dateMaximum);\n  if (field.placeholder && 'placeholder' in editor) editor.placeholder = String(field.placeholder);",
              'browser date range')

          replace_once(
              'tests/WebBrowserWasmSmoke/Program.cs',
              '    Call form.AddPasswordField("password", "Password")\n    Call form.AddSeparator("identity_separator")',
              '    Call form.AddPasswordField("password", "Password")\n    Call form.AddDateField("birthday", "Birthday")\n    Call form.AddSeparator("identity_separator")',
              'browser sample date field')
          replace_once(
              'tests/WebBrowserWasmSmoke/Program.cs',
              '    Call form.SetRegexValidation("name", "^[A-Za-z ]+$")\n    Call form.SetFieldPlaceholder("name", "Enter your name")',
              '    Call form.SetRegexValidation("name", "^[A-Za-z ]+$")\n    Call form.SetDateRange("birthday", "2020-01-01", "2030-12-31")\n    Call form.SetFieldPlaceholder("name", "Enter your name")',
              'browser date range API')
          replace_once(
              'tests/WebBrowserWasmSmoke/Program.cs',
              '        "multilistbox", "selectedOptions", "select.multiple", "field.placeholder", "field.regexPattern", "field.tooltip",',
              '        "multilistbox", "selectedOptions", "select.multiple", "field.placeholder", "field.regexPattern", "field.dateMinimum", "field.dateMaximum", "field.tooltip",',
              'browser date range markers')

          replace_once(
              'samples/ui-form-core.xps',
              '    Call first.SetNumberRange("age", 0, 150)\n    Call first.SetRegexValidation("existing", "^[A-Za-z ]+$")',
              '    Call first.SetNumberRange("age", 0, 150)\n    Call first.SetRegexValidation("existing", "^[A-Za-z ]+$")\n    Call first.SetDateRange("birthday", "2020-01-01", "2030-12-31")',
              'core date range API')
          replace_once(
              'samples/ui-form-core.xps',
              '    Print "REGEX_VALIDATION_CONFIGURED=True"\n    Print "FIELD_COUNT=" & CStr(first.FieldCount)',
              '    Print "REGEX_VALIDATION_CONFIGURED=True"\n    Print "DATE_RANGE_CONFIGURED=True"\n    Print "FIELD_COUNT=" & CStr(first.FieldCount)',
              'core date range marker')
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/XPScript.Compiler/UIExtensionDesktopPostProcessor.cs src/XPScript.UI.Desktop/DesktopBridgeContracts.cs src/XPScript.Web.Compiler/XpsBrowserWasmCompiler.cs tests/WebBrowserWasmSmoke/Program.cs samples/ui-form-core.xps
          git commit -m "Wire UIForm date range validation across runtimes [date-range-patched]"
          git push origin HEAD:uiform-date-range-validation
