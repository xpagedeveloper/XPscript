name: Notes docs cleanup once

on:
  push:
    branches: [docs/astro-foundation]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/astro-foundation
          fetch-depth: 0
      - run: python3 scripts/notes_docs_cleanup_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove unsupported Notes API from Astro docs"
          git push origin HEAD:docs/astro-foundation
