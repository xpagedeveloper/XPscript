name: Web FastCGI nginx

on:
  push:
    branches: ['todo-web-runtime-fastcgi-nginx-fuzz']
    paths:
      - '.github/workflows/web-fastcgi-nginx.yml'
      - 'src/XPScript.Web.FastCgi/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'tests/WebFastCgiNginxHost/**'
      - 'docs/web-fastcgi-nginx.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/web-fastcgi-nginx.yml'
      - 'src/XPScript.Web.FastCgi/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'tests/WebFastCgiNginxHost/**'
      - 'docs/web-fastcgi-nginx.md'

permissions:
  contents: read

jobs:
  nginx-fastcgi:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx

      - name: Build solution
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore

      - name: Install nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          nginx -v

      - name: Run nginx fastcgi_pass integration
        shell: bash
        run: |
          set -euo pipefail

          SITE_ROOT="$RUNNER_TEMP/xps-nginx-site"
          PREFIX="$RUNNER_TEMP/xps-nginx-prefix"
          CONF="$RUNNER_TEMP/xps-nginx.conf"
          HOST_LOG="$RUNNER_TEMP/xps-fastcgi-host.log"
          mkdir -p "$SITE_ROOT" "$PREFIX/logs"

          cat > "$SITE_ROOT/index.xps" <<'XPS'
          [Anonymous]
          [Get]
          Sub Index()
              Response.ContentType = "text/plain; charset=utf-8"
              Response.SetHeader("X-XPScript-Transport", "fastcgi-nginx")
              Response.Write("nginx|")
              Response.Write(Request.QueryFirst("name"))
          End Sub
          XPS

          dotnet run --project ./tests/WebFastCgiNginxHost/WebFastCgiNginxHost.csproj -c Release -- "$SITE_ROOT" 19090 >"$HOST_LOG" 2>&1 &
          HOST_PID=$!

          cleanup() {
            nginx -p "$PREFIX" -c "$CONF" -s quit >/dev/null 2>&1 || true
            kill "$HOST_PID" >/dev/null 2>&1 || true
            wait "$HOST_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/19090) >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          if ! (echo > /dev/tcp/127.0.0.1/19090) >/dev/null 2>&1; then
            cat "$HOST_LOG"
            exit 1
          fi

          cat > "$CONF" <<NGINX
          worker_processes 1;
          error_log $PREFIX/logs/error.log notice;
          pid $PREFIX/nginx.pid;

          events {
              worker_connections 64;
          }

          http {
              access_log off;
              server {
                  listen 127.0.0.1:18080;
                  server_name localhost;
                  root $SITE_ROOT;

                  location / {
                      fastcgi_pass 127.0.0.1:19090;
                      fastcgi_param SCRIPT_FILENAME \$document_root\$fastcgi_script_name;
                      fastcgi_param SCRIPT_NAME     \$fastcgi_script_name;
                      fastcgi_param PATH_INFO       \$fastcgi_path_info;
                      fastcgi_param QUERY_STRING    \$query_string;
                      fastcgi_param REQUEST_METHOD  \$request_method;
                      fastcgi_param CONTENT_TYPE    \$content_type;
                      fastcgi_param CONTENT_LENGTH  \$content_length;
                      fastcgi_param SERVER_NAME     \$server_name;
                      fastcgi_param SERVER_PORT     \$server_port;
                      fastcgi_param SERVER_PROTOCOL \$server_protocol;
                      fastcgi_param REMOTE_ADDR     \$remote_addr;
                      fastcgi_param HTTPS           \$https if_not_empty;
                      fastcgi_connect_timeout 5s;
                      fastcgi_send_timeout 15s;
                      fastcgi_read_timeout 15s;
                  }
              }
          }
          NGINX

          nginx -p "$PREFIX" -c "$CONF" -t
          nginx -p "$PREFIX" -c "$CONF"

          for _ in $(seq 1 40); do
            if curl --fail --silent --max-time 2 'http://127.0.0.1:18080/index?name=integration' > "$RUNNER_TEMP/nginx-response.txt"; then
              break
            fi
            sleep 0.25
          done

          BODY=$(cat "$RUNNER_TEMP/nginx-response.txt")
          test "$BODY" = 'nginx|integration'
          curl --fail --silent --max-time 5 -D "$RUNNER_TEMP/nginx-headers.txt" 'http://127.0.0.1:18080/index?name=headers' -o "$RUNNER_TEMP/nginx-body2.txt"
          grep -qi '^X-XPScript-Transport: fastcgi-nginx' "$RUNNER_TEMP/nginx-headers.txt"
          test "$(cat "$RUNNER_TEMP/nginx-body2.txt")" = 'nginx|headers'

          echo 'WEB-FASTCGI-NGINX=OK'
