name: Application Registry and Secrets

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/ApplicationObjectPreprocessor.cs'
      - 'src/XPScript.Compiler/ApplicationRuntimeSource.cs'
      - 'src/XPScript.Compiler/ApplicationPersistenceRuntimeSource.cs'
      - 'samples/application-registry-secrets.xps'
      - 'docs/application-reference.md'
      - 'docs/application-registry-secrets.md'
      - '.github/workflows/application-registry-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-persistence:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release

      - name: Compile Registry and Secrets surface
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-registry-secrets.xps -o ./out/application-registry-secrets.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Application Registry/Secrets sample compilation failed.' }

      - name: Verify user registry round-trip
        shell: pwsh
        run: |
          $output = & ./out/application-registry-secrets.exe
          if ($LASTEXITCODE -ne 0) { throw "Application Registry sample exited with code $LASTEXITCODE." }
          if ($output -notcontains 'REGISTRY=XPscript-registry-ok') { throw 'Application.Registry.User round-trip failed.' }
