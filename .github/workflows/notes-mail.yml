name: NotesMail

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notes-mail-surface:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Compile NotesMail MIME surface
        shell: pwsh
        run: |
          $output = & dotnet ./src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll ./samples/notes-mail-surface.xps -o ./out/mime/notes-mail --runtime=false 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "NotesMail MIME compile failed with exit code $LASTEXITCODE" }
      - name: Compile NotesMail without MIME
        shell: pwsh
        run: |
          $output = & dotnet ./src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll ./samples/notes-mail-no-mime-surface.xps -o ./out/no-mime/notes-mail --runtime=false 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "NotesMail no-MIME compile failed with exit code $LASTEXITCODE" }
      - name: Compile full Notes surface
        shell: pwsh
        run: |
          $output = & dotnet ./src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll ./samples/notes-full-domino-runtime-test.xps -o ./out/full/notes-full --runtime=false 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "Full Notes surface compile failed with exit code $LASTEXITCODE" }
      - name: Audit recent Notes core surface coverage
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project ./tests/NotesFullRuntimeSurfaceAudit/NotesFullRuntimeSurfaceAudit.csproj -c Release -- NotesSession NotesDocument NotesDatabase NotesDatabaseAccess
