name: HTTP decompression coverage v2
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Patch HTTP transports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return False
              if old not in s:
                  raise SystemExit(f'pattern not found: {path}')
              p.write_text(s.replace(old, new, 1))
              return True

          flags = '''AutomaticDecompression = System.Net.DecompressionMethods.GZip |
                                     System.Net.DecompressionMethods.Deflate |
                                     System.Net.DecompressionMethods.Brotli'''

          patch('src/XPScript.Compiler/AiRuntimeSource.cs',
                '_handler = new System.Net.Http.HttpClientHandler { AllowAutoRedirect = false };',
                '''_handler = new System.Net.Http.HttpClientHandler
        {
            AllowAutoRedirect = false,
            AutomaticDecompression = System.Net.DecompressionMethods.GZip |
                                     System.Net.DecompressionMethods.Deflate |
                                     System.Net.DecompressionMethods.Brotli
        };''')

          patch('src/XPScript.Compiler/JsonHttpCompatibilityRuntimeSource.cs',
                '''            AllowAutoRedirect = MaxRedirects > 0,
            MaxAutomaticRedirections = Math.Max(1, MaxRedirects)
''',
                '''            AllowAutoRedirect = MaxRedirects > 0,
            MaxAutomaticRedirections = Math.Max(1, MaxRedirects),
            AutomaticDecompression = System.Net.DecompressionMethods.GZip |
                                     System.Net.DecompressionMethods.Deflate |
                                     System.Net.DecompressionMethods.Brotli
''')

          for path in ['src/XPScript.Compiler/DatabaseAttachmentRuntimeV2Source.cs',
                       'src/XPScript.Compiler/DatabaseAttachmentRuntimeSource.cs']:
              patch(path,
                    'new System.Net.Http.HttpClientHandler { AllowAutoRedirect = false }',
                    '''new System.Net.Http.HttpClientHandler
        {
            AllowAutoRedirect = false,
            AutomaticDecompression = System.Net.DecompressionMethods.GZip |
                                     System.Net.DecompressionMethods.Deflate |
                                     System.Net.DecompressionMethods.Brotli
        }''')

          patch('src/XPScript.UI.Desktop/DesktopImageHost.cs',
                'private static readonly HttpClient Http = new() { Timeout = TimeSpan.FromSeconds(15) };',
                '''private static readonly HttpClient Http = new(new HttpClientHandler
    {
        AutomaticDecompression = System.Net.DecompressionMethods.GZip |
                                 System.Net.DecompressionMethods.Deflate |
                                 System.Net.DecompressionMethods.Brotli
    })
    {
        Timeout = TimeSpan.FromSeconds(15)
    };''')
          PY
      - name: Verify coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            'src/XPScript.Compiler/NativeHttpRuntimeSource.cs',
            'src/XPScript.Compiler/AiRuntimeSource.cs',
            'src/XPScript.Compiler/JsonHttpCompatibilityRuntimeSource.cs',
            'src/XPScript.Compiler/DatabaseAttachmentRuntimeV2Source.cs',
            'src/XPScript.Compiler/DatabaseAttachmentRuntimeSource.cs',
            'src/XPScript.UI.Desktop/DesktopImageHost.cs'
          ]
          for f in files:
              s = Path(f).read_text()
              for token in ['DecompressionMethods.GZip','DecompressionMethods.Deflate','DecompressionMethods.Brotli']:
                  if token not in s:
                      raise SystemExit(f'{f} missing {token}')
          print('HTTP decompression coverage verified')
          PY
      - name: Build compiler
        run: dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Build desktop
        run: dotnet build src/XPScript.UI.Desktop/XPScript.UI.Desktop.csproj -c Release
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/XPScript.Compiler/AiRuntimeSource.cs src/XPScript.Compiler/JsonHttpCompatibilityRuntimeSource.cs src/XPScript.Compiler/DatabaseAttachmentRuntimeV2Source.cs src/XPScript.Compiler/DatabaseAttachmentRuntimeSource.cs src/XPScript.UI.Desktop/DesktopImageHost.cs
          git commit -m 'Enable decompression across HTTP transports'
          git push
