name: Security Concurrent Compile Regression

on:
  push:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/**'
      - 'samples/application-runtime.xps'
      - '.github/workflows/security-concurrent-compile-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/**'
      - 'samples/application-runtime.xps'
      - '.github/workflows/security-concurrent-compile-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concurrent-compiles:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Verify 12 concurrent compiler invocations are isolated
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ./out/concurrent | Out-Null

          $jobs = 1..12 | ForEach-Object {
            $index = $_
            Start-Job -ScriptBlock {
              param($repo, $index)
              Set-Location $repo
              $output = "./out/concurrent/app-$index.exe"
              $text = & dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-runtime.xps -o $output --framework-dependent 2>&1
              [pscustomobject]@{
                Index = $index
                ExitCode = $LASTEXITCODE
                Output = $output
                Log = ($text -join "`n")
              }
            } -ArgumentList $PWD.Path, $index
          }

          $results = $jobs | Receive-Job -Wait -AutoRemoveJob
          if ($results.Count -ne 12) {
            throw "Expected 12 compile results, got $($results.Count)."
          }

          foreach ($result in $results) {
            if ($result.ExitCode -ne 0) {
              throw "Concurrent compile $($result.Index) failed with exit code $($result.ExitCode): $($result.Log)"
            }
            if (-not (Test-Path -LiteralPath $result.Output -PathType Leaf)) {
              throw "Concurrent compile $($result.Index) did not create $($result.Output)."
            }
          }

          $names = Get-ChildItem -LiteralPath ./out/concurrent -File | Where-Object { $_.Name -like 'app-*.exe' } | Select-Object -ExpandProperty Name
          if (($names | Sort-Object -Unique).Count -ne 12) {
            throw "Expected 12 distinct executable outputs, got $(($names | Sort-Object -Unique).Count)."
          }

          foreach ($result in $results) {
            $runtimeOutput = & $result.Output
            if ($LASTEXITCODE -ne 0) {
              throw "Concurrent output $($result.Output) failed to run with exit code $LASTEXITCODE."
            }
            if ($runtimeOutput -notcontains 'ARGCOUNT=0') {
              throw "Concurrent output $($result.Output) did not produce expected runtime marker."
            }
          }
