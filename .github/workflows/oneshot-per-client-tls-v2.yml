name: Per-client TLS validation v2
on: [push]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/per-client-tls-validation
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python3 scripts/patch-per-client-tls.py
      - run: python3 scripts/fix-per-client-tls-build.py
      - run: dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - run: dotnet build src/XPScript.UI.Desktop/XPScript.UI.Desktop.csproj -c Release
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/XPScript.Compiler src/XPScript.UI.Desktop
          git commit -m 'Add per-client TLS certificate validation modes'
          git push origin HEAD:feature/per-client-tls-validation
