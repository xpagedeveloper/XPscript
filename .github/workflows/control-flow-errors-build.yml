name: Control Flow and Error Handling Compatibility

on:
  workflow_dispatch:
  push:
    branches: [todo-statement-layout-audit]
    paths:
      - '.github/workflows/control-flow-errors-build.yml'
      - 'samples/statement-layout-audit.xps'
      - 'samples/if-layouts.xps'
      - 'samples/erl-physical-source-line.xps'
      - 'samples/nested-resume-targets.xps'
      - 'src/XPScript.Compiler/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify If statement layouts
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/if-layouts.xps -o ./out/if-layouts.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'If layout sample compilation failed.' }
          $output = & ./out/if-layouts.exe
          foreach ($value in @('SINGLE=OK','SINGLE_ELSE=OK','STRING_ELSE=OK','BLOCK=OK','SPLIT_THEN=OK','SPLIT_ELSEIF=OK','INLINE_ELSEIF=OK','DATE_SINGLE=OK')) {
            if ($output -notcontains $value) { throw "If layout output missing: $value`n$output" }
          }
          if ($output -contains 'SINGLE_TRUE_BAD' -or $output -contains 'ELSEIF_BAD' -or $output -contains 'INLINE_ELSEIF_BAD') { throw "Unexpected If branch output:`n$output" }
      - name: Verify statement layout continuations and compound conditions
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/statement-layout-audit.xps -o ./out/statement-layout-audit.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Statement layout audit compilation failed.' }
          $output = & ./out/statement-layout-audit.exe
          foreach ($value in @('CONTINUED_IF=OK','NESTED_IF=OK','FOR=1','FOR=2','FORALL=2','WHILE=2','WHILE_OR=1','DO_WHILE=0','DO_UNTIL=1','LOOP_WHILE=2','LOOP_UNTIL=2','SELECT=OK','WITH=8','FUNCTION=8','PROPERTY=8','DECLARE=COMPILED')) {
            if ($output -notcontains $value) { throw "Statement layout output missing: $value`n$output" }
          }
          if ($output -contains 'NESTED_BAD' -or $output -contains 'SELECT_BAD') { throw "Unexpected statement branch output:`n$output" }
      - name: Verify physical Erl source line
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/erl-physical-source-line.xps -o ./out/erl-physical.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Erl sample compilation failed.' }
          $output = & ./out/erl-physical.exe
          if ($LASTEXITCODE -ne 0) { throw "Erl sample exited with code $LASTEXITCODE.`n$output" }
          if ($output -notcontains 'Erl=5') { throw "Expected physical Erl=5.`n$output" }
      - name: Verify nested Resume targets
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/nested-resume-targets.xps -o ./out/nested-resume.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Nested Resume sample compilation failed.' }
          $output = & ./out/nested-resume.exe
          if ($LASTEXITCODE -ne 0) { throw "Nested Resume sample exited with code $LASTEXITCODE.`n$output" }
          $expected = @('outer-before','middle-before','middle-handler:7001','middle-after','outer-after')
          foreach ($value in $expected) {
            if ($output -notcontains $value) { throw "Nested Resume output missing: $value`n$output" }
          }
          if ($output | Where-Object { $_ -like 'outer-handler:*' }) { throw "Outer handler must not catch the inner error.`n$output" }
