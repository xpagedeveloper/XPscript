name: Web Static Files

on:
  push:
    paths:
      - '.github/workflows/web-static-files.yml'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.Runtime/XpsWebServer.cs'
      - 'src/XPScript.Web.Runtime/XpsWebPathResolver.cs'
      - 'tests/WebStaticFilesSmoke/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/web-static-files.yml'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.Runtime/XpsWebServer.cs'
      - 'src/XPScript.Web.Runtime/XpsWebPathResolver.cs'
      - 'tests/WebStaticFilesSmoke/**'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore static file regression
        run: dotnet restore ./tests/WebStaticFilesSmoke/WebStaticFilesSmoke.csproj
      - name: Run static file regression
        run: dotnet run --project ./tests/WebStaticFilesSmoke/WebStaticFilesSmoke.csproj -c Release
