name: Web Response Limit

on:
  push:
    branches:
      - main
      - todo-web-response-body-limit
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'tests/WebResponseLimitSmoke/**'
      - '.github/workflows/web-response-limit.yml'
  pull_request:
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'tests/WebResponseLimitSmoke/**'
      - '.github/workflows/web-response-limit.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore regression
        run: dotnet restore ./tests/WebResponseLimitSmoke/WebResponseLimitSmoke.csproj
      - name: Run response body limit regression
        run: dotnet run --project ./tests/WebResponseLimitSmoke/WebResponseLimitSmoke.csproj -c Release
