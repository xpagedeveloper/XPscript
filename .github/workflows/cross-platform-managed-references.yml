name: Cross Platform Managed References

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/XPScript.Compiler/CompilerDriver.cs'
      - 'src/XPScript.Compiler/ManagedAssemblyReferencePreprocessor.cs'
      - 'src/XPScript.Compiler/CompilerPathSecurity.cs'
      - 'src/XPScript.Compiler/CompilerSecureFileCopy.cs'
      - 'src/XPScript.Compiler/CompilerOutputPublisher.cs'
      - 'tests/ManagedReferenceFixture/**'
      - 'tests/ManagedReferenceDeploymentProbe/**'
      - 'todo/security-review-todo.md'
      - '.github/workflows/cross-platform-managed-references.yml'

permissions:
  contents: read

jobs:
  managed-references:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify managed references and RID-native deployment
        run: dotnet run --project ./tests/ManagedReferenceDeploymentProbe/ManagedReferenceDeploymentProbe.csproj -c Release
