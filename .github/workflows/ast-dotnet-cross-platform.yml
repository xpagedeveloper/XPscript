name: AST .NET cross-platform matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-dotnet-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ast-runtime:
    name: AST runtime (${{ matrix.os }}, .NET ${{ matrix.dotnet }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dotnet: '10.0.x'
            framework: '10'
          - os: ubuntu-latest
            dotnet: '11.0.x'
            framework: '11'
          - os: macos-latest
            dotnet: '10.0.x'
            framework: '10'
          - os: macos-latest
            dotnet: '11.0.x'
            framework: '11'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.404
            ${{ matrix.dotnet }}

      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Run AST runtime smoke fixtures
        shell: pwsh
        run: |
          $compiler = './src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll'
          $fixtures = @(
            './tests/ast-compile-probe/list-byval-element-runtime.xps',
            './tests/ast-compile-probe/class-method-ui-native-signatures.xps',
            './tests/ast-compile-probe/multidimensional-redim.xps'
          )
          foreach ($fixture in $fixtures) {
            Write-Host "===== AST fixture: $fixture (.NET ${{ matrix.framework }}) ====="
            if ($fixture -like '*class-method-ui-native-signatures.xps') {
              $output = Join-Path $env:RUNNER_TEMP 'ast-class-method-signatures'
              dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ast-compile $fixture -o $output --target-framework ${{ matrix.framework }} --security=off --debug
            } else {
              dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ast-run $fixture --target-framework ${{ matrix.framework }} --security=off --no-daemon --debug
            }
            if ($LASTEXITCODE -ne 0) { throw "AST fixture failed: $fixture" }
          }
