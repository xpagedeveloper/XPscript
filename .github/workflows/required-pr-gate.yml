name: Required PR Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-pr-gate:
    name: Required PR Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate solution project-reference closure
        shell: pwsh
        run: |
          $repoRoot = [System.IO.Path]::GetFullPath((Get-Location).Path)
          $solutionPath = Join-Path $repoRoot 'XPScriptCompiler.slnx'
          [xml]$solution = Get-Content -Raw $solutionPath

          $solutionProjects = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($project in @($solution.Solution.Project)) {
            $relativePath = [string]$project.Path
            if ([string]::IsNullOrWhiteSpace($relativePath)) {
              throw 'XPScriptCompiler.slnx contains a Project entry without a Path.'
            }

            $fullPath = [System.IO.Path]::GetFullPath((Join-Path $repoRoot $relativePath))
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
              throw "Solution project does not exist: $relativePath"
            }
            [void]$solutionProjects.Add($fullPath)
          }

          foreach ($projectPath in $solutionProjects) {
            [xml]$projectXml = Get-Content -Raw $projectPath
            $projectDirectory = Split-Path -Parent $projectPath
            foreach ($reference in @($projectXml.Project.ItemGroup.ProjectReference)) {
              if ($null -eq $reference) { continue }
              $include = [string]$reference.Include
              if ([string]::IsNullOrWhiteSpace($include)) { continue }

              $referencedPath = [System.IO.Path]::GetFullPath((Join-Path $projectDirectory $include))
              if (-not (Test-Path -LiteralPath $referencedPath -PathType Leaf)) {
                throw "ProjectReference from '$projectPath' does not exist: $include"
              }
              if (-not $solutionProjects.Contains($referencedPath)) {
                $relativeReferencedPath = [System.IO.Path]::GetRelativePath($repoRoot, $referencedPath).Replace('\', '/')
                $relativeOwnerPath = [System.IO.Path]::GetRelativePath($repoRoot, $projectPath).Replace('\', '/')
                throw "Solution is missing ProjectReference '$relativeReferencedPath' required by '$relativeOwnerPath'. Add it to XPScriptCompiler.slnx."
              }
            }
          }

          Write-Host "SOLUTION-PROJECT-REFERENCE-CLOSURE=OK ($($solutionProjects.Count) projects)"

      - name: Validate command docs and demo catalog
        shell: pwsh
        run: ./scripts/validate-docs-demos.ps1

      - name: Restore compiler
        run: dotnet restore ./XPScriptCompiler.slnx

      - name: Build compiler
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore

      - name: Compile runnable demo programs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/required-gate/demos | Out-Null
          $demos = @(
            'console/hello.xps',
            'desktop-ui/customer-form.xps',
            'browser-wasm/customer-form.xps',
            'sqlite/sqlite-demo.xps',
            'mssql/mssql-demo.xps',
            'httpdb/httpdb-demo.xps',
            'http/http-client.xps',
            'ai/ai-tool-demo.xps'
          )
          foreach ($relative in $demos) {
            $withoutExtension = [System.IO.Path]::ChangeExtension($relative, $null)
            $safe = ($withoutExtension -replace '[^A-Za-z0-9._-]', '-')
            $output = "./out/required-gate/demos/$safe"
            dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- "./demo/$relative" -o $output --framework-dependent
            if ($LASTEXITCODE -ne 0) { throw "Demo compilation failed: $relative" }
          }
          Write-Host "DEMO-COMPILE=OK ($($demos.Count) standalone programs)"

      - name: Verify Seek Loc LOF and Reset
        shell: pwsh
        run: |
          $output = './out/required-gate/demos/file-position-reset'
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-position-reset.xps -o $output --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Seek/Loc/LOF/Reset sample did not compile.' }
          chmod +x $output
          $result = & $output 2>&1
          $exit = $LASTEXITCODE
          $result | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Seek/Loc/LOF/Reset sample failed with exit code $exit." }
          foreach ($expected in @('SEEK-RESET=1','RESET-FREEFILE=1','FILE-POSITION-RESET=OK')) {
            if ($result -notcontains $expected) { throw "File-position sample output missing: $expected" }
          }
          Write-Host 'FILE-POSITION-RESET=OK'

      - name: Verify managed-reference documentation example
        shell: pwsh
        run: |
          dotnet build ./tests/ManagedReferenceFixture/ManagedReferenceFixture.csproj -c Release
          New-Item -ItemType Directory -Force ./samples/managed-reference | Out-Null
          Copy-Item ./tests/ManagedReferenceFixture/bin/Release/net10.0/ManagedReferenceFixture.dll ./samples/managed-reference/ManagedReferenceFixture.dll -Force
          $output = './out/required-gate/demos/managed-reference'
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/managed-reference.xps -o $output --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Managed-reference documentation example did not compile.' }
          chmod +x $output
          $result = & $output 2>&1
          $exit = $LASTEXITCODE
          $result | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Managed-reference documentation example failed with exit code $exit." }
          if ($result -notcontains 'MANAGED-REFERENCE=OK') { throw 'Managed-reference documentation example output mismatch.' }
          Write-Host 'MANAGED-REFERENCE-DOCS=OK'

      - name: Run offline demo programs
        shell: pwsh
        run: |
          $programs = @(
            './out/required-gate/demos/console-hello',
            './out/required-gate/demos/sqlite-sqlite-demo',
            './out/required-gate/demos/httpdb-httpdb-demo'
          )
          foreach ($program in $programs) {
            chmod +x $program
            $output = & $program 2>&1
            $exit = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($exit -ne 0) { throw "Demo runtime failed: $program (exit $exit)" }
          }
          Write-Host "DEMO-RUNTIME=OK ($($programs.Count) offline demos)"

      - name: Compile portable smoke program
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/required-gate | Out-Null
          $output = './out/required-gate/evaluate-xpscript'
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/evaluate-xpscript.xps -o $output --framework-dependent --result-format json
          if ($LASTEXITCODE -ne 0) { throw 'Required PR Gate smoke compilation failed.' }
          chmod +x $output
          $result = & $output 2>&1
          $exit = $LASTEXITCODE
          $result | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Required PR Gate smoke runtime failed with exit code $exit." }
          foreach ($expected in @('EXPRESSION=7','STATEMENTS=52','STRING=HELLO WORLD','LOGICAL=True')) {
            if ($result -notcontains $expected) { throw "Required PR Gate smoke output missing: $expected" }
          }

      - name: Report stable gate
        run: echo 'REQUIRED-PR-GATE=OK'
