name: AST Lifecycle Isolation (Linux)

on:
  push:
    branches: [investigate-ast-compiler]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ast-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Run AST image getter lifecycle regressions
        shell: pwsh
        run: ./tests/ast-compile-probe/run-ast-image-get.ps1
      - name: Run AST constructor lifecycle regressions
        shell: pwsh
        run: ./tests/ast-compile-probe/run-ast-constructor.ps1
      - name: Run AST destructor lifecycle regressions
        shell: pwsh
        run: ./tests/ast-compile-probe/run-ast-destructor.ps1
