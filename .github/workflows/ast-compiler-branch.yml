name: AST Compiler Branch CI

on:
  push:
    branches:
      - investigate-ast-compiler
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-compiler-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-compiler-checks:
    name: Focused compiler checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run focused class override regression first
        shell: pwsh
        run: ./tests/class-override/run-class-override.ps1
      - name: Run focused Parent member regression
        shell: pwsh
        run: ./tests/class-parent/run-class-parent.ps1
      - name: Run focused inherited constructor regression
        shell: pwsh
        run: ./tests/class-constructor/run-class-constructor.ps1
      - name: Run focused inherited delete regression
        shell: pwsh
        run: ./tests/class-delete/run-class-delete.ps1
      - name: Run focused New constructor regression
        shell: pwsh
        run: ./tests/class-new/run-class-new.ps1
      - name: Run focused object reference default regression
        shell: pwsh
        run: ./tests/class-reference-default/run-class-reference-default.ps1
      - name: Run focused Delete alias regression
        shell: pwsh
        run: ./tests/class-delete-alias/run-class-delete-alias.ps1
      - name: Run focused Set Nothing regression
        shell: pwsh
        run: ./tests/class-set-nothing/run-class-set-nothing.ps1
      - name: Run focused fluent class regression
        shell: pwsh
        run: ./tests/class-fluent/run-class-fluent.ps1
      - name: Run focused lazy class instance regression
        shell: pwsh
        run: ./tests/class-lazy-instance/run-class-lazy-instance.ps1
      - name: Run focused AST lexer tests first
        run: dotnet run --project ./tests/ast-lexer/AstLexerProbe.csproj -c Release
      - name: Run bound C# emission regression
        run: dotnet run --project ./tests/ast-emission/AstEmissionProbe.csproj -c Release
      - name: Run AST XPscript compile probe
        run: dotnet run --project ./tests/ast-compile-probe/AstCompileProbe.csproj -c Release
      - name: Verify AST and normal compiler target matrix
        run: dotnet run --project ./tests/TargetMatrixProbe/TargetMatrixProbe.csproj -c Release
      - name: Verify Android AST compiler target probe
        run: dotnet run --project ./tests/AndroidCompilerProbe/AndroidCompilerProbe.csproj -c Release
      - name: Verify AST browser-WASM target compilation
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ast-browser-wasm-target'
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ast-compile ./tests/ast-compile-probe/shared-runtime.xps --output $output --rid browser-wasm
          if (-not (Test-Path (Join-Path $output 'Generated.dll'))) { throw 'AST browser-WASM target compilation did not produce Generated.dll.' }
          Write-Host 'AST_BROWSER_WASM_TARGET_COMPILE=OK'
      - name: Run xpscriptc AST CLI compilation probe
        shell: pwsh
        run: ./tests/ast-compile-probe/run-ast-cli.ps1
      - name: Verify CLI command-line compatibility
        shell: pwsh
        run: ./tests/cli-compatibility/run-cli-compatibility.ps1
      - name: Run focused AST unknown-symbol binder test
        run: dotnet run --project ./tests/ast-binding/AstBindingProbe.csproj -c Release
      - name: Run deterministic AST compatibility tests first
        shell: pwsh
        run: ./tests/ast-compat/run-ast-compat.ps1
      - name: Compare legacy and AST diagnostic identity
        shell: pwsh
        run: ./tests/ast-compat/run-diagnostic-compat.ps1
      - name: Verify focused MCP web diagnostic first
        run: dotnet run --project ./tests/CompilerMcpWebDiagnosticProbe/CompilerMcpWebDiagnosticProbe.csproj -c Release -- .
      - name: Verify CLI and MCP diagnostic parity
        run: dotnet run --project ./tests/CompilerMcpProtocolProbe/CompilerMcpProtocolProbe.csproj -c Release -- .
      - name: Compile repository sample and demo scripts
        shell: pwsh
        run: ./tests/ast-compat/run-repository-sweep.ps1
      - name: Run language tests
        shell: pwsh
        run: ./.github/scripts/run-fulltests.ps1 -Suite language

  windows-ast-cli-regression:
    name: Windows AST CLI regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        shell: pwsh
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        shell: pwsh
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore -p:UseSharedCompilation=false
      - name: Run complete Windows AST CLI regression
        shell: pwsh
        run: ./tests/ast-compile-probe/run-ast-cli.ps1

  full-regression:
    if: github.event_name == 'workflow_dispatch'
    name: Full regression (${{ matrix.name }})
    needs: focused-compiler-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler once
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run all FullTests
        shell: pwsh
        run: ./.github/scripts/run-fulltests.ps1

  desktop-target-matrix:
    name: AST desktop target (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-13
          - rid: osx-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj -r ${{ matrix.rid }}
      - name: Build compiler for target RID
        run: dotnet publish ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore -r ${{ matrix.rid }} --self-contained false -p:UseSharedCompilation=false
      - name: Verify target metadata and supported RID
        run: dotnet run --project ./tests/TargetMatrixProbe/TargetMatrixProbe.csproj -c Release --no-restore
      - name: Compile AST source for target RID
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "ast-target-${{ matrix.rid }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ast-compile ./tests/ast-compile-probe/shared-runtime.xps --output $output --rid ${{ matrix.rid }}
          if (-not (Test-Path (Join-Path $output 'Generated.dll'))) { throw 'AST target compilation did not produce Generated.dll.' }
          $actual = ((& dotnet (Join-Path $output 'Generated.dll')) -join "`n").Trim()
          $expected = @'
INTEGER
LONG
17
True
2
EMPTY=[]
Variable is null
NULL
1
False
True
bcd
True
3
2
1
OVERFLOW=6
CONTINUED
'@.Trim()
          if ($actual -cne $expected) { throw "AST console target output mismatch for ${{ matrix.rid }}.`nExpected:`n$expected`nActual:`n$actual" }
          Write-Host 'AST_CONSOLE_TARGET_RUNTIME=OK'
      - name: Verify generated compiler artifact
        shell: pwsh
        run: |
          $artifact = Get-ChildItem './src/XPScript.Compiler/bin/Release/net10.0/${{ matrix.rid }}/publish/xpscriptc*' | Select-Object -First 1
          if (-not $artifact) { throw 'Target-specific compiler artifact was not produced.' }
          Write-Host "Produced $($artifact.FullName)"

  android-target-build:
    name: AST Android target build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload in the GitHub runner
        run: dotnet workload install android
      - name: Restore and build Android host
        run: |
          dotnet restore ./src/XPScript.UI.Android/XPScript.UI.Android.csproj -r android-x64
          dotnet build ./src/XPScript.UI.Android/XPScript.UI.Android.csproj -c Release --no-restore -r android-x64
      - name: Build AST Android compiler probe
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          dotnet run --project ./tests/AndroidCompilerProbe/AndroidCompilerProbe.csproj -c Release --no-restore
          $output = Join-Path $env:RUNNER_TEMP 'ast-android-arm64'
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ast-compile ./samples/android-debug-print.xps --output $output --runtime=false --platform android-arm64 --debug
          if (-not (Test-Path (Join-Path $output 'Generated.dll'))) { throw 'AST Android ARM64 compilation did not produce Generated.dll.' }
          Write-Host 'AST_ANDROID_TARGET_BUILD=OK'
