name: AST Compiler Branch CI

on:
  push:
    branches:
      - investigate-ast-compiler
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-compiler-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-compiler-checks:
    name: Focused compiler checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run focused AST lexer tests first
        run: dotnet run --project ./tests/ast-lexer/AstLexerProbe.csproj -c Release
      - name: Run deterministic AST compatibility tests first
        shell: pwsh
        run: ./tests/ast-compat/run-ast-compat.ps1
      - name: Verify focused MCP web diagnostic first
        run: dotnet run --project ./tests/CompilerMcpWebDiagnosticProbe/CompilerMcpWebDiagnosticProbe.csproj -c Release -- .
      - name: Verify CLI and MCP diagnostic parity
        run: dotnet run --project ./tests/CompilerMcpProtocolProbe/CompilerMcpProtocolProbe.csproj -c Release -- .
      - name: Compile repository sample and demo scripts
        shell: pwsh
        run: ./tests/ast-compat/run-repository-sweep.ps1
      - name: Run language tests
        shell: pwsh
        run: ./.github/scripts/run-fulltests.ps1 -Suite language

  full-regression:
    name: Full regression (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    needs: focused-compiler-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler once
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run all FullTests
        shell: pwsh
        run: ./.github/scripts/run-fulltests.ps1
