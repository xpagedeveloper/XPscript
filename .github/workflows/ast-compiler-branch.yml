name: AST Compiler Branch CI

on:
  push:
    branches:
      - investigate-ast-compiler
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-compiler-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-compiler-checks:
    name: Focused compiler checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile hello smoke test
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ast-ci-hello --runtime=false
      - name: Run language tests first
        shell: pwsh
        run: ./.github/scripts/run-fulltests.ps1 -Suite language

  full-regression:
    name: Full regression (${{ matrix.name }})
    needs: focused-compiler-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler once
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run all FullTests
        shell: pwsh
        run: ./.github/scripts/run-fulltests.ps1
