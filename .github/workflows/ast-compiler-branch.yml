name: AST Compiler Branch CI

on:
  push:
    branches:
      - investigate-ast-compiler
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-compiler-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ast-compiler-regression:
    name: AST compiler regression ${{ matrix.locale }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: sv-SE
            lang: sv_SE.UTF-8
          - locale: en-US
            lang: en_US.UTF-8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LANG: ${{ matrix.lang }}
      LC_ALL: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v6
      - name: Install test locales
        shell: bash
        run: |
          sudo locale-gen sv_SE.UTF-8 en_US.UTF-8
          locale -a
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Build AST probe projects before concurrent execution
        shell: pwsh
        run: |
          $projects = @(
            './tests/ast-lexer/AstLexerProbe.csproj',
            './tests/ast-emission/AstEmissionProbe.csproj',
            './tests/ast-compile-probe/AstCompileProbe.csproj',
            './tests/AndroidCompilerProbe/AndroidCompilerProbe.csproj',
            './tests/AstApplicationRuntimeProbe/AstApplicationRuntimeProbe.csproj',
            './tests/AstSpreadsheetRuntimeProbe/AstSpreadsheetRuntimeProbe.csproj'
          )
          foreach ($project in $projects) {
            dotnet build $project -c Release
            if ($LASTEXITCODE -ne 0) { throw "Probe build failed: $project" }
          }
      - name: Run AST lexer probe
        run: dotnet run --project ./tests/ast-lexer/AstLexerProbe.csproj -c Release --no-build
      - name: Run AST emission probe
        run: dotnet run --project ./tests/ast-emission/AstEmissionProbe.csproj -c Release --no-build
      - name: Run AST compiler probe
        run: dotnet run --project ./tests/ast-compile-probe/AstCompileProbe.csproj -c Release --no-build
      - name: Run Android compiler metadata probe
        run: dotnet run --project ./tests/AndroidCompilerProbe/AndroidCompilerProbe.csproj -c Release --no-build
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Verify browser WASM AST target
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ast-browser-wasm-target'
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ast-compile ./tests/ast-compile-probe/shared-runtime.xps --output $output --rid browser-wasm
          if (-not (Test-Path (Join-Path $output 'Generated.dll'))) { throw 'AST browser-WASM target compilation did not produce Generated.dll.' }
          Write-Host 'AST_BROWSER_WASM_TARGET_COMPILE=OK'
      - name: Run AST CLI regression
        shell: pwsh
        run: ./tests/ast-compile-probe/run-ast-cli.ps1
      - name: Verify CLI compatibility
        shell: pwsh
        run: ./tests/cli-compatibility/run-cli-compatibility.ps1
