name: UIForm Extended Fields

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/UIFormAdditionalFieldsPostProcessor.cs'
      - 'src/XPScript.Compiler/UIFormAdditionalFieldFixupPostProcessor.cs'
      - 'src/XPScript.Compiler/UIFormRemoteSearchPostProcessor.cs'
      - 'src/XPScript.Compiler/UIExtensionDesktopPostProcessor.cs'
      - 'src/XPScript.Web.Runtime/XpsUIWebRuntimeBridge.cs'
      - 'samples/uiform-extended-fields.xps'
      - 'samples/uiform-remote-search.xps'
      - 'tests/uiform_extended_lookup_server.py'
      - '.github/workflows/uiform-extended-fields.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile and run remote-search sample without backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = if ($IsWindows) { './out/uiform-remote-search.exe' } else { './out/uiform-remote-search' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Remote-search UIForm sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Remote-search UIForm sample failed. Server-side mode must not preload the backend.`n$output" }
          $output | ForEach-Object { Write-Host $_ }
          if ($output -notcontains 'FIELD_COUNT=2') { throw "Unexpected remote-search field count.`n$output" }
          if ($output -notcontains 'UIFORM_REMOTE_SEARCH=OK') { throw "Remote-search completion marker missing.`n$output" }
      - name: Start lookup API
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList './tests/uiform_extended_lookup_server.py' -PassThru
          $server.Id | Set-Content ./uiform-lookup.pid
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $client = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 18083)
              $client.Dispose()
              exit 0
            } catch {
              Start-Sleep -Milliseconds 200
            }
          }
          throw 'UIForm lookup server did not start.'
      - name: Compile and run extended field sample
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = if ($IsWindows) { './out/uiform-extended-fields.exe' } else { './out/uiform-extended-fields' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-extended-fields.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Extended UIForm sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Extended UIForm sample failed.`n$output" }
          $output | ForEach-Object { Write-Host $_ }
          if ($output -notcontains 'FIELD_COUNT=10') { throw "Unexpected UIForm field count.`n$output" }
          if ($output -notcontains 'ROLE_COUNT=2') { throw "Multi-value UIForm binding failed.`n$output" }
          if ($output -notcontains 'UIFORM_EXTENDED_FIELDS=OK') { throw "Extended UIForm completion marker missing.`n$output" }
      - name: Stop lookup API
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./uiform-lookup.pid) {
            $pidValue = [int](Get-Content ./uiform-lookup.pid)
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
