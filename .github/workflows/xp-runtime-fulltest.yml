name: XP Runtime FullTest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xp-runtime-fulltest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xp-runtime:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify XPSpreadsheet compiler probes
        shell: pwsh
        run: |
          dotnet run --project ./tests/SpreadsheetCapabilityProbe/SpreadsheetCapabilityProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and run XPSpreadsheet suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./out/xp-runtime | Out-Null
          $compilerDll = (Resolve-Path './src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll').Path
          $samples = @('xpspreadsheet-basic','xpspreadsheet-worksheets','xpspreadsheet-styles','xpspreadsheet-ranges','xpspreadsheet-formatting','xpspreadsheet-autofilter','xpspreadsheet-csv-interop')
          foreach ($sample in $samples) {
            dotnet $compilerDll "./demo/spreadsheet/$sample.xps" -o "./out/xp-runtime/$sample" --runtime=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = if (Test-Path "./out/xp-runtime/$sample.exe") { "./out/xp-runtime/$sample.exe" } else { "./out/xp-runtime/$sample" }
            & $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not $IsWindows) {
            $xlsx = Get-ChildItem -Path . -Filter 'xpspreadsheet-basic.xlsx' -File -Recurse | Select-Object -First 1
            if ($null -eq $xlsx) { Write-Error 'XPSpreadsheet round-trip did not create the expected XLSX file.'; exit 1 }
            Add-Type -AssemblyName System.IO.Compression
            $zip = [System.IO.Compression.ZipFile]::OpenRead($xlsx.FullName)
            try {
              $marker = $zip.GetEntry('docProps/custom.xml')
              if ($null -eq $marker) { Write-Error 'XPSpreadsheet workbook marker is missing.'; exit 1 }
              $reader = [System.IO.StreamReader]::new($marker.Open())
              try { $markerText = $reader.ReadToEnd() } finally { $reader.Dispose() }
              if ($markerText -notmatch 'XPScriptWorkbookVersion' -or $markerText -notmatch '>2<') { Write-Error "XPSpreadsheet workbook marker is invalid: $markerText"; exit 1 }
            }
            finally { $zip.Dispose() }
          }
      - name: Verify XPSpreadsheet unsupported format error
        shell: pwsh
        run: |
          $compilerDll = (Resolve-Path './src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll').Path
          dotnet $compilerDll ./demo/spreadsheet/xpspreadsheet-invalid-format.xps -o ./out/xp-runtime/xpspreadsheet-invalid-format --runtime=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = if (Test-Path './out/xp-runtime/xpspreadsheet-invalid-format.exe') { './out/xp-runtime/xpspreadsheet-invalid-format.exe' } else { './out/xp-runtime/xpspreadsheet-invalid-format' }
          if ($IsWindows) {
            $stdoutFile = Join-Path $env:RUNNER_TEMP 'xpspreadsheet-invalid-format.stdout.txt'
            $stderrFile = Join-Path $env:RUNNER_TEMP 'xpspreadsheet-invalid-format.stderr.txt'
            $process = Start-Process -FilePath $exe -Wait -PassThru -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
            $invalidFormatExitCode = $process.ExitCode
            $output = ((Get-Content $stdoutFile -Raw -ErrorAction SilentlyContinue) + (Get-Content $stderrFile -Raw -ErrorAction SilentlyContinue))
          }
          else {
            $output = (& $exe 2>&1 | Out-String)
            $invalidFormatExitCode = $LASTEXITCODE
          }
          if ($invalidFormatExitCode -eq 0) { Write-Error 'XPSpreadsheet unexpectedly accepted a non-XLSX format.'; exit 1 }
          if ($output -notmatch 'supports only \.xlsx files') { Write-Error "XPSpreadsheet returned the wrong unsupported-format diagnostic: $output"; exit 1 }
          $global:LASTEXITCODE = 0
      - name: Compile and run JSON, CSV and XML regressions
        shell: pwsh
        run: |
          $compilerDll = (Resolve-Path './src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll').Path
          $samples = @('native-csv-regression','native-xml-dom-regression')
          foreach ($sample in $samples) {
            dotnet $compilerDll "./samples/$sample.xps" -o "./out/xp-runtime/$sample" --runtime=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = if (Test-Path "./out/xp-runtime/$sample.exe") { "./out/xp-runtime/$sample.exe" } else { "./out/xp-runtime/$sample" }
            & $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compile XPAi structured output
        shell: pwsh
        run: |
          $compilerDll = (Resolve-Path './src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll').Path
          dotnet $compilerDll ./samples/xpai-structured-output.xps -o ./out/xp-runtime/xpai-structured --runtime=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'XP_RUNTIME_FULLTEST: passed'
