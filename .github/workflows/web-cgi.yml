name: Web CGI

on:
  push:
    paths:
      - '.github/workflows/web-cgi.yml'
      - 'src/XPScript.Web.Cgi/**'
      - 'src/XPScript.Web.Runtime/XpsWebContext.cs'
      - 'src/XPScript.Web.Runtime/XpsWebRequest.cs'
      - 'src/XPScript.Web.Runtime/XpsWebResponse.cs'
      - 'src/XPScript.Web.Runtime/XpsMultipartForm.cs'
      - 'src/XPScript.Web.Compiler/XpsWebDispatcher.cs'
      - 'src/XPScript.Web.Compiler/XpsWebCompiler.cs'
      - 'src/XPScript.Web.Compiler/XpsWebCompilationCache.cs'
      - 'tests/WebCgiSmoke/**'
      - 'tests/WebCgiDominoSmoke/**'
      - 'tests/WebCgiStateSmoke/**'
      - 'tests/WebFileTransferSmoke/**'
      - 'XPScriptCompiler.slnx'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/web-cgi.yml'
      - 'src/XPScript.Web.Cgi/**'
      - 'src/XPScript.Web.Runtime/XpsWebContext.cs'
      - 'src/XPScript.Web.Runtime/XpsWebRequest.cs'
      - 'src/XPScript.Web.Runtime/XpsWebResponse.cs'
      - 'src/XPScript.Web.Runtime/XpsMultipartForm.cs'
      - 'src/XPScript.Web.Compiler/XpsWebDispatcher.cs'
      - 'src/XPScript.Web.Compiler/XpsWebCompiler.cs'
      - 'src/XPScript.Web.Compiler/XpsWebCompilationCache.cs'
      - 'tests/WebCgiSmoke/**'
      - 'tests/WebCgiDominoSmoke/**'
      - 'tests/WebCgiStateSmoke/**'
      - 'tests/WebFileTransferSmoke/**'
      - 'XPScriptCompiler.slnx'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx
      - name: Build solution
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore
      - name: Run CGI adapter and executable regression
        run: dotnet run --project ./tests/WebCgiSmoke/WebCgiSmoke.csproj -c Release
      - name: Run Domino PATH_INFO CGI regression
        run: dotnet run --project ./tests/WebCgiDominoSmoke/WebCgiDominoSmoke.csproj -c Release
      - name: Run persistent CGI Session and Application regression
        run: dotnet run --project ./tests/WebCgiStateSmoke/WebCgiStateSmoke.csproj -c Release
      - name: Run multipart upload and file response regression
        run: dotnet run --project ./tests/WebFileTransferSmoke/WebFileTransferSmoke.csproj -c Release
