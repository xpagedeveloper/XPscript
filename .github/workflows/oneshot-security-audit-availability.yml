name: One-shot security audit availability implementation

on:
  push:
    branches:
      - feature/application-dependency-security
    paths:
      - .github/workflows/oneshot-security-audit-availability.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/application-dependency-security
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Patch audit availability handling
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          audit = 'src/XPScript.Compiler/ApplicationSecurityAudit.cs'
          replace_once(
              audit,
              '    private static readonly Regex NuGetAuditWarning = new(\n',
              '    private static readonly Regex NuGetAuditUnavailable = new(\n        @"(?:warning|error)\\s+(?<code>NU1900|NU1905):\\s*(?<message>[^\\r\\n]+)",\n        RegexOptions.IgnoreCase | RegexOptions.CultureInvariant | RegexOptions.Compiled);\n\n    private static readonly Regex NuGetAuditWarning = new(\n')
          replace_once(
              audit,
              '        var findings = Parse(buildOutput);\n        if (findings.Count == 0) return;\n',
              '        var unavailable = ParseUnavailable(buildOutput);\n        if (unavailable is not null)\n        {\n            var message = $"Application dependency security check unavailable [{unavailable.Code}]: {unavailable.Message}";\n            if (mode == ApplicationSecurityMode.Strict)\n                throw new CompilerException(message);\n            Console.Error.WriteLine(message);\n        }\n\n        var findings = Parse(buildOutput);\n        if (findings.Count == 0) return;\n')
          replace_once(
              audit,
              '    internal static IReadOnlyList<Finding> Parse(string buildOutput)\n',
              '    internal static UnavailableFinding? ParseUnavailable(string buildOutput)\n    {\n        var match = NuGetAuditUnavailable.Match(buildOutput ?? string.Empty);\n        if (!match.Success) return null;\n        return new UnavailableFinding(\n            match.Groups["code"].Value.Trim().ToUpperInvariant(),\n            match.Groups["message"].Value.Trim());\n    }\n\n    internal static IReadOnlyList<Finding> Parse(string buildOutput)\n')
          replace_once(
              audit,
              '    internal sealed record Finding(string Code, string Package, string Version, string Severity, string Advisory);\n',
              '    internal sealed record UnavailableFinding(string Code, string Message);\n    internal sealed record Finding(string Code, string Package, string Version, string Severity, string Advisory);\n')

          inspector = 'src/XPScript.Compiler/ApplicationDependencyInspector.cs'
          replace_once(
              inspector,
              'public sealed record ApplicationDependencyInspection(\n    string SourceFile,\n    string RuntimeIdentifier,\n    IReadOnlyList<ApplicationResolvedDependency> Dependencies)\n',
              'public sealed record ApplicationDependencyInspection(\n    string SourceFile,\n    string RuntimeIdentifier,\n    IReadOnlyList<ApplicationResolvedDependency> Dependencies,\n    bool SecurityCheckAvailable = true,\n    string? SecurityCheckMessage = null)\n')
          replace_once(
              inspector,
              '            var list = await RunDotnetAsync(tempRoot, args, cancellationToken).ConfigureAwait(false);\n            if (list.ExitCode != 0)\n                throw new CompilerException("Unable to inspect application dependencies." + Environment.NewLine + list.Output);\n\n            var dependencies = ParsePackageListJson(list.Stdout, directByName);\n            return new(Path.GetFileName(sourcePath), rid, dependencies);\n',
              '            var list = await RunDotnetAsync(tempRoot, args, cancellationToken).ConfigureAwait(false);\n            var unavailable = vulnerabilitiesOnly ? ApplicationSecurityAudit.ParseUnavailable(list.Output) : null;\n            if (list.ExitCode != 0 && unavailable is null)\n                throw new CompilerException("Unable to inspect application dependencies." + Environment.NewLine + list.Output);\n\n            var dependencies = list.ExitCode == 0 ? ParsePackageListJson(list.Stdout, directByName) : [];\n            return new(\n                Path.GetFileName(sourcePath),\n                rid,\n                dependencies,\n                SecurityCheckAvailable: unavailable is null,\n                SecurityCheckMessage: unavailable is null ? null : $"[{unavailable.Code}] {unavailable.Message}");\n')

          command = 'src/XPScript.Cli/ApplicationDependencyCommand.cs'
          replace_once(
              command,
              '        if (json)\n        {\n            Console.WriteLine(JsonSerializer.Serialize(inspection, new JsonSerializerOptions { WriteIndented = true }));\n            return securityOnly && inspection.VulnerableDependencies.Count > 0 ? 2 : 0;\n        }\n',
              '        if (json)\n        {\n            Console.WriteLine(JsonSerializer.Serialize(inspection, new JsonSerializerOptions { WriteIndented = true }));\n            if (securityOnly && !inspection.SecurityCheckAvailable) return 3;\n            return securityOnly && inspection.VulnerableDependencies.Count > 0 ? 2 : 0;\n        }\n')
          replace_once(
              command,
              '        if (securityOnly)\n        {\n            if (inspection.VulnerableDependencies.Count == 0)\n',
              '        if (securityOnly)\n        {\n            if (!inspection.SecurityCheckAvailable)\n            {\n                Console.WriteLine("Security status: UNAVAILABLE");\n                Console.WriteLine(inspection.SecurityCheckMessage ?? "NuGet vulnerability information could not be retrieved.");\n                return 3;\n            }\n\n            if (inspection.VulnerableDependencies.Count == 0)\n')
          replace_once(
              command,
              'Returns exit code 2 when one or more vulnerable dependencies are found.\n',
              'Returns exit code 2 when one or more vulnerable dependencies are found.\nReturns exit code 3 when NuGet vulnerability information is unavailable.\n')
      - name: Build CLI
        run: dotnet build src/XPScript.Cli/XPScript.Cli.csproj -c Release --nologo
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/XPScript.Compiler src/XPScript.Cli
          git commit -m "Handle unavailable NuGet vulnerability audit data"
          git push origin HEAD:feature/application-dependency-security
