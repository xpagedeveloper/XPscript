name: Application Runtime Concurrency

on:
  push:
    branches:
      - todo-application-concurrent-reads
    paths:
      - 'src/XPScript.Compiler/ApplicationRuntimeSource.cs'
      - 'tests/ApplicationRuntimeConcurrencyProbe/**'
      - '.github/workflows/application-runtime-concurrency.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/ApplicationRuntimeSource.cs'
      - 'tests/ApplicationRuntimeConcurrencyProbe/**'
      - '.github/workflows/application-runtime-concurrency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concurrent-reads:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run exact generated Application runtime concurrency probe
        shell: pwsh
        run: |
          dotnet run --project ./tests/ApplicationRuntimeConcurrencyProbe/ApplicationRuntimeConcurrencyProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Application runtime concurrency probe failed with exit code $LASTEXITCODE." }
