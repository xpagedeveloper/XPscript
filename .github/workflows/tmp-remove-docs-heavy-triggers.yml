name: Remove Docs Heavy CI Triggers

on:
  push:
    branches:
      - docs-command-reference-standard
    paths:
      - '.github/workflows/tmp-remove-docs-heavy-triggers.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs-command-reference-standard
      - name: Remove docs path triggers from heavy workflows
        shell: python
        run: |
          from pathlib import Path
          import re

          keep = {'documentation-reference.yml', 'branding-regression.yml', 'tmp-remove-docs-heavy-triggers.yml'}
          changed = []
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              if path.name in keep:
                  continue
              text = path.read_text(encoding='utf-8')
              new = re.sub(r"(?m)^\s*-\s*'docs/[^']*'\s*\n", '', text)
              new = re.sub(r'(?m)^\s*-\s*"docs/[^"]*"\s*\n', '', new)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Updated workflows:')
          for item in changed:
              print('-', item)
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-remove-docs-heavy-triggers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Keep documentation changes on lightweight CI"
          git push origin HEAD:docs-command-reference-standard
