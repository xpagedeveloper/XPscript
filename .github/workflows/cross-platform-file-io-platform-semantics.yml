name: Cross Platform File IO Platform Semantics

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/FileSystemPortabilityRuntimeSource.cs'
      - 'src/XPScript.Compiler/FileIoExtensionsRuntimeSource.cs'
      - 'src/XPScript.Compiler/CrossPlatformRuntimeSource.cs'
      - 'samples/file-io-platform-semantics.xps'
      - 'docs/file-io-reference.md'
      - '.github/workflows/cross-platform-file-io-platform-semantics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-dir-depth:
    if: github.head_ref == 'feature/dir-filter-isfile-isdir'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply bounded recursive Dir and documentation
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('src/XPScript.Compiler/CrossPlatformRuntimeSource.cs')
          s = runtime.read_text()
          old = '''    public static string Dir(object? pattern = null, int mode = 0)
    {
        if (pattern is not null)
        {
            if (mode < 0 || mode > 3)
                throw new XPScriptRuntimeException(5, "Dir mode must be 0, 1, 2, or 3.");

            var raw = XPScriptRuntime.CStr(pattern);
            if (string.IsNullOrWhiteSpace(raw)) raw = "*";

            var directoryPart = Path.GetDirectoryName(raw);
            var directory = string.IsNullOrEmpty(directoryPart)
                ? Environment.CurrentDirectory
                : Path.GetFullPath(directoryPart);
            var mask = Path.GetFileName(raw);
            if (string.IsNullOrEmpty(mask)) mask = "*";
            if (!Directory.Exists(directory))
                throw new DirectoryNotFoundException("Directory does not exist.");

            IEnumerable<string> entries = mode switch
            {
                0 => Directory.EnumerateFileSystemEntries(directory, mask, SearchOption.TopDirectoryOnly),
                1 => Directory.EnumerateFiles(directory, mask, SearchOption.TopDirectoryOnly),
                2 => Directory.EnumerateDirectories(directory, mask, SearchOption.TopDirectoryOnly),
                3 => Directory.EnumerateFiles(directory, mask, SearchOption.AllDirectories),
                _ => throw new XPScriptRuntimeException(5, "Dir mode must be 0, 1, 2, or 3.")
            };

            DirEnumerator?.Dispose();
            DirEnumerator = entries
                .Select(entry => mode == 3 ? Path.GetRelativePath(directory, entry) : Path.GetFileName(entry))
                .Where(name => !string.IsNullOrEmpty(name) && name != "." && name != "..")
                .GetEnumerator();
        }

        if (DirEnumerator is null) return "";
        if (!DirEnumerator.MoveNext())
        {
            DirEnumerator.Dispose();
            DirEnumerator = null;
            return "";
        }
        return DirEnumerator.Current;
    }
'''
          new = '''    public static string Dir(object? pattern = null, int mode = 0, int maxDepth = 3)
    {
        if (pattern is not null)
        {
            if (mode < 0 || mode > 3)
                throw new XPScriptRuntimeException(5, "Dir mode must be 0, 1, 2, or 3.");
            if (maxDepth < 0 || maxDepth > 32)
                throw new XPScriptRuntimeException(5, "Dir maxDepth must be between 0 and 32.");

            var raw = XPScriptRuntime.CStr(pattern);
            if (string.IsNullOrWhiteSpace(raw)) raw = "*";

            var directoryPart = Path.GetDirectoryName(raw);
            var directory = string.IsNullOrEmpty(directoryPart)
                ? Environment.CurrentDirectory
                : Path.GetFullPath(directoryPart);
            var mask = Path.GetFileName(raw);
            if (string.IsNullOrEmpty(mask)) mask = "*";
            if (!Directory.Exists(directory))
                throw new DirectoryNotFoundException("Directory does not exist.");

            IEnumerable<string> entries = mode switch
            {
                0 => Directory.EnumerateFileSystemEntries(directory, mask, SearchOption.TopDirectoryOnly),
                1 => Directory.EnumerateFiles(directory, mask, SearchOption.TopDirectoryOnly),
                2 => Directory.EnumerateDirectories(directory, mask, SearchOption.TopDirectoryOnly),
                3 => EnumerateFilesLimitedDepth(directory, mask, maxDepth),
                _ => throw new XPScriptRuntimeException(5, "Dir mode must be 0, 1, 2, or 3.")
            };

            DirEnumerator?.Dispose();
            DirEnumerator = entries
                .Select(entry => mode == 3 ? Path.GetRelativePath(directory, entry) : Path.GetFileName(entry))
                .Where(name => !string.IsNullOrEmpty(name) && name != "." && name != "..")
                .GetEnumerator();
        }

        if (DirEnumerator is null) return "";
        if (!DirEnumerator.MoveNext())
        {
            DirEnumerator.Dispose();
            DirEnumerator = null;
            return "";
        }
        return DirEnumerator.Current;
    }

    private static IEnumerable<string> EnumerateFilesLimitedDepth(string root, string mask, int maxDepth)
    {
        var pending = new Stack<(string Directory, int Depth)>();
        pending.Push((root, 0));

        while (pending.Count > 0)
        {
            var current = pending.Pop();
            foreach (var file in Directory.EnumerateFiles(current.Directory, mask, SearchOption.TopDirectoryOnly))
                yield return file;

            if (current.Depth >= maxDepth) continue;

            foreach (var child in Directory.EnumerateDirectories(current.Directory, "*", SearchOption.TopDirectoryOnly))
            {
                FileAttributes attributes;
                try { attributes = File.GetAttributes(child); }
                catch (IOException) { continue; }
                catch (UnauthorizedAccessException) { continue; }
                if ((attributes & FileAttributes.ReparsePoint) != 0) continue;
                pending.Push((child, current.Depth + 1));
            }
        }
    }
'''
          if old in s:
              runtime.write_text(s.replace(old, new, 1))
          elif 'int maxDepth = 3' not in s:
              raise SystemExit('Expected Dir implementation not found')

          sample = Path('samples/file-io-platform-semantics.xps')
          s = sample.read_text()
          marker = '''    Print "DIR_MODE3=OK"
'''
          addition = '''    MkDir "depth-a"
    MkDir "depth-a/depth-b"
    MkDir "depth-a/depth-b/depth-c"
    fileNumber = FreeFile
    Open "depth-a/level1.txt" For Output As #fileNumber
    Print #fileNumber, "level1"
    Close #fileNumber
    fileNumber = FreeFile
    Open "depth-a/depth-b/level2.txt" For Output As #fileNumber
    Print #fileNumber, "level2"
    Close #fileNumber
    fileNumber = FreeFile
    Open "depth-a/depth-b/depth-c/level3.txt" For Output As #fileNumber
    Print #fileNumber, "level3"
    Close #fileNumber

    found = Dir("*", 3, 1)
    Dim sawLevel1 As Integer
    Dim sawLevel2 As Integer
    sawLevel1 = 0
    sawLevel2 = 0
    Do While found <> ""
        If found = "depth-a/level1.txt" Or found = "depth-a\\level1.txt" Then sawLevel1 = 1
        If Instr(found, "level2.txt") > 0 Then sawLevel2 = 1
        found = Dir()
    Loop
    If sawLevel1 <> 1 Or sawLevel2 <> 0 Then Error 9722, "Dir recursive maxDepth=1 boundary failed"
    Print "DIR_MAXDEPTH=OK"

    Kill "depth-a/depth-b/depth-c/level3.txt"
    Kill "depth-a/depth-b/level2.txt"
    Kill "depth-a/level1.txt"
    RmDir "depth-a/depth-b/depth-c"
    RmDir "depth-a/depth-b"
    RmDir "depth-a"
'''
          if 'DIR_MAXDEPTH=OK' not in s:
              if marker not in s: raise SystemExit('DIR_MODE3 marker not found')
              sample.write_text(s.replace(marker, marker + addition, 1))

          docs = Path('docs/file-io-reference.md')
          s = docs.read_text()
          old_dir = '| `Dir` | `Dir([pattern] [, mode])` | optional `pattern`: path/search mask; optional `mode`: `0`/omitted = files and directories in the current level, `1` = files only, `2` = directories only, `3` = files recursively including subdirectories. Call `Dir()` again to continue enumeration. | Enumerates matching entries, always excluding `.` and `..`. Recursive mode returns paths relative to the searched directory. | [filesystem-portability-semantics.xps](../samples/filesystem-portability-semantics.xps) |'
          new_dir = '| `Dir` | `Dir([pattern] [, mode [, maxDepth]])` | optional `pattern`: path/search mask; optional `mode`: `0`/omitted = files and directories in the current level, `1` = files only, `2` = directories only, `3` = files recursively; optional `maxDepth`: recursion depth for mode `3`, default `3`, valid `0..32`. Depth `0` searches only the starting directory, `1` includes one subdirectory level, and so on. Call `Dir()` again to continue enumeration. | Enumerates matching entries, always excluding `.` and `..`. Recursive mode is bounded, skips reparse-point/symbolic-link directories, and returns paths relative to the searched directory. | [filesystem-portability-semantics.xps](../samples/filesystem-portability-semantics.xps) |'
          if old_dir in s:
              s = s.replace(old_dir, new_dir, 1)
          elif 'Dir([pattern] [, mode [, maxDepth]])' not in s:
              raise SystemExit('Dir docs row not found')

          old_attr = '| `GetFileAttr` | `GetFileAttr(path)` | `path`: file path. | Returns the file attribute bit mask. Platform-specific attributes follow XPScript portability semantics. | [filesystem-portability-semantics.xps](../samples/filesystem-portability-semantics.xps) |'
          new_attr = '''| `GetFileAttr` | `GetFileAttr(fullPath)` | `fullPath`: existing file or directory path. | Returns the platform file-attribute bit mask described below. | [filesystem-portability-semantics.xps](../samples/filesystem-portability-semantics.xps) |'''
          if old_attr in s:
              s = s.replace(old_attr, new_attr, 1)
          elif 'GetFileAttr(fullPath)' not in s:
              raise SystemExit('GetFileAttr docs row not found')

          section = '''
### `GetFileAttr(fullPath)` attribute values

`GetFileAttr` returns the integer bit mask reported by .NET `FileAttributes` for the existing path. Multiple bits can be set at the same time, so test an attribute with a bitwise `And`, for example `If (GetFileAttr(path) And 16) <> 0 Then ...`.

| Value | Attribute | Windows | macOS / Linux |
|---:|---|---|---|
| `1` | ReadOnly | Returned when the filesystem reports the Windows read-only attribute. | May be returned when the runtime/filesystem exposes a read-only attribute; Unix permission bits are not a one-to-one Windows attribute mapping. |
| `2` | Hidden | Native Windows Hidden attribute. | XPScript guarantees this bit for names whose final path component starts with `.`. |
| `4` | System | Windows system attribute where supported. | Normally not meaningful on Unix-like filesystems. |
| `16` | Directory | Directory. | Directory. |
| `32` | Archive | Windows archive attribute where supported. | Normally not meaningful on Unix-like filesystems. |
| `128` | Normal | A regular path with no other applicable special attributes may report Normal. | May be reported for an otherwise ordinary file. |
| `256` | Temporary | Windows/filesystem temporary attribute where supported. | Filesystem/runtime dependent. |
| `512` | SparseFile | Sparse-file attribute where exposed. | Filesystem/runtime dependent. |
| `1024` | ReparsePoint | Reparse point, including symbolic-link-like entries. | Used by .NET for symbolic links/reparse-style entries where exposed. |
| `2048` | Compressed | Windows compressed attribute where supported. | Filesystem/runtime dependent. |
| `4096` | Offline | Windows offline attribute where supported. | Normally not meaningful on Unix-like filesystems. |
| `8192` | NotContentIndexed | Windows indexing attribute where supported. | Normally not meaningful on Unix-like filesystems. |
| `16384` | Encrypted | Windows encrypted attribute where supported. | Filesystem/runtime dependent. |

The result is a bit mask, not a single enum value. Windows can therefore return combinations such as `Directory + Hidden = 18`. On macOS/Linux, XPScript explicitly adds `Hidden (2)` for dot-prefixed names because hidden state is conventionally represented by the filename rather than a native Windows-style attribute. Other bits are whatever the underlying .NET runtime and filesystem report for that path; do not assume Windows-only metadata such as `Archive` or `System` exists on Unix-like systems.

'''
          if '### `GetFileAttr(fullPath)` attribute values' not in s:
              anchor = '## Copyable example\n'
              if anchor not in s: raise SystemExit('Docs copyable-example anchor not found')
              s = s.replace(anchor, section + anchor, 1)
          docs.write_text(s)

      - name: Commit prepared changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No preparation changes needed."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/XPScript.Compiler/CrossPlatformRuntimeSource.cs samples/file-io-platform-semantics.xps docs/file-io-reference.md
          git commit -m 'Bound recursive Dir depth and document file attributes'
          git push origin HEAD:${{ github.head_ref }}

  platform-semantics:
    needs: prepare-dir-depth
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Resolve current RID
        id: rid
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } elseif ($env:RUNNER_ARCH -eq 'X64') { 'x64' } else { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          $os = if ($env:RUNNER_OS -eq 'Windows') { 'win' } elseif ($env:RUNNER_OS -eq 'Linux') { 'linux' } elseif ($env:RUNNER_OS -eq 'macOS') { 'osx' } else { throw "Unsupported runner OS: $env:RUNNER_OS" }
          "rid=$os-$arch" >> $env:GITHUB_OUTPUT
      - name: Compile and verify filesystem semantics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = if ($env:RUNNER_OS -eq 'Windows') { './out/file-io-platform-semantics.exe' } else { './out/file-io-platform-semantics' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-io-platform-semantics.xps --runtime '${{ steps.rid.outputs.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'file-io-platform-semantics.xps compilation failed.' }
          $result = & $exe
          if ($LASTEXITCODE -ne 0) { throw "Platform semantics fixture failed.`n$result" }
          $result | ForEach-Object { Write-Host $_ }
          if ($result -notcontains 'FILE_IO_PLATFORM_SEMANTICS=OK') { throw "Missing success marker.`n$result" }
          if ($result -notcontains 'ISFILE_ISDIR=OK') { throw "IsFile/IsDir regression missing.`n$result" }
          if ($result -notcontains 'DIR_MODE1=OK') { throw "Dir mode 1 regression missing.`n$result" }
          if ($result -notcontains 'DIR_MODE2=OK') { throw "Dir mode 2 regression missing.`n$result" }
          if ($result -notcontains 'DIR_MODE3=OK') { throw "Dir mode 3 regression missing.`n$result" }
          if ($result -notcontains 'DIR_MAXDEPTH=OK') { throw "Dir maxDepth regression missing.`n$result" }

          if ($env:RUNNER_OS -eq 'Windows') {
            if ($result -notcontains 'CHDRIVE_WINDOWS=SUPPORTED') { throw "Windows ChDrive was not verified.`n$result" }
            $hidden = $result | Where-Object { $_ -like 'WINDOWS_HIDDEN_ATTR=*' } | Select-Object -First 1
            if (-not $hidden) { throw "Windows hidden attribute was not observed.`n$result" }
            $value = [int]($hidden -replace '^WINDOWS_HIDDEN_ATTR=', '')
            if (($value -band 2) -eq 0) { throw "Windows hidden attribute bit was not set.`n$result" }
            if ($result -notcontains 'DIR_CASE_MATCH=TRUE') { throw "Windows filesystem should match case-insensitively on the hosted runner.`n$result" }
            if ($result -notcontains 'DELETE_OPEN_WINDOWS=BLOCKED') { throw "Windows delete-while-open contract was not verified.`n$result" }
          } else {
            if ($result -notcontains 'CHDRIVE_NONWINDOWS_ERR=5') { throw "Non-Windows ChDrive must raise XPScript error 5.`n$result" }
            if ($result -notcontains 'UNIX_SET_HIDDEN_ERR=5') { throw "Unix SetFileAttr Hidden must require an explicit dot-name rename.`n$result" }
            $dotHidden = $result | Where-Object { $_ -like 'DOT_HIDDEN_ATTR=*' } | Select-Object -First 1
            if (-not $dotHidden) { throw "Unix dot-hidden attributes were not reported.`n$result" }
            $value = [int]($dotHidden -replace '^DOT_HIDDEN_ATTR=', '')
            if (($value -band 2) -eq 0) { throw "Unix leading-dot file did not synthesize the Hidden bit.`n$result" }
            if ($result -notcontains 'DELETE_OPEN_UNIX=UNLINKED') { throw "Unix delete-while-open contract was not verified.`n$result" }
            if ($env:RUNNER_OS -eq 'Linux' -and $result -notcontains 'DIR_CASE_MATCH=FALSE') { throw "Linux hosted filesystem should preserve case-sensitive Dir matching.`n$result" }
          }
