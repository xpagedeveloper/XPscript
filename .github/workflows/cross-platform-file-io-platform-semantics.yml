name: Cross Platform File IO Platform Semantics

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/FileSystemPortabilityRuntimeSource.cs'
      - 'src/XPScript.Compiler/FileIoExtensionsRuntimeSource.cs'
      - 'src/XPScript.Compiler/FileIoExtensionsPreprocessor.cs'
      - 'src/XPScript.Compiler/CrossPlatformRuntimeSource.cs'
      - 'src/XPScript.Compiler/CrossPlatformPreprocessor.cs'
      - 'src/XPScript.Compiler/AdvancedXPScriptTranspiler.cs'
      - 'samples/file-io-platform-semantics.xps'
      - 'samples/file-convenience.xps'
      - 'docs/file-io-reference.md'
      - 'scripts/_patch_copy_move_path.py'
      - '.github/workflows/cross-platform-file-io-platform-semantics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-copy-move-path:
    if: github.head_ref == 'feature/dir-filter-isfile-isdir'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python ./scripts/_patch_copy_move_path.py
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/XPScript.Compiler/FileSystemPortabilityRuntimeSource.cs src/XPScript.Compiler/CrossPlatformRuntimeSource.cs src/XPScript.Compiler/CrossPlatformPreprocessor.cs samples/file-convenience.xps docs/file-io-reference.md
          git commit -m 'Add CopyFile MoveFile policies and Path API'
          git push origin HEAD:${{ github.head_ref }}

  platform-semantics:
    needs: prepare-copy-move-path
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Resolve current RID
        id: rid
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } elseif ($env:RUNNER_ARCH -eq 'X64') { 'x64' } else { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          $os = if ($env:RUNNER_OS -eq 'Windows') { 'win' } elseif ($env:RUNNER_OS -eq 'Linux') { 'linux' } elseif ($env:RUNNER_OS -eq 'macOS') { 'osx' } else { throw "Unsupported runner OS: $env:RUNNER_OS" }
          "rid=$os-$arch" >> $env:GITHUB_OUTPUT
      - name: Compile and verify filesystem semantics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = if ($env:RUNNER_OS -eq 'Windows') { './out/file-io-platform-semantics.exe' } else { './out/file-io-platform-semantics' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-io-platform-semantics.xps --runtime '${{ steps.rid.outputs.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'file-io-platform-semantics.xps compilation failed.' }
          $result = & $exe
          if ($LASTEXITCODE -ne 0) { throw "Platform semantics fixture failed.`n$result" }
          $result | ForEach-Object { Write-Host $_ }
          foreach ($required in @('FILE_IO_PLATFORM_SEMANTICS=OK','ISFILE_ISDIR=OK','DIR_MODE1=OK','DIR_MODE2=OK','DIR_MODE3=OK','DIR_MAXDEPTH=OK')) {
            if ($result -notcontains $required) { throw "Missing regression marker $required.`n$result" }
          }

          $convExe = if ($env:RUNNER_OS -eq 'Windows') { './out/file-convenience.exe' } else { './out/file-convenience' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-convenience.xps --runtime '${{ steps.rid.outputs.rid }}' -o $convExe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'file-convenience.xps compilation failed.' }
          $conv = & $convExe
          if ($LASTEXITCODE -ne 0) { throw "File convenience fixture failed.`n$conv" }
          $conv | ForEach-Object { Write-Host $_ }
          foreach ($required in @('FILE_CONVENIENCE=OK','COPY_MOVE_PATH=OK')) {
            if ($conv -notcontains $required) { throw "Missing file convenience marker $required.`n$conv" }
          }

          if ($env:RUNNER_OS -eq 'Windows') {
            if ($result -notcontains 'CHDRIVE_WINDOWS=SUPPORTED') { throw "Windows ChDrive was not verified.`n$result" }
            $hidden = $result | Where-Object { $_ -like 'WINDOWS_HIDDEN_ATTR=*' } | Select-Object -First 1
            if (-not $hidden) { throw "Windows hidden attribute was not observed.`n$result" }
            $value = [int]($hidden -replace '^WINDOWS_HIDDEN_ATTR=', '')
            if (($value -band 2) -eq 0) { throw "Windows hidden attribute bit was not set.`n$result" }
            if ($result -notcontains 'DIR_CASE_MATCH=TRUE') { throw "Windows filesystem should match case-insensitively on the hosted runner.`n$result" }
            if ($result -notcontains 'DELETE_OPEN_WINDOWS=BLOCKED') { throw "Windows delete-while-open contract was not verified.`n$result" }
          } else {
            if ($result -notcontains 'CHDRIVE_NONWINDOWS_ERR=5') { throw "Non-Windows ChDrive must raise XPScript error 5.`n$result" }
            if ($result -notcontains 'UNIX_SET_HIDDEN_ERR=5') { throw "Unix SetFileAttr Hidden must require an explicit dot-name rename.`n$result" }
            $dotHidden = $result | Where-Object { $_ -like 'DOT_HIDDEN_ATTR=*' } | Select-Object -First 1
            if (-not $dotHidden) { throw "Unix dot-hidden attributes were not reported.`n$result" }
            $value = [int]($dotHidden -replace '^DOT_HIDDEN_ATTR=', '')
            if (($value -band 2) -eq 0) { throw "Unix leading-dot file did not synthesize the Hidden bit.`n$result" }
            if ($result -notcontains 'DELETE_OPEN_UNIX=UNLINKED') { throw "Unix delete-while-open contract was not verified.`n$result" }
            if ($env:RUNNER_OS -eq 'Linux' -and $result -notcontains 'DIR_CASE_MATCH=FALSE') { throw "Linux hosted filesystem should preserve case-sensitive Dir matching.`n$result" }
          }
