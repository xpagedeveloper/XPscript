name: Notes API cleanup once

on:
  push:
    branches: [fix/notes-agent-native-properties-v3]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/notes-agent-native-properties-v3
          fetch-depth: 0
      - run: python3 scripts/notes_api_cleanup_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove unsupported Notes API members"
          git push origin HEAD:fix/notes-agent-native-properties-v3
