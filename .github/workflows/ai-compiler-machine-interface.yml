name: AI Compiler Machine Interface

on:
  push:
    branches:
      - ai-compiler-machine-interface
  workflow_dispatch:

jobs:
  machine-interface:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore XPScriptCompiler.slnx

      - name: Build
        run: dotnet build XPScriptCompiler.slnx -c Release --no-restore

      - name: Machine interface probe
        run: dotnet run --project tests/CompilerMachineInterfaceProbe/CompilerMachineInterfaceProbe.csproj -c Release -- .

      - name: Validate CLI JSON contract
        shell: pwsh
        run: |
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = 'dotnet'
          $psi.ArgumentList.Add('run')
          $psi.ArgumentList.Add('--project')
          $psi.ArgumentList.Add('src/XPScript.Compiler/XPScript.Compiler.csproj')
          $psi.ArgumentList.Add('-c')
          $psi.ArgumentList.Add('Release')
          $psi.ArgumentList.Add('--no-build')
          $psi.ArgumentList.Add('--')
          $psi.ArgumentList.Add('validate')
          $psi.ArgumentList.Add('samples/null-integer-assignment-error.xps')
          $psi.ArgumentList.Add('--result-format')
          $psi.ArgumentList.Add('json')
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $process = [System.Diagnostics.Process]::Start($psi)
          $output = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          if ($process.ExitCode -ne 2) { throw "Expected validation exit code 2, got $($process.ExitCode). stderr: $stderr" }
          $json = $output | ConvertFrom-Json
          $output | Set-Content -NoNewline compiler-result.actual.json
          if ($json.schema -ne 'xpscript.compiler-result') { throw "Unexpected schema" }
          if ($json.schemaVersion -ne 1) { throw "Unexpected schemaVersion" }
          if ($json.operation -ne 'validate') { throw "Unexpected operation" }
          if ($json.result -ne 'error') { throw "Expected error result" }
          if (-not $json.compilerVersion) { throw "Missing compilerVersion" }
          if (-not ($json.errors | Where-Object { $_.diagnosticCode -eq 'XPS2001' })) { throw "Missing XPS2001 diagnostic" }

      - name: Validate JSON Schema
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python -m jsonschema -i compiler-result.actual.json schemas/compiler-result.schema.json
