name: AI Compiler Machine Interface

on:
  push:
    branches:
      - ai-compiler-machine-interface
  workflow_dispatch:

jobs:
  machine-interface:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore XPScriptCompiler.slnx

      - name: Build
        run: dotnet build XPScriptCompiler.slnx -c Release --no-restore

      - name: Machine interface probe
        run: dotnet run --project tests/CompilerMachineInterfaceProbe/CompilerMachineInterfaceProbe.csproj -c Release -- .

      - name: Validate CLI JSON contract
        shell: pwsh
        run: |
          $output = dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- validate samples/null-integer-assignment-error.xps --result-format json
          if ($LASTEXITCODE -ne 2) { throw "Expected validation exit code 2, got $LASTEXITCODE" }
          $json = $output | ConvertFrom-Json
          if ($json.schema -ne 'xpscript.compiler-result') { throw "Unexpected schema" }
          if ($json.schemaVersion -ne 1) { throw "Unexpected schemaVersion" }
          if ($json.operation -ne 'validate') { throw "Unexpected operation" }
          if ($json.result -ne 'error') { throw "Expected error result" }
          if (-not $json.compilerVersion) { throw "Missing compilerVersion" }
          if (-not ($json.errors | Where-Object { $_.diagnosticCode -eq 'XPS2001' })) { throw "Missing XPS2001 diagnostic" }
