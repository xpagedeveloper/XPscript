name: Increment Compound Operators

on:
  push:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/IncrementCompoundAssignmentPreprocessor.cs'
      - 'src/XPScript.Compiler/IncrementRuntimeSource.cs'
      - 'src/XPScript.Compiler/IncrementOperatorSyntaxValidator.cs'
      - 'src/XPScript.Compiler/SourceTypeValidator.cs'
      - 'src/XPScript.Compiler/TypeCoercionPreprocessor.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'samples/increment-compound-operators.xps'
      - 'samples/increment-invalid-*.xps'
      - 'samples/compound-invalid-string-numeric.xps'
      - 'todo/increment-decrement-operators-todo.md'
      - 'todo/done/increment-decrement-operators-todo.md'
      - '.github/workflows/increment-compound-operators.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/IncrementCompoundAssignmentPreprocessor.cs'
      - 'src/XPScript.Compiler/IncrementRuntimeSource.cs'
      - 'src/XPScript.Compiler/IncrementOperatorSyntaxValidator.cs'
      - 'src/XPScript.Compiler/SourceTypeValidator.cs'
      - 'src/XPScript.Compiler/TypeCoercionPreprocessor.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'samples/increment-compound-operators.xps'
      - 'samples/increment-invalid-*.xps'
      - 'samples/compound-invalid-string-numeric.xps'
      - 'todo/increment-decrement-operators-todo.md'
      - 'todo/done/increment-decrement-operators-todo.md'
      - '.github/workflows/increment-compound-operators.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  increment-compound-operators:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }

      - name: Compile operator regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/operators | Out-Null
          $exe = if ($IsWindows) { './out/operators/increment-compound-operators.exe' } else { './out/operators/increment-compound-operators' }
          $compile = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/increment-compound-operators.xps -o $exe --framework-dependent --result-format json
          $exit = $LASTEXITCODE
          $compile | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw 'Operator regression compilation failed.' }

      - name: Run operator regression
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { './out/operators/increment-compound-operators.exe' } else { './out/operators/increment-compound-operators' }
          if (-not $IsWindows) { chmod +x $exe }
          $result = & $exe 2>&1
          $exit = $LASTEXITCODE
          $result | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Operator regression failed with exit code $exit." }
          if ($result -notcontains 'INCREMENT-COMPOUND-OPERATORS=OK') { throw 'Operator regression did not report success.' }

      - name: Verify invalid operator syntax fails closed with source mapping
        shell: pwsh
        run: |
          $cases = @(
            @{ Name = 'increment-invalid-literal'; Line = 2 },
            @{ Name = 'increment-invalid-expression'; Line = 4 },
            @{ Name = 'increment-invalid-prefix'; Line = 3 },
            @{ Name = 'increment-invalid-value-expression'; Line = 5 },
            @{ Name = 'compound-invalid-string-numeric'; Line = 4 }
          )

          foreach ($case in $cases) {
            $name = $case.Name
            $source = "./samples/$name.xps"
            $output = if ($IsWindows) { "./out/operators/$name.exe" } else { "./out/operators/$name" }
            $resultText = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- $source -o $output --framework-dependent --result-format json
            $compilerExitCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            $resultText | ForEach-Object { Write-Host $_ }
            if ($compilerExitCode -eq 0) { throw "$name unexpectedly compiled successfully." }

            $jsonText = $resultText -join "`n"
            try {
              $result = $jsonText | ConvertFrom-Json
            }
            catch {
              throw "$name did not return valid JSON compiler diagnostics."
            }

            if ($result.result -ne 'error' -or $null -eq $result.errors -or $result.errors.Count -lt 1) {
              throw "$name did not return a structured compiler error."
            }

            $diagnostic = $result.errors[0]
            if ($diagnostic.line -ne $case.Line) {
              throw "$name mapped to line $($diagnostic.line), expected line $($case.Line)."
            }
            if ($diagnostic.position -lt 1) {
              throw "$name did not return a valid source position."
            }

            $sourceLines = Get-Content -LiteralPath $source
            $expectedCode = $sourceLines[$case.Line - 1].Trim()
            if ([string]::IsNullOrWhiteSpace($diagnostic.code) -or $diagnostic.code.Trim() -ne $expectedCode) {
              throw "$name mapped code '$($diagnostic.code)' but expected '$expectedCode'."
            }
          }
