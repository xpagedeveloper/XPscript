name: Web FastCGI

on:
  push:
    paths:
      - '.github/workflows/web-fastcgi.yml'
      - 'src/XPScript.Web.FastCgi/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Compiler/UIExtensionPreprocessor.cs'
      - 'src/XPScript.Compiler/UIExtensionRuntimeSource.cs'
      - 'tests/WebFastCgiSmoke/**'
      - 'tests/WebFastCgiBoundarySmoke/**'
      - 'tests/WebFastCgiUnixSmoke/**'
      - 'tests/WebFastCgiAdversarialSmoke/**'
      - 'tests/WebUIFormFastCgiSmoke/**'
      - 'docs/web-fastcgi-nginx.md'
      - 'XPScriptCompiler.slnx'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/web-fastcgi.yml'
      - 'src/XPScript.Web.FastCgi/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Compiler/UIExtensionPreprocessor.cs'
      - 'src/XPScript.Compiler/UIExtensionRuntimeSource.cs'
      - 'tests/WebFastCgiSmoke/**'
      - 'tests/WebFastCgiBoundarySmoke/**'
      - 'tests/WebFastCgiUnixSmoke/**'
      - 'tests/WebFastCgiAdversarialSmoke/**'
      - 'tests/WebUIFormFastCgiSmoke/**'
      - 'docs/web-fastcgi-nginx.md'
      - 'XPScriptCompiler.slnx'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx
      - name: Build solution
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore
      - name: Run raw FastCGI regression
        run: dotnet run --project ./tests/WebFastCgiSmoke/WebFastCgiSmoke.csproj -c Release
      - name: Run FastCGI boundary and TCP regression
        run: dotnet run --project ./tests/WebFastCgiBoundarySmoke/WebFastCgiBoundarySmoke.csproj -c Release
      - name: Run FastCGI Unix socket regression
        if: runner.os != 'Windows'
        run: dotnet run --project ./tests/WebFastCgiUnixSmoke/WebFastCgiUnixSmoke.csproj -c Release
      - name: Run FastCGI adversarial corpus
        run: dotnet run --project ./tests/WebFastCgiAdversarialSmoke/WebFastCgiAdversarialSmoke.csproj -c Release
      - name: Run UIForm FastCGI GET/POST JSON binding regression
        run: dotnet run --project ./tests/WebUIFormFastCgiSmoke/WebUIFormFastCgiSmoke.csproj -c Release
