name: Compiler Permission Symlink

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/XPScript.Compiler/CompilerPathSecurity.cs'
      - 'tests/CompilerPermissionSymlinkProbe/**'
      - '.github/workflows/compiler-permission-symlink.yml'

permissions:
  contents: read

jobs:
  permission-symlink:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify permissions and symlink safety
        run: dotnet run --project ./tests/CompilerPermissionSymlinkProbe/CompilerPermissionSymlinkProbe.csproj -c Release
