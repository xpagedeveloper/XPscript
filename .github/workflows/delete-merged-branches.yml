name: Delete Merged Branches

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch all remote branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Delete merged and superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/${REPOSITORY}" --jq '.default_branch')"
          if [[ "$default_branch" != "main" ]]; then
            echo "Refusing cleanup because default branch is '$default_branch', expected 'main'."
            exit 1
          fi

          owner="${REPOSITORY%%/*}"

          # One-time allow-list for branches whose functionality was merged through
          # replacement/consolidation work. Their original tips are not necessarily
          # ancestors of main, so normal merge ancestry cannot prove them merged.
          superseded_branches=(
            session-defaults-role-restoration
            web-session-roles-status
            todo-ui-form-color-month-v1
            todo-ui-form-color-month-v2
            todo-ui-form-datetime-range-v1
            todo-ui-form-datetime-range-v2
            todo-ui-form-desktop-avalonia-v1
            todo-ui-form-desktop-avalonia-v2
            todo-ui-form-desktop-avalonia-v3
            todo-ui-form-email-url-time-v1
            todo-ui-form-email-url-time-v2
            todo-ui-form-layout-actions-reactive-v2
            todo-ui-form-layout-reactive-v1
            todo-ui-form-password-select-v2
            todo-ui-form-radio-hidden-v1
            todo-ui-form-radio-hidden-v2
            todo-ui-form-select-password-v1
            todo-ui-form-select-password-v2
            todo-ui-form-validation-v1
            todo-ui-list-view-v1
            feature/notes-note-collection
            feature/notes-richtext-objects
          )

          is_explicitly_superseded_branch() {
            local branch="$1"
            local candidate
            for candidate in "${superseded_branches[@]}"; do
              if [[ "$branch" == "$candidate" ]]; then
                return 0
              fi
            done
            return 1
          }

          has_open_pr() {
            local branch="$1"
            local count
            count="$(gh api "repos/${REPOSITORY}/pulls?state=open&base=main&head=${owner}:${branch}&per_page=1" --jq 'length')"
            [[ "$count" != "0" ]]
          }

          has_merged_pr_for_current_tip() {
            local branch="$1"
            local current_sha="$2"
            local count

            count="$(
              gh api "repos/${REPOSITORY}/pulls?state=closed&base=main&head=${owner}:${branch}&per_page=100" |
                jq --arg sha "$current_sha" '[.[] | select(.merged_at != null and .head.sha == $sha)] | length'
            )"
            [[ "$count" != "0" ]]
          }

          try_delete_branch() {
            local branch="$1"
            echo "Delete merged/superseded branch: $branch"
            if gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"; then
              return 0
            fi

            if ! gh api "repos/${REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Branch already deleted by another cleanup run: $branch"
              return 0
            fi

            echo "Keep branch because GitHub blocked deletion (branch protection/ruleset or permissions): $branch"
            return 1
          }

          deleted=0
          skipped=0
          blocked=0
          kept=0

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"

            if [[ -z "$branch" || "$branch" == "main" || "$branch" == "HEAD" ]]; then
              continue
            fi

            if has_open_pr "$branch"; then
              echo "Skip branch with open PR: $branch"
              ((skipped+=1))
              continue
            fi

            current_sha="$(git rev-parse "refs/remotes/origin/${branch}")"
            merged_by_history=false
            merged_by_pr=false
            explicitly_superseded=false

            if git merge-base --is-ancestor "refs/remotes/origin/${branch}" refs/remotes/origin/main; then
              merged_by_history=true
            fi

            if has_merged_pr_for_current_tip "$branch" "$current_sha"; then
              merged_by_pr=true
            fi

            if is_explicitly_superseded_branch "$branch"; then
              explicitly_superseded=true
            fi

            if [[ "$merged_by_history" == "true" || "$merged_by_pr" == "true" || "$explicitly_superseded" == "true" ]]; then
              if try_delete_branch "$branch"; then
                ((deleted+=1))
              else
                ((blocked+=1))
              fi
            else
              echo "Keep branch with commits not proven merged or superseded: $branch"
              ((kept+=1))
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort)

          echo "Deleted merged/superseded branches: $deleted"
          echo "Skipped open-PR branches: $skipped"
          echo "Kept branches not proven merged/superseded: $kept"
          echo "Branches blocked from deletion: $blocked"

          if (( blocked > 0 )); then
            echo "::error::GitHub repository rules blocked deletion of $blocked branch(es). Check branch protection/rulesets and rerun this workflow."
            exit 1
          fi
