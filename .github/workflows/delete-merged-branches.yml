name: Delete Merged Branches

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch all remote branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Delete branches merged into main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/${REPOSITORY}" --jq '.default_branch')"
          if [[ "$default_branch" != "main" ]]; then
            echo "Refusing cleanup because default branch is '$default_branch', expected 'main'."
            exit 1
          fi

          owner="${REPOSITORY%%/*}"

          has_open_pr() {
            local branch="$1"
            local count
            count="$(gh api "repos/${REPOSITORY}/pulls?state=open&base=main&head=${owner}:${branch}&per_page=1" --jq 'length')"
            [[ "$count" != "0" ]]
          }

          has_merged_pr_for_current_tip() {
            local branch="$1"
            local current_sha="$2"
            local count

            count="$(
              gh api "repos/${REPOSITORY}/pulls?state=closed&base=main&head=${owner}:${branch}&per_page=100" |
                jq --arg sha "$current_sha" '[.[] | select(.merged_at != null and .head.sha == $sha)] | length'
            )"
            [[ "$count" != "0" ]]
          }

          try_delete_branch() {
            local branch="$1"
            echo "Delete merged branch: $branch"
            if gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"; then
              return 0
            fi

            if ! gh api "repos/${REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Branch already deleted by another cleanup run: $branch"
              return 0
            fi

            echo "Keep merged branch because GitHub blocked deletion (branch protection/ruleset or permissions): $branch"
            return 1
          }

          deleted=0
          skipped=0
          blocked=0
          kept=0

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"

            if [[ -z "$branch" || "$branch" == "main" || "$branch" == "HEAD" ]]; then
              continue
            fi

            if has_open_pr "$branch"; then
              echo "Skip branch with open PR: $branch"
              ((skipped+=1))
              continue
            fi

            current_sha="$(git rev-parse "refs/remotes/origin/${branch}")"
            merged_by_history=false
            merged_by_pr=false

            if git merge-base --is-ancestor "refs/remotes/origin/${branch}" refs/remotes/origin/main; then
              merged_by_history=true
            fi

            if has_merged_pr_for_current_tip "$branch" "$current_sha"; then
              merged_by_pr=true
            fi

            if [[ "$merged_by_history" == "true" || "$merged_by_pr" == "true" ]]; then
              if try_delete_branch "$branch"; then
                ((deleted+=1))
              else
                ((blocked+=1))
              fi
            else
              echo "Keep branch with commits not proven merged into main: $branch"
              ((kept+=1))
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort)

          echo "Deleted merged branches: $deleted"
          echo "Skipped open-PR branches: $skipped"
          echo "Kept branches not proven fully merged: $kept"
          echo "Merged branches blocked from deletion: $blocked"

          if (( blocked > 0 )); then
            echo "::error::GitHub repository rules blocked deletion of $blocked merged branch(es). Check branch protection/rulesets and rerun this workflow."
            exit 1
          fi
