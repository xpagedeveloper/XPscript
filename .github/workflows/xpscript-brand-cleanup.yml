name: XPScript Internal Branding Cleanup

on:
  push:
    paths:
      - '.github/workflows/xpscript-brand-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Normalize internal branding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          $pairs = @(
            @('LotusScript','XPScript'),
            @('Lotus','XPScript'),
            @('lotus','xpscript'),
            @('LS Lite','XPScript'),
            @('LSLite','XPScript'),
            @('lslite','xpscript'),
            @('LS Light','XPScript'),
            @('ls light','xpscript'),
            @('HCL','XPScript'),
            @('Domino','XPScript')
          )

          Get-ChildItem -Recurse -File | Where-Object {
            $_.FullName -notmatch '\\.git\\' -and $_.FullName -notmatch '\\.github\\'
          } | ForEach-Object {
            try {
              $text = Get-Content -LiteralPath $_.FullName -Raw
              $before = $text
              foreach ($pair in $pairs) { $text = $text.Replace($pair[0], $pair[1]) }
              if ($text -ne $before) { [IO.File]::WriteAllText($_.FullName, $text, [Text.UTF8Encoding]::new($false)) }
            } catch { }
          }

          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Normalize all internal branding to XPScript'
            git push origin HEAD:main
          }
