name: Null Text Boundaries

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'src/XPScript.Compiler/XPScriptRuntimeSource.cs'
      - 'samples/null-empty-inspection-helpers.xps'
      - '.github/workflows/null-text-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify Empty and Null text boundaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/null-empty-inspection-helpers$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/null-empty-inspection-helpers.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Null/Empty text-boundary regression compilation failed.' }
          if (-not $IsWindows) { chmod +x $program }
          $output = @(& $program 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Null/Empty text-boundary regression failed.`n$output" }
          foreach ($value in @('EMPTY_CSTR_LEN=0', 'NULL_CSTR_LEN=0')) {
            if ($output -notcontains $value) { throw "Text-boundary output missing: $value`n$output" }
          }
          $joined = $output -join "`n"
          if ($joined -match 'NullSentinel') {
            throw "Private NULL sentinel leaked through text conversion.`n$output"
          }
