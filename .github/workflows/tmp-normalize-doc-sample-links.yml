name: Normalize Documentation Sample Links

on:
  push:
    branches:
      - docs-command-reference-standard
    paths:
      - '.github/workflows/tmp-normalize-doc-sample-links.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs-command-reference-standard
      - name: Normalize sample and docs links
        shell: python
        run: |
          from pathlib import Path
          import re

          for path in sorted(Path('docs').glob('*.md')):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()

              # Remove an opening sample-only/source-fixture paragraph. Detailed sample lists at
              # the end of a document remain and are converted to clickable links below.
              if lines and lines[0].startswith('# '):
                  i = 1
                  while i < len(lines) and not lines[i].strip():
                      i += 1
                  if i < len(lines):
                      start = i
                      while i < len(lines) and lines[i].strip() and not lines[i].startswith('#'):
                          i += 1
                      paragraph = '\n'.join(lines[start:i])
                      lowered = paragraph.lower()
                      if 'samples/' in paragraph and any(p in lowered for p in ('documents', 'demonstrated by', 'represented by', 'source examples', 'samples used')):
                          del lines[start:i]
                          while start < len(lines) and not lines[start].strip():
                              del lines[start]
                          lines.insert(start, '')

              text = '\n'.join(lines).rstrip() + '\n'

              # Convert bare code-form repository sample references to clickable relative links.
              def sample_link(match):
                  target = match.group(1)
                  return f'[{target}](../{target})'
              text = re.sub(r'`(samples/[A-Za-z0-9_./+ -]+\.(?:xps|cmd|ps1|sh|json|txt))`', sample_link, text)

              # Convert bare docs references to local clickable links.
              def docs_link(match):
                  target = match.group(1)
                  return f'[{target}]({Path(target).name})'
              text = re.sub(r'`(docs/[A-Za-z0-9_.-]+\.md)`', docs_link, text)

              path.write_text(text, encoding='utf-8')
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-normalize-doc-sample-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/tmp-normalize-doc-sample-links.yml
          git commit -m "Normalize documentation sample links"
          git push origin HEAD:docs-command-reference-standard
