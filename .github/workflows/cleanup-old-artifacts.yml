name: Cleanup old GitHub Actions artifacts

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff="$(date -u -d '3 days ago' +%s)"

          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GH_REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .created_at] | @tsv' |
          while IFS=$'\t' read -r id name created_at; do
            created_epoch="$(date -u -d "$created_at" +%s)"
            if [ "$created_epoch" -lt "$cutoff" ]; then
              echo "Deleting artifact: $name ($id), created $created_at"
              gh api \
                --method DELETE \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "/repos/${GH_REPO}/actions/artifacts/${id}"
            fi
          done
