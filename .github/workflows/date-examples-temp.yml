name: Date Examples Regression Temp

on:
  push:
    branches: [todo-date-examples]
    paths:
      - '.github/workflows/date-examples-temp.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify Date Adjust example
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./examples/date-adjust.xps -o ./out/date-adjust.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Date Adjust example compilation failed.' }
          $output = & ./out/date-adjust.exe
          foreach ($value in @('ORIGINAL=2024-02-29 00:00:00','ADJUSTED=2025-03-30 03:04:05')) {
            if ($output -notcontains $value) { throw "Date Adjust output missing: $value`n$output" }
          }
      - name: Verify Date Difference example
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./examples/date-difference.xps -o ./out/date-difference.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Date Difference example compilation failed.' }
          $output = & ./out/date-difference.exe
          foreach ($value in @('SECONDS=90061','REVERSE=-90061')) {
            if ($output -notcontains $value) { throw "Date Difference output missing: $value`n$output" }
          }
      - name: Verify Date comparison example
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./examples/date-comparisons.xps -o ./out/date-comparisons.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Date comparison example compilation failed.' }
          $output = & ./out/date-comparisons.exe
          foreach ($value in @('LT=TRUE','LTE=TRUE','GT=TRUE','GTE=TRUE','NE=TRUE','EQ=TRUE')) {
            if ($output -notcontains $value) { throw "Date comparison output missing: $value`n$output" }
          }
      - name: Verify OS Date formatting example
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./examples/date-os-formatting.xps -o ./out/date-os-formatting.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'OS Date formatting example compilation failed.' }
          $output = & ./out/date-os-formatting.exe
          foreach ($prefix in @('DATE-MASK=','TIME-MASK=','DATE=','TIME=')) {
            $line = $output | Where-Object { $_.StartsWith($prefix) } | Select-Object -First 1
            if (-not $line -or $line.Length -le $prefix.Length) { throw "OS Date formatting output missing/non-empty prefix: $prefix`n$output" }
          }
