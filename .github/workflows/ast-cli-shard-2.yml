name: AST CLI Shard 2 (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-shard-2:
    name: Core operators and arrays
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run CLI shard 2
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/ast-compile-probe/run-ast-cli-shard-2.ps1
