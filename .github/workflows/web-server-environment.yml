name: Web Server Environment

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Web.Runtime/XpsWebContext.cs'
      - 'src/XPScript.Web.Runtime/XpsWebServer.cs'
      - 'tests/WebServerEnvironmentSmoke/**'
      - '.github/workflows/web-server-environment.yml'
  push:
    branches:
      - 'todo-web-environment-*'
    paths:
      - 'src/XPScript.Web.Runtime/XpsWebContext.cs'
      - 'src/XPScript.Web.Runtime/XpsWebServer.cs'
      - 'tests/WebServerEnvironmentSmoke/**'
      - '.github/workflows/web-server-environment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run web environment regression
        shell: pwsh
        run: |
          dotnet run --project ./tests/WebServerEnvironmentSmoke/WebServerEnvironmentSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Web environment regression failed.' }
