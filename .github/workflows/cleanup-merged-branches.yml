name: Cleanup merged branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete branches already contained in default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          default_branch="${{ github.event.repository.default_branch }}"
          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"

          # A squash-merged PR does not make its original head commit an ancestor of
          # main, while old implementation branches often do not have a surviving PR.
          # Collect both sources, but only delete a branch when either Git proves that
          # its tip is already contained in the default branch or GitHub records a
          # merged same-repository PR for that exact branch.
          merged_pr_branches="$(mktemp)"
          page=1
          while true; do
            response="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=${default_branch}&per_page=100&page=${page}")"
            count="$(jq 'length' <<<"$response")"
            [ "$count" -eq 0 ] && break

            jq -r --arg default_branch "$default_branch" '
              .[]
              | select(.merged_at != null)
              | select(.head.repo.full_name == .base.repo.full_name)
              | .head.ref
              | select(. != $default_branch)
            ' <<<"$response" >> "$merged_pr_branches"

            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done
          sort -u -o "$merged_pr_branches" "$merged_pr_branches"

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"
            [ "$branch" = "$default_branch" ] && continue
            [ "$branch" = "HEAD" ] && continue

            contained=false
            merged_pr=false
            if git merge-base --is-ancestor "$remote_ref" "origin/${default_branch}"; then
              contained=true
            fi
            if grep -Fxq "$branch" "$merged_pr_branches"; then
              merged_pr=true
            fi

            if [ "$contained" = true ] || [ "$merged_pr" = true ]; then
              echo "Deleting merged branch: ${branch} (contained=${contained}, merged_pr=${merged_pr})"
              git push origin --delete "$branch"
            else
              echo "Keeping unmerged branch: ${branch}"
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | sort)
