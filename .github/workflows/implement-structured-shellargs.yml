name: Implement Structured ShellArgs

on:
  push:
    branches:
      - todo-security-structured-shellargs

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-security-structured-shellargs
          fetch-depth: 0
      - name: Apply implementation patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          exec(base64.b64decode(''))
          PY
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add structured ShellArgs process API'
          git push origin HEAD:todo-security-structured-shellargs
