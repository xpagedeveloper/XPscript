    Print "SHELLARGS=STARTED"
End Sub
'@ | Set-Content 'samples/shell-structured-arguments.xps' -Encoding utf8NoBOM

          $workflowPath = '.github/workflows/cross-platform-compiler-shell.yml'
          $workflow = Get-Content $workflowPath -Raw
          $workflow = $workflow.Replace("      - 'src/XPScript.Compiler/CrossPlatformRuntimeSource.cs'", "      - 'src/XPScript.Compiler/CrossPlatformRuntimeSource.cs'`n      - 'src/XPScript.Compiler/CrossPlatformPreprocessor.cs'")
          $workflow = $workflow.Replace("      - 'samples/platform-shell-arguments.xps'", "      - 'samples/platform-shell-arguments.xps'`n      - 'samples/shell-structured-arguments.xps'")
          $stepAnchor = @'
      - name: Verify self-contained single-file output
'@
          $structuredStep = @'
      - name: Verify structured ShellArgs preserves argument boundaries
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue ./shell-args-output.txt
          $exe = "./out/shellargs${{ steps.target.outputs.ext }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/shell-structured-arguments.xps --runtime '${{ steps.target.outputs.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'shell-structured-arguments.xps compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $result = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Structured ShellArgs fixture failed.`n$result" }
          if ($result -notcontains 'SHELLARGS=STARTED') { throw "Structured ShellArgs fixture did not start.`n$result" }
          for ($i = 0; $i -lt 100 -and -not (Test-Path ./shell-args-output.txt); $i++) { Start-Sleep -Milliseconds 100 }
          if (-not (Test-Path ./shell-args-output.txt)) { throw 'Structured ShellArgs helper did not produce output.' }
          $argsOut = Get-Content ./shell-args-output.txt
          if ($argsOut -notcontains 'A0=space value') { throw "ShellArgs space argument was corrupted.`n$argsOut" }
          if ($argsOut -notcontains 'A1=åäö 漢字') { throw "ShellArgs Unicode argument was corrupted.`n$argsOut" }
          if ($argsOut -notcontains 'A2LEN=0') { throw "ShellArgs empty argument was not preserved.`n$argsOut" }
          if ($argsOut -notcontains 'A3=meta & | < > ^ % !') { throw "ShellArgs metacharacter argument was corrupted or shell-parsed.`n$argsOut" }

      - name: Verify self-contained single-file output
