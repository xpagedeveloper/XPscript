          $docsAnchor = '## Declare Function / Declare Sub'
          $docsSection = @'
## ShellArgs

`ShellArgs(program, arguments [, windowStyle])` is the structured process API. `arguments` must be an array or list. Each element is passed directly through `ProcessStartInfo.ArgumentList`, so XPScript does not join the values into a command string or re-parse them.

```xpscript
Dim args(2) As String
args(0) = "--name"
args(1) = "value with spaces"
args(2) = "literal & | characters"
Call ShellArgs("myprogram", args)
```

Use an interpreter explicitly when running a script, for example `ShellArgs("pwsh", args)` with `-File` as one of the argument elements. This keeps the interpreter boundary explicit. Bare executable resolution uses absolute PATH entries only, matching the hardened `Shell()` resolution policy.

## Declare Function / Declare Sub
'@
          if (-not $docs.Contains($docsAnchor)) { throw 'Platform docs anchor not found.' }
          $docs = $docs.Replace($docsAnchor, $docsSection)
          Set-Content $docsPath $docs -Encoding utf8NoBOM

          $todoPath = 'todo/security-review-todo.md'
