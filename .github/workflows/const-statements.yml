name: Const Statements

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/AdvancedXPScriptTranspiler.cs'
      - 'samples/const-statements.xps'
      - '.github/workflows/const-statements.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  const-statements:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }

      - name: Verify local Const statements
        shell: pwsh
        run: |
          $output = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- run ./samples/const-statements.xps
          if ($LASTEXITCODE -ne 0) { throw "Const sample failed.`n$($output -join [Environment]::NewLine)" }
          $required = @(
            'NOTES_RUNTIME=C:\Program Files\HCL\Notes',
            'TEXT_VALUE=hello',
            'INTEGER_VALUE=42',
            'LONG_VALUE=2147483648',
            'DOUBLE_VALUE=12.5',
            'BOOLEAN_VALUE=True',
            'INFERRED_INTEGER=7',
            'INFERRED_LONG=2147483648',
            'INFERRED_DOUBLE=3.25',
            'INFERRED_BOOLEAN=False',
            'CONST_STATEMENTS=OK'
          )
          foreach ($line in $required) {
            if ($output -notcontains $line) { throw "Missing expected Const output '$line'.`n$($output -join [Environment]::NewLine)" }
          }
