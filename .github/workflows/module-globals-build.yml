name: Module Globals Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Verify module scalar state
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/module-scalars.xps -o ./out/module-scalars.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Module scalar compilation failed.' }
          $output = & ./out/module-scalars.exe
          foreach ($value in @('MODULEDEFAULT=0:','MODULEPUBLIC=15','MODULEPRIVATE=module-private')) {
            if ($output -notcontains $value) { throw "Module scalar output missing: $value" }
          }

      - name: Verify module arrays
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/module-arrays.xps -o ./out/module-arrays.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Module array compilation failed.' }
          $output = & ./out/module-arrays.exe
          foreach ($value in @('MODULEARRAY=50','MODULEBOUNDS=1:4','MODULEFIXED=two')) {
            if ($output -notcontains $value) { throw "Module array output missing: $value" }
          }

      - name: Verify module Type values
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/module-type-values.xps -o ./out/module-type-values.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Module Type value compilation failed.' }
          $output = & ./out/module-type-values.exe
          if ($output -notcontains 'BUILD=XPScript:42') { throw 'Module Type value runtime behavior failed.' }

      - name: Verify module object references
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/module-object-references.xps -o ./out/module-object-references.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Module object reference compilation failed.' }
          $output = & ./out/module-object-references.exe
          foreach ($value in @(
            'NAME=Fredrik',
            'NOTHING1=False',
            'SAME=True',
            'ALIAS=Fredrik',
            'NOTHING2=True',
            'ALIASSTILL=Fredrik',
            'DELETEDPRIMARY=True',
            'DELETEDALIAS=True'
          )) {
            if ($output -notcontains $value) { throw "Module object reference output missing: $value" }
          }
