name: Compiler Diagnostics Debug

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/CompileResult.cs'
      - 'src/XPScript.Compiler/CompilerDiagnosticMode.cs'
      - 'src/XPScript.Compiler/CompilerDiagnosticParser.cs'
      - 'src/XPScript.Compiler/ExpandedSourceContext.cs'
      - 'src/XPScript.Compiler/RunCompiler.cs'
      - 'src/XPScript.Compiler/RunRoslynCompiler.cs'
      - 'src/XPScript.Compiler/XPScriptCompilerCommandLine.cs'
      - 'src/XPScript.Compiler/CompilerSourceLineDirectivePostProcessor.cs'
      - 'src/XPScript.Compiler/RuntimeDebugTraceSource.cs'
      - 'src/XPScript.Compiler/HclIsDefinedRuntimeSource.cs'
      - 'samples/debug-on-error-runtime.xps'
      - 'samples/include-source-map/**'
      - 'docs/compiler-diagnostics.md'
      - '.github/workflows/compiler-diagnostics-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }

      - name: Verify normal diagnostics hide generated C sharp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $stdoutPath = [System.IO.Path]::GetTempFileName()
          $stderrPath = [System.IO.Path]::GetTempFileName()
          try {
            & dotnet run --no-build --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- run ./samples/include-source-map/root.xps --info --result-format text 1> $stdoutPath 2> $stderrPath
            $exitCode = $LASTEXITCODE
            $stdout = Get-Content -Raw $stdoutPath
            $stderr = Get-Content -Raw $stderrPath

            if ($exitCode -ne 2) { throw "Expected exit code 2, got $exitCode.`nstdout:`n$stdout`nstderr:`n$stderr" }
            if ($stdout -notmatch '(?m)^\s*file:\s*compile-error\.xps\s*$') { throw "Original XPScript file was not reported.`n$stdout" }
            if ($stdout -notmatch '(?m)^\s*line:\s*5\s*$') { throw "Original XPScript line 5 was not reported.`n$stdout" }
            if ($stdout -match 'Program\.cs') { throw "Normal diagnostic leaked Program.cs.`n$stdout" }
            if ($stderr -match 'Program\.cs') { throw "Normal --info output leaked Program.cs.`n$stderr" }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $stdoutPath, $stderrPath
          }
          exit 0

      - name: Verify debug diagnostics show generated C sharp
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $stdoutPath = [System.IO.Path]::GetTempFileName()
          $stderrPath = [System.IO.Path]::GetTempFileName()
          try {
            & dotnet run --no-build --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- run ./samples/include-source-map/generated-csharp-error.xps --debug --result-format text 1> $stdoutPath 2> $stderrPath
            $exitCode = $LASTEXITCODE
            $stdout = Get-Content -Raw $stdoutPath
            $stderr = Get-Content -Raw $stderrPath

            if ($exitCode -ne 2) { throw "Expected exit code 2, got $exitCode.`n$stdout" }
            if ($stdout -notmatch '(?m)^\s*file:\s*generated-csharp-error\.xps\s*$') { throw "Debug output lost the source-mapped XPScript diagnostic.`n$stdout" }
            if ($stdout -notmatch '(?m)^\s*file:\s*Program\.cs\s*$') { throw "Debug output did not include generated Program.cs.`n$stdout" }
            if ($stdout -notmatch 'CS\d{4}') { throw "Debug output did not include a C# diagnostic identifier.`n$stdout" }
            if ($stderr -notmatch 'Started to compile') { throw "--debug did not include --info compile start.`n$stderr" }
            if ($stderr -notmatch 'Compiling .* run.*\d+s') { throw "--debug did not include the live compile timer.`n$stderr" }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $stdoutPath, $stderrPath
          }
          exit 0

      - name: Verify debug bypasses cache and traces handled runtime errors
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $project = './src/XPScript.Compiler/XPScript.Compiler.csproj'
          $sample = './samples/debug-on-error-runtime.xps'

          $warm = @(& dotnet run --no-build --project $project -c Release -- run $sample --info 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Warm run failed.`n$warm" }

          $debug = @(& dotnet run --no-build --project $project -c Release -- run $sample --debug 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Debug handled-error run failed.`n$debug" }
          $text = $debug -join "`n"

          if ($text -notmatch 'Started to compile debug-on-error-runtime\.xps') { throw "Debug reused cache instead of compiling.`n$text" }
          if ($text -match 'Run cache hit for debug-on-error-runtime\.xps') { throw "Debug unexpectedly reported a cache hit.`n$text" }
          if ($text -notmatch 'Compiling debug-on-error-runtime\.xps .*\d+s') { throw "Debug compile timer missing.`n$text" }
          if ($text -notmatch 'Compiled debug-on-error-runtime\.xps in \d+\.\d+s') { throw "Debug compile completion time missing.`n$text" }
          if ($text -notmatch 'DEBUG runtime exception trapped') { throw "Handled runtime exception detail missing in debug mode.`n$text" }
          if ($text -notmatch 'DEBUG-ON-ERROR=CONTINUED') { throw "On Error Resume Next did not continue after the trapped exception.`n$text" }
