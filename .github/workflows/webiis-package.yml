name: WebIIS Package

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run WebIIS package probe
        run: dotnet run --project ./tests/WebIisPackageProbe/WebIisPackageProbe.csproj -c Release
