name: WebIIS IIS E2E

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  iis-e2e:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install browser WebAssembly build tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet workload install wasm-tools
          if ($LASTEXITCODE -ne 0) { throw "wasm-tools installation failed with exit code $LASTEXITCODE." }

      - name: Install Chromium test runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $playwright = Join-Path $env:RUNNER_TEMP 'xps-playwright'
          New-Item -ItemType Directory -Path $playwright -Force | Out-Null
          Push-Location $playwright
          npm init -y | Out-Null
          npm install --no-save playwright
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Playwright.' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Playwright Chromium.' }
          Pop-Location
          "XPS_PLAYWRIGHT=$playwright" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Enable-WindowsOptionalFeature -Online -NoRestart -All -FeatureName `
            IIS-WebServerRole, `
            IIS-WebServer, `
            IIS-CommonHttpFeatures, `
            IIS-DefaultDocument, `
            IIS-StaticContent, `
            IIS-HttpErrors, `
            IIS-HttpLogging, `
            IIS-RequestFiltering, `
            IIS-ApplicationDevelopment, `
            IIS-ManagementConsole, `
            IIS-ManagementScriptingTools
          Start-Service W3SVC

      - name: Install ASP.NET Core Hosting Bundle when needed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $module = Join-Path $env:ProgramFiles 'IIS\Asp.Net Core Module\V2\aspnetcorev2.dll'
          if (-not (Test-Path $module)) {
            $installer = Join-Path $env:RUNNER_TEMP 'dotnet-hosting-10.exe'
            Invoke-WebRequest 'https://aka.ms/dotnet/10.0/dotnet-hosting-win.exe' -OutFile $installer
            $process = Start-Process $installer -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
            if ($process.ExitCode -notin 0, 3010) {
              throw "Hosting Bundle installer failed with exit code $($process.ExitCode)."
            }
          }
          if (-not (Test-Path $module)) {
            throw "ASP.NET Core Module V2 was not installed at $module."
          }
          & "$env:windir\system32\inetsrv\appcmd.exe" stop apppool /apppool.name:DefaultAppPool 2>$null | Out-Null
          Restart-Service W3SVC

      - name: Build WebIIS deployment package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:RUNNER_TEMP 'xps-webiis-e2e-app'
          $output = Join-Path $env:RUNNER_TEMP 'xps-webiis-e2e-deploy'
          Remove-Item $app,$output,"$output.zip" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $app -Force | Out-Null

          @'
          [Anonymous]
          [Get]
          Sub Index()
              Response.Write("MAIN-OK")
          End Sub
          '@ | Set-Content -Path (Join-Path $app 'main.xps') -Encoding utf8

          @'
          [Platform:browser-wasm]

          Sub Main()
              Dim form As New UIForm("IIS Browser WASM Index Test")
              Call form.AddTextField("name", "Name")
              Call form.AddEmailField("email", "Email")
              Call form.SetRequired("name", True)
              Call form.ShowDialog()
          End Sub
          '@ | Set-Content -Path (Join-Path $app 'index.xps') -Encoding utf8

          @'
          [Anonymous]
          [Get]
          Sub Index()
              Response.Write("PAGE2-OK")
          End Sub
          '@ | Set-Content -Path (Join-Path $app 'page2.xps') -Encoding utf8

          @'
          [Anonymous]
          [Get]
          Sub Index()
              Dim form As New UIForm("IIS UIForm Test")
              Call form.AddTextField("name", "Name")
              Call form.AddEmailField("email", "Email")
              Call form.SetRequired("name", True)
              Call form.ShowDialog()
          End Sub
          '@ | Set-Content -Path (Join-Path $app 'uiform.xps') -Encoding utf8

          $ordinary = Join-Path $app 'ordinary'
          New-Item -ItemType Directory -Path $ordinary -Force | Out-Null
          @'
          [Anonymous]
          [Get]
          Sub Index()
              Response.Write("ORDINARY-INDEX-OK")
          End Sub
          '@ | Set-Content -Path (Join-Path $ordinary 'index.xps') -Encoding utf8

          @'
          [Anonymous]
          [Get]
          Sub WriteA()
              Application.State.Set("shared", "application-a")
              Process.State.Set("shared", "process-a")
              Session.State.Set("private", "session-a")
              Request.State.Set("temporary", "request-a")
              Response.Write("WRITE-A|")
              Response.Write(Request.State.Get("temporary"))
          End Sub

          [Anonymous]
          [Get]
          Sub Read()
              Response.Write(Application.State.Get("shared"))
              Response.Write("|")
              Response.Write(Process.State.Get("shared"))
              Response.Write("|")
              Response.Write(Session.State.Get("private"))
              Response.Write("|")
              Response.Write(Request.State.Get("temporary"))
          End Sub
          '@ | Set-Content -Path (Join-Path $app 'state.xps') -Encoding utf8

          @'
          [Anonymous]
          [Get]
          Sub WriteB()
              Application.State.Set("shared", "application-b")
              Process.State.Set("shared", "process-b")
              Session.State.Set("private", "session-b")
              Response.Write("WRITE-B")
          End Sub
          '@ | Set-Content -Path (Join-Path $app 'stateb.xps') -Encoding utf8

          dotnet run --project .\src\XPScript.Cli\XPScript.Cli.csproj -c Release -- compile (Join-Path $app 'main.xps') --target webiis --output $output
          if ($LASTEXITCODE -ne 0) { throw "WebIIS compilation failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path (Join-Path $output 'site\web.config'))) { throw 'web.config was not generated.' }
          if (-not (Test-Path (Join-Path $output 'site\index.xps'))) { throw 'index.xps was not packaged.' }
          if (-not (Test-Path (Join-Path $output 'site\uiform.xps'))) { throw 'UIForm source was not packaged.' }
          if (-not (Test-Path (Join-Path $output 'site\ordinary\index.xps'))) { throw 'nested server-side index.xps was not packaged.' }
          if (-not (Test-Path "$output.zip")) { throw 'WebIIS ZIP was not generated.' }

          $webConfig = Get-Content (Join-Path $output 'site\web.config') -Raw
          if ($webConfig -notmatch '--default-document index\.xps') { throw 'WebIIS host was not configured to use index.xps as the default document.' }

          "XPS_E2E_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XPS_E2E_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install package into IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module WebAdministration
          $siteName = 'XPscript-WebIIS-E2E'
          $poolName = 'XPscript-WebIIS-E2E-Pool'
          $port = 50837
          $physicalPath = Join-Path $env:XPS_E2E_OUTPUT 'site'
          $cachePath = Join-Path $physicalPath '.xpscript-cache'
          New-Item -ItemType Directory -Path $cachePath -Force | Out-Null

          if (Test-Path "IIS:\Sites\$siteName") { Remove-Website -Name $siteName }
          if (Test-Path "IIS:\AppPools\$poolName") { Remove-WebAppPool -Name $poolName }

          New-WebAppPool -Name $poolName | Out-Null
          Set-ItemProperty "IIS:\AppPools\\$poolName" -Name managedRuntimeVersion -Value ''
          Set-ItemProperty "IIS:\AppPools\\$poolName" -Name processModel.identityType -Value 4
          New-Website -Name $siteName -Port $port -IPAddress '127.0.0.1' -PhysicalPath $physicalPath -ApplicationPool $poolName | Out-Null

          & icacls $physicalPath /grant "IIS AppPool\${poolName}:(OI)(CI)RX" /T /C | Out-Null
          & icacls $cachePath /grant "IIS AppPool\${poolName}:(OI)(CI)M" /T /C | Out-Null
          Start-WebAppPool -Name $poolName
          Start-Website -Name $siteName

          "XPS_E2E_SITE=$siteName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XPS_E2E_POOL=$poolName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XPS_E2E_URL=http://127.0.0.1:$port" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify normal web routing and state scopes through IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = $env:XPS_E2E_URL

          $lastError = $null
          $probe = $null
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $probe = Invoke-WebRequest "$base/main" -UseBasicParsing -TimeoutSec 5
              if ($probe.StatusCode -eq 200) { break }
            }
            catch { $lastError = $_ }
            Start-Sleep -Seconds 1
          }
          if (-not $probe -or $probe.StatusCode -ne 200) {
            throw "IIS site did not become ready. Last error: $lastError"
          }
          if ($probe.Content -ne 'MAIN-OK') { throw "Unexpected /main response: '$($probe.Content)'" }

          $extensionless = Invoke-WebRequest "$base/page2" -UseBasicParsing
          if ($extensionless.Content -ne 'PAGE2-OK') { throw "Extensionless route failed: '$($extensionless.Content)'" }

          $withExtension = Invoke-WebRequest "$base/page2.xps" -UseBasicParsing
          if ($withExtension.Content -ne 'PAGE2-OK') { throw "Explicit .xps route failed: '$($withExtension.Content)'" }

          $caseInsensitive = Invoke-WebRequest "$base/PAGE2" -UseBasicParsing
          if ($caseInsensitive.Content -ne 'PAGE2-OK') { throw "Case-insensitive route failed: '$($caseInsensitive.Content)'" }

          $ordinaryIndex = Invoke-WebRequest "$base/ordinary/" -UseBasicParsing
          if ($ordinaryIndex.Content -ne 'ORDINARY-INDEX-OK') { throw "Nested server-side index.xps default route failed: '$($ordinaryIndex.Content)'" }

          $userA = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $userB = New-Object Microsoft.PowerShell.Commands.WebRequestSession

          $writeA = Invoke-WebRequest "$base/state/WriteA" -WebSession $userA -UseBasicParsing
          if ($writeA.Content -ne 'WRITE-A|request-a') { throw "User A state write failed: '$($writeA.Content)'" }

          $readA = Invoke-WebRequest "$base/state/Read" -WebSession $userA -UseBasicParsing
          if ($readA.Content -ne 'application-a|process-a|session-a|') {
            throw "User A state read failed or Request.State leaked: '$($readA.Content)'"
          }

          $readB = Invoke-WebRequest "$base/state/Read" -WebSession $userB -UseBasicParsing
          if ($readB.Content -ne 'application-a|process-a||') {
            throw "User B did not share Application/Process state or Session.State leaked: '$($readB.Content)'"
          }

          $writeB = Invoke-WebRequest "$base/stateb/WriteB" -WebSession $userB -UseBasicParsing
          if ($writeB.Content -ne 'WRITE-B') { throw "User B state write failed: '$($writeB.Content)'" }

          $readAAfterB = Invoke-WebRequest "$base/state/Read" -WebSession $userA -UseBasicParsing
          if ($readAAfterB.Content -ne 'application-b|process-b|session-a|') {
            throw "User A did not see User B Application/Process update or lost its own Session.State: '$($readAAfterB.Content)'"
          }

          $readBAfterB = Invoke-WebRequest "$base/state/Read" -WebSession $userB -UseBasicParsing
          if ($readBAfterB.Content -ne 'application-b|process-b|session-b|') {
            throw "User B Session.State was not preserved: '$($readBAfterB.Content)'"
          }

          Write-Host 'WEBIIS-NORMAL-WEB=OK'

      - name: Verify UIForm web application through IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-WebRequest "$env:XPS_E2E_URL/uiform" -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -ne 200) { throw "UIForm route returned HTTP $($response.StatusCode)." }
          if ($response.Content -notmatch 'IIS UIForm Test') { throw 'UIForm title was not rendered through IIS.' }
          if ($response.Content -notmatch 'name') { throw 'UIForm text field was not rendered through IIS.' }
          if ($response.Content -notmatch 'email') { throw 'UIForm email field was not rendered through IIS.' }
          Write-Host 'WEBIIS-UIFORM-WEB=OK'

      - name: Verify browser WebAssembly index through IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = $env:XPS_E2E_URL
          $response = Invoke-WebRequest "$base/" -UseBasicParsing -TimeoutSec 300
          if ($response.StatusCode -ne 200) { throw "browser-WASM index bootstrap returned HTTP $($response.StatusCode)." }
          if ($response.Content -notmatch '<base href="index\.xps/">') { throw 'browser-WASM root bootstrap did not point assets at index.xps.' }
          if ($response.Content -notmatch 'xpscript-app') { throw 'browser-WASM bootstrap did not contain the XPscript application host element.' }

          $mainJs = Invoke-WebRequest "$base/index.xps/main.js" -UseBasicParsing -TimeoutSec 60
          if ($mainJs.StatusCode -ne 200) { throw "browser-WASM main.js returned HTTP $($mainJs.StatusCode)." }

          $asset = Invoke-WebRequest "$base/index.xps/_framework/dotnet.js" -UseBasicParsing -TimeoutSec 60
          if ($asset.StatusCode -ne 200) { throw "browser-WASM dotnet.js returned HTTP $($asset.StatusCode)." }
          if ([string]::IsNullOrWhiteSpace($asset.Content)) { throw 'browser-WASM dotnet.js was empty.' }

          $cache = Join-Path $env:XPS_E2E_OUTPUT 'site\.xpscript-cache\wasm'
          if (-not (Test-Path $cache)) { throw 'browser-WASM cache directory was not created under the deployed IIS site.' }
          $frameworkAssets = Get-ChildItem $cache -Recurse -File -Filter dotnet.js -ErrorAction SilentlyContinue
          if (-not $frameworkAssets) { throw 'browser-WASM publish output did not contain dotnet.js.' }
          Write-Host 'WEBIIS-BROWSER-WASM-ASSETS=OK'

      - name: Verify browser WebAssembly executes in Chromium
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:XPS_PLAYWRIGHT 'verify-wasm.js'
          @'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const failures = [];
            page.on('pageerror', error => failures.push('pageerror: ' + error.message));
            page.on('requestfailed', request => failures.push('requestfailed: ' + request.url() + ' ' + (request.failure()?.errorText || '')));
            await page.goto(process.env.XPS_E2E_URL + '/', { waitUntil: 'domcontentloaded', timeout: 300000 });
            await page.locator('input[name="name"]').waitFor({ state: 'visible', timeout: 180000 });
            await page.locator('input[name="email"]').waitFor({ state: 'visible', timeout: 30000 });
            const body = await page.textContent('body');
            if (!body || !body.includes('IIS Browser WASM Index Test')) throw new Error('WASM UIForm title was not rendered.');
            if (failures.length) throw new Error(failures.join('\n'));
            await browser.close();
            console.log('WEBIIS-BROWSER-WASM-CHROMIUM=OK');
          })().catch(error => { console.error(error); process.exit(1); });
          '@ | Set-Content -Path $script -Encoding utf8
          Push-Location $env:XPS_PLAYWRIGHT
          node $script
          if ($LASTEXITCODE -ne 0) { throw "Chromium browser-WASM verification failed with exit code $LASTEXITCODE." }
          Pop-Location

      - name: Collect IIS diagnostics on failure
        if: failure()
        shell: powershell
        run: |
          Write-Host '=== web.config ==='
          Get-Content (Join-Path $env:XPS_E2E_OUTPUT 'site\web.config') -ErrorAction SilentlyContinue
          Write-Host '=== IIS sites ==='
          & "$env:windir\system32\inetsrv\appcmd.exe" list site
          Write-Host '=== IIS app pools ==='
          & "$env:windir\system32\inetsrv\appcmd.exe" list apppool
          Write-Host '=== WASM cache ==='
          Get-ChildItem (Join-Path $env:XPS_E2E_OUTPUT 'site\.xpscript-cache') -Recurse -ErrorAction SilentlyContinue | Select-Object FullName,Length
          Write-Host '=== recent Application event log ==='
          Get-WinEvent -LogName Application -MaxEvents 50 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'IIS|IIS AspNetCore Module|ASP.NET Core|WAS|W3SVC' } |
            Format-List TimeCreated,ProviderName,Id,LevelDisplayName,Message

      - name: Remove IIS test site
        if: always()
        shell: powershell
        run: |
          Import-Module WebAdministration -ErrorAction SilentlyContinue
          if ($env:XPS_E2E_SITE -and (Test-Path "IIS:\Sites\$env:XPS_E2E_SITE")) {
            Remove-Website -Name $env:XPS_E2E_SITE
          }
          if ($env:XPS_E2E_POOL -and (Test-Path "IIS:\AppPools\$env:XPS_E2E_POOL")) {
            Remove-WebAppPool -Name $env:XPS_E2E_POOL
          }
