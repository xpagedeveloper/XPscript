name: Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-windows:
    name: Compile Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

  compile-linux:
    name: Compile Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

  compile-macos:
    name: Compile macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
