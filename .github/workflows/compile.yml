name: Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-notices:
    name: Validate license notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore projects for license metadata
        run: dotnet restore ./XPScriptCompiler.slnx
      - name: Validate direct package notices
        shell: pwsh
        run: ./scripts/validate-license-notices.ps1

  compile-windows:
    name: Compile Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary.exe --runtime=false
      - name: Verify generated license notice
        shell: pwsh
        run: |
          if (-not (Test-Path ./out/Third-party-license.txt)) { throw 'Missing Third-party-license.txt' }
          $notice = Get-Content ./out/Third-party-license.txt -Raw
          if ($notice -notmatch 'Apache License') { throw 'Generated notice does not contain the XPScript Apache license.' }
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured.exe --runtime=false
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom.exe --runtime=false
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom.exe
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform.exe --runtime=false
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --runtime=false --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-richtext-linked-objects-surface.xps ./out/notes-richtext.exe
      - name: Compile Notes MIME surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-mime-entity-surface.xps ./out/notes-mime.exe
      - name: Compile Notes core database surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-session-database-open-runtime-test.xps ./out/notes-core-database.exe

  compile-linux:
    name: Compile Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify debugger core
        run: dotnet run --project ./tests/DebuggerCoreProbe/DebuggerCoreProbe.csproj -c Release
      - name: Compile ArraySort regression application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/array-sort-regression.xps -o ./out/array-sort-regression --runtime=false
      - name: Run ArraySort regression application
        run: ./out/array-sort-regression
      - name: Compile CSV regression application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-csv-regression.xps -o ./out/native-csv-regression --runtime=false
      - name: Run CSV regression application
        run: ./out/native-csv-regression
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom --runtime=false
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom
      - name: Verify UIForm asset packaging
        shell: bash
        run: |
          rm -rf ./samples/assets ./out/assets
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-create --runtime=false
          test -d ./samples/assets
          printf 'embedded-asset-payload' > ./samples/assets/embed-test.txt
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-external --runtime=false
          test "$(cat ./out/assets/embed-test.txt)" = "embedded-asset-payload"
          rm -rf ./out/assets
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-embedded --runtime=false --embed-assets
          rm -rf ./out/assets
          ./out/uiform-assets-embedded | grep -q UIFORM_ASSETS_OK
          test "$(cat ./out/assets/embed-test.txt)" = "embedded-asset-payload"
      - name: Install browser WASM workload
        run: dotnet workload install wasm-tools
      - name: Verify browser WASM multi-window UIForm
        run: dotnet run --project ./tests/WebBrowserWasmMultiWindowSmoke/WebBrowserWasmMultiWindowSmoke.csproj -c Release
      - name: Verify desktop UIForm lifecycle
        run: dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
      - name: Verify OpenAPI REST generator
        run: dotnet run --project ./tests/OpenApiGeneratorSmoke/OpenApiGeneratorSmoke.csproj -c Release
      - name: Verify OpenAPI unified CLI generate
        run: dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi generate ./tests/OpenApiGeneratorSmoke/petstore.yaml -o ./out/generated-openapi.xps --force
      - name: Verify OpenAPI unified CLI import
        run: dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi import ./tests/OpenApiGeneratorSmoke/petstore-reimport.yaml -o ./out/generated-openapi.xps
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary --runtime=false
      - name: Verify generated license notice
        shell: bash
        run: |
          test -f ./out/Third-party-license.txt
          grep -q 'Apache License' ./out/Third-party-license.txt
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured --runtime=false
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform --runtime=false
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --runtime=false --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-richtext-linked-objects-surface.xps ./out/notes-richtext
      - name: Compile Notes MIME surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-mime-entity-surface.xps ./out/notes-mime
      - name: Compile Notes core database surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-session-database-open-runtime-test.xps ./out/notes-core-database

  compile-macos:
    name: Compile macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary --runtime=false
      - name: Verify generated license notice
        run: |
          test -f ./out/Third-party-license.txt
          grep -q 'Apache License' ./out/Third-party-license.txt
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured --runtime=false
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom --runtime=false
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform --runtime=false
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --runtime=false --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-richtext-linked-objects-surface.xps ./out/notes-richtext
      - name: Compile Notes MIME surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-mime-entity-surface.xps ./out/notes-mime
      - name: Compile Notes core database surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-session-database-open-runtime-test.xps ./out/notes-core-database
