name: Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-windows:
    name: Compile Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary.exe --framework-dependent
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured.exe --framework-dependent
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom.exe --framework-dependent
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom.exe
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform.exe --framework-dependent
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --framework-dependent --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/notes-richtext-linked-objects-surface.xps -o ./out/notes-richtext.exe --framework-dependent
      - name: Compile Notes navigator position regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/notes-richtext-navigator-position-regression.xps -o ./out/notes-richtext-position.exe --framework-dependent

  compile-linux:
    name: Compile Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile ArraySort regression application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/array-sort-regression.xps -o ./out/array-sort-regression --framework-dependent
      - name: Run ArraySort regression application
        run: ./out/array-sort-regression
      - name: Compile CSV regression application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-csv-regression.xps -o ./out/native-csv-regression --framework-dependent
      - name: Run CSV regression application
        run: ./out/native-csv-regression
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom --framework-dependent
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom
      - name: Verify UIForm asset packaging
        shell: bash
        run: |
          rm -rf ./samples/assets ./out/assets
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-create --framework-dependent
          test -d ./samples/assets
          printf 'embedded-asset-payload' > ./samples/assets/embed-test.txt
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-external --framework-dependent
          test "$(cat ./out/assets/embed-test.txt)" = "embedded-asset-payload"
          rm -rf ./out/assets
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-embedded --framework-dependent --embed-assets
          rm -rf ./out/assets
          ./out/uiform-assets-embedded | grep -q UIFORM_ASSETS_OK
          test "$(cat ./out/assets/embed-test.txt)" = "embedded-asset-payload"
      - name: Install browser WASM workload
        run: dotnet workload install wasm-tools
      - name: Verify browser WASM multi-window UIForm
        run: dotnet run --project ./tests/WebBrowserWasmMultiWindowSmoke/WebBrowserWasmMultiWindowSmoke.csproj -c Release
      - name: Verify desktop UIForm lifecycle
        run: dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
      - name: Verify OpenAPI REST generator
        run: dotnet run --project ./tests/OpenApiGeneratorSmoke/OpenApiGeneratorSmoke.csproj -c Release
      - name: Verify OpenAPI unified CLI generate
        run: dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi generate ./tests/OpenApiGeneratorSmoke/petstore.yaml -o ./out/generated-openapi.xps --force
      - name: Verify OpenAPI unified CLI import
        run: dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi import ./tests/OpenApiGeneratorSmoke/petstore-reimport.yaml -o ./out/generated-openapi.xps
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary --framework-dependent
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured --framework-dependent
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform --framework-dependent
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --framework-dependent --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/notes-richtext-linked-objects-surface.xps -o ./out/notes-richtext --framework-dependent
      - name: Compile Notes navigator position regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/notes-richtext-navigator-position-regression.xps -o ./out/notes-richtext-position --framework-dependent

  compile-macos:
    name: Compile macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary --framework-dependent
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured --framework-dependent
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom --framework-dependent
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform --framework-dependent
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --framework-dependent --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/notes-richtext-linked-objects-surface.xps -o ./out/notes-richtext --framework-dependent
      - name: Compile Notes navigator position regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/notes-richtext-navigator-position-regression.xps -o ./out/notes-richtext-position --framework-dependent
