name: Evaluate Object Redaction

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/EvaluateCollectionIsolationRuntimeSource.cs'
      - 'src/XPScript.Compiler/XPScriptEvaluateRuntimeSource.cs'
      - 'samples/evaluate-object-callvar-rejection.xps'
      - '.github/workflows/evaluate-object-redaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-object-redaction:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler
        shell: pwsh
        run: |
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }

      - name: Verify unsupported mutable Evaluate object rejection is redacted
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/evaluate-object | Out-Null
          $exe = if ($IsWindows) { './out/evaluate-object/rejection.exe' } else { './out/evaluate-object/rejection' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/evaluate-object-callvar-rejection.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Evaluate object rejection sample failed to compile.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          $exit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Evaluate object rejection sample failed at runtime with exit code $exit." }
          if ($output -notcontains 'OBJECT-CALLVAR-REJECTED=OK') { throw 'Object rejection marker missing.' }
          if ($output -notcontains 'OBJECT-CALLVAR-DIAGNOSTIC-REDACTED=OK') { throw 'Diagnostic redaction marker missing.' }
          if (($output -join "`n") -match 'EvaluateObjectProbe') { throw 'Evaluate diagnostic leaked the internal object type.' }
