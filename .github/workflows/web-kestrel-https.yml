name: Web Kestrel HTTPS

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Cli/**'
      - 'tests/WebKestrelHttpsSmoke/**'
      - '.github/workflows/web-kestrel-https.yml'
  push:
    branches: ['todo-web-runtime-kestrel-https-limits']
    paths:
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Cli/**'
      - 'tests/WebKestrelHttpsSmoke/**'
      - '.github/workflows/web-kestrel-https.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx
      - name: Build solution
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore
      - name: Run real Kestrel TLS and HTTP2 regression
        run: dotnet run --project ./tests/WebKestrelHttpsSmoke/WebKestrelHttpsSmoke.csproj -c Release
