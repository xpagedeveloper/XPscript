name: Archive Runtime Branch Check

on:
  push:
    branches: [archive-runtime-todo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Run preprocessor pipeline probe
        run: dotnet run --project ./tests/PreprocessorPipelineProbe/PreprocessorPipelineProbe.csproj -c Release
      - name: Compile ZIP-only archive demo
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/archive/archive-zip.xps -o ./out/archive-zip --framework-dependent
      - name: Compile extended archive create demo
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/archive/archive-create-extended.xps -o ./out/archive-extended --framework-dependent
