name: Layout Dump Temp

on:
  push:
    branches: [todo-statement-layout-audit]
    paths:
      - 'tools/LayoutDump.cs'
      - 'tools/LayoutDump.csproj'
      - '.github/workflows/layout-dump-temp.yml'

permissions:
  contents: read

jobs:
  dump:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Dump generated condition
        run: dotnet run --project ./tools/LayoutDump.csproj -c Release
