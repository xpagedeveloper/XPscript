name: Language Extensions Compatibility

on:
  push:
    branches: [main, runtime-development-no-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Compile language extension sample
        shell: pwsh
        run: |
          $resultText = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/language-extensions.xps -o ./out/language-extensions.exe --framework-dependent --result-format json
          $compilerExitCode = $LASTEXITCODE
          $resultText | ForEach-Object { Write-Host $_ }
          if ($compilerExitCode -ne 0) {
            try {
              $result = $resultText | ConvertFrom-Json
              foreach ($errorItem in @($result.errors)) {
                Write-Host "DIAGNOSTIC line=$($errorItem.line) position=$($errorItem.position)"
                Write-Host "DESCRIPTION: $($errorItem.description)"
                Write-Host "CODE: $($errorItem.code)"
                Write-Host "MARKED: $($errorItem.markedCode)"
              }
            } catch {
              Write-Host 'Unable to parse structured compiler diagnostics.'
            }
            throw 'Language extensions compilation failed.'
          }

      - name: Run language extension sample
        shell: pwsh
        run: |
          $output = & ./out/language-extensions.exe
          foreach ($value in @(
            'ENUM=11',
            'ENUMQUAL=20',
            'TYPE=Fredrik:40',
            'OPTIONAL=Hello Fredrik',
            'OPTIONAL2=Hi Fredrik',
            'PROPERTYLET=PropertyLet',
            'STRCONV=HELLO WORLD',
            'CTYPE=42',
            'VALUE=7',
            'COUNT=8'
          )) {
            if ($output -notcontains $value) { throw "Language extension output missing: $value" }
          }

      - name: Compile Date object enhancement sample
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/date-object-enhancements.xps -o ./out/date-object-enhancements.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Date object enhancement compilation failed.' }

      - name: Verify Date OS formatting properties
        shell: pwsh
        run: |
          $output = & ./out/date-object-enhancements.exe
          if ($LASTEXITCODE -ne 0) { throw "Date object enhancement sample exited with code $LASTEXITCODE." }

          $dateMask = ($output | Where-Object { $_ -like 'OSDATEFORMAT=*' } | Select-Object -First 1)
          $timeMask = ($output | Where-Object { $_ -like 'OSTIMEFORMAT=*' } | Select-Object -First 1)
          $dateValue = ($output | Where-Object { $_ -like 'OSDATE=*' } | Select-Object -First 1)
          $timeValue = ($output | Where-Object { $_ -like 'OSTIME=*' } | Select-Object -First 1)

          if ([string]::IsNullOrWhiteSpace($dateMask) -or $dateMask -eq 'OSDATEFORMAT=') { throw 'OSDateFormatting returned an empty format mask.' }
          if ([string]::IsNullOrWhiteSpace($timeMask) -or $timeMask -eq 'OSTIMEFORMAT=') { throw 'OSTimeFormatting returned an empty format mask.' }
          if ([string]::IsNullOrWhiteSpace($dateValue) -or $dateValue -eq 'OSDATE=') { throw 'Format$ with OSDateFormatting returned an empty value.' }
          if ([string]::IsNullOrWhiteSpace($timeValue) -or $timeValue -eq 'OSTIME=') { throw 'Format$ with OSTimeFormatting returned an empty value.' }
