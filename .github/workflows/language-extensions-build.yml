name: Language Extensions Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Compile language extension sample
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/language-extensions.xps -o ./out/language-extensions.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Language extensions compilation failed.' }

      - name: Run language extension sample
        shell: pwsh
        run: |
          $output = & ./out/language-extensions.exe
          foreach ($value in @(
            'ENUM=11',
            'ENUMQUAL=20',
            'TYPE=Fredrik:40',
            'OPTIONAL=Hello Fredrik',
            'OPTIONAL2=Hi Fredrik',
            'VALUE=7',
            'COUNT=8'
          )) {
            if ($output -notcontains $value) { throw "Language extension output missing: $value" }
          }
