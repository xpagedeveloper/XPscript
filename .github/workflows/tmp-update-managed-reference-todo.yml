name: Apply Managed Reference TODO Status

on:
  push:
    branches:
      - todo-cross-platform-managed-references-batch
    paths:
      - '.github/workflows/tmp-update-managed-reference-todo.yml'

permissions:
  contents: write

jobs:
  update-todo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-cross-platform-managed-references-batch
      - name: Mark managed reference batch verified
        shell: python
        run: |
          from pathlib import Path
          path = Path('todo/cross-platform-runtime-todo.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
            '- [>] explicit external managed `.dll` references use `Reference "relative/path/Assembly.dll"`': '- [x] explicit external managed `.dll` references use `Reference "relative/path/Assembly.dll"`',
            '- [>] managed references are staged into the compiler\'s unique temporary build directory and emitted as generated MSBuild `<Reference>` items': '- [x] managed references are staged into the compiler\'s unique temporary build directory and emitted as generated MSBuild `<Reference>` items',
            '- [>] users cannot provide raw MSBuild/XML through the reference syntax': '- [x] users cannot provide raw MSBuild/XML through the reference syntax',
            '- [>] managed reference paths must be relative to and remain inside the XPScript source directory': '- [x] managed reference paths must be relative to and remain inside the XPScript source directory',
            '- [>] referenced managed assemblies are marked `Private` so publish can carry the dependency with the generated application': '- [x] referenced managed assemblies are marked `Private` so publish can carry the dependency with the generated application',
            '- [>] RID-specific native dependencies for managed assemblies use repeatable `ReferenceNative "path" Runtime "rid"` directives': '- [x] RID-specific native dependencies for managed assemblies use repeatable `ReferenceNative "path" Runtime "rid"` directives',
            '- [>] only `ReferenceNative` entries matching the selected compiler target RID are packaged': '- [x] only `ReferenceNative` entries matching the selected compiler target RID are packaged',
            '- [>] managed/native reference paths are checked for missing files, traversal, file-name collisions and executable overwrite': '- [x] managed/native reference paths are checked for missing files, traversal, file-name collisions and executable overwrite',
            '- [>] reference directives are replaced by blank source lines before transpilation so physical diagnostic line numbers remain stable': '- [x] reference directives are replaced by blank source lines before transpilation so physical diagnostic line numbers remain stable',
            '- [ ] add a real managed test assembly plus RID-native fixtures when execution/build verification is re-enabled': '- [x] real net10.0 managed test assembly plus target-RID native fixture are build/runtime-verified by `Cross Platform Managed References`',
            '- [ ] verify managed reference deployment in both self-contained and framework-dependent publish modes': '- [x] managed reference deployment is verified in both self-contained and framework-dependent publish modes on Windows/Linux/macOS by `Cross Platform Managed References`',
            '- [ ] decide whether direct CLR type/member interop should be exposed as a separate language feature; assembly reference support alone does not implicitly expose arbitrary CLR APIs': '- [x] direct CLR type/member interop is explicitly a separate future language feature; assembly reference support alone does not expose arbitrary CLR APIs',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected TODO line: {old}')
              text = text.replace(old, new, 1)
          marker = '`Cross Platform Native Loader Compatibility` verifies exact-RID/OS/base native target selection for all six supported RIDs and executes the matching native system-library call plus loader-diagnostic fixture on Windows x64, Windows ARM64, Linux x64, Linux ARM64, macOS x64 and macOS ARM64 hosted runners.\n'
          note = '\n`Cross Platform Managed References` builds a real net10.0 fixture assembly, compiles the same XPScript source in framework-dependent and self-contained modes on Windows/Ubuntu/macOS, verifies matching RID-native deployment and non-matching RID filtering, and executes both generated artifacts successfully. `Reference` remains a build/deployment directive and does not implicitly expose CLR type/member interop.\n'
          if note.strip() not in text:
              text = text.replace(marker, marker + note, 1)
          path.write_text(text, encoding='utf-8')
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-update-managed-reference-todo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add todo/cross-platform-runtime-todo.md .github/workflows/tmp-update-managed-reference-todo.yml
          git commit -m "Mark managed reference portability batch verified"
          git push origin HEAD:todo-cross-platform-managed-references-batch
