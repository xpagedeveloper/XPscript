name: General Dim and Is Nothing

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/GeneralSyntaxPreprocessor.cs'
      - 'src/XPScript.Compiler/NothingComparisonValidator.cs'
      - 'src/XPScript.Compiler/UnhandledRuntimeErrorPostProcessor.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/ReservedIdentifierPreprocessor.cs'
      - 'src/XPScript.Compiler/XPScriptObjectRuntimeSource.cs'
      - 'samples/general-dim-is-nothing.xps'
      - 'samples/notes-c-api-v1.xps'
      - 'samples/notes-view-autoupdate-console.xps'
      - 'todo/HCLNotes.md'
      - '.github/workflows/general-dim-is-nothing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  general-syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }

      - name: Verify mixed Dim and Is Nothing
        shell: pwsh
        run: |
          $output = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- run ./samples/general-dim-is-nothing.xps
          if ($LASTEXITCODE -ne 0) { throw "General syntax sample failed.`n$($output -join [Environment]::NewLine)" }
          $required = @(
            'CLASS_NOTHING=OK',
            'CLASS_IS_NOT_NOTHING=OK',
            'CLASS_NOT_IS_NOTHING=OK',
            'EXTERNAL_NOTHING=OK',
            'GENERAL_DIM_IS_NOTHING=OK'
          )
          foreach ($marker in $required) {
            if ($output -notcontains $marker) { throw "Missing marker $marker.`n$($output -join [Environment]::NewLine)" }
          }

      - name: Reject equality comparisons with Nothing
        shell: pwsh
        run: |
          $invalid = Join-Path $env:RUNNER_TEMP 'invalid-nothing-comparison.xps'
          $cases = @('value <> Nothing', 'Nothing <> value', 'value = Nothing', 'Nothing = value')
          foreach ($expression in $cases) {
            @"
          Option Declare
          Class Example
          End Class
          Sub Main()
              Dim value As Example
              If $expression Then
                  Print "INVALID"
              End If
          End Sub
          "@ | Set-Content -Path $invalid

            $output = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- run $invalid 2>&1
            if ($LASTEXITCODE -eq 0) { throw "Invalid Nothing comparison unexpectedly compiled: $expression.`n$($output -join [Environment]::NewLine)" }
            $text = $output -join [Environment]::NewLine
            if ($text -notmatch "Nothing cannot be compared with '(<>|=)'") { throw "Expected Nothing comparison diagnostic was missing for $expression.`n$text" }
            if ($text -notmatch "Is Nothing.*Is Not Nothing") { throw "Expected replacement syntax guidance was missing for $expression.`n$text" }
          }

          $valid = Join-Path $env:RUNNER_TEMP 'valid-set-nothing.xps'
          @'
          Option Declare
          Class Example
          End Class
          Sub Main()
              Dim value As Example
              Set value = Nothing
              Print "SET_NOTHING=OK"
          End Sub
          '@ | Set-Content -Path $valid
          $output = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- run $valid 2>&1
          if ($LASTEXITCODE -ne 0 -or $output -notcontains 'SET_NOTHING=OK') { throw "Set value = Nothing must remain valid.`n$($output -join [Environment]::NewLine)" }

      - name: Hide generated CSharp runtime stack traces
        shell: pwsh
        run: |
          $runtimeFailure = Join-Path $env:RUNNER_TEMP 'runtime-failure.xps'
          @'
          Option Declare
          Sub Main()
              Error 5, "runtime-failure"
          End Sub
          '@ | Set-Content -Path $runtimeFailure

          $output = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- run $runtimeFailure 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Runtime failure unexpectedly returned success.`n$($output -join [Environment]::NewLine)" }
          $text = $output -join [Environment]::NewLine
          if ($text -notmatch 'XPscript runtime error') { throw "XPscript runtime error message was missing.`n$text" }
          if ($text -match 'Unhandled exception|XPScriptRuntimeException|Program\.cs| at Script\.| at Program\.') {
              throw "Generated CSharp/.NET stack trace leaked to the user.`n$text"
          }
