name: Native JSON Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/NativeJsonRuntimeSource.cs'
      - 'src/XPScript.Compiler/NativeHttpJsonPreprocessor.cs'
      - 'src/XPScript.Compiler/XPScriptObjectRuntimeSource.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'src/XPScript.Compiler/CoreCompatibilityTranspiler.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/ClassOverloadValidator.cs'
      - 'src/XPScript.Compiler/DefaultVisibilityPreprocessor.cs'
      - 'src/XPScript.Compiler/PropertyLetCompatibilityPreprocessor.cs'
      - 'samples/native-json-regression.xps'
      - 'samples/default-private-class-json.xps'
      - 'samples/option-public-visibility.xps'
      - 'samples/class-member-conflict-invalid.xps'
      - 'samples/json-resource-limits.xps'
      - 'tests/JsonErrorInstrumentationProbe/**'
      - '.github/workflows/native-json-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-json:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify JSON and HTTP On Error instrumentation
        shell: pwsh
        run: |
          dotnet run --project ./tests/JsonErrorInstrumentationProbe/JsonErrorInstrumentationProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Native JSON/HTTP On Error instrumentation regression failed.' }
      - name: Compile and verify Native JSON API
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = if ($IsWindows) { './out/native-json-regression.exe' } else { './out/native-json-regression' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-json-regression.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Native JSON sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Native JSON regression failed.`n$output" }
          $output | ForEach-Object { Write-Host $_ }
          $required = @(
            'DOCUMENT={"name":"Alice","active":true}',
            'OBJCOUNT=2',
            'OBJNAME=Fredrik',
            'OBJHAS=True',
            'OBJCOUNT2=1',
            'ARRAYCOUNT=2',
            'ARRAYVALUE=TWO',
            'ARRAYCOUNT2=1',
            'ARRAYFIRST=TWO',
            'ELEMENTTYPE=Number',
            'ELEMENTVALUE=123',
            'STRINGIFY={"name":"Fredrik"}',
            'ENCODE=["TWO"]',
            'CLASSJSON={"id":7,"name":"USER-ANNA"}',
            'DECODE={"ok":true}',
            'EMPTYJSON=null',
            'NULLJSON=null',
            'NOTHINGJSON=null'
          )
          foreach ($value in $required) {
            if ($output -notcontains $value) { throw "Native JSON output missing: $value`n$output" }
          }
          $joined = $output -join "`n"
          if ($joined -match 'NullSentinel|ILSObjectReference|LSRef|do-not-serialize|mPassword|__IsDeleted') {
            throw "Internal/private XPscript class state leaked into JSON output.`n$output"
          }
      - name: Verify class default visibility
        shell: pwsh
        run: |
          $privateExe = if ($IsWindows) { './out/default-private-class-json.exe' } else { './out/default-private-class-json' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/default-private-class-json.xps -o $privateExe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Default-private class sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $privateExe }
          $privateOutput = @(& $privateExe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Default-private class regression failed.`n$privateOutput" }
          if ($privateOutput -notcontains 'DEFAULTPRIVATE={"visible":"yes"}') {
            throw "Default-private class JSON output was unexpected.`n$privateOutput"
          }
          if (($privateOutput -join "`n") -match 'secret|hidden') {
            throw "Default-private member leaked into JSON.`n$privateOutput"
          }

          $publicExe = if ($IsWindows) { './out/option-public-visibility.exe' } else { './out/option-public-visibility' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/option-public-visibility.xps -o $publicExe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Option Public sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $publicExe }
          $publicOutput = @(& $publicExe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Option Public regression failed.`n$publicOutput" }
          if ($publicOutput -notcontains 'OPTIONPUBLIC={"value":"ok","display":"DISPLAY-ok"}') {
            throw "Option Public class JSON output was unexpected.`n$publicOutput"
          }
      - name: Reject field and property name conflicts
        shell: pwsh
        run: |
          $badExe = if ($IsWindows) { './out/class-member-conflict-invalid.exe' } else { './out/class-member-conflict-invalid' }
          $badOutput = @(dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/class-member-conflict-invalid.xps -o $badExe --framework-dependent 2>&1)
          if ($LASTEXITCODE -eq 0) { throw 'Field/property conflict unexpectedly compiled.' }
          $joined = $badOutput -join "`n"
          if ($joined -notmatch "cannot declare field and property 'Name' with the same name") {
            throw "Field/property conflict diagnostic was missing or unexpected.`n$joined"
          }
      - name: Verify JSON resource limits and rollback
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { './out/json-resource-limits.exe' } else { './out/json-resource-limits' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/json-resource-limits.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'JSON resource-limit sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "JSON resource-limit regression failed.`n$output" }
          $output | ForEach-Object { Write-Host $_ }
          $required = @(
            'PARSE_SIZE_ERR=5',
            'DEPTH_ERR=5',
            'NODE_COUNT_ERR=5',
            'OBJECT_PAYLOAD_ERR=5',
            'OBJECT_ROLLBACK=safe',
            'ARRAY_ADD_PAYLOAD_ERR=5',
            'ARRAY_ADD_COUNT=1',
            'ARRAY_SET_PAYLOAD_ERR=5',
            'ARRAY_SET_VALUE=safe',
            'STRINGIFY_SIZE_ERR=5',
            'NONFINITE_ERR=5',
            'PARSED_NONFINITE_ERR=5',
            'MALFORMED_ERR=5',
            'MALFORMED_TEXT=Invalid JSON input.',
            'JSON_RESOURCE_LIMITS=OK'
          )
          foreach ($value in $required) {
            if ($output -notcontains $value) { throw "JSON resource-limit output missing: $value`n$output" }
          }
          if (($output -join "`n") -match 'DO_NOT_ECHO') {
            throw "Malformed JSON diagnostic leaked source payload.`n$output"
          }
