name: Evaluate Legacy Terminology

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'samples/**'
      - 'examples/**'
      - 'README.md'
      - 'tests/check_evaluate_legacy_terminology.py'
      - '.github/workflows/evaluate-legacy-terminology.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'samples/**'
      - 'examples/**'
      - 'README.md'
      - 'tests/check_evaluate_legacy_terminology.py'
      - '.github/workflows/evaluate-legacy-terminology.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject legacy Evaluate terminology and evaluator references
        run: python3 ./tests/check_evaluate_legacy_terminology.py
