name: TEMP macOS desktop host build

on:
  push:
    branches: [investigate-ast-compiler]
    paths:
      - '.github/workflows/temp-macos-desktop-host-build.yml'
      - 'src/XPScript.UI.Desktop/DesktopApplicationHost.cs'

permissions:
  contents: read

jobs:
  build-host:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop host
        run: dotnet build ./src/XPScript.UI.Desktop/XPScript.UI.Desktop.csproj -c Release
