name: Cross Platform Filesystem Edge Cases

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/FileSystemPortabilityRuntimeSource.cs'
      - 'src/XPScript.Compiler/FileSystemPortabilityPostProcessor.cs'
      - 'samples/file-path-argument-probe.xps'
      - 'samples/file-case-preservation.xps'
      - 'todo/cross-platform-runtime-todo.md'
      - '.github/workflows/cross-platform-filesystem-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem-edge:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Resolve current RID
        id: rid
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } elseif ($env:RUNNER_ARCH -eq 'X64') { 'x64' } else { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          $os = if ($env:RUNNER_OS -eq 'Windows') { 'win' } elseif ($env:RUNNER_OS -eq 'Linux') { 'linux' } elseif ($env:RUNNER_OS -eq 'macOS') { 'osx' } else { throw "Unsupported runner OS: $env:RUNNER_OS" }
          "rid=$os-$arch" >> $env:GITHUB_OUTPUT
      - name: Compile filesystem probes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $argExe = if ($env:RUNNER_OS -eq 'Windows') { './out/file-path-argument-probe.exe' } else { './out/file-path-argument-probe' }
          $caseExe = if ($env:RUNNER_OS -eq 'Windows') { './out/file-case-preservation.exe' } else { './out/file-case-preservation' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-path-argument-probe.xps --runtime '${{ steps.rid.outputs.rid }}' -o $argExe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'file-path-argument-probe.xps compilation failed.' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-case-preservation.xps --runtime '${{ steps.rid.outputs.rid }}' -o $caseExe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'file-case-preservation.xps compilation failed.' }
          "ARG_EXE=$argExe" >> $env:GITHUB_ENV
          "CASE_EXE=$caseExe" >> $env:GITHUB_ENV
      - name: Verify case preservation
        shell: pwsh
        run: |
          $result = & $env:CASE_EXE
          if ($LASTEXITCODE -ne 0 -or $result -notcontains 'CASE_PRESERVATION=OK') { throw "Case preservation failed.`n$result" }
      - name: Verify Windows drive and long-path access
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'xps-long-path'
          $segment = 'segment-' + ('x' * 45)
          $deep = $root
          1..6 | ForEach-Object { $deep = Join-Path $deep ($segment + $_) }
          New-Item -ItemType Directory -Force $deep | Out-Null
          $file = Join-Path $deep 'LongPathProbe.txt'
          $result = & $env:ARG_EXE create $file
          if ($LASTEXITCODE -ne 0 -or $result -notcontains 'PATH_ARGUMENT_PROBE=OK') { throw "Windows long-path create failed.`n$result" }
          if (-not (Test-Path -LiteralPath $file)) { throw 'Windows long-path file was not created.' }
          $driveQualified = (Resolve-Path -LiteralPath $file).Path
          if ($driveQualified -notmatch '^[A-Za-z]:\\') { throw "Expected drive-qualified path, got $driveQualified" }
          $result = & $env:ARG_EXE filelen $driveQualified
          if ($LASTEXITCODE -ne 0 -or $result -notcontains 'PATH_ARGUMENT_PROBE=OK') { throw "Windows drive-qualified FileLen failed.`n$result" }
          if ($driveQualified.Length -le 260) { throw "Long-path fixture did not exceed 260 characters: $($driveQualified.Length)" }
          Write-Host "WINDOWS_LONG_PATH_LENGTH=$($driveQualified.Length)"
      - name: Verify Unix file modes and ownership preservation
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'xps-unix-permissions'
          New-Item -ItemType Directory -Force $root | Out-Null
          $source = Join-Path $root 'source.sh'
          $copy = Join-Path $root 'copy.sh'
          Set-Content -LiteralPath $source -Value '#!/bin/sh' -NoNewline
          chmod 754 $source
          $beforeMode = (stat -f '%Lp' $source 2>$null)
          if ($LASTEXITCODE -ne 0) { $beforeMode = (stat -c '%a' $source) }
          $beforeUid = (stat -f '%u' $source 2>$null)
          if ($LASTEXITCODE -ne 0) { $beforeUid = (stat -c '%u' $source) }
          $result = & $env:ARG_EXE copy $source $copy
          if ($LASTEXITCODE -ne 0 -or $result -notcontains 'PATH_ARGUMENT_PROBE=OK') { throw "Unix FileCopy probe failed.`n$result" }
          $afterMode = (stat -f '%Lp' $copy 2>$null)
          if ($LASTEXITCODE -ne 0) { $afterMode = (stat -c '%a' $copy) }
          $afterUid = (stat -f '%u' $copy 2>$null)
          if ($LASTEXITCODE -ne 0) { $afterUid = (stat -c '%u' $copy) }
          if ([string]$beforeMode -ne [string]$afterMode) { throw "Unix mode changed: $beforeMode -> $afterMode" }
          if ([string]$beforeUid -ne [string]$afterUid) { throw "Unix owner changed: $beforeUid -> $afterUid" }
          Write-Host "UNIX_MODE_OWNER=OK mode=$afterMode uid=$afterUid"
      - name: Probe cross-filesystem Name behavior where available
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          $sourceRoot = $env:RUNNER_TEMP
          $candidateRoots = @('/dev/shm','/tmp') | Where-Object { Test-Path -LiteralPath $_ }
          $sourceDevice = (stat -f '%d' $sourceRoot 2>$null)
          if ($LASTEXITCODE -ne 0) { $sourceDevice = (stat -c '%d' $sourceRoot) }
          $otherRoot = $null
          foreach ($candidate in $candidateRoots) {
            $device = (stat -f '%d' $candidate 2>$null)
            if ($LASTEXITCODE -ne 0) { $device = (stat -c '%d' $candidate) }
            if ([string]$device -ne [string]$sourceDevice) { $otherRoot = $candidate; break }
          }
          if (-not $otherRoot) {
            Write-Host 'CROSS_FILESYSTEM_NAME=NOT_AVAILABLE_ON_RUNNER'
            exit 0
          }
          $source = Join-Path $sourceRoot ('xps-crossfs-' + [guid]::NewGuid().ToString('N') + '.txt')
          $destination = Join-Path $otherRoot ('xps-crossfs-' + [guid]::NewGuid().ToString('N') + '.txt')
          Set-Content -LiteralPath $source -Value 'crossfs' -NoNewline
          $result = & $env:ARG_EXE move $source $destination
          if ($LASTEXITCODE -ne 0 -or $result -notcontains 'PATH_ARGUMENT_PROBE=OK') { throw "Cross-filesystem Name probe failed to report behavior.`n$result" }
          $line = $result | Where-Object { $_ -like 'MOVE_ERR=*' } | Select-Object -First 1
          if (-not $line) { throw "Cross-filesystem Name did not report MOVE_ERR.`n$result" }
          $errValue = [int]($line -replace '^MOVE_ERR=', '')
          if ($errValue -eq 0) { throw 'Name unexpectedly implemented a copy+delete cross-filesystem fallback.' }
          if (-not (Test-Path -LiteralPath $source)) { throw 'Failed cross-filesystem Name removed the source.' }
          if (Test-Path -LiteralPath $destination) { throw 'Failed cross-filesystem Name left a destination artifact.' }
          Write-Host "CROSS_FILESYSTEM_NAME=FAILED_SAFELY err=$errValue"
