name: Platform FullTest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, investigate-ast-compiler, test-openapi-import-class-skeletons]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-hosting:
    name: Web and REST hosting (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run REST, Kestrel, CGI and FastCGI smoke tests
        shell: pwsh
        run: |
          $projects = @(
            'tests/WebRestApiSmoke/WebRestApiSmoke.csproj',
            'tests/WebKestrelSmoke/WebKestrelSmoke.csproj',
            'tests/WebCgiSmoke/WebCgiSmoke.csproj',
            'tests/WebFastCgiSmoke/WebFastCgiSmoke.csproj'
          )
          foreach ($project in $projects) {
            dotnet run --project $project -c Release
            if ($LASTEXITCODE -ne 0) { throw "Web hosting smoke test failed: $project" }
          }

  openapi:
    name: OpenAPI generation and compilation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run focused regressions, CLI chain and complete OpenAPI suite
        shell: bash
        run: bash tests/OpenApiGeneratorSmoke/run-rest-host-ci.sh

  browser-wasm:
    name: Browser WASM and server-side Notes boundary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install browser-WASM workload
        shell: pwsh
        run: dotnet workload install wasm-tools
      - name: Run browser-WASM and Notes server-boundary smoke test
        shell: pwsh
        run: |
          dotnet run --project tests/WebBrowserWasmSmoke/WebBrowserWasmSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Browser-WASM or Notes server-boundary smoke test failed.' }

  android-ast:
    name: Android AST target (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        shell: bash
        run: dotnet workload install android
      - name: Build Android compiler probe
        shell: bash
        run: |
          dotnet run --project tests/AndroidCompilerProbe/AndroidCompilerProbe.csproj -c Release
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- ast-compile samples/android-debug-print.xps --output "$RUNNER_TEMP/ast-android-arm64" --runtime=false --platform android-arm64 --debug
