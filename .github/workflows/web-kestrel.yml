name: Web Kestrel Transport

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Compiler/UIExtensionPreprocessor.cs'
      - 'src/XPScript.Compiler/UIExtensionRuntimeSource.cs'
      - 'src/XPScript.Cli/**'
      - 'tests/WebKestrelSmoke/**'
      - 'tests/WebUIFormKestrelSmoke/**'
      - '.github/workflows/web-kestrel.yml'
      - 'XPScriptCompiler.slnx'
  push:
    branches: ['todo-web-runtime-kestrel', 'todo-web-runtime-observability', 'todo-ui-form-core-*']
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Compiler/UIExtensionPreprocessor.cs'
      - 'src/XPScript.Compiler/UIExtensionRuntimeSource.cs'
      - 'src/XPScript.Cli/**'
      - 'tests/WebKestrelSmoke/**'
      - 'tests/WebUIFormKestrelSmoke/**'
      - '.github/workflows/web-kestrel.yml'
      - 'XPScriptCompiler.slnx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx

      - name: Build solution
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore

      - name: Run Kestrel loopback integration
        run: dotnet run --project ./tests/WebKestrelSmoke/WebKestrelSmoke.csproj -c Release

      - name: Run UIForm Kestrel GET/POST JSON binding regression
        run: dotnet run --project ./tests/WebUIFormKestrelSmoke/WebUIFormKestrelSmoke.csproj -c Release
