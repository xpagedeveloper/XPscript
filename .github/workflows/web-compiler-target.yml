name: Web Compiler Target

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.UI.Browser/**'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/IncludeSourcePreprocessor.cs'
      - 'src/XPScript.Compiler/AdvancedXPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/CompilerDriver.cs'
      - 'tests/WebCompilerSmoke/**'
      - 'tests/WebBrowserWasmSmoke/**'
      - 'tests/WebRestApiSmoke/**'
      - '.github/workflows/web-compiler-target.yml'
      - 'XPScriptCompiler.slnx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx

      - name: Build solution
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore

      - name: Compile and invoke loadable web routes
        run: dotnet run --project ./tests/WebCompilerSmoke/WebCompilerSmoke.csproj -c Release

      - name: Run REST API route and binding smoke
        env:
          XPSCRIPT_WEB_CONSOLE_ERRORS: '1'
        run: dotnet run --project ./tests/WebRestApiSmoke/WebRestApiSmoke.csproj -c Release

  browser-wasm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MSBuildWarningsAsMessages: 'IL2026;CS8601;CS8618'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install isolated .NET SDK for Windows WASM
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $privateDotnet = Join-Path $env:RUNNER_TEMP 'xps-wasm-dotnet'
          Remove-Item $privateDotnet -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $privateDotnet -Force | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install-xps-wasm.ps1'
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installer
          & $installer -Version '10.0.400' -InstallDir $privateDotnet -NoPath
          if ($LASTEXITCODE -ne 0) { throw "Private .NET SDK install failed with exit code $LASTEXITCODE." }
          "DOTNET_ROOT=$privateDotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $privateDotnet | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify WASM SDK source
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --info
          $dotnetPath = (Get-Command dotnet).Source
          if (-not $dotnetPath.StartsWith($env:RUNNER_TEMP, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Windows WASM smoke is not using the isolated SDK: $dotnetPath"
          }

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Run browser-wasm smoke
        run: dotnet run --project ./tests/WebBrowserWasmSmoke/WebBrowserWasmSmoke.csproj -c Release
