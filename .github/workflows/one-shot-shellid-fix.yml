name: One-shot ShellId fix

on:
  push:
    branches:
      - investigate-ast-compiler

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: investigate-ast-compiler
          fetch-depth: 0
      - name: Patch ShellId startup failure contract
        shell: pwsh
        run: |
          $path = 'src/XPScript.Compiler/AstExperimentalCompiler.cs'
          $text = [System.IO.File]::ReadAllText($path)
          $pattern = 'catch \(System\.ComponentModel\.Win32Exception ex\)\s*\{\s*throw new XPScriptRuntimeException\(53, ex\.Message\);\s*\}'
          $replacement = "catch (System.ComponentModel.Win32Exception)`n        {`n            return 0L;`n        }"
          $patched = [regex]::Replace($text, $pattern, $replacement, 1)
          if ($patched -eq $text) { throw 'Expected ShellId startup-failure block not found.' }
          [System.IO.File]::WriteAllText($path, $patched, [System.Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          git rm -- '.github/workflows/one-shot-shellid-fix.yml'
          git commit -m 'Return zero when AST ShellId startup fails'
          git push origin HEAD:investigate-ast-compiler
