name: Apply generated license integration patch

on:
  push:
    branches:
      - feature/generated-third-party-license

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[generated-license-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generated-third-party-license
      - name: Integrate generated license publication
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/XPScript.Compiler/CompilerOutputPublisher.cs')
          s = p.read_text()
          old = '''    public static void Publish(
              string generatedExecutable,
              string outputPath,
              string sourcePath,
              IReadOnlyList<NativeDependencyPackager.Dependency> nativeDependencies,
              IReadOnlyList<ManagedAssemblyReferencePreprocessor.NativeReference> managedNativeDependencies,
              bool makeExecutable)
          {
          '''
          new = '''    public static void Publish(
              string generatedExecutable,
              string outputPath,
              string sourcePath,
              IReadOnlyList<NativeDependencyPackager.Dependency> nativeDependencies,
              IReadOnlyList<ManagedAssemblyReferencePreprocessor.NativeReference> managedNativeDependencies,
              bool makeExecutable) =>
              PublishCore(generatedExecutable, outputPath, sourcePath, nativeDependencies, managedNativeDependencies, null, makeExecutable);

          public static void PublishWithLicenseNotice(
              string generatedExecutable,
              string outputPath,
              string sourcePath,
              IReadOnlyList<NativeDependencyPackager.Dependency> nativeDependencies,
              IReadOnlyList<ManagedAssemblyReferencePreprocessor.NativeReference> managedNativeDependencies,
              string licenseNoticePath,
              bool makeExecutable) =>
              PublishCore(generatedExecutable, outputPath, sourcePath, nativeDependencies, managedNativeDependencies, licenseNoticePath, makeExecutable);

          private static void PublishCore(
              string generatedExecutable,
              string outputPath,
              string sourcePath,
              IReadOnlyList<NativeDependencyPackager.Dependency> nativeDependencies,
              IReadOnlyList<ManagedAssemblyReferencePreprocessor.NativeReference> managedNativeDependencies,
              string? licenseNoticePath,
              bool makeExecutable)
          {
          '''
          if old not in s: raise SystemExit('Publish signature block not found')
          s = s.replace(old, new, 1)
          old = '''        PublishStaged(generatedExecutable, outputFullPath, dependencies, makeExecutable);
              }

              public static void PublishDirectory(
          '''
          new = '''        if (!string.IsNullOrWhiteSpace(licenseNoticePath))
                  dependencies.Add(new Dependency(licenseNoticePath, ThirdPartyLicenseNoticeGenerator.OutputFileName));

              PublishStaged(generatedExecutable, outputFullPath, dependencies, makeExecutable);
              }

              public static void PublishDirectory(
          '''
          if old not in s: raise SystemExit('PublishStaged call not found')
          s = s.replace(old, new, 1)
          old = '''    public static void PublishDirectory(
              string publishDirectory,
              string generatedExecutable,
              string outputPath,
              string sourcePath,
              IReadOnlyList<NativeDependencyPackager.Dependency> nativeDependencies,
              IReadOnlyList<ManagedAssemblyReferencePreprocessor.NativeReference> managedNativeDependencies,
              bool makeExecutable)
          {
          '''
          new = '''    public static void PublishDirectory(
              string publishDirectory,
              string generatedExecutable,
              string outputPath,
              string sourcePath,
              IReadOnlyList<NativeDependencyPackager.Dependency> nativeDependencies,
              IReadOnlyList<ManagedAssemblyReferencePreprocessor.NativeReference> managedNativeDependencies,
              bool makeExecutable) =>
              PublishDirectoryCore(publishDirectory, generatedExecutable, outputPath, sourcePath, nativeDependencies, managedNativeDependencies, null, makeExecutable);

          public static void PublishDirectoryWithLicenseNotice(
              string publishDirectory,
              string generatedExecutable,
              string outputPath,
              string sourcePath,
              IReadOnlyList<NativeDependencyPackager.Dependency> nativeDependencies,
              IReadOnlyList<ManagedAssemblyReferencePreprocessor.NativeReference> managedNativeDependencies,
              string licenseNoticePath,
              bool makeExecutable) =>
              PublishDirectoryCore(publishDirectory, generatedExecutable, outputPath, sourcePath, nativeDependencies, managedNativeDependencies, licenseNoticePath, makeExecutable);

          private static void PublishDirectoryCore(
              string publishDirectory,
              string generatedExecutable,
              string outputPath,
              string sourcePath,
              IReadOnlyList<NativeDependencyPackager.Dependency> nativeDependencies,
              IReadOnlyList<ManagedAssemblyReferencePreprocessor.NativeReference> managedNativeDependencies,
              string? licenseNoticePath,
              bool makeExecutable)
          {
          '''
          if old not in s: raise SystemExit('PublishDirectory signature block not found')
          s = s.replace(old, new, 1)
          old = '''            // The executable is committed last so an interrupted publication never exposes a new
                      // apphost before its managed/runtime closure has been installed.
                      operations.Add(executableOperation.Value);
          '''
          new = '''            if (!string.IsNullOrWhiteSpace(licenseNoticePath))
                      {
                          StageAdditionalDependency(
                              licenseNoticePath,
                              ThirdPartyLicenseNoticeGenerator.OutputFileName,
                              outputDirectory,
                              stageDirectory,
                              seenNames,
                              operations);
                      }

                      // The executable is committed last so an interrupted publication never exposes a new
                      // apphost before its managed/runtime closure has been installed.
                      operations.Add(executableOperation.Value);
          '''
          if old not in s: raise SystemExit('PublishDirectory commit block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/XPScript.Compiler/CompilerDriver.cs')
          s = p.read_text()
          old = '''            var generatedExecutable = FindPublishedExecutable(publishDir, rid, OutputAssemblyName(outputPath));
                      if (generatedExecutable is null)
                          throw new CompilerException("Compilation succeeded, but no executable was produced for runtime " + rid + ".");

                      if (CompilePublishLayoutContext.IsConfigured && !CompilePublishLayoutContext.SingleFile)
                      {
                          CompilerOutputPublisher.PublishDirectory(
          '''
          new = '''            var generatedExecutable = FindPublishedExecutable(publishDir, rid, OutputAssemblyName(outputPath));
                      if (generatedExecutable is null)
                          throw new CompilerException("Compilation succeeded, but no executable was produced for runtime " + rid + ".");

                      var licenseNoticePath = Path.Combine(tempRoot, ThirdPartyLicenseNoticeGenerator.OutputFileName);
                      await File.WriteAllTextAsync(licenseNoticePath, ThirdPartyLicenseNoticeGenerator.Generate(tempRoot, selfContained));
                      CompilerPathSecurity.HardenTemporaryFile(licenseNoticePath);

                      if (CompilePublishLayoutContext.IsConfigured && !CompilePublishLayoutContext.SingleFile)
                      {
                          CompilerOutputPublisher.PublishDirectoryWithLicenseNotice(
          '''
          if old not in s: raise SystemExit('CompilerDriver publish block start not found')
          s = s.replace(old, new, 1)
          old = '''                    managedReferences.Native,
                              makeExecutable: !rid.StartsWith("win-", StringComparison.OrdinalIgnoreCase) && !OperatingSystem.IsWindows());
                      }
                      else
                      {
                          CompilerOutputPublisher.Publish(
          '''
          new = '''                    managedReferences.Native,
                              licenseNoticePath,
                              makeExecutable: !rid.StartsWith("win-", StringComparison.OrdinalIgnoreCase) && !OperatingSystem.IsWindows());
                      }
                      else
                      {
                          CompilerOutputPublisher.PublishWithLicenseNotice(
          '''
          if old not in s: raise SystemExit('CompilerDriver directory call tail not found')
          s = s.replace(old, new, 1)
          old = '''                    managedReferences.Native,
                              makeExecutable: !rid.StartsWith("win-", StringComparison.OrdinalIgnoreCase) && !OperatingSystem.IsWindows());
                      }
          '''
          new = '''                    managedReferences.Native,
                              licenseNoticePath,
                              makeExecutable: !rid.StartsWith("win-", StringComparison.OrdinalIgnoreCase) && !OperatingSystem.IsWindows());
                      }
          '''
          if old not in s: raise SystemExit('CompilerDriver single file call tail not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('docs/publishing.md')
          s = p.read_text()
          addition = '''

## Generated third-party license file

Every compiled application is published with `Third-party-license.txt` beside the executable. The compiler generates this file from the exact NuGet dependency graph restored for that application, including transitive packages. It reads package license metadata and package-local NOTICE/third-party notice files where available.

The file starts with the XPScript Apache License 2.0 redistribution requirements, the complete Apache 2.0 license text and the XPScript NOTICE content. When `--runtime=true` is used, the file also includes the .NET runtime license and the third-party notices from the .NET SDK/runtime installation used to publish the application.

`Third-party-license.txt` must be distributed with the compiled application. This applies to both single-file and multi-file publishing; single-file publishing bundles executable code, not the legal notice sidecar.
'''
          if '## Generated third-party license file' not in s:
              s += addition
          p.write_text(s)

          p = Path('THIRD-PARTY-NOTICES.md')
          s = p.read_text()
          marker = '## .NET runtime and SDK\n'
          note = '''## Generated application license notices

The XPScript compiler creates `Third-party-license.txt` beside every compiled application. The generated file is based on the package graph restored for that application and includes the applicable package license/NOTICE material available in the restored NuGet packages. It also carries XPScript's Apache License 2.0 redistribution material. For self-contained applications (`--runtime=true`), the compiler additionally includes the .NET license and third-party notices from the .NET installation used for publishing.

Distributors of compiled XPScript applications must keep `Third-party-license.txt` with the application and must not remove any additional license or notice files that a dependency requires to remain separate.

'''
          if marker not in s: raise SystemExit('THIRD-PARTY .NET marker not found')
          if '## Generated application license notices' not in s:
              s = s.replace(marker, note + marker, 1)
          p.write_text(s)
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-generated-license-patch.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate generated third-party license output [generated-license-integrated]"
          git push origin HEAD:feature/generated-third-party-license
