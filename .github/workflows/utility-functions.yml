name: Utility Functions

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/CrossPlatformPreprocessor.cs'
      - 'src/XPScript.Compiler/CrossPlatformRuntimeSource.cs'
      - 'samples/file-exists-string-template.xps'
      - 'docs/utility-functions.md'
      - '.github/workflows/utility-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  utility-functions:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler and resolve target
        id: target
        shell: pwsh
        run: |
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } elseif ($env:RUNNER_ARCH -eq 'X64') { 'x64' } else { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          if ($env:RUNNER_OS -eq 'Windows') { $rid = "win-$arch"; $ext = '.exe' }
          elseif ($env:RUNNER_OS -eq 'Linux') { $rid = "linux-$arch"; $ext = '' }
          elseif ($env:RUNNER_OS -eq 'macOS') { $rid = "osx-$arch"; $ext = '' }
          else { throw "Unsupported runner OS: $env:RUNNER_OS" }
          "rid=$rid" >> $env:GITHUB_OUTPUT
          "ext=$ext" >> $env:GITHUB_OUTPUT

      - name: Prepare filesystem fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./utility-fixture/subdir | Out-Null
          Set-Content -LiteralPath ./utility-fixture/existing.txt -Value 'exists' -NoNewline

      - name: Verify FileExists DirExists and StrTemplate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = "./out/utility-functions${{ steps.target.outputs.ext }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-exists-string-template.xps --runtime '${{ steps.target.outputs.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Utility function sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Utility function sample failed.`n$output" }
          $output | ForEach-Object { Write-Host $_ }

          if ($output -notcontains 'Hello fredrik, you are 52 years old. Escaped: {0} and }.') {
            throw "StrTemplate output was incorrect.`n$output"
          }
          if ($output -notcontains 'FILE_EXISTS=YES') { throw "FileExists did not detect the existing file.`n$output" }
          if ($output -notcontains 'MISSING_FILE=NO') { throw "FileExists did not reject the missing file.`n$output" }
          if ($output -notcontains 'DIR_EXISTS=YES') { throw "DirExists did not detect the existing directory.`n$output" }
          if ($output -notcontains 'MISSING_DIR=NO') { throw "DirExists did not reject the missing directory.`n$output" }
