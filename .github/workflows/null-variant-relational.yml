name: Null Variant Relational

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/TypeCoercionPreprocessor.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'src/XPScript.Compiler/CoreCompatibilityRuntimeSource.cs'
      - 'samples/null-variant-relational.xps'
      - '.github/workflows/null-variant-relational.yml'
      - 'todo/null-empty-nothing-semantics.md'
  push:
    branches:
      - 'todo-null-relational-*'
    paths:
      - 'src/XPScript.Compiler/TypeCoercionPreprocessor.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'src/XPScript.Compiler/CoreCompatibilityRuntimeSource.cs'
      - 'samples/null-variant-relational.xps'
      - '.github/workflows/null-variant-relational.yml'
      - 'todo/null-empty-nothing-semantics.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore compiler
        shell: pwsh
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        shell: pwsh
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Compile and verify NULL relational semantics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/null-relational | Out-Null
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/null-relational/null-relational$extension"

          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/null-variant-relational.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'NULL relational fixture compilation failed.' }

          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "NULL relational fixture exited with code $LASTEXITCODE." }
          $output | ForEach-Object { Write-Host $_ }

          foreach ($value in @(
            'NULL_EQ=True',
            'NULL_NE=True',
            'NULL_LT=True',
            'NULL_LE=True',
            'NULL_GT=True',
            'NULL_GE=True',
            'EMPTY_EQ_ZERO=True',
            'EMPTY_LT_ONE=True'
          )) {
            if ($output -notcontains $value) { throw "NULL relational output missing: $value" }
          }
