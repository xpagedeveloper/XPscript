name: Cross Platform Runtime Verification

on:
  push:
    branches: [todo-cross-platform-runtime-verification]
    paths:
      - '.github/workflows/cross-platform-runtime-verification.yml'
      - 'src/XPScript.Compiler/**'
      - 'samples/platform-shell.xps'
      - 'samples/file-lock-holder.xps'
      - 'samples/file-lock-contender.xps'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-verification:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }

      - name: Resolve runner RID
        id: rid
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } elseif ($env:RUNNER_ARCH -eq 'X64') { 'x64' } else { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          if ($env:RUNNER_OS -eq 'Windows') { $rid = "win-$arch"; $platform = 'Windows'; $extension = '.exe' }
          elseif ($env:RUNNER_OS -eq 'Linux') { $rid = "linux-$arch"; $platform = 'Linux'; $extension = '' }
          elseif ($env:RUNNER_OS -eq 'macOS') { $rid = "osx-$arch"; $platform = 'MacOS'; $extension = '' }
          else { throw "Unsupported runner OS: $env:RUNNER_OS" }
          "rid=$rid" >> $env:GITHUB_OUTPUT
          "platform=$platform" >> $env:GITHUB_OUTPUT
          "extension=$extension" >> $env:GITHUB_OUTPUT

      - name: Verify Platform and Shell runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = "./out/platform-shell${{ steps.rid.outputs.extension }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/platform-shell.xps --runtime '${{ steps.rid.outputs.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'platform-shell.xps compilation failed.' }
          if ($env:RUNNER_OS -ne 'Windows') { chmod +x $exe }
          $result = & $exe
          if ($LASTEXITCODE -ne 0) { throw "platform-shell.xps exited with $LASTEXITCODE.`n$result" }
          if ($result -notcontains 'PLATFORM=${{ steps.rid.outputs.platform }}') { throw "Unexpected Platform() result.`n$result" }

      - name: Compile cross-process lock fixtures
        shell: pwsh
        run: |
          $holder = "./out/file-lock-holder${{ steps.rid.outputs.extension }}"
          $contender = "./out/file-lock-contender${{ steps.rid.outputs.extension }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-lock-holder.xps --runtime '${{ steps.rid.outputs.rid }}' -o $holder --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'file-lock-holder.xps compilation failed.' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-lock-contender.xps --runtime '${{ steps.rid.outputs.rid }}' -o $contender --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'file-lock-contender.xps compilation failed.' }
          if ($env:RUNNER_OS -ne 'Windows') { chmod +x $holder $contender }

      - name: Verify cross-process Lock and Unlock
        shell: pwsh
        run: |
          $holder = "./out/file-lock-holder${{ steps.rid.outputs.extension }}"
          $contender = "./out/file-lock-contender${{ steps.rid.outputs.extension }}"
          Remove-Item -Force -ErrorAction SilentlyContinue ./holder.out, ./holder.err, ./xps-lock-test.bin, ./xps-lock-ready.flag
          $process = Start-Process -FilePath $holder -RedirectStandardOutput ./holder.out -RedirectStandardError ./holder.err -PassThru

          $ready = $false
          for ($i = 0; $i -lt 150; $i++) {
            if (Test-Path ./xps-lock-ready.flag) {
              $ready = $true
              break
            }
            if ($process.HasExited) {
              $holderResult = Get-Content ./holder.out -ErrorAction SilentlyContinue
              $holderError = Get-Content ./holder.err -ErrorAction SilentlyContinue
              throw "Holder exited before publishing the ready marker.`n$holderResult`n$holderError"
            }
            Start-Sleep -Milliseconds 100
          }
          if (-not $ready) {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw 'Timed out waiting for holder lock ready marker.'
          }

          $contenderResult = & $contender
          $contenderExit = $LASTEXITCODE
          $process.WaitForExit()
          $holderResult = Get-Content ./holder.out -ErrorAction SilentlyContinue
          $holderError = Get-Content ./holder.err -ErrorAction SilentlyContinue
          if ($contenderExit -ne 0) { throw "Lock contender exited with $contenderExit.`n$contenderResult" }
          if ($holderResult -notcontains 'LOCKED' -or $holderResult -notcontains 'UNLOCKED') { throw "Holder did not complete expected lock cycle.`n$holderResult`n$holderError" }
          if (-not ($contenderResult | Where-Object { $_ -like 'LOCK_FAILED Err=70*' })) { throw "Second process unexpectedly acquired the locked range or returned the wrong diagnostic.`n$contenderResult" }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue ./xps-lock-test.bin, ./xps-lock-ready.flag, ./holder.out, ./holder.err
