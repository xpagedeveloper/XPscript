name: Include Dependency Discovery

on:
  push:
    branches:
      - todo-include-dependency-discovery
    paths:
      - 'src/XPScript.Compiler/**'
      - 'samples/include-dependencies/**'
      - 'todo/include-source-files-todo.md'
      - '.github/workflows/include-dependency-discovery.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/**'
      - 'samples/include-dependencies/**'
      - 'todo/include-source-files-todo.md'
      - '.github/workflows/include-dependency-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  include-dependencies:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }

      - name: Create dependency fixtures
        shell: pwsh
        run: |
          $deps = './samples/include-dependencies/deps'
          New-Item -ItemType Directory -Force $deps | Out-Null
          New-Item -ItemType Directory -Force "$deps/native" | Out-Null
          New-Item -ItemType Directory -Force './out/include-dependencies' | Out-Null

          $helper = Join-Path $env:RUNNER_TEMP 'xps-include-helper'
          New-Item -ItemType Directory -Force $helper | Out-Null
          Set-Content -LiteralPath (Join-Path $helper 'Helper.csproj') -Encoding utf8 -Value @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
          </Project>
          '@
          Set-Content -LiteralPath (Join-Path $helper 'Helper.cs') -Encoding utf8 -Value 'public static class Helper { public static string Value => "OK"; }'
          dotnet build (Join-Path $helper 'Helper.csproj') -c Release -o $deps
          if ($LASTEXITCODE -ne 0) { throw 'Helper assembly build failed.' }

          foreach ($name in @(
            'win-x64-helper.dll', 'win-arm64-helper.dll',
            'linux-x64-helper.so', 'linux-arm64-helper.so',
            'osx-x64-helper.dylib', 'osx-arm64-helper.dylib')) {
            Set-Content -LiteralPath (Join-Path $deps $name) -Encoding utf8 -Value 'native-fixture'
          }
          Set-Content -LiteralPath (Join-Path $deps 'native/windows.dll') -Encoding utf8 -Value 'native-fixture'
          Set-Content -LiteralPath (Join-Path $deps 'native/linux.so') -Encoding utf8 -Value 'native-fixture'
          Set-Content -LiteralPath (Join-Path $deps 'native/macos.dylib') -Encoding utf8 -Value 'native-fixture'

      - name: Compile dependencies declared by include
        shell: pwsh
        run: |
          $extension = if ($env:RUNNER_OS -eq 'Windows') { '.exe' } else { '' }
          $exe = "./out/include-dependencies/app$extension"
          $compile = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/include-dependencies/root.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw "Include dependency compile failed.`n$compile" }
          if ($env:RUNNER_OS -ne 'Windows') { chmod +x $exe }

          $output = & $exe
          if ($LASTEXITCODE -ne 0) { throw "Included dependency executable failed.`n$output" }
          if ($output -notcontains 'INCLUDE-DEPS=OK') { throw "Included dependency runtime marker missing.`n$output" }

          $arch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          $rid = switch ($env:RUNNER_OS) {
            'Windows' { "win-$arch" }
            'Linux' { "linux-$arch" }
            'macOS' { "osx-$arch" }
            default { throw "Unsupported runner OS $env:RUNNER_OS" }
          }
          $referenceNative = switch ($rid) {
            'win-x64' { 'win-x64-helper.dll' }
            'win-arm64' { 'win-arm64-helper.dll' }
            'linux-x64' { 'linux-x64-helper.so' }
            'linux-arm64' { 'linux-arm64-helper.so' }
            'osx-x64' { 'osx-x64-helper.dylib' }
            'osx-arm64' { 'osx-arm64-helper.dylib' }
            default { throw "Unsupported RID $rid" }
          }
          $declareNative = switch ($env:RUNNER_OS) {
            'Windows' { 'windows.dll' }
            'Linux' { 'linux.so' }
            'macOS' { 'macos.dylib' }
          }

          $outputDir = Split-Path -Parent $exe
          if (-not (Test-Path -LiteralPath (Join-Path $outputDir $referenceNative))) {
            throw "ReferenceNative from include was not published: $referenceNative"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $outputDir $declareNative))) {
            throw "Declare native dependency from include was not published: $declareNative"
          }

      - name: Verify direct run discovers managed include reference
        shell: pwsh
        run: |
          $output = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- run ./samples/include-dependencies/root.xps
          if ($LASTEXITCODE -ne 0) { throw "Direct run with included dependencies failed.`n$output" }
          if ($output -notcontains 'INCLUDE-DEPS=OK') { throw "Direct-run include dependency marker missing.`n$output" }
