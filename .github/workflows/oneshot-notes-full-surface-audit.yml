name: One-shot Notes full surface audit

on:
  push:
    branches:
      - feat/richtext-structural-surface
    paths:
      - .github/workflows/oneshot-notes-full-surface-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Audit NotesSession NotesDocument NotesDatabase fulltest coverage
        run: dotnet run --project ./tests/NotesFullRuntimeSurfaceAudit/NotesFullRuntimeSurfaceAudit.csproj -c Release
      # Temporary workflow; remove after the member audit is clean.
