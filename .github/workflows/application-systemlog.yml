name: Application System Log

on:
  push:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/ApplicationSystemLogRuntimeSource.cs'
      - 'src/XPScript.Compiler/ApplicationRuntimeSource.cs'
      - 'src/XPScript.Compiler/ApplicationObjectPreprocessor.cs'
      - 'samples/application-systemlog.xps'
      - '.github/workflows/application-systemlog.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/ApplicationSystemLogRuntimeSource.cs'
      - 'src/XPScript.Compiler/ApplicationRuntimeSource.cs'
      - 'src/XPScript.Compiler/ApplicationObjectPreprocessor.cs'
      - 'samples/application-systemlog.xps'
      - '.github/workflows/application-systemlog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile Application.SystemLog sample
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/application-systemlog | Out-Null
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/application-systemlog.xps -o ./out/application-systemlog/systemlog --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Application.SystemLog sample compilation failed.' }
          Write-Host 'APPLICATION-SYSTEMLOG-COMPILE=OK'
