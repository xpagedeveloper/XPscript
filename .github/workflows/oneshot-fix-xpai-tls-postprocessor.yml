name: Fix XPAi TLS postprocessor
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/per-client-tls-validation
          fetch-depth: 0
      - name: Patch XPAi tool-loop markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/XPScript.Compiler/AiSessionRuntimePostProcessor.cs')
          s=p.read_text()
          old='''        var requestJson = BuildRequest(messagesValue, stream, modelValue);
        var requestText = requestJson.ToJsonString();
        if (System.Text.Encoding.UTF8.GetByteCount(requestText) > MaxRequestBytes)
            throw new XPScriptRuntimeException(5, "XPAi request body exceeds the 8 MiB limit.");

        var cancellation = BeginRequest();
'''
          new='''        var requestJson = BuildRequest(messagesValue, stream, modelValue);
        var requestText = requestJson.ToJsonString();
        if (System.Text.Encoding.UTF8.GetByteCount(requestText) > MaxRequestBytes)
            throw new XPScriptRuntimeException(5, "XPAi request body exceeds the 8 MiB limit.");

        _tls.Reset();
        var cancellation = BeginRequest();
'''
          if old not in s and new not in s:
              raise SystemExit('XPAi original tool-loop marker not found')
          if old in s:
              s=s.replace(old,new,1)
          old2='''        var requestJson = BuildRequest(messagesValue, stream, modelValue);
        var cancellation = BeginRequest();
        try
'''
          new2='''        var requestJson = BuildRequest(messagesValue, stream, modelValue);
        _tls.Reset();
        var cancellation = BeginRequest();
        try
'''
          if old2 not in s and new2 not in s:
              raise SystemExit('XPAi replacement tool-loop marker not found')
          if old2 in s:
              s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/XPScript.Compiler/AiSessionRuntimePostProcessor.cs
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve TLS state in XPAi tool-loop postprocessor'
          git push origin HEAD:feature/per-client-tls-validation
