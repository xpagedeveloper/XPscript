name: Session Compatibility Patch
on:
  push:
    branches: [session-defaults-role-restoration]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[session-compat-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: session-defaults-role-restoration
      - shell: python
        run: |
          from pathlib import Path
          p=Path('src/XPScript.Cli/XpsHostConfig.cs')
          s=p.read_text(encoding='utf-8')
          old='        public bool? Metrics { get; init; }\n        public string? SessionCookie { get; init; }\n'
          new='        public bool? Metrics { get; init; }\n        // Legacy compatibility only. Sessions are always enabled for Kestrel/FastCGI.\n        public bool? Sessions { get; init; }\n        public string? SessionCookie { get; init; }\n'
          if old not in s: raise SystemExit('target missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/XPScript.Cli/XpsHostConfig.cs
          git commit -m "Keep legacy sessions config field accepted [session-compat-patched]"
          git push origin HEAD:session-defaults-role-restoration
