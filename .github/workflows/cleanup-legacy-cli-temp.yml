name: Cleanup legacy CLI syntax

on:
  push:
    branches: [cleanup-legacy-cli-options]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup-legacy-cli-options
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply cleanup
        run: python3 ./scripts/cleanup-legacy-cli-temp.py
      - name: Rebuild documentation preview
        working-directory: docs-site
        run: |
          npm install --no-audit --no-fund
          npm run build
          cd ..
          rm -rf docs-preview
          mkdir -p docs-preview
          cp -R docs-site/dist/. docs-preview/
          touch docs-preview/.nojekyll
      - name: Verify cleanup and build
        shell: pwsh
        run: |
          ./scripts/validate-no-legacy-cli-options.ps1
          ./scripts/validate-docs-demos.ps1
          dotnet build ./XPScriptCompiler.slnx -c Release --nologo
      - name: Commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/cleanup-legacy-cli-temp.yml
          rm -f scripts/cleanup-legacy-cli-temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git commit -m "Remove legacy compile option syntax"
          git push origin HEAD:cleanup-legacy-cli-options
