name: Temporary Constructor Parity

on:
  push:
    branches: [investigate-ast-compiler]

permissions:
  contents: read

jobs:
  constructor-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Run constructor parity harness
        shell: pwsh
        run: ./tests/ast-compile-probe/run-ast-constructor.ps1
