name: Patch If Layouts

on:
  push:
    branches: [todo-if-layouts]
    paths:
      - 'tools/patch-if-layouts.py'
      - '.github/workflows/patch-if-layouts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-if-layouts
      - name: Apply If layout patch
        run: python ./tools/patch-if-layouts.py
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'xpagedeveloper'
          git config user.email 'fredrik@xpagedeveloper.com'
          git add src/XPScript.Compiler/IfLayoutPreprocessor.cs src/XPScript.Compiler/XPScriptTranspiler.cs src/XPScript.Compiler/AdvancedXPScriptTranspiler.cs
          git commit -m 'Support flexible If statement layouts'
          git push origin HEAD:todo-if-layouts
