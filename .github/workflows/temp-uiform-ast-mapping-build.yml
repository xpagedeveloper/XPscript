name: TEMP UIForm AST mapping build

on:
  push:
    branches: [investigate-ast-compiler]
    paths:
      - '.github/workflows/temp-uiform-ast-mapping-build.yml'
      - 'src/XPScript.Compiler/AstUiFormSupport.cs'
      - 'src/XPScript.Compiler/Emission/BoundExpressionEmitter.cs'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
