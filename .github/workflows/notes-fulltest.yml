name: Notes FullTest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notes-fulltest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notes-surface:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile consolidated Notes surface
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./out/notes | Out-Null
          $compilerDll = (Resolve-Path './src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll').Path
          $samples = @('notes-full-domino-runtime-test', 'notes-mail-surface', 'notes-mail-no-mime-surface')
          foreach ($sample in $samples) {
            dotnet $compilerDll "./samples/$sample.xps" -o "./out/notes/$sample" --runtime=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify NotesDocument.Send diagnostics
        shell: pwsh
        run: |
          $output = & dotnet ./src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll ./samples/notes-document-send-surface.xps -o ./out/notes/notes-send --runtime=false 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -notmatch 'warning: NotesDocument\.Send attachForm=True is not supported') { throw 'Expected NotesDocument.Send attachForm compiler warning was not emitted.' }
      - name: Compile NotesDatabase QueryAccess surface
        shell: pwsh
        run: |
          dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-database-query-access-runtime-test.xps ./out/notes/notes-query-access
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit Notes surface coverage
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          dotnet run --project ./tests/NotesFullRuntimeSurfaceAudit/NotesFullRuntimeSurfaceAudit.csproj -c Release -- NotesSession NotesDocument NotesDatabase NotesDatabaseAccess
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'NOTES_FULLTEST: passed'
