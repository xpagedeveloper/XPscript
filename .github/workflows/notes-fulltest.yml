name: Notes FullTest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notes-fulltest.yml'
      - '.github/scripts/run-fulltests.ps1'
      - 'src/XPScript.Compiler/**'
      - 'samples/notes-*.xps'
      - 'tests/Notes*/**'
      - 'tests/ast-compile-probe/notes-*.xps'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/notes-fulltest.yml'
      - '.github/scripts/run-fulltests.ps1'
      - 'src/XPScript.Compiler/**'
      - 'samples/notes-*.xps'
      - 'tests/Notes*/**'
      - 'tests/ast-compile-probe/notes-*.xps'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build AST compiler
        run: dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Run Notes FullTest
        shell: pwsh
        run: ./.github/scripts/run-fulltests.ps1 -Suite notes
