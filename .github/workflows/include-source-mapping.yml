name: Include Source Mapping

on:
  workflow_dispatch:
  push:
    branches:
      - todo-include-source-mapping
      - todo-include-diagnostic-source-lines
      - todo-include-erl-source-lines
      - compiler-source-line-mapping
    paths:
      - 'src/XPScript.Compiler/Include*.cs'
      - 'src/XPScript.Compiler/ExpandedSourceContext.cs'
      - 'src/XPScript.Compiler/SourcePreprocessor*.cs'
      - 'src/XPScript.Compiler/SourceLineMarkerPreprocessor.cs'
      - 'src/XPScript.Compiler/SourceLineRuntimeSource.cs'
      - 'src/XPScript.Compiler/CompilerSourceLineDirectivePostProcessor.cs'
      - 'src/XPScript.Compiler/BrowserWasmHttpCsrfPostProcessor.cs'
      - 'src/XPScript.Compiler/CompilerDriver.cs'
      - 'samples/include-source-map/**'
      - 'samples/include-erl/**'
      - '.github/workflows/include-source-mapping.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/XPScript.Compiler/Include*.cs'
      - 'src/XPScript.Compiler/ExpandedSourceContext.cs'
      - 'src/XPScript.Compiler/SourcePreprocessor*.cs'
      - 'src/XPScript.Compiler/SourceLineMarkerPreprocessor.cs'
      - 'src/XPScript.Compiler/SourceLineRuntimeSource.cs'
      - 'src/XPScript.Compiler/CompilerSourceLineDirectivePostProcessor.cs'
      - 'src/XPScript.Compiler/BrowserWasmHttpCsrfPostProcessor.cs'
      - 'src/XPScript.Compiler/CompilerDriver.cs'
      - 'samples/include-source-map/**'
      - 'samples/include-erl/**'
      - '.github/workflows/include-source-mapping.yml'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj --no-restore --nologo

      - name: Verify include-local diagnostic mapping
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $expectedCode = '    value = "*****"'
          $expectedMarker = $expectedCode + [Environment]::NewLine + (' ' * 12) + '^'
          $expectedMarkerNormalized = $expectedCode + "`n" + (' ' * 12) + '^'

          function Invoke-ExpectedCompileFailure([string] $format, [bool] $directRun) {
            $stdoutPath = [System.IO.Path]::GetTempFileName()
            $stderrPath = [System.IO.Path]::GetTempFileName()
            try {
              if ($directRun) {
                & dotnet run --no-build --project src/XPScript.Compiler/XPScript.Compiler.csproj -- run samples/include-source-map/root.xps --result-format $format 1> $stdoutPath 2> $stderrPath
              } else {
                & dotnet run --no-build --project src/XPScript.Compiler/XPScript.Compiler.csproj -- samples/include-source-map/root.xps --framework-dependent --result-format $format 1> $stdoutPath 2> $stderrPath
              }
              $exitCode = $LASTEXITCODE
              $stdout = Get-Content -Raw $stdoutPath
              $stderr = Get-Content -Raw $stderrPath
              Write-Host "--- $format run=$directRun exit=$exitCode ---"
              if (-not [string]::IsNullOrWhiteSpace($stderr)) {
                Write-Host "stderr:"
                Write-Host $stderr
              }
              Write-Host "stdout:"
              Write-Host $stdout
              if ($exitCode -ne 2) {
                throw "Expected compiler exit code 2 for $format (run=$directRun), got $exitCode.`nstdout:`n$stdout`nstderr:`n$stderr"
              }
              return $stdout
            } finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $stdoutPath, $stderrPath
            }
          }

          $text = Invoke-ExpectedCompileFailure 'text' $false
          if ($text -notmatch 'compile-error\.xps') { throw "Text diagnostic did not include include filename.`n$text" }
          if ($text -notmatch '(?m)^\s*line:\s*5\s*$') { throw "Text diagnostic did not report include-local line 5.`n$text" }
          if ($text -match '(?m)^\s*line:\s*15\s*$') { throw "Text diagnostic leaked flattened line 15.`n$text" }
          if ($text -notmatch 'description:\s*compile-error\.xps:') { throw "Text diagnostic description did not preserve include filename.`n$text" }
          if ($text -notmatch 'code:\s+value = "\*{5}"') { throw "Text diagnostic did not use the included source line.`n$text" }

          $jsonText = Invoke-ExpectedCompileFailure 'json' $false
          $json = $jsonText | ConvertFrom-Json
          if ($json.result -ne 'error') { throw "JSON result was not error.`n$jsonText" }
          if ($json.errors[0].line -ne 5) { throw "JSON diagnostic line was $($json.errors[0].line), expected 5.`n$jsonText" }
          if ($json.errors[0].description -notmatch '^compile-error\.xps:') { throw "JSON diagnostic did not preserve include filename.`n$jsonText" }
          if ($json.errors[0].code -ne $expectedCode) { throw "JSON diagnostic code came from the wrong source line. Got '$($json.errors[0].code)'.`n$jsonText" }
          if ($json.errors[0].markedCode -ne $expectedMarker) { throw "JSON diagnostic marker did not point into the included source line.`n$jsonText" }

          $xmlText = Invoke-ExpectedCompileFailure 'xml' $false
          [xml]$xml = $xmlText
          $xmlError = $xml.compileResult.errors.error | Select-Object -First 1
          if ([int]$xmlError.line -ne 5) { throw "XML diagnostic line was $($xmlError.line), expected 5.`n$xmlText" }
          if ([string]$xmlError.description -notmatch '^compile-error\.xps:') { throw "XML diagnostic did not preserve include filename.`n$xmlText" }
          if ([string]$xmlError.code -ne $expectedCode) { throw "XML diagnostic code came from the wrong source line.`n$xmlText" }
          $xmlMarkerNormalized = ([string]$xmlError.markedCode).Replace("`r`n", "`n").Replace("`r", "`n")
          if ($xmlMarkerNormalized -ne $expectedMarkerNormalized) { throw "XML diagnostic marker did not point into the included source line.`n$xmlText" }

          $runText = Invoke-ExpectedCompileFailure 'text' $true
          if ($runText -notmatch 'compile-error\.xps') { throw "Direct-run diagnostic did not include include filename.`n$runText" }
          if ($runText -notmatch '(?m)^\s*line:\s*5\s*$') { throw "Direct-run diagnostic did not report include-local line 5.`n$runText" }
          if ($runText -notmatch 'code:\s+value = "\*{5}"') { throw "Direct-run diagnostic did not use the included source line.`n$runText" }

          exit 0

      - name: Verify include-local Erl runtime mapping
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputPath = if ($IsWindows) { 'out/include-erl.exe' } else { 'out/include-erl' }

          dotnet run --no-build --project src/XPScript.Compiler/XPScript.Compiler.csproj -- samples/include-erl/root.xps -o $outputPath --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Include Erl fixture compilation failed.' }

          $compiledOutput = (& $outputPath | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Compiled include Erl fixture failed.`n$compiledOutput" }
          if ($compiledOutput -notmatch '(?m)^INCLUDE-ERL=5\s*$') { throw "Compiled execution did not report include-local Erl=5.`n$compiledOutput" }

          $directOutput = (& dotnet run --no-build --project src/XPScript.Compiler/XPScript.Compiler.csproj -- run samples/include-erl/root.xps 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Direct include Erl execution failed.`n$directOutput" }
          if ($directOutput -notmatch '(?m)^INCLUDE-ERL=5\s*$') { throw "Direct execution did not report include-local Erl=5.`n$directOutput" }
