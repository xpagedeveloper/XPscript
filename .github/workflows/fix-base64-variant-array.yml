name: Fix Base64 Variant Array Indexing

on:
  push:
    branches: [todo-base64-binary]
    paths:
      - '.github/workflows/fix-base64-variant-array.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-base64-binary
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Patch Variant array lowering
        shell: pwsh
        run: |
          $path = 'src/XPScript.Compiler/CoreCompatibilityTranspiler.cs'
          $text = Get-Content $path -Raw

          $old = 'finalLine = RewriteArrayReads(finalLine, arrays);'
          $new = 'finalLine = RewriteArrayReads(finalLine, arrays, scalarTypes);'
          if (-not $text.Contains($old)) { throw 'RewriteArrayReads call site not found.' }
          $text = $text.Replace($old, $new)

          $old = 'if (arrayAssignment.Success && arrays.ContainsKey(arrayAssignment.Groups[1].Value))'
          $new = 'if (arrayAssignment.Success && (arrays.ContainsKey(arrayAssignment.Groups[1].Value) || (scalarTypes.TryGetValue(arrayAssignment.Groups[1].Value, out var indexedScalarType) && indexedScalarType.Equals("Variant", StringComparison.OrdinalIgnoreCase))))'
          if (-not $text.Contains($old)) { throw 'Array assignment lowering condition not found.' }
          $text = $text.Replace($old, $new)

          $old = 'private string RewriteArrayReads(string line, Dictionary<string, ArrayInfo> arrays)'
          $new = 'private string RewriteArrayReads(string line, Dictionary<string, ArrayInfo> arrays, Dictionary<string, string> scalarTypes)'
          if (-not $text.Contains($old)) { throw 'RewriteArrayReads signature not found.' }
          $text = $text.Replace($old, $new)

          $needle = '        foreach (var name in arrays.Keys.OrderByDescending(x => x.Length))`r`n            line = ReplaceCall(line, name, args => $"LSArrayRuntime.Get({name}{(args.Length > 0 ? ", " + args : "")})");'
          if (-not $text.Contains($needle)) {
            $needle = '        foreach (var name in arrays.Keys.OrderByDescending(x => x.Length))`n            line = ReplaceCall(line, name, args => $"LSArrayRuntime.Get({name}{(args.Length > 0 ? ", " + args : "")})");'
          }
          if (-not $text.Contains($needle)) { throw 'Array read lowering block not found.' }
          $replacement = $needle + "`n        foreach (var name in scalarTypes.Where(x => x.Value.Equals(\"Variant\", StringComparison.OrdinalIgnoreCase)).Select(x => x.Key).OrderByDescending(x => x.Length))`n            line = ReplaceCall(line, name, args => $\"LSArrayRuntime.Get({name}{(args.Length > 0 ? \", \\" + args : \\"\\")})\");"
          $text = $text.Replace($needle, $replacement)

          Set-Content $path $text -NoNewline
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify Base64DecodeBinary
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/base64-binary.xps -o ./out/base64-binary.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Base64 binary sample compilation failed.' }
          $output = & ./out/base64-binary.exe
          foreach ($value in @('LOW=0','HIGH=3','B0=1','B1=2','B2=3','B3=255')) {
            if ($output -notcontains $value) { throw "Base64 binary output missing: $value`n$output" }
          }
      - name: Verify Variant runtime array reads and writes
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/variant-runtime-array-indexing.xps -o ./out/variant-runtime-array-indexing.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Variant runtime array sample compilation failed.' }
          $output = & ./out/variant-runtime-array-indexing.exe
          foreach ($value in @('READ0=10','READ1=20','READ2=30','WRITE1=99','LOW=0','HIGH=2')) {
            if ($output -notcontains $value) { throw "Variant runtime array output missing: $value`n$output" }
          }
      - name: Update TODO and clean temporary workflows
        shell: pwsh
        run: |
          $path = 'todo/runtime-reference-todo.md'
          $text = Get-Content $path -Raw
          $base64Old = '- [>] binary-return Base64 decode via `Base64DecodeBinary()`; source: `samples/base64-binary.xps`'
          $base64New = '- [x] binary-return Base64 decode via `Base64DecodeBinary()` returning a normal XPScript Byte array; source: `samples/base64-binary.xps`'
          if (-not $text.Contains($base64Old)) { throw 'Base64 TODO line not found.' }
          $text = $text.Replace($base64Old, $base64New)
          $arrayAnchor = '- [x] arrays as `Type` members including deep-copy of array storage'
          if (-not $text.Contains($arrayAnchor)) { throw 'Array TODO anchor not found.' }
          $arrayLine = '- [x] `Variant` values containing runtime XPScript arrays support indexed reads and writes; discovered by the `Base64DecodeBinary()` regression and covered by `samples/variant-runtime-array-indexing.xps`'
          if (-not $text.Contains($arrayLine)) { $text = $text.Replace($arrayAnchor, $arrayAnchor + "`n" + $arrayLine) }
          Set-Content $path $text -NoNewline

          git rm .github/workflows/base64-binary-temp.yml
          git rm .github/workflows/fix-base64-variant-array.yml
          git config user.name 'xpagedeveloper'
          git config user.email 'fredrik@xpagedeveloper.com'
          git add src/XPScript.Compiler/CoreCompatibilityTranspiler.cs samples/variant-runtime-array-indexing.xps todo/runtime-reference-todo.md
          git commit -m 'Complete Base64 binary and Variant array indexing'
          git push origin HEAD:todo-base64-binary
