name: macOS Record Lock ABI Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/FileIoExtensionsRuntimeSource.cs'
      - 'src/XPScript.Compiler/FileSystemPortabilityRuntimeSource.cs'
      - '.github/workflows/macos-fcntl-abi-probe.yml'
      - '.github/workflows/cross-platform-runtime-verification.yml'
      - 'todo/done/cross-platform-runtime-todo.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify Darwin record-lock ABI and native lockf behavior
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xps-lock-probe.c" <<'EOF'
          #include <errno.h>
          #include <fcntl.h>
          #include <stddef.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <sys/wait.h>
          #include <unistd.h>

          int main(void) {
              printf("SIZE=%zu\n", sizeof(struct flock));
              printf("START=%zu\n", offsetof(struct flock, l_start));
              printf("LEN=%zu\n", offsetof(struct flock, l_len));
              printf("PID=%zu\n", offsetof(struct flock, l_pid));
              printf("TYPE=%zu\n", offsetof(struct flock, l_type));
              printf("WHENCE=%zu\n", offsetof(struct flock, l_whence));
              printf("F_SETLK=%d\n", F_SETLK);
              printf("F_WRLCK=%d\n", F_WRLCK);
              printf("F_UNLCK=%d\n", F_UNLCK);
              printf("F_TLOCK=%d\n", F_TLOCK);
              printf("F_ULOCK=%d\n", F_ULOCK);
              printf("O_RDWR=%d\n", O_RDWR);
              printf("O_CREAT=%d\n", O_CREAT);
              printf("O_CLOEXEC=%d\n", O_CLOEXEC);
              printf("SEEK_SET=%d\n", SEEK_SET);

              char sharedPath[] = "/tmp/xps-open-probe-XXXXXX";
              int seed = mkstemp(sharedPath);
              if (seed < 0) { perror("mkstemp-shared"); return 9; }
              close(seed);
              int shared = open(sharedPath, O_RDWR | O_CREAT | O_CLOEXEC, 0666);
              if (shared < 0) { perror("open-parent"); unlink(sharedPath); return 10; }
              pid_t child = fork();
              if (child < 0) { perror("fork"); close(shared); unlink(sharedPath); return 11; }
              if (child == 0) {
                  int second = open(sharedPath, O_RDWR | O_CREAT | O_CLOEXEC, 0666);
                  if (second < 0) { perror("open-child"); _exit(12); }
                  close(second);
                  _exit(0);
              }
              int childStatus = 0;
              if (waitpid(child, &childStatus, 0) < 0) { perror("waitpid"); close(shared); unlink(sharedPath); return 13; }
              close(shared);
              unlink(sharedPath);
              if (!WIFEXITED(childStatus) || WEXITSTATUS(childStatus) != 0) return 14;
              puts("OPEN_SHARED_DIRECT=OK");

              char path[] = "/tmp/xps-lockf-probe-XXXXXX";
              int fd = mkstemp(path);
              if (fd < 0) { perror("mkstemp"); return 20; }
              unlink(path);
              if (write(fd, "abcdef", 6) != 6) { perror("write"); close(fd); return 21; }
              if (lseek(fd, 0, SEEK_SET) < 0) { perror("lseek-lock"); close(fd); return 22; }
              if (lockf(fd, F_TLOCK, 3) != 0) { perror("lockf-lock"); close(fd); return 23; }
              if (lseek(fd, 0, SEEK_SET) < 0) { perror("lseek-unlock"); close(fd); return 24; }
              if (lockf(fd, F_ULOCK, 3) != 0) { perror("lockf-unlock"); close(fd); return 25; }
              close(fd);
              puts("LOCKF_DIRECT=OK");
              return 0;
          }
          EOF
          clang -Wall -Wextra -Werror "$RUNNER_TEMP/xps-lock-probe.c" -o "$RUNNER_TEMP/xps-lock-probe"
          output="$($RUNNER_TEMP/xps-lock-probe)"
          printf '%s\n' "$output"
          grep -qx 'SIZE=24' <<< "$output"
          grep -qx 'START=0' <<< "$output"
          grep -qx 'LEN=8' <<< "$output"
          grep -qx 'PID=16' <<< "$output"
          grep -qx 'TYPE=20' <<< "$output"
          grep -qx 'WHENCE=22' <<< "$output"
          grep -qx 'F_SETLK=8' <<< "$output"
          grep -qx 'F_WRLCK=3' <<< "$output"
          grep -qx 'F_UNLCK=2' <<< "$output"
          grep -qx 'F_TLOCK=2' <<< "$output"
          grep -qx 'F_ULOCK=0' <<< "$output"
          grep -qx 'O_RDWR=2' <<< "$output"
          grep -qx 'O_CREAT=512' <<< "$output"
          grep -qx 'O_CLOEXEC=16777216' <<< "$output"
          grep -qx 'SEEK_SET=0' <<< "$output"
          grep -qx 'OPEN_SHARED_DIRECT=OK' <<< "$output"
          grep -qx 'LOCKF_DIRECT=OK' <<< "$output"
