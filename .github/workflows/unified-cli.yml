name: Unified CLI

on:
  push:
    paths:
      - '.github/workflows/unified-cli.yml'
      - 'src/XPScript.Cli/**'
      - 'src/XPScript.Compiler/Program.cs'
      - 'src/XPScript.Compiler/CompilerDriver.cs'
      - 'src/XPScript.Compiler/CompilerBuildEnvironment.cs'
      - 'src/XPScript.Compiler/RunArtifactCache.cs'
      - 'src/XPScript.Compiler/XPScriptCompilerCommandLine.cs'
      - 'samples/unified-cli-smoke.xps'
      - 'XPScriptCompiler.slnx'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/unified-cli.yml'
      - 'src/XPScript.Cli/**'
      - 'src/XPScript.Compiler/Program.cs'
      - 'src/XPScript.Compiler/CompilerDriver.cs'
      - 'src/XPScript.Compiler/CompilerBuildEnvironment.cs'
      - 'src/XPScript.Compiler/RunArtifactCache.cs'
      - 'src/XPScript.Compiler/XPScriptCompilerCommandLine.cs'
      - 'samples/unified-cli-smoke.xps'
      - 'XPScriptCompiler.slnx'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx
      - name: Build unified CLI
        run: dotnet build ./src/XPScript.Cli/XPScript.Cli.csproj -c Release --no-restore
      - name: Verify xpscript compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $output = "./out/unified-cli$ext"
          $compileOutput = @(dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release --no-build -- compile ./samples/unified-cli-smoke.xps --framework-dependent -o $output 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "xpscript compile failed.`n$compileOutput" }
          if (-not (Test-Path $output)) { throw "Unified CLI compile output was not created: $output" }
          if (-not ($compileOutput | Where-Object { $_ -like 'Started to compile unified-cli-smoke.xps*' })) { throw "Compile start status missing.`n$compileOutput" }
          if (-not ($compileOutput | Where-Object { $_ -like 'Compiling unified-cli-smoke.xps*' })) { throw "Compile progress status missing.`n$compileOutput" }
          if (-not ($compileOutput | Where-Object { $_ -like 'Compiled unified-cli-smoke.xps in *' })) { throw "Compile completion status missing.`n$compileOutput" }
      - name: Verify quiet xpscript run
        shell: pwsh
        run: |
          $output = @(dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release --no-build -- run ./samples/unified-cli-smoke.xps 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "xpscript run failed.`n$output" }
          if ($output -notcontains 'UNIFIED-CLI=OK') { throw "Unified CLI runtime output mismatch.`n$output" }
          if ($output | Where-Object { $_ -like 'Started to compile *' -or $_ -like 'Compiling *' -or $_ -like 'Compiled *' -or $_ -like 'Run cache hit *' }) { throw "Default xpscript run must not emit compiler info.`n$output" }
      - name: Verify repeated xpscript run cache
        shell: pwsh
        run: |
          $output = @(dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release --no-build -- run ./samples/unified-cli-smoke.xps --info 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "cached xpscript run --info failed.`n$output" }
          if ($output -notcontains 'UNIFIED-CLI=OK') { throw "Unified CLI runtime output mismatch with cached --info.`n$output" }
          if (-not ($output | Where-Object { $_ -like 'Run cache hit for unified-cli-smoke.xps*' })) { throw "Repeated run did not use the run artifact cache.`n$output" }
          if (-not ($output | Where-Object { $_ -like 'Starting program*' })) { throw "Run lifecycle info missing.`n$output" }
      - name: Verify changed source rebuild and recache
        shell: pwsh
        run: |
          # Changing only script code keeps the generated dependency graph identical.
          # This exercises rebuild + persistent run restore state, then artifact recache.
          $changed = './out/unified-cli-changed.xps'
          (Get-Content ./samples/unified-cli-smoke.xps -Raw).Replace('UNIFIED-CLI=OK', 'UNIFIED-CLI=CHANGED') | Set-Content -NoNewline $changed
          $first = @(dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release --no-build -- run $changed --info 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "changed source first run failed.`n$first" }
          if ($first -notcontains 'UNIFIED-CLI=CHANGED') { throw "Changed source runtime output mismatch.`n$first" }
          if (-not ($first | Where-Object { $_ -like 'Compiled unified-cli-changed.xps in *' })) { throw "Changed source was not rebuilt.`n$first" }
          $second = @(dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release --no-build -- run $changed --info 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "changed source cached run failed.`n$second" }
          if (-not ($second | Where-Object { $_ -like 'Run cache hit for unified-cli-changed.xps*' })) { throw "Changed source did not recache after rebuild.`n$second" }
      - name: Verify direct compile shortcut
        shell: pwsh
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $output = "./out/unified-cli-shortcut$ext"
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release --no-build -- ./samples/unified-cli-smoke.xps --framework-dependent -o $output
          if ($LASTEXITCODE -ne 0) { throw 'xpscript direct compile shortcut failed.' }
          if (-not (Test-Path $output)) { throw "Unified CLI shortcut output was not created: $output" }
