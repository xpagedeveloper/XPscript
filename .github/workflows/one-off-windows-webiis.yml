name: One-off Windows WebIIS Probe

on:
  workflow_dispatch:
  push:
    branches:
      - investigate-ast-compiler

permissions:
  contents: read

jobs:
  webiis:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler and WebIIS probe
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet restore ./tests/WebIisPackageProbe/WebIisPackageProbe.csproj
      - name: Build compiler and WebIIS probe
        run: |
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          dotnet build ./tests/WebIisPackageProbe/WebIisPackageProbe.csproj -c Release --no-restore
      - name: Run WebIIS package probe
        run: dotnet run --project ./tests/WebIisPackageProbe/WebIisPackageProbe.csproj -c Release --no-build
