name: Cross Platform All RID Compile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-portable-source:
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }

      - name: Compile same portable source for ${{ matrix.rid }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $rid = '${{ matrix.rid }}'
          $extension = if ($rid.StartsWith('win-')) { '.exe' } else { '' }
          $output = "./out/platform-shell-$rid$extension"

          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/platform-shell.xps --rid $rid -o $output --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed for $rid." }
          if (-not (Test-Path $output)) { throw "Expected output missing for ${rid}: $output" }

          $length = (Get-Item $output).Length
          if ($length -le 0) { throw "Generated output is empty for $rid." }
          Write-Host "Compiled ./samples/platform-shell.xps for $rid -> $output ($length bytes)"

  execute-portable-source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            platform: Windows
          - runner: windows-11-arm
            rid: win-arm64
            platform: Windows
          - runner: ubuntu-latest
            rid: linux-x64
            platform: Linux
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            platform: Linux
          - runner: macos-15-intel
            rid: osx-x64
            platform: MacOS
          - runner: macos-latest
            rid: osx-arm64
            platform: MacOS
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler
        shell: pwsh
        run: |
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }

      - name: Verify runner matches ${{ matrix.rid }}
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } elseif ($env:RUNNER_ARCH -eq 'X64') { 'x64' } else { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          $os = if ($env:RUNNER_OS -eq 'Windows') { 'win' } elseif ($env:RUNNER_OS -eq 'Linux') { 'linux' } elseif ($env:RUNNER_OS -eq 'macOS') { 'osx' } else { throw "Unsupported runner OS: $env:RUNNER_OS" }
          $actual = "$os-$arch"
          if ($actual -ne '${{ matrix.rid }}') { throw "Runner architecture mismatch: expected ${{ matrix.rid }}, actual $actual" }

      - name: Compile matching portable artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $output = if ($env:RUNNER_OS -eq 'Windows') { './out/platform-shell.exe' } else { './out/platform-shell' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/platform-shell.xps --rid '${{ matrix.rid }}' -o $output --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Portable source compilation failed for ${{ matrix.rid }}.' }
          if (-not (Test-Path $output)) { throw 'Portable output missing for ${{ matrix.rid }}.' }

      - name: Execute matching portable artifact
        shell: pwsh
        run: |
          $output = if ($env:RUNNER_OS -eq 'Windows') { './out/platform-shell.exe' } else { './out/platform-shell' }
          if ($env:RUNNER_OS -ne 'Windows') {
            bash -c "test -x '$output'"
            if ($LASTEXITCODE -ne 0) { throw 'Unix output is not executable.' }
          }
          $result = & $output
          if ($LASTEXITCODE -ne 0) { throw "Portable artifact failed for ${{ matrix.rid }}.`n$result" }
          if ($result -notcontains 'PLATFORM=${{ matrix.platform }}') { throw "Platform result mismatch for ${{ matrix.rid }}.`n$result" }
