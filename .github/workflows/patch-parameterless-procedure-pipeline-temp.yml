name: Patch Parameterless Procedure Pipeline Temp

on:
  push:
    branches: [todo-cross-platform-file-io-portability]
    paths:
      - '.github/workflows/patch-parameterless-procedure-pipeline-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Insert canonicalization step
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/XPScript.Compiler/XPScriptTranspiler.cs')
          text = path.read_text(encoding='utf-8')
          needle = '        source = new IfLayoutPreprocessor().Transform(source);\n'
          replacement = needle + '        source = new ParameterlessProcedureHeaderPreprocessor().Transform(source);\n'
          if replacement in text:
              raise SystemExit('parameterless procedure preprocessor already wired')
          if needle not in text:
              raise SystemExit('IfLayout pipeline anchor not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/patch-parameterless-procedure-pipeline-temp.yml
          git config user.name "xpagedeveloper"
          git config user.email "fredrik@xpagedeveloper.com"
          git add src/XPScript.Compiler/XPScriptTranspiler.cs
          git commit -m "Support parameterless procedure declarations without parentheses"
          git push
