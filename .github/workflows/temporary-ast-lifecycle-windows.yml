name: Temporary AST Lifecycle (Windows)

on:
  push:
    branches: [investigate-ast-compiler]

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Run constructor lifecycle regressions
        shell: pwsh
        run: ./tests/ast-compile-probe/run-ast-constructor.ps1
      - name: Run destructor lifecycle regressions
        shell: pwsh
        run: ./tests/ast-compile-probe/run-ast-destructor.ps1
