name: AST Platform FullTest

on:
  push:
    branches:
      - investigate-ast-compiler
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-platform-fulltest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ast-platform:
    name: AST ${{ matrix.name }} ${{ matrix.locale }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            rid: linux-x64
            locale: sv-SE
            lang: sv_SE.UTF-8
          - name: Linux
            os: ubuntu-latest
            rid: linux-x64
            locale: en-US
            lang: en_US.UTF-8
          - name: Windows
            os: windows-latest
            rid: win-x64
            locale: sv-SE
            lang: sv_SE.UTF-8
          - name: Windows
            os: windows-latest
            rid: win-x64
            locale: en-US
            lang: en_US.UTF-8
          - name: macOS
            os: macos-latest
            rid: osx-x64
            locale: sv-SE
            lang: sv_SE.UTF-8
          - name: macOS
            os: macos-latest
            rid: osx-x64
            locale: en-US
            lang: en_US.UTF-8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LANG: ${{ matrix.lang }}
      LC_ALL: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux locales
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo locale-gen sv_SE.UTF-8 en_US.UTF-8
          locale -a
      - name: Set Windows culture
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-Culture '${{ matrix.locale }}'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler for target RID
        timeout-minutes: 15
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj -r ${{ matrix.rid }}
      - name: Build compiler
        timeout-minutes: 15
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Restore CLI for AST WebIIS regression
        timeout-minutes: 15
        run: dotnet restore ./src/XPScript.Cli/XPScript.Cli.csproj
      - name: Restore native Application runtime probe
        run: dotnet restore ./tests/AstApplicationRuntimeProbe/AstApplicationRuntimeProbe.csproj
      - name: Restore native Spreadsheet runtime probe
        run: dotnet restore ./tests/AstSpreadsheetRuntimeProbe/AstSpreadsheetRuntimeProbe.csproj
      - name: Build AST CLI probe before no-build execution
        run: dotnet build ./tests/ast-compile-probe/AstCompileProbe.csproj -c Release --no-restore
      - name: Run AST lexer and emission probes
        timeout-minutes: 10
        run: |
          dotnet run --project ./tests/ast-lexer/AstLexerProbe.csproj -c Release
          dotnet run --project ./tests/ast-emission/AstEmissionProbe.csproj -c Release
      - name: Run AST CLI regression
        timeout-minutes: 45
        shell: pwsh
        run: ./tests/ast-compile-probe/run-ast-cli.ps1
      - name: Compile and execute AST target sample
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "ast-${{ matrix.rid }}-${{ matrix.locale }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ast-compile ./tests/ast-compile-probe/shared-runtime.xps --output $output --rid ${{ matrix.rid }}
          $assembly = Join-Path $output 'Generated.dll'
          if (-not (Test-Path $assembly)) { throw "AST ${{ matrix.rid }} ${{ matrix.locale }} compilation did not produce Generated.dll." }
          $actual = ((& dotnet $assembly) -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($actual)) { throw 'AST target executable produced no output.' }
          Write-Host "AST_${{ matrix.rid }}_${{ matrix.locale }}_FULLTEST=OK"
