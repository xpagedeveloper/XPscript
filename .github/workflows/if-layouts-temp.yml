name: If Layout Regression Temp

on:
  push:
    branches: [todo-if-layouts]
    paths:
      - '.github/workflows/if-layouts-temp.yml'
      - 'samples/if-layouts.xps'
      - 'src/XPScript.Compiler/IfLayoutPreprocessor.cs'
      - 'src/XPScript.Compiler/AdvancedXPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'

permissions:
  contents: read

jobs:
  if-layouts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile and verify If layouts
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/if-layouts.xps -o ./out/if-layouts.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'If layout sample compilation failed.' }
          $output = & ./out/if-layouts.exe
          foreach ($value in @('SINGLE=OK','SINGLE_ELSE=OK','STRING_ELSE=OK','BLOCK=OK','SPLIT_THEN=OK','SPLIT_ELSEIF=OK','DATE_SINGLE=OK')) {
            if ($output -notcontains $value) { throw "If layout output missing: $value`n$output" }
          }
          if ($output -contains 'SINGLE_TRUE_BAD' -or $output -contains 'ELSEIF_BAD') { throw "Unexpected If branch output:`n$output" }
