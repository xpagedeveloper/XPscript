name: IntelliSense API documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/**'
      - 'docs/**'
      - 'samples/**'
      - 'demo/**'
      - 'scripts/validate-intellisense-api-docs.ps1'
      - 'scripts/validate-runtime-api-doc-sync.ps1'
      - '.github/workflows/intellisense-api-docs.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate machine-readable API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate IntelliSense API contract
        shell: pwsh
        run: ./scripts/validate-intellisense-api-docs.ps1
      - name: Validate runtime API source/documentation synchronization
        env:
          API_SYNC_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: pwsh
        run: ./scripts/validate-runtime-api-doc-sync.ps1 -BaseRef "$env:API_SYNC_BASE_REF"

  trigger-plugin-sync:
    name: Trigger VS Code IntelliSense synchronization
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch plugin catalog synchronization
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_SYNC_TOKEN }}
          XP_SCRIPT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Repository secret PLUGIN_SYNC_TOKEN is required. Use a fine-grained token with access to dispatch workflows in xpagedeveloper/XPScript-visual-code-plugin."
            exit 1
          fi
          gh api \
            --method POST \
            repos/xpagedeveloper/XPScript-visual-code-plugin/dispatches \
            -f event_type=xpscript-api-updated \
            -F "client_payload[xpscript_sha]=$XP_SCRIPT_SHA"
