name: Managed Null Interop

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'tests/ManagedReferenceFixture/**'
      - 'tests/ManagedNullInteropProbe/**'
      - '.github/workflows/managed-null-interop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify managed Empty and Null interop contract
        run: dotnet run --project ./tests/ManagedNullInteropProbe/ManagedNullInteropProbe.csproj -c Release
