name: AST CLI Shard 6 (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - investigate-ast-compiler
    paths:
      - '.github/workflows/ast-cli-shard-6.yml'
      - 'tests/ast-compile-probe/run-ast-cli-shard-6.ps1'
      - 'tests/ast-compile-probe/cli-common.ps1'
      - 'tests/ast-compile-probe/parser-error.xps'
      - 'tests/ast-compile-probe/include-parser-span-error-next.xps'
      - 'tests/ast-compile-probe/cli-main.xps'
      - 'src/XPScript.Compiler/**'

permissions:
  contents: read

jobs:
  cli-shard-6:
    name: Diagnostics, source mapping and final CLI
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run CLI shard 6
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/ast-compile-probe/run-ast-cli-shard-6.ps1
