name: SQLite Database

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/SqliteDbRuntimeSource.cs'
      - 'src/XPScript.Compiler/DatabaseUiDataSourceRuntimeSource.cs'
      - 'src/XPScript.Compiler/DatabaseAttachmentRuntimeSource.cs'
      - 'src/XPScript.Compiler/DatabaseAttachmentRuntimeV2Source.cs'
      - 'src/XPScript.Compiler/NativeHttpJsonPreprocessor.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/CompilerBuildEnvironment.cs'
      - 'src/XPScript.Compiler/UIExtensionRuntimeSource.cs'
      - 'samples/xpdb-sqlite.xps'
      - 'samples/database-uiform-datasource.xps'
      - 'samples/database-attachments.xps'
      - 'docs/sqlite.md'
      - 'docs/database-ui-datasources.md'
      - 'docs/commands.md'
      - 'docs/index.md'
      - '.github/workflows/sqlite-database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Compile and run SQLite sample
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/sqlite | Out-Null
          $exe = if ($IsWindows) { './out/sqlite/xpdb-sqlite.exe' } else { './out/sqlite/xpdb-sqlite' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpdb-sqlite.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'SQLite sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "SQLite regression failed.`n$output" }
          $output | ForEach-Object { Write-Host $_ }
          foreach ($value in @('INSERTED=1','LASTID=1','QUERYTYPE=Array','ROWCOUNT=1','ROWNAME=Ada','ROWACTIVE=1','SCALAR=1','ROLLBACKCOUNT=1','READONLY=True','READONLYCOUNT=1','XPDBSQLITE=OK')) {
            if ($output -notcontains $value) { throw "SQLite output missing: $value`n$output" }
          }

      - name: Verify shared UIForm database data source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/sqlite-datasource | Out-Null
          $exe = if ($IsWindows) { './out/sqlite-datasource/database-uiform-datasource.exe' } else { './out/sqlite-datasource/database-uiform-datasource' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/database-uiform-datasource.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Database/UIForm data-source sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Database/UIForm data-source regression failed.`n$output" }
          $output | ForEach-Object { Write-Host $_ }
          foreach ($value in @('LIST-COUNT=1','LISTVIEW-COUNT=1','LISTVIEW-NAME=Anna','SHARED-NAME=Anna Andersson','SHARED-CITY=Goteborg','HIDDEN-BEFORE=KEEP-ME','SAVE-AFFECTED=1','SAVED-NAME=Anna Andersson','SAVED-CITY=Goteborg','HIDDEN-AFTER=KEEP-ME','DATABASE-UIFORM-DATASOURCE=OK')) {
            if ($output -notcontains $value) { throw "Database/UIForm output missing: $value`n$output" }
          }

      - name: Verify unified SQLite attachments
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/sqlite-attachments | Out-Null
          $exe = if ($IsWindows) { './out/sqlite-attachments/database-attachments.exe' } else { './out/sqlite-attachments/database-attachments' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/database-attachments.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Database attachment sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Database attachment regression failed.`n$output" }
          $output | ForEach-Object { Write-Host $_ }
          foreach ($value in @(
            'ATTACH-EMPTY=0',
            'ATTACH-AFTER-SAVE=2',
            'ATTACH-DUPLICATE-IDS=True',
            'ATTACH-CREATED-BY=creator@example',
            'ATTACH-NAME=contracts.pdf',
            'ATTACH-HAS-CHECKSUM=True',
            'ATTACH-FIND-NAME=2',
            'ATTACH-METADATA-ID=True',
            'ATTACH-SAME-LENGTH=True',
            'ATTACH-GETALL=2',
            'ATTACH-CREATED-BY-PRESERVED=creator@example',
            'ATTACH-MODIFIED-BY=editor@example',
            'ATTACH-DELETED-FIRST=True',
            'ATTACH-AFTER-FIRST-DELETE=1',
            'ATTACH-DELETED-SECOND=True',
            'ATTACH-AFTER-DELETE=0',
            'DATABASE-ATTACHMENTS=OK'
          )) {
            if ($output -notcontains $value) { throw "Database attachment output missing: $value`n$output" }
          }

      - name: Remove SQLite regression databases
        if: always()
        shell: pwsh
        run: |
          Remove-Item ./out/sqlite/xpdb-sqlite-regression.db -Force -ErrorAction SilentlyContinue
          Remove-Item ./out/sqlite-datasource/database-uiform-datasource.db -Force -ErrorAction SilentlyContinue
          Remove-Item ./xpdb-sqlite-regression.db -Force -ErrorAction SilentlyContinue
          Remove-Item ./database-uiform-datasource.db -Force -ErrorAction SilentlyContinue
          Remove-Item ./database-attachments.db -Force -ErrorAction SilentlyContinue
          Remove-Item ./database-attachments-copy.xps -Force -ErrorAction SilentlyContinue
          Remove-Item ./database-attachments-all -Recurse -Force -ErrorAction SilentlyContinue
