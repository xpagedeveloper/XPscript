name: Null Empty Semantics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/SourceTypeValidator.cs'
      - 'src/XPScript.Compiler/TypeCoercionPreprocessor.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'src/XPScript.Compiler/XPScriptRuntimeSource.cs'
      - 'src/XPScript.Compiler/ModuleGlobalsPreprocessor.cs'
      - 'src/XPScript.Compiler/CoreCompatibilityTranspiler.cs'
      - 'samples/null-empty-semantics.xps'
      - 'samples/null-empty-inspection-helpers.xps'
      - 'samples/nothing-variant-assignment-error.xps'
      - 'samples/null-integer-assignment-error.xps'
      - 'samples/null-module-global-assignment-error.xps'
      - 'samples/null-variant-parameter.xps'
      - 'samples/null-integer-parameter-error.xps'
      - 'samples/module-object-references.xps'
      - 'samples/variant-global-static-empty.xps'
      - 'todo/null-empty-nothing-semantics.md'
      - '.github/workflows/null-empty-semantics.yml'
  push:
    branches:
      - 'todo-*'
    paths:
      - 'src/XPScript.Compiler/SourceTypeValidator.cs'
      - 'src/XPScript.Compiler/TypeCoercionPreprocessor.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'src/XPScript.Compiler/XPScriptRuntimeSource.cs'
      - 'src/XPScript.Compiler/ModuleGlobalsPreprocessor.cs'
      - 'src/XPScript.Compiler/CoreCompatibilityTranspiler.cs'
      - 'samples/null-empty-semantics.xps'
      - 'samples/null-empty-inspection-helpers.xps'
      - 'samples/nothing-variant-assignment-error.xps'
      - 'samples/null-integer-assignment-error.xps'
      - 'samples/null-module-global-assignment-error.xps'
      - 'samples/null-variant-parameter.xps'
      - 'samples/null-integer-parameter-error.xps'
      - 'samples/module-object-references.xps'
      - 'samples/variant-global-static-empty.xps'
      - 'todo/null-empty-nothing-semantics.md'
      - '.github/workflows/null-empty-semantics.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Compile and verify Null/Empty runtime semantics
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/null-empty-semantics$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/null-empty-semantics.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Null/Empty regression compilation failed.' }

          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "Null/Empty regression exited with code $LASTEXITCODE." }

          foreach ($value in @(
            'EMPTY_DT=0',
            'EMPTY_TYPE=EMPTY',
            'EMPTY_ISEMPTY=True',
            'EMPTY_ISNULL=False',
            'NULL_DT=1',
            'NULL_TYPE=NULL',
            'NULL_ISEMPTY=False',
            'NULL_ISNULL=True',
            'NULL_PROPAGATES=True'
          )) {
            if ($output -notcontains $value) { throw "Null/Empty output missing: $value" }
          }

      - name: Compile and verify Null/Empty inspection helpers
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/null-empty-inspection-helpers$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/null-empty-inspection-helpers.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Null/Empty inspection helper regression compilation failed.' }

          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "Null/Empty inspection helper regression exited with code $LASTEXITCODE." }
          $output | ForEach-Object { Write-Host $_ }

          foreach ($value in @(
            'EMPTY_ISNUMERIC=False',
            'EMPTY_ISSCALAR=True',
            'EMPTY_ISOBJECT=False',
            'EMPTY_ISDATE=False',
            'EMPTY_ISARRAY=False',
            'EMPTY_CVAR_TYPE=EMPTY',
            'EMPTY_CVAR_ISEMPTY=True',
            'EMPTY_CVAR_ISNULL=False',
            'NULL_ISNUMERIC=False',
            'NULL_ISSCALAR=True',
            'NULL_ISOBJECT=False',
            'NULL_ISDATE=False',
            'NULL_ISARRAY=False',
            'NULL_CVAR_TYPE=NULL',
            'NULL_CVAR_ISEMPTY=False',
            'NULL_CVAR_ISNULL=True'
          )) {
            if ($output -notcontains $value) { throw "Null/Empty inspection helper output missing: $value" }
          }

      - name: Compile and verify Null Variant parameter semantics
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/null-variant-parameter$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/null-variant-parameter.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Null Variant parameter regression compilation failed.' }

          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "Null Variant parameter regression exited with code $LASTEXITCODE." }
          $output | ForEach-Object { Write-Host $_ }

          foreach ($value in @(
            'PARAM_TYPE=NULL',
            'PARAM_ISNULL=True',
            'PARAM_ISEMPTY=False'
          )) {
            if ($output -notcontains $value) { throw "Null Variant parameter output missing: $value" }
          }

      - name: Verify invalid Null and Nothing value assignments are rejected
        shell: pwsh
        run: |
          $cases = @(
            @{ File = './samples/nothing-variant-assignment-error.xps'; Expected = 'Nothing is valid only for object-reference assignment with Set.' },
            @{ File = './samples/null-integer-assignment-error.xps'; Expected = 'Null can be assigned only to a Variant-compatible value, not Integer.' },
            @{ File = './samples/null-module-global-assignment-error.xps'; Expected = 'Null can be assigned only to a Variant-compatible value, not Integer.' },
            @{ File = './samples/null-integer-parameter-error.xps'; Expected = "Null can be passed only to a Variant-compatible parameter. Parameter 'value' of 'AcceptInteger' expects Integer." }
          )

          foreach ($case in $cases) {
            $oldNativePreference = $PSNativeCommandUseErrorActionPreference
            try {
              $PSNativeCommandUseErrorActionPreference = $false
              $output = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- $case.File --framework-dependent 2>&1
              $exit = $LASTEXITCODE
              $global:LASTEXITCODE = 0
            }
            finally {
              $PSNativeCommandUseErrorActionPreference = $oldNativePreference
            }

            $output | ForEach-Object { Write-Host $_ }
            if ($exit -eq 0) { throw "Negative assignment fixture unexpectedly compiled: $($case.File)" }
            $text = $output -join "`n"
            if (-not $text.Contains($case.Expected, [StringComparison]::Ordinal)) {
              throw "Expected assignment diagnostic missing for $($case.File): $($case.Expected)"
            }
          }

      - name: Compile and verify object Nothing semantics
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/module-object-references$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/module-object-references.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Object Nothing regression compilation failed.' }

          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "Object Nothing regression exited with code $LASTEXITCODE." }

          foreach ($value in @(
            'NAME=Fredrik',
            'NOTHING1=False',
            'SAME=True',
            'ALIAS=Fredrik',
            'NOTHING2=True',
            'ALIASSTILL=Fredrik',
            'DELETEDPRIMARY=True',
            'DELETEDALIAS=True'
          )) {
            if ($output -notcontains $value) { throw "Object Nothing output missing: $value" }
          }

      - name: Compile and verify Variant global and Static EMPTY semantics
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/variant-global-static-empty$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/variant-global-static-empty.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Variant global/Static EMPTY regression compilation failed.' }

          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "Variant global/Static EMPTY regression exited with code $LASTEXITCODE." }
          $output | ForEach-Object { Write-Host $_ }

          foreach ($value in @(
            'GLOBAL_TYPE=EMPTY',
            'GLOBAL_DT=0',
            'GLOBAL_ISEMPTY=True',
            'GLOBAL_ISNULL=False',
            'STATIC_FIRST_TYPE=EMPTY',
            'STATIC_FIRST_DT=0',
            'STATIC_FIRST_ISEMPTY=True',
            'STATIC_FIRST_ISNULL=False',
            'STATIC_RETAINED=73'
          )) {
            if ($output -notcontains $value) { throw "Variant global/Static output missing: $value" }
          }
