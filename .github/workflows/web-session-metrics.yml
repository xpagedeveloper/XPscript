name: Web Session Metrics

on:
  pull_request:
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'tests/WebSessionMetricsSmoke/**'
      - '.github/workflows/web-session-metrics.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'tests/WebSessionMetricsSmoke/**'
      - '.github/workflows/web-session-metrics.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx
      - name: Build solution
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore
      - name: Run session metrics regression
        run: dotnet run --project ./tests/WebSessionMetricsSmoke/WebSessionMetricsSmoke.csproj -c Release
