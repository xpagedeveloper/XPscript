name: SQL Server Database

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/MsSqlDbRuntimeSource.cs'
      - 'src/XPScript.Compiler/DatabaseUiDataSourceRuntimeSource.cs'
      - 'src/XPScript.Compiler/DatabaseAttachmentRuntimeSource.cs'
      - 'src/XPScript.Compiler/DatabaseAttachmentRuntimeV2Source.cs'
      - 'src/XPScript.Compiler/DatabaseAttachmentRuntimeV3Source.cs'
      - 'src/XPScript.Compiler/NativeHttpJsonPreprocessor.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/CompilerBuildEnvironment.cs'
      - 'src/XPScript.Compiler/UIExtensionRuntimeSource.cs'
      - 'src/XPScript.Web.Compiler/**'
      - 'tests/WebCompilerSmoke/**'
      - 'samples/xpdb-mssql.xps'
      - 'samples/database-uiform-datasource-mssql.xps'
      - 'samples/database-attachments-mssql.xps'
      - 'docs/mssql.md'
      - '.github/workflows/mssql-database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: SQL Server real CRUD through XPscript
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ format('Xps{0}Aa!', github.run_id) }}
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Compiler restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }
      - name: Compile XPscript SQL Server CRUD regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/mssql-integration | Out-Null
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpdb-mssql.xps -o ./out/mssql-integration/xpdb-mssql --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'SQL Server regression compilation failed.' }
          chmod +x ./out/mssql-integration/xpdb-mssql
      - name: Run XPscript CRUD against SQL Server
        shell: pwsh
        env:
          XPSCRIPT_MSSQL_CONNECTION: Server=127.0.0.1,1433;Database=master;User ID=sa;Password=${{ format('Xps{0}Aa!', github.run_id) }};Encrypt=True;TrustServerCertificate=True;Connect Timeout=2
        run: |
          $output = @(); $exitCode = 1
          for ($attempt = 1; $attempt -le 90; $attempt++) {
            $output = @(& ./out/mssql-integration/xpdb-mssql 2>&1); $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw "SQL Server XPscript CRUD regression failed.`n$output" }
          foreach ($value in @(
            'OPEN=True','MSSQL-CREATE=OK','MSSQL-READ=OK','UPDATED=1','UPDATEDNAME=Ada Updated',
            'MSSQL-UPDATE=OK','ROLLBACKCOUNT=1','DELETED=1','DELETECOUNT=0','MSSQL-DELETE=OK',
            'DATABASE=master','CLOSED=False','XPDBMSSQL=OK'
          )) {
            if ($output -notcontains $value) { throw "SQL Server output missing: $value`n$output" }
          }
