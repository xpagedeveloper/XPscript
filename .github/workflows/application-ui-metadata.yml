name: Application UI Metadata

on:
  pull_request:
    paths-ignore:
      - 'src/XPScript.Compiler/Notes*.cs'
      - 'samples/notes-*.xps'
      - 'samples/xpscript-notes-runtime-fixture.dxl'
      - 'docs/notes-*.md'
      - 'todo/HCLNotes.md'
  push:
    branches: [ main ]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run application UI metadata probe
        run: dotnet run --project ./tests/ApplicationUiMetadataProbe/ApplicationUiMetadataProbe.csproj -c Release