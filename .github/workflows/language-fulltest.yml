name: Language FullTest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-fulltest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile and run language regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./out/language | Out-Null
          $compilerDll = (Resolve-Path './src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll').Path
          $samples = @('array-sort-regression', 'statement-layout-audit')
          foreach ($sample in $samples) {
            dotnet $compilerDll "./samples/$sample.xps" -o "./out/language/$sample" --runtime=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = if (Test-Path "./out/language/$sample.exe") { "./out/language/$sample.exe" } else { "./out/language/$sample" }
            & $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host 'LANGUAGE_FULLTEST: passed'
