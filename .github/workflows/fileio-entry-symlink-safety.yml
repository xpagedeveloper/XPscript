name: File IO Entry Symlink Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/FileSystemPortabilityRuntimeSource.cs'
      - 'samples/fileio-entry-symlink-safety.xps'
      - '.github/workflows/fileio-entry-symlink-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry-symlink-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler and resolve target
        id: target
        shell: pwsh
        run: |
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } elseif ($env:RUNNER_ARCH -eq 'X64') { 'x64' } else { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          if ($env:RUNNER_OS -eq 'Windows') { $rid = "win-$arch"; $ext = '.exe' }
          elseif ($env:RUNNER_OS -eq 'Linux') { $rid = "linux-$arch"; $ext = '' }
          elseif ($env:RUNNER_OS -eq 'macOS') { $rid = "osx-$arch"; $ext = '' }
          else { throw "Unsupported runner OS: $env:RUNNER_OS" }
          "rid=$rid" >> $env:GITHUB_OUTPUT
          "ext=$ext" >> $env:GITHUB_OUTPUT

      - name: Prepare symlink targets
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue ./toctou-fixture
          New-Item -ItemType Directory -Force ./toctou-fixture | Out-Null
          New-Item -ItemType Directory -Force ./toctou-fixture/rmdir-target | Out-Null
          Set-Content -NoNewline -Path ./toctou-fixture/kill-target.txt -Value 'KILL_TARGET_SAFE'
          Set-Content -NoNewline -Path ./toctou-fixture/name-source-target.txt -Value 'NAME_SOURCE_TARGET_SAFE'
          Set-Content -NoNewline -Path ./toctou-fixture/name-destination-target.txt -Value 'NAME_DEST_TARGET_SAFE'
          Set-Content -NoNewline -Path ./toctou-fixture/rmdir-target/keep.txt -Value 'RMDIR_TARGET_SAFE'

          $killTarget = (Resolve-Path ./toctou-fixture/kill-target.txt).Path
          $nameSourceTarget = (Resolve-Path ./toctou-fixture/name-source-target.txt).Path
          $nameDestinationTarget = (Resolve-Path ./toctou-fixture/name-destination-target.txt).Path
          $rmdirTarget = (Resolve-Path ./toctou-fixture/rmdir-target).Path

          New-Item -ItemType SymbolicLink -Path ./toctou-fixture/kill-link -Target $killTarget | Out-Null
          New-Item -ItemType SymbolicLink -Path ./toctou-fixture/name-source-link -Target $nameSourceTarget | Out-Null
          New-Item -ItemType SymbolicLink -Path ./toctou-fixture/name-destination-link -Target $nameDestinationTarget | Out-Null
          New-Item -ItemType SymbolicLink -Path ./toctou-fixture/rmdir-link -Target $rmdirTarget | Out-Null

          if ((Get-Content -Raw $killTarget) -ne 'KILL_TARGET_SAFE') { throw 'Kill target fixture is invalid before runtime test.' }
          if ((Get-Content -Raw $nameSourceTarget) -ne 'NAME_SOURCE_TARGET_SAFE') { throw 'Name source target fixture is invalid before runtime test.' }
          if ((Get-Content -Raw $nameDestinationTarget) -ne 'NAME_DEST_TARGET_SAFE') { throw 'Name destination target fixture is invalid before runtime test.' }
          if ((Get-Content -Raw (Join-Path $rmdirTarget 'keep.txt')) -ne 'RMDIR_TARGET_SAFE') { throw 'RmDir target fixture is invalid before runtime test.' }

      - name: Verify entry operations never affect symlink targets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = "./out/fileio-entry-safety${{ steps.target.outputs.ext }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/fileio-entry-symlink-safety.xps --runtime '${{ steps.target.outputs.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'File IO entry safety sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $result = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "File IO entry safety sample failed.`n$result" }
          if ($result -notcontains 'TOCTOU_ENTRY_SAFETY=DONE') { throw "Sample did not reach completion marker.`n$result" }
          if ((Get-Content -Raw ./toctou-fixture/kill-target.txt) -ne 'KILL_TARGET_SAFE') { throw 'Kill affected the symlink target.' }
          if ((Get-Content -Raw ./toctou-fixture/name-source-target.txt) -ne 'NAME_SOURCE_TARGET_SAFE') { throw 'Name affected the source symlink target.' }
          if ((Get-Content -Raw ./toctou-fixture/name-destination-target.txt) -ne 'NAME_DEST_TARGET_SAFE') { throw 'Name affected the destination symlink target.' }
          if ((Get-Content -Raw ./toctou-fixture/rmdir-target/keep.txt) -ne 'RMDIR_TARGET_SAFE') { throw 'RmDir affected the directory symlink target.' }
