name: AST UIForm Show Hide Platforms
# Push changes to this workflow deliberately retrigger the platform probe.

on:
  push:
    branches: [investigate-ast-compiler]
    paths:
      - '.github/workflows/ast-uiform-platforms.yml'
      - 'src/XPScript.Compiler/**'
      - 'src/XPScript.UI.Desktop/**'
      - 'tests/DesktopUIFormLifecycleSmoke/**'
      - 'tests/AndroidAstBackendProbe/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'tests/WebBrowserWasmSmoke/**'
      - 'tests/WebBrowserWasmBrowserSmoke/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-windows:
    name: AST UIForm Show Hide (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and run AST desktop lifecycle probe
        shell: pwsh
        run: |
          dotnet build ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
          $process = Start-Process dotnet -ArgumentList @('run', '--project', './tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj', '-c', 'Release', '--no-build', '--', '--ast-only') -PassThru -NoNewWindow
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force
            throw 'AST Windows UIForm probe timed out after 180 seconds.'
          }
          if ($process.ExitCode -ne 0) { throw "AST Windows UIForm probe failed with exit code $($process.ExitCode)." }
          dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release --no-build -- --headless-host-probe

  desktop-linux:
    name: AST UIForm Show Hide (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build and run AST desktop lifecycle probe
        run: |
          set -euo pipefail
          dotnet build ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
          timeout --kill-after=5s 180s xvfb-run -a dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release --no-build -- --ast-only
          timeout --kill-after=5s 180s dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release --no-build -- --headless-host-probe
          timeout --kill-after=5s 180s dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release --no-build -- --headless-ast-generated

  desktop-macos:
    name: AST UIForm Show Hide (macOS)
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and run AST desktop lifecycle probe
        run: |
          set -euo pipefail
          dotnet build ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
          python3 - <<'PY'
          import subprocess
          import sys
          command = [
              'dotnet', 'run', '--project', './tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj',
              '-c', 'Release', '--no-build', '--', '--ast-only'
          ]
          process = subprocess.Popen(command)
          try:
              exit_code = process.wait(timeout=180)
          except subprocess.TimeoutExpired:
              process.kill()
              process.wait()
              raise SystemExit('AST macOS UIForm probe timed out after 180 seconds.')
          if exit_code != 0:
              raise SystemExit(exit_code)
          probe = subprocess.run([
              'dotnet', 'run', '--project', './tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj',
              '-c', 'Release', '--no-build', '--', '--headless-host-probe'
          ], timeout=180)
          if probe.returncode != 0:
              raise SystemExit(probe.returncode)
          PY

  android:
    name: AST UIForm target (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build and run Android AST probe
        run: |
          set -euo pipefail
          dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
          dotnet run --project tests/AndroidAstBackendProbe/AndroidAstBackendProbe.csproj -c Release

  browser-wasm:
    name: AST browser WASM probe (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install browser WASM workload
        run: dotnet workload install wasm-tools
      - name: Build browser interaction probe
        run: dotnet build tests/WebBrowserWasmBrowserSmoke/WebBrowserWasmBrowserSmoke.csproj -c Release
      - name: Install Chromium system dependencies
        run: sudo apt-get update && sudo apt-get install -y chromium
      - name: Install Chromium for Playwright
        run: pwsh tests/WebBrowserWasmBrowserSmoke/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Run browser WASM probe
        run: dotnet run --project tests/WebBrowserWasmSmoke/WebBrowserWasmSmoke.csproj -c Release
      - name: Run browser interaction probe
        run: dotnet run --project tests/WebBrowserWasmBrowserSmoke/WebBrowserWasmBrowserSmoke.csproj -c Release --no-build
