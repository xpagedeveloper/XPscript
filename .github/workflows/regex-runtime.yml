name: Regex Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/ReferenceRuntimeExtensionsPreprocessor.cs'
      - 'src/XPScript.Compiler/ReferenceRuntimeExtensionsSource.cs'
      - 'samples/reference-runtime-batch1.xps'
      - '.github/workflows/regex-runtime.yml'
  push:
    branches:
      - 'uiform-*'
      - 'todo-*'
    paths:
      - 'src/XPScript.Compiler/ReferenceRuntimeExtensionsPreprocessor.cs'
      - 'src/XPScript.Compiler/ReferenceRuntimeExtensionsSource.cs'
      - 'samples/reference-runtime-batch1.xps'
      - '.github/workflows/regex-runtime.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile and verify regex functions
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/reference-runtime-batch1$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/reference-runtime-batch1.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Regex runtime sample compilation failed.' }
          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "Regex runtime sample failed with code $LASTEXITCODE." }
          $output | ForEach-Object { Write-Host $_ }
          foreach ($value in @(
            'REGEXVALIDATE=True',
            'REGEXINVALID=False',
            'REGEXMATCHV=12,345,7',
            'REGEXMATCHS=9,88'
          )) {
            if ($output -notcontains $value) { throw "Regex output missing: $value" }
          }
