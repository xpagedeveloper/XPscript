name: Temporary Browser Main Assembly Fix

on:
  push:
    branches: [ fix-navigation-state-handoff ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-navigation-state-handoff
      - name: Patch explicit WASM main assembly
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/XPScript.Web.Compiler/XpsBrowserWasmCompiler.cs')
          text = path.read_text()
          old = "await runMain();"
          new = "await runMain('XPScript.BrowserApp');"
          if old not in text:
              print('Patch already applied.')
          else:
              path.write_text(text.replace(old, new, 1))
      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/XPScript.Web.Compiler/XpsBrowserWasmCompiler.cs
          git commit -m "Run explicit browser WASM main assembly"
          git push origin HEAD:fix-navigation-state-handoff
