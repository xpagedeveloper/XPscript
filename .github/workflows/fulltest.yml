name: FullTest
# OpenAPI corpus trigger: use current branch workflow definition

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fulltest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-gate:
    name: Windows Gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Restore projects for license metadata
        run: dotnet restore ./XPScriptCompiler.slnx
      - name: Validate direct package notices
        shell: pwsh
        run: ./scripts/validate-license-notices.ps1
      - name: Validate removed CLI syntax
        shell: pwsh
        run: ./scripts/validate-no-legacy-cli-options.ps1

  compile-windows:
    name: Compile Windows
    needs: windows-gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile OpenAPI regression corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./out/openapi-corpus
          for fixture in ./tests/OpenApiGeneratorSmoke/fixtures/*.yaml; do
            name="$(basename "$fixture" .yaml)"
            echo "::group::OpenAPI corpus: $name"
            client="./out/openapi-corpus/$name-client.xps"
            dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi client generate "$fixture" -o "$client"
            test -f "$client"
            ! grep -qi 'UIForm' "$client"
            host="./out/openapi-corpus/$name-client-host.xps"
            cat "$client" > "$host"
            printf '\nSub Main()\nEnd Sub\n' >> "$host"
            dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- "$host" -o "./out/openapi-corpus/$name-client" --runtime=false
            server="./out/openapi-corpus/$name-server.xps"
            dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi generate "$fixture" -o "$server" --force
            test -f "$server"
            server_host="./out/openapi-corpus/$name-server-host.xps"
            grep -Ev '^\[[^]]+\]$' "$server" > "$server_host"
            printf '\nSub Main()\nEnd Sub\n' >> "$server_host"
            dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- "$server_host" -o "./out/openapi-corpus/$name-server" --runtime=false
            echo "::endgroup::"
          done
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary.exe --runtime=false
      - name: Verify generated license notice
        shell: pwsh
        run: |
          if (-not (Test-Path ./out/Third-party-license.txt)) { throw 'Missing Third-party-license.txt' }
          $notice = Get-Content ./out/Third-party-license.txt -Raw
          if ($notice -notmatch 'Apache License') { throw 'Generated notice does not contain the XPScript Apache license.' }
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured.exe --runtime=false
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom.exe --runtime=false
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom.exe
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform.exe --runtime=false
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --runtime=false --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-richtext-linked-objects-surface.xps ./out/notes-richtext.exe
      - name: Compile Notes MIME surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-mime-entity-surface.xps ./out/notes-mime.exe
      - name: Compile Notes core database surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-session-database-open-runtime-test.xps ./out/notes-core-database.exe

  fulltest-windows:
    name: Windows ${{ matrix.name }} FullTest
    needs: compile-windows
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Language
            suite: language
          - name: Notes
            suite: notes
          - name: XP Runtime
            suite: runtime
          - name: Platform
            suite: platform
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler once
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run Windows ${{ matrix.name }} FullTest
        shell: pwsh
        run: ./.github/scripts/run-fulltests.ps1 -Suite ${{ matrix.suite }}

  compile-linux:
    name: Compile Linux
    needs: fulltest-windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify debugger core
        run: dotnet run --project ./tests/DebuggerCoreProbe/DebuggerCoreProbe.csproj -c Release
      - name: Compile ArraySort regression application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/array-sort-regression.xps -o ./out/array-sort-regression --runtime=false
      - name: Run ArraySort regression application
        run: ./out/array-sort-regression
      - name: Compile CSV regression application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-csv-regression.xps -o ./out/native-csv-regression --runtime=false
      - name: Run CSV regression application
        run: ./out/native-csv-regression
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom --runtime=false
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom
      - name: Verify UIForm adversarial input security
        run: dotnet run --project ./tests/WebUIFormAdversarialSecurity/WebUIFormAdversarialSecurity.csproj -c Release
      - name: Verify UIForm asset packaging
        shell: bash
        run: |
          rm -rf ./samples/assets ./out/assets
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-create --runtime=false
          test -d ./samples/assets
          printf 'embedded-asset-payload' > ./samples/assets/embed-test.txt
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-external --runtime=false
          test "$(cat ./out/assets/embed-test.txt)" = "embedded-asset-payload"
          rm -rf ./out/assets
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-embedded --runtime=false --embed-assets
          rm -rf ./out/assets
          ./out/uiform-assets-embedded | grep -q UIFORM_ASSETS_OK
          test "$(cat ./out/assets/embed-test.txt)" = "embedded-asset-payload"
      - name: Install browser WASM workload
        run: dotnet workload install wasm-tools
      - name: Verify browser WASM multi-window UIForm
        run: dotnet run --project ./tests/WebBrowserWasmMultiWindowSmoke/WebBrowserWasmMultiWindowSmoke.csproj -c Release
      - name: Verify desktop UIForm lifecycle
        run: dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
      - name: Verify OpenAPI REST generator
        run: dotnet run --project ./tests/OpenApiGeneratorSmoke/OpenApiGeneratorSmoke.csproj -c Release
      - name: Generate OpenAPI API consumer for compile test
        run: dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi client generate ./tests/OpenApiGeneratorSmoke/client-ci.yaml -o ./out/generated-openapi-client.xps
      - name: Verify generated OpenAPI API consumer surface
        shell: bash
        run: |
          test -f ./out/generated-openapi-client.xps
          grep -q 'Public Class ClientCIApi' ./out/generated-openapi-client.xps
          grep -q 'XPJsonSchema.Parse' ./out/generated-openapi-client.xps
          grep -q 'XPJsonArray' ./out/generated-openapi-client.xps
          grep -q 'Optional Expand As Variant = Nothing' ./out/generated-openapi-client.xps
          grep -q 'Public Class ItemChoice' ./out/generated-openapi-client.xps
          grep -q 'Public Class ItemEnvelope' ./out/generated-openapi-client.xps
          grep -q 'Public Class ItemState' ./out/generated-openapi-client.xps
          ! grep -qi 'UIForm' ./out/generated-openapi-client.xps
      - name: Compile generated OpenAPI API consumer
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi-client.xps -o ./out/generated-openapi-client --runtime=false
      - name: Verify OpenAPI API consumer update and compile
        shell: bash
        run: |
          cp ./out/generated-openapi-client.xps ./out/updated-openapi-client.xps
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi client update ./tests/OpenApiGeneratorSmoke/client-ci.yaml -o ./out/updated-openapi-client.xps
          grep -q 'XPJsonSchema.Parse' ./out/updated-openapi-client.xps
          ! grep -qi 'UIForm' ./out/updated-openapi-client.xps
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/updated-openapi-client.xps -o ./out/updated-openapi-client --runtime=false
      - name: Verify OpenAPI YML API consumer generate and compile
        shell: bash
        run: |
          cp ./tests/OpenApiGeneratorSmoke/client-ci.yaml ./out/client-ci.yml
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi client generate ./out/client-ci.yml -o ./out/generated-openapi-yml-client.xps
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi-yml-client.xps -o ./out/generated-openapi-yml-client --runtime=false
      - name: Verify OpenAPI JSON API consumer generate and compile
        shell: bash
        run: |
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi client generate ./tests/OpenApiGeneratorSmoke/petstore.json -o ./out/generated-openapi-json-client.xps
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi-json-client.xps -o ./out/generated-openapi-json-client --runtime=false
      - name: Verify OpenAPI REST server generate and compile
        shell: bash
        run: |
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi generate ./tests/OpenApiGeneratorSmoke/petstore.yaml -o ./out/generated-openapi.xps --force
          test -f ./out/generated-openapi.xps
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi.xps -o ./out/generated-openapi-server --runtime=false
      - name: Verify OpenAPI REST server import and compile
        shell: bash
        run: |
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi import ./tests/OpenApiGeneratorSmoke/petstore-reimport.yaml -o ./out/generated-openapi.xps
          test -f ./out/generated-openapi.xps
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi.xps -o ./out/imported-openapi-server --runtime=false
      - name: Verify OpenAPI JSON REST server generate and compile
        shell: bash
        run: |
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi generate ./tests/OpenApiGeneratorSmoke/petstore.json -o ./out/generated-openapi-json.xps --force
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi-json.xps -o ./out/generated-openapi-json-server --runtime=false
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary --runtime=false
      - name: Verify generated license notice
        shell: bash
        run: |
          test -f ./out/Third-party-license.txt
          grep -q 'Apache License' ./out/Third-party-license.txt
      - name: Compile self-contained license notice probe
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out-selfcontained/ordinary --runtime=true
      - name: Verify self-contained .NET notices
        shell: bash
        run: |
          test -f ./out-selfcontained/Third-party-license.txt
          grep -q 'Microsoft .NET runtime bundled with this application' ./out-selfcontained/Third-party-license.txt
          grep -q '.NET third-party notices' ./out-selfcontained/Third-party-license.txt
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured --runtime=false
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform --runtime=false
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --runtime=false --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-richtext-linked-objects-surface.xps ./out/notes-richtext
      - name: Compile Notes MIME surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-mime-entity-surface.xps ./out/notes-mime
      - name: Compile Notes core database surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-session-database-open-runtime-test.xps ./out/notes-core-database

  compile-macos:
    name: Compile macOS
    needs: fulltest-windows
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary --runtime=false
      - name: Verify generated license notice
        run: |
          test -f ./out/Third-party-license.txt
          grep -q 'Apache License' ./out/Third-party-license.txt
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured --runtime=false
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom --runtime=false
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform --runtime=false
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --runtime=false --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-richtext-linked-objects-surface.xps ./out/notes-richtext
      - name: Compile Notes MIME surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-mime-entity-surface.xps ./out/notes-mime
      - name: Compile Notes core database surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-session-database-open-runtime-test.xps ./out/notes-core-database

  fulltest-unix:
    name: ${{ matrix.name }} FullTest
    needs: [compile-linux, compile-macos]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler once
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run all ${{ matrix.name }} FullTests
        shell: pwsh
        run: ./.github/scripts/run-fulltests.ps1
 "$server" > "$server_host"
            printf '\nSub Main()\nEnd Sub\n' >> "$server_host"
            dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- "$server_host" -o "./out/openapi-corpus/$name-server" --runtime=false
            echo "::endgroup::"
          done
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary.exe --runtime=false
      - name: Verify generated license notice
        shell: pwsh
        run: |
          if (-not (Test-Path ./out/Third-party-license.txt)) { throw 'Missing Third-party-license.txt' }
          $notice = Get-Content ./out/Third-party-license.txt -Raw
          if ($notice -notmatch 'Apache License') { throw 'Generated notice does not contain the XPScript Apache license.' }
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured.exe --runtime=false
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom.exe --runtime=false
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom.exe
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform.exe --runtime=false
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --runtime=false --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-richtext-linked-objects-surface.xps ./out/notes-richtext.exe
      - name: Compile Notes MIME surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-mime-entity-surface.xps ./out/notes-mime.exe
      - name: Compile Notes core database surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-session-database-open-runtime-test.xps ./out/notes-core-database.exe

  fulltest-windows:
    name: Windows ${{ matrix.name }} FullTest
    needs: compile-windows
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Language
            suite: language
          - name: Notes
            suite: notes
          - name: XP Runtime
            suite: runtime
          - name: Platform
            suite: platform
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler once
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run Windows ${{ matrix.name }} FullTest
        shell: pwsh
        run: ./.github/scripts/run-fulltests.ps1 -Suite ${{ matrix.suite }}

  compile-linux:
    name: Compile Linux
    needs: fulltest-windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify debugger core
        run: dotnet run --project ./tests/DebuggerCoreProbe/DebuggerCoreProbe.csproj -c Release
      - name: Compile ArraySort regression application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/array-sort-regression.xps -o ./out/array-sort-regression --runtime=false
      - name: Run ArraySort regression application
        run: ./out/array-sort-regression
      - name: Compile CSV regression application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-csv-regression.xps -o ./out/native-csv-regression --runtime=false
      - name: Run CSV regression application
        run: ./out/native-csv-regression
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom --runtime=false
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom
      - name: Verify UIForm adversarial input security
        run: dotnet run --project ./tests/WebUIFormAdversarialSecurity/WebUIFormAdversarialSecurity.csproj -c Release
      - name: Verify UIForm asset packaging
        shell: bash
        run: |
          rm -rf ./samples/assets ./out/assets
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-create --runtime=false
          test -d ./samples/assets
          printf 'embedded-asset-payload' > ./samples/assets/embed-test.txt
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-external --runtime=false
          test "$(cat ./out/assets/embed-test.txt)" = "embedded-asset-payload"
          rm -rf ./out/assets
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-assets-regression.xps -o ./out/uiform-assets-embedded --runtime=false --embed-assets
          rm -rf ./out/assets
          ./out/uiform-assets-embedded | grep -q UIFORM_ASSETS_OK
          test "$(cat ./out/assets/embed-test.txt)" = "embedded-asset-payload"
      - name: Install browser WASM workload
        run: dotnet workload install wasm-tools
      - name: Verify browser WASM multi-window UIForm
        run: dotnet run --project ./tests/WebBrowserWasmMultiWindowSmoke/WebBrowserWasmMultiWindowSmoke.csproj -c Release
      - name: Verify desktop UIForm lifecycle
        run: dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
      - name: Verify OpenAPI REST generator
        run: dotnet run --project ./tests/OpenApiGeneratorSmoke/OpenApiGeneratorSmoke.csproj -c Release
      - name: Generate OpenAPI API consumer for compile test
        run: dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi client generate ./tests/OpenApiGeneratorSmoke/client-ci.yaml -o ./out/generated-openapi-client.xps
      - name: Verify generated OpenAPI API consumer surface
        shell: bash
        run: |
          test -f ./out/generated-openapi-client.xps
          grep -q 'Public Class ClientCIApi' ./out/generated-openapi-client.xps
          grep -q 'XPJsonSchema.Parse' ./out/generated-openapi-client.xps
          grep -q 'XPJsonArray' ./out/generated-openapi-client.xps
          grep -q 'Optional Expand As Variant = Nothing' ./out/generated-openapi-client.xps
          grep -q 'Public Class ItemChoice' ./out/generated-openapi-client.xps
          grep -q 'Public Class ItemEnvelope' ./out/generated-openapi-client.xps
          grep -q 'Public Class ItemState' ./out/generated-openapi-client.xps
          ! grep -qi 'UIForm' ./out/generated-openapi-client.xps
      - name: Compile generated OpenAPI API consumer
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi-client.xps -o ./out/generated-openapi-client --runtime=false
      - name: Verify OpenAPI API consumer update and compile
        shell: bash
        run: |
          cp ./out/generated-openapi-client.xps ./out/updated-openapi-client.xps
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi client update ./tests/OpenApiGeneratorSmoke/client-ci.yaml -o ./out/updated-openapi-client.xps
          grep -q 'XPJsonSchema.Parse' ./out/updated-openapi-client.xps
          ! grep -qi 'UIForm' ./out/updated-openapi-client.xps
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/updated-openapi-client.xps -o ./out/updated-openapi-client --runtime=false
      - name: Verify OpenAPI YML API consumer generate and compile
        shell: bash
        run: |
          cp ./tests/OpenApiGeneratorSmoke/client-ci.yaml ./out/client-ci.yml
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi client generate ./out/client-ci.yml -o ./out/generated-openapi-yml-client.xps
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi-yml-client.xps -o ./out/generated-openapi-yml-client --runtime=false
      - name: Verify OpenAPI JSON API consumer generate and compile
        shell: bash
        run: |
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi client generate ./tests/OpenApiGeneratorSmoke/petstore.json -o ./out/generated-openapi-json-client.xps
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi-json-client.xps -o ./out/generated-openapi-json-client --runtime=false
      - name: Verify OpenAPI REST server generate and compile
        shell: bash
        run: |
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi generate ./tests/OpenApiGeneratorSmoke/petstore.yaml -o ./out/generated-openapi.xps --force
          test -f ./out/generated-openapi.xps
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi.xps -o ./out/generated-openapi-server --runtime=false
      - name: Verify OpenAPI REST server import and compile
        shell: bash
        run: |
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi import ./tests/OpenApiGeneratorSmoke/petstore-reimport.yaml -o ./out/generated-openapi.xps
          test -f ./out/generated-openapi.xps
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi.xps -o ./out/imported-openapi-server --runtime=false
      - name: Verify OpenAPI JSON REST server generate and compile
        shell: bash
        run: |
          dotnet run --project ./src/XPScript.Cli/XPScript.Cli.csproj -c Release -p:SkipUnifiedPublish=true -- openapi generate ./tests/OpenApiGeneratorSmoke/petstore.json -o ./out/generated-openapi-json.xps --force
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./out/generated-openapi-json.xps -o ./out/generated-openapi-json-server --runtime=false
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary --runtime=false
      - name: Verify generated license notice
        shell: bash
        run: |
          test -f ./out/Third-party-license.txt
          grep -q 'Apache License' ./out/Third-party-license.txt
      - name: Compile self-contained license notice probe
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out-selfcontained/ordinary --runtime=true
      - name: Verify self-contained .NET notices
        shell: bash
        run: |
          test -f ./out-selfcontained/Third-party-license.txt
          grep -q 'Microsoft .NET runtime bundled with this application' ./out-selfcontained/Third-party-license.txt
          grep -q '.NET third-party notices' ./out-selfcontained/Third-party-license.txt
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured --runtime=false
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform --runtime=false
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --runtime=false --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-richtext-linked-objects-surface.xps ./out/notes-richtext
      - name: Compile Notes MIME surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-mime-entity-surface.xps ./out/notes-mime
      - name: Compile Notes core database surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-session-database-open-runtime-test.xps ./out/notes-core-database

  compile-macos:
    name: Compile macOS
    needs: fulltest-windows
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile ordinary application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hello.xps -o ./out/ordinary --runtime=false
      - name: Verify generated license notice
        run: |
          test -f ./out/Third-party-license.txt
          grep -q 'Apache License' ./out/Third-party-license.txt
      - name: Compile XPAi structured output
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai-structured-output.xps -o ./out/xpai-structured --runtime=false
      - name: Compile native XML DOM regression
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-xml-dom-regression.xps -o ./out/native-xml-dom --runtime=false
      - name: Run native XML DOM regression
        run: ./out/native-xml-dom
      - name: Compile UIForm application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/uiform-remote-search.xps -o ./out/uiform --runtime=false
      - name: Compile web application
        run: dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/webiis/main.xps --target webiis --runtime=false --output ./out/web
      - name: Compile Notes rich-text surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-richtext-linked-objects-surface.xps ./out/notes-richtext
      - name: Compile Notes MIME surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-mime-entity-surface.xps ./out/notes-mime
      - name: Compile Notes core database surface
        run: dotnet run --project ./tests/NotesRichTextDiagnostic/NotesRichTextDiagnostic.csproj -c Release -- ./samples/notes-session-database-open-runtime-test.xps ./out/notes-core-database

  fulltest-unix:
    name: ${{ matrix.name }} FullTest
    needs: [compile-linux, compile-macos]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler once
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run all ${{ matrix.name }} FullTests
        shell: pwsh
        run: ./.github/scripts/run-fulltests.ps1
