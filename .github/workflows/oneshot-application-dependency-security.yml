name: One-shot application dependency security implementation

on:
  push:
    branches:
      - feature/application-dependency-security

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/application-dependency-security
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Patch compiler security audit integration
        shell: python
        run: |
          from pathlib import Path

          driver_path = Path('src/XPScript.Compiler/CompilerDriver.cs')
          driver = driver_path.read_text(encoding='utf-8')

          needle = '''            var stdout = await stdoutTask; var stderr = await stderrTask;\n\n            if (process.ExitCode != 0)'''
          replacement = '''            var stdout = await stdoutTask; var stderr = await stderrTask;\n            ApplicationSecurityAudit.Report(stdout + Environment.NewLine + stderr);\n\n            if (process.ExitCode != 0)'''
          count = driver.count(needle)
          if count != 2:
              raise SystemExit(f'Expected 2 compiler build output sites, found {count}')
          driver = driver.replace(needle, replacement)

          needle = '''    <CopyLocalLockFileAssemblies>true</CopyLocalLockFileAssemblies>\n    <RuntimeIdentifier>{runtimeIdentifier}</RuntimeIdentifier>'''
          replacement = '''    <CopyLocalLockFileAssemblies>true</CopyLocalLockFileAssemblies>\n    <NuGetAudit>true</NuGetAudit>\n    <NuGetAuditMode>all</NuGetAuditMode>\n    <NuGetAuditLevel>low</NuGetAuditLevel>\n    <WarningsNotAsErrors>NU1901;NU1902;NU1903;NU1904;$(WarningsNotAsErrors)</WarningsNotAsErrors>\n    <RuntimeIdentifier>{runtimeIdentifier}</RuntimeIdentifier>'''
          if needle not in driver:
              raise SystemExit('Compiler generated-project property anchor not found')
          driver = driver.replace(needle, replacement, 1)
          driver_path.write_text(driver, encoding='utf-8')

          run_path = Path('src/XPScript.Compiler/RunCompiler.cs')
          run = run_path.read_text(encoding='utf-8')

          needle = '''            await File.WriteAllTextAsync(projectPath, BuildProject(references), cancellationToken).ConfigureAwait(false);'''
          replacement = '''            var usesMimeKit = generatedSource.Contains("MimeKit.", StringComparison.Ordinal);\n            await File.WriteAllTextAsync(projectPath, BuildProject(references, usesMimeKit), cancellationToken).ConfigureAwait(false);'''
          if needle not in run:
              raise SystemExit('RunCompiler BuildProject call anchor not found')
          run = run.replace(needle, replacement, 1)

          needle = '''            var build = await ExecuteBuildAsync(tempRoot, projectPath, outputRoot, cancellationToken).ConfigureAwait(false);\n            if (build.ExitCode != 0)'''
          replacement = '''            var build = await ExecuteBuildAsync(tempRoot, projectPath, outputRoot, cancellationToken).ConfigureAwait(false);\n            ApplicationSecurityAudit.Report(build.Stdout + Environment.NewLine + build.Stderr);\n            if (build.ExitCode != 0)'''
          if needle not in run:
              raise SystemExit('RunCompiler build result anchor not found')
          run = run.replace(needle, replacement, 1)

          needle = '''    private static string BuildProject(IReadOnlyList<(string Name, string Path)> references)'''
          replacement = '''    private static string BuildProject(IReadOnlyList<(string Name, string Path)> references, bool usesMimeKit)'''
          if needle not in run:
              raise SystemExit('RunCompiler BuildProject signature anchor not found')
          run = run.replace(needle, replacement, 1)

          needle = '''        return $"""\n<Project Sdk="Microsoft.NET.Sdk">\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n    <StartupObject>Program</StartupObject>\n    <TargetFramework>net10.0</TargetFramework>\n    <ImplicitUsings>enable</ImplicitUsings>\n    <Nullable>enable</Nullable>\n    <CopyLocalLockFileAssemblies>true</CopyLocalLockFileAssemblies>\n    <UseAppHost>false</UseAppHost>\n  </PropertyGroup>\n  <ItemGroup>\n    <PackageReference Include="MimeKit" Version="4.17.0" />\n  </ItemGroup>\n{items}</Project>\n""";'''
          replacement = '''        var packageItems = usesMimeKit\n            ? "  <ItemGroup>\\n    <PackageReference Include=\\\"MimeKit\\\" Version=\\\"4.17.0\\\" />\\n  </ItemGroup>\\n"\n            : string.Empty;\n\n        return $"""\n<Project Sdk="Microsoft.NET.Sdk">\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n    <StartupObject>Program</StartupObject>\n    <TargetFramework>net10.0</TargetFramework>\n    <ImplicitUsings>enable</ImplicitUsings>\n    <Nullable>enable</Nullable>\n    <CopyLocalLockFileAssemblies>true</CopyLocalLockFileAssemblies>\n    <UseAppHost>false</UseAppHost>\n    <NuGetAudit>true</NuGetAudit>\n    <NuGetAuditMode>all</NuGetAuditMode>\n    <NuGetAuditLevel>low</NuGetAuditLevel>\n    <WarningsNotAsErrors>NU1901;NU1902;NU1903;NU1904;$(WarningsNotAsErrors)</WarningsNotAsErrors>\n  </PropertyGroup>\n{packageItems}{items}</Project>\n""";'''
          if needle not in run:
              raise SystemExit('RunCompiler project template anchor not found')
          run = run.replace(needle, replacement, 1)
          run_path.write_text(run, encoding='utf-8')

      - name: Build compiler
        run: dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --nologo

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/oneshot-application-dependency-security.yml
          git add src/XPScript.Compiler/ApplicationSecurityAudit.cs src/XPScript.Compiler/CompilerDriver.cs src/XPScript.Compiler/RunCompiler.cs .github/workflows/oneshot-application-dependency-security.yml
          git commit -m "Implement application-scoped dependency security audit"
          git push origin HEAD:feature/application-dependency-security
