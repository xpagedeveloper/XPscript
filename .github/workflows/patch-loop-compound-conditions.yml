name: Patch Loop Compound Conditions

on:
  push:
    branches: [todo-statement-layout-audit]
    paths:
      - '.github/workflows/patch-loop-compound-conditions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply loop condition patch
        run: python tools/patch-loop-compound-conditions.py
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/patch-loop-compound-conditions.yml
          rm tools/patch-loop-compound-conditions.py
          git config user.name "xpagedeveloper"
          git config user.email "fredrik@xpagedeveloper.com"
          git add -A
          git commit -m "Lower compound comparisons in loop conditions"
          git push
