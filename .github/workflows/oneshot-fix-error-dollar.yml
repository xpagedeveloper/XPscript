name: Fix Error dollar rewrite
on:
  push:
    branches:
      - feature/per-client-tls-validation
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/per-client-tls-validation
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python3 scripts/fix-error-dollar.py
      - run: dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/XPScript.Compiler/CoreCompatibilityTranspiler.cs
          git commit -m 'Fix standalone Error dollar expression rewriting'
          git push origin HEAD:feature/per-client-tls-validation
