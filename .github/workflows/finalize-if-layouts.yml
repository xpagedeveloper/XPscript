name: Finalize If Layouts Branch

on:
  push:
    branches: [todo-if-layouts]
    paths:
      - 'tools/finalize-if-layouts.py'
      - '.github/workflows/finalize-if-layouts.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-if-layouts
      - name: Update TODO and documentation
        run: python ./tools/finalize-if-layouts.py
      - name: Remove temporary patch/test files and commit
        shell: pwsh
        run: |
          git rm .github/workflows/if-layouts-temp.yml
          git rm .github/workflows/patch-if-layouts.yml
          git rm .github/workflows/patch-if-layout-order.yml
          git rm .github/workflows/patch-inline-elseif.yml
          git rm .github/workflows/finalize-if-layouts.yml
          git rm tools/patch-if-layouts.py
          git rm tools/patch-if-layout-order.py
          git rm tools/patch-inline-elseif.py
          git rm tools/finalize-if-layouts.py
          git config user.name 'xpagedeveloper'
          git config user.email 'fredrik@xpagedeveloper.com'
          git add todo/runtime-reference-todo.md docs/core-language.md
          git commit -m 'Finalize If statement layout support'
          git push origin HEAD:todo-if-layouts
