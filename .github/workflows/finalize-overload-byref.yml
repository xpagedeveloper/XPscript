name: Finalize Overload ByRef TODO

on:
  push:
    branches: [todo-overload-byref]
    paths:
      - '.github/workflows/finalize-overload-byref.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-overload-byref
      - name: Mark overload follow-ups verified
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('todo/runtime-reference-todo.md')
          s = p.read_text(encoding='utf-8')
          old = '- [>] class overload follow-ups for array/scalar overload end-to-end coverage and scalar `ByRef`; detailed checklist: `todo/function-sub-overloading-todo.md`'
          new = '- [x] class overload follow-ups for array/scalar overload end-to-end coverage and scalar `ByRef`; detailed checklist: `todo/function-sub-overloading-todo.md`'
          if old not in s:
              raise SystemExit('Overload follow-up TODO line not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit TODO sync
        shell: bash
        run: |
          git config user.name "xpagedeveloper"
          git config user.email "fredrik@xpagedeveloper.com"
          git add todo/runtime-reference-todo.md
          git commit -m "Mark class overload follow-ups verified"
          git push origin HEAD:todo-overload-byref
