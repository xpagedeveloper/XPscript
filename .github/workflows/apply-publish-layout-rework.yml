name: Apply publish layout rework

on:
  push:
    branches:
      - publish-layout-rework

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[publish-layout-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix compile-only migration anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-publish-layout-rework.py')
          s = p.read_text(encoding='utf-8')
          old = '''replace_exact(path,\n''' + "'''            using var securityScope = ApplicationSecurityModeContext.Push(effectiveSecurityMode);\\n            using var diagnosticMode = CompilerDiagnosticMode.Push(debug);'''" + ''',\n''' + "'''            using var securityScope = ApplicationSecurityModeContext.Push(effectiveSecurityMode);\\n            using var diagnosticMode = CompilerDiagnosticMode.Push(debug);\\n            using var publishLayoutScope = CompilePublishLayoutContext.Push(singleFile, selfContained);''')"
          new = '''replace_exact(path,\n''' + "'''            using var securityScope = ApplicationSecurityModeContext.Push(effectiveSecurityMode);\\n            using var diagnosticMode = CompilerDiagnosticMode.Push(debug);\\n            var timer = Stopwatch.StartNew();'''" + ''',\n''' + "'''            using var securityScope = ApplicationSecurityModeContext.Push(effectiveSecurityMode);\\n            using var diagnosticMode = CompilerDiagnosticMode.Push(debug);\\n            using var publishLayoutScope = CompilePublishLayoutContext.Push(singleFile, selfContained);\\n            var timer = Stopwatch.StartNew();''')"
          if old not in s:
              raise SystemExit('compile-only migration anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply source and documentation changes
        run: python3 scripts/apply-publish-layout-rework.py
      - name: Remove one-time migration files
        run: |
          rm scripts/apply-publish-layout-rework.py
          rm .github/workflows/apply-publish-layout-rework.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Rework compile single-file and runtime options [publish-layout-applied]"
          git push origin HEAD:publish-layout-rework
