name: Persistent Web Cache Patch
on:
  push:
    branches: [session-defaults-role-restoration]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[persistent-web-cache-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: session-defaults-role-restoration
      - shell: python
        run: |
          from pathlib import Path

          # Compilation cache options and disk lookup path.
          p=Path('src/XPScript.Web.Compiler/XpsWebCompilationCache.cs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('using System.Diagnostics;\n','using System.Diagnostics;\nusing System.Security.Cryptography;\nusing System.Text;\n')
          s=s.replace('    public string ConfigurationIdentity { get; init; } = "default";\n','''    public string ConfigurationIdentity { get; init; } = "default";\n    public bool EnablePersistentCache { get; init; } = true;\n    public string? PersistentCacheDirectory { get; init; }\n''')
          s=s.replace('''        if (string.IsNullOrWhiteSpace(ConfigurationIdentity) || ConfigurationIdentity.Length > 512)\n            throw new ArgumentException("ConfigurationIdentity must contain 1 to 512 characters.", nameof(ConfigurationIdentity));\n''','''        if (string.IsNullOrWhiteSpace(ConfigurationIdentity) || ConfigurationIdentity.Length > 512)\n            throw new ArgumentException("ConfigurationIdentity must contain 1 to 512 characters.", nameof(ConfigurationIdentity));\n        if (PersistentCacheDirectory is not null && string.IsNullOrWhiteSpace(PersistentCacheDirectory))\n            throw new ArgumentException("PersistentCacheDirectory cannot be empty when specified.", nameof(PersistentCacheDirectory));\n''')
          old='''    private async Task<XpsCompiledWebUnit> CompileMeasuredAsync(\n        string fullPath,\n        string fullSiteRoot,\n        string runtimeIdentifier,\n        XPScriptCompilationSnapshot expectedSnapshot)\n    {\n        Interlocked.Increment(ref _compilationStarts);\n        var started = Stopwatch.GetTimestamp();\n        try\n        {\n            return await CompileAndVerifyAsync(fullPath, fullSiteRoot, runtimeIdentifier, expectedSnapshot).ConfigureAwait(false);\n        }\n        catch\n        {\n            Interlocked.Increment(ref _compilationFailures);\n            throw;\n        }\n        finally\n        {\n            var elapsed = Stopwatch.GetElapsedTime(started);\n            Interlocked.Add(ref _compilationDurationTicks, Math.Max(0, elapsed.Ticks));\n        }\n    }\n\n    private async Task<XpsCompiledWebUnit> CompileAndVerifyAsync(\n        string fullPath,\n        string fullSiteRoot,\n        string runtimeIdentifier,\n        XPScriptCompilationSnapshot expectedSnapshot)\n    {\n        var unit = await _compiler.CompileAsync(fullPath, fullSiteRoot, CancellationToken.None).ConfigureAwait(false);\n'''
          new='''    private async Task<XpsCompiledWebUnit> CompileMeasuredAsync(\n        string fullPath,\n        string fullSiteRoot,\n        string runtimeIdentifier,\n        XPScriptCompilationSnapshot expectedSnapshot)\n    {\n        var persistentCacheDirectory = ResolvePersistentCacheDirectory(fullSiteRoot);\n        if (persistentCacheDirectory is not null)\n        {\n            var persisted = await _compiler.TryLoadPersistentAsync(\n                fullPath, fullSiteRoot, expectedSnapshot.Identity, persistentCacheDirectory, CancellationToken.None).ConfigureAwait(false);\n            if (persisted is not null) return persisted;\n        }\n\n        Interlocked.Increment(ref _compilationStarts);\n        var started = Stopwatch.GetTimestamp();\n        try\n        {\n            return await CompileAndVerifyAsync(fullPath, fullSiteRoot, runtimeIdentifier, expectedSnapshot, persistentCacheDirectory).ConfigureAwait(false);\n        }\n        catch\n        {\n            Interlocked.Increment(ref _compilationFailures);\n            throw;\n        }\n        finally\n        {\n            var elapsed = Stopwatch.GetElapsedTime(started);\n            Interlocked.Add(ref _compilationDurationTicks, Math.Max(0, elapsed.Ticks));\n        }\n    }\n\n    private string? ResolvePersistentCacheDirectory(string fullSiteRoot)\n    {\n        if (!_options.EnablePersistentCache) return null;\n        if (!string.IsNullOrWhiteSpace(_options.PersistentCacheDirectory))\n            return Path.GetFullPath(_options.PersistentCacheDirectory);\n\n        var localData = Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData);\n        if (string.IsNullOrWhiteSpace(localData)) localData = Path.GetTempPath();\n        var normalizedRoot = Path.TrimEndingDirectorySeparator(Path.GetFullPath(fullSiteRoot)).Replace('\\\\', '/');\n        var siteHash = Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(normalizedRoot))).ToLowerInvariant();\n        return Path.Combine(localData, "XPScript", "web-cache", siteHash);\n    }\n\n    private async Task<XpsCompiledWebUnit> CompileAndVerifyAsync(\n        string fullPath,\n        string fullSiteRoot,\n        string runtimeIdentifier,\n        XPScriptCompilationSnapshot expectedSnapshot,\n        string? persistentCacheDirectory)\n    {\n        var unit = persistentCacheDirectory is null\n            ? await _compiler.CompileAsync(fullPath, fullSiteRoot, CancellationToken.None).ConfigureAwait(false)\n            : await _compiler.CompileAndPersistAsync(fullPath, fullSiteRoot, expectedSnapshot.Identity, persistentCacheDirectory, CancellationToken.None).ConfigureAwait(false);\n'''
          if old not in s: raise SystemExit('cache compile block target missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Compiler can load and persist generated DLL/PDB artifacts.
          p=Path('src/XPScript.Web.Compiler/XpsWebCompiler.cs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('using System.Security;\n','using System.Security;\nusing System.Security.Cryptography;\nusing System.Text;\n')
          old='''    public async Task<XpsCompiledWebUnit> CompileAsync(string sourcePath, string allowedSourceRoot, CancellationToken cancellationToken = default)\n    {\n'''
          new='''    public Task<XpsCompiledWebUnit> CompileAsync(string sourcePath, string allowedSourceRoot, CancellationToken cancellationToken = default)\n        => CompileCoreAsync(sourcePath, allowedSourceRoot, null, null, cancellationToken);\n\n    internal Task<XpsCompiledWebUnit> CompileAndPersistAsync(\n        string sourcePath,\n        string allowedSourceRoot,\n        string snapshotIdentity,\n        string persistentCacheDirectory,\n        CancellationToken cancellationToken = default)\n        => CompileCoreAsync(sourcePath, allowedSourceRoot, snapshotIdentity, persistentCacheDirectory, cancellationToken);\n\n    internal async Task<XpsCompiledWebUnit?> TryLoadPersistentAsync(\n        string sourcePath,\n        string allowedSourceRoot,\n        string snapshotIdentity,\n        string persistentCacheDirectory,\n        CancellationToken cancellationToken = default)\n    {\n        ArgumentException.ThrowIfNullOrWhiteSpace(sourcePath);\n        ArgumentException.ThrowIfNullOrWhiteSpace(allowedSourceRoot);\n        ArgumentException.ThrowIfNullOrWhiteSpace(snapshotIdentity);\n        ArgumentException.ThrowIfNullOrWhiteSpace(persistentCacheDirectory);\n\n        var fullSourcePath = Path.GetFullPath(sourcePath);\n        var fullSourceRoot = Path.GetFullPath(allowedSourceRoot);\n        if (!File.Exists(fullSourcePath)) return null;\n        var source = await File.ReadAllTextAsync(fullSourcePath, cancellationToken).ConfigureAwait(false);\n        var parsed = new XpsWebRouteMetadataParser().Parse(source);\n        if (string.Equals(parsed.Platform, "browser-wasm", StringComparison.OrdinalIgnoreCase) || parsed.Routes.Count == 0) return null;\n\n        var artifactDirectory = PersistentArtifactDirectory(persistentCacheDirectory, fullSourceRoot, fullSourcePath, snapshotIdentity);\n        var assemblyPath = Path.Combine(artifactDirectory, "XPScript.WebUnit.dll");\n        if (!File.Exists(assemblyPath)) return null;\n\n        try\n        {\n            var assemblyBytes = await File.ReadAllBytesAsync(assemblyPath, cancellationToken).ConfigureAwait(false);\n            var pdbPath = Path.Combine(artifactDirectory, "XPScript.WebUnit.pdb");\n            var pdbBytes = File.Exists(pdbPath) ? await File.ReadAllBytesAsync(pdbPath, cancellationToken).ConfigureAwait(false) : null;\n            return LoadCompiledUnit(assemblyBytes, pdbBytes, parsed);\n        }\n        catch (Exception ex) when (ex is IOException or UnauthorizedAccessException or BadImageFormatException or XpsWebCompilationException)\n        {\n            try { Directory.Delete(artifactDirectory, recursive: true); } catch { }\n            return null;\n        }\n    }\n\n    private async Task<XpsCompiledWebUnit> CompileCoreAsync(\n        string sourcePath,\n        string allowedSourceRoot,\n        string? snapshotIdentity,\n        string? persistentCacheDirectory,\n        CancellationToken cancellationToken = default)\n    {\n'''
          if old not in s: raise SystemExit('compiler overload target missing')
          s=s.replace(old,new,1)
          old='''            var loadContext = new AssemblyLoadContext("XPScriptWeb-" + Guid.NewGuid().ToString("N"), isCollectible: true);\n            loadContext.Resolving += ResolveSharedAssembly;\n            try\n            {\n                using var assemblyStream = new MemoryStream(assemblyBytes, writable: false);\n                Assembly assembly;\n                if (pdbBytes is not null)\n                {\n                    using var pdbStream = new MemoryStream(pdbBytes, writable: false);\n                    assembly = loadContext.LoadFromStream(assemblyStream, pdbStream);\n                }\n                else assembly = loadContext.LoadFromStream(assemblyStream);\n                ValidateCompiledRoutes(assembly, parsed.Routes);\n                return new XpsCompiledWebUnit(loadContext, assembly, parsed.Routes, parsed.PrecompileTargets);\n            }\n            catch\n            {\n                loadContext.Resolving -= ResolveSharedAssembly;\n                loadContext.Unload();\n                throw;\n            }\n'''
          new='''            if (!string.IsNullOrWhiteSpace(snapshotIdentity) && !string.IsNullOrWhiteSpace(persistentCacheDirectory))\n                await PersistArtifactAsync(persistentCacheDirectory, fullSourceRoot, fullSourcePath, snapshotIdentity, assemblyBytes, pdbBytes, cancellationToken).ConfigureAwait(false);\n\n            return LoadCompiledUnit(assemblyBytes, pdbBytes, parsed);\n'''
          if old not in s: raise SystemExit('compiler load block target missing')
          s=s.replace(old,new,1)
          marker='''    private static async Task<XpsCompiledWebUnit> CompileBrowserWasmAsync'''
          helpers='''    private static XpsCompiledWebUnit LoadCompiledUnit(byte[] assemblyBytes, byte[]? pdbBytes, XpsWebRouteParseResult parsed)\n    {\n        var loadContext = new AssemblyLoadContext("XPScriptWeb-" + Guid.NewGuid().ToString("N"), isCollectible: true);\n        loadContext.Resolving += ResolveSharedAssembly;\n        try\n        {\n            using var assemblyStream = new MemoryStream(assemblyBytes, writable: false);\n            Assembly assembly;\n            if (pdbBytes is not null)\n            {\n                using var pdbStream = new MemoryStream(pdbBytes, writable: false);\n                assembly = loadContext.LoadFromStream(assemblyStream, pdbStream);\n            }\n            else assembly = loadContext.LoadFromStream(assemblyStream);\n            ValidateCompiledRoutes(assembly, parsed.Routes);\n            return new XpsCompiledWebUnit(loadContext, assembly, parsed.Routes, parsed.PrecompileTargets);\n        }\n        catch\n        {\n            loadContext.Resolving -= ResolveSharedAssembly;\n            loadContext.Unload();\n            throw;\n        }\n    }\n\n    private static string PersistentArtifactDirectory(string cacheRoot, string siteRoot, string sourcePath, string snapshotIdentity)\n    {\n        var sourceKey = HashText(Path.GetFullPath(siteRoot) + "\\0" + Path.GetFullPath(sourcePath));\n        var compilerVersion = typeof(XpsWebCompiler).Assembly.GetName().Version?.ToString() ?? "unknown";\n        var identityKey = HashText(snapshotIdentity + "\\0" + compilerVersion);\n        return Path.Combine(Path.GetFullPath(cacheRoot), sourceKey, identityKey);\n    }\n\n    private static string HashText(string value)\n        => Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(value))).ToLowerInvariant();\n\n    private static async Task PersistArtifactAsync(\n        string cacheRoot, string siteRoot, string sourcePath, string snapshotIdentity, byte[] assemblyBytes, byte[]? pdbBytes, CancellationToken cancellationToken)\n    {\n        var artifactDirectory = PersistentArtifactDirectory(cacheRoot, siteRoot, sourcePath, snapshotIdentity);\n        Directory.CreateDirectory(artifactDirectory);\n        await WriteAtomicAsync(Path.Combine(artifactDirectory, "XPScript.WebUnit.dll"), assemblyBytes, cancellationToken).ConfigureAwait(false);\n        if (pdbBytes is not null)\n            await WriteAtomicAsync(Path.Combine(artifactDirectory, "XPScript.WebUnit.pdb"), pdbBytes, cancellationToken).ConfigureAwait(false);\n\n        var sourceDirectory = Directory.GetParent(artifactDirectory)?.FullName;\n        if (sourceDirectory is null) return;\n        foreach (var directory in Directory.EnumerateDirectories(sourceDirectory))\n        {\n            if (Path.GetFullPath(directory).Equals(Path.GetFullPath(artifactDirectory), OperatingSystem.IsWindows() ? StringComparison.OrdinalIgnoreCase : StringComparison.Ordinal)) continue;\n            try { Directory.Delete(directory, recursive: true); } catch { }\n        }\n    }\n\n    private static async Task WriteAtomicAsync(string path, byte[] bytes, CancellationToken cancellationToken)\n    {\n        var temp = path + ".tmp-" + Guid.NewGuid().ToString("N");\n        try\n        {\n            await File.WriteAllBytesAsync(temp, bytes, cancellationToken).ConfigureAwait(false);\n            File.Move(temp, path, overwrite: true);\n        }\n        finally\n        {\n            try { if (File.Exists(temp)) File.Delete(temp); } catch { }\n        }\n    }\n\n'''
          if marker not in s: raise SystemExit('compiler helper insertion target missing')
          s=s.replace(marker,helpers+marker,1)
          p.write_text(s,encoding='utf-8')

          # Add restart persistence and invalidation regression.
          p=Path('tests/WebPrecompileSmoke/Program.cs')
          s=p.read_text(encoding='utf-8')
          marker='''    using var capturedError = new StringWriter();\n'''
          test='''    var persistentCacheDirectory = Path.Combine(parent, "persistent-cache");\n    var persistentSource = Path.Combine(root, "persistent.xps");\n    await File.WriteAllTextAsync(persistentSource, """\n[Anonymous]\n[Get]\nSub Index()\n    Response.Write("persistent-v1")\nEnd Sub\n""");\n    var persistentOptions = new XpsWebCompilationCacheOptions\n    {\n        MaxEntries = 8,\n        MaxSourceBytes = 1024 * 1024,\n        IdleTtl = TimeSpan.FromMinutes(5),\n        FailureBackoff = TimeSpan.FromSeconds(2),\n        ConfigurationIdentity = "persistent-restart-smoke-v1",\n        PersistentCacheDirectory = persistentCacheDirectory\n    };\n    await using (var firstPersistentCache = new XpsWebCompilationCache(new XpsWebCompiler(), persistentOptions))\n    {\n        await using var lease = await firstPersistentCache.AcquireAsync(persistentSource, root);\n        if (firstPersistentCache.CompilationStarts != 1) throw new Exception("Initial persistent page compile did not compile exactly once.");\n    }\n    await using (var restartedPersistentCache = new XpsWebCompilationCache(new XpsWebCompiler(), persistentOptions))\n    {\n        await using var lease = await restartedPersistentCache.AcquireAsync(persistentSource, root);\n        if (restartedPersistentCache.CompilationStarts != 0) throw new Exception("Persistent precompile artifact was not reused after cache/server restart.");\n    }\n    await File.AppendAllTextAsync(persistentSource, Environment.NewLine + "' changed");\n    await using (var changedPersistentCache = new XpsWebCompilationCache(new XpsWebCompiler(), persistentOptions))\n    {\n        await using var lease = await changedPersistentCache.AcquireAsync(persistentSource, root);\n        if (changedPersistentCache.CompilationStarts != 1) throw new Exception("Touched web source did not invalidate persistent precompile artifact.");\n    }\n\n'''
          if marker not in s: raise SystemExit('precompile test insertion target missing')
          s=s.replace(marker,test+marker,1)
          p.write_text(s,encoding='utf-8')

          # Documentation.
          p=Path('docs/web.md')
          s=p.read_text(encoding='utf-8')
          needle='''Already compiled files are reused while their source/dependency snapshot remains unchanged. The response is allowed to complete before sublevel warmup runs in the background.\n'''
          repl='''Already compiled files are reused while their source/dependency snapshot remains unchanged. Ordinary server-side `.xps` pages also persist their compiled DLL/PDB artifact on disk. The persistent cache survives server restarts and is reused only when the source/dependency snapshot, runtime, compiler configuration and compiler version still match. A changed source or dependency automatically causes recompilation and replacement of the old artifact. Browser-WASM pages keep their separate bundle cache. The response is allowed to complete before sublevel warmup runs in the background.\n'''
          if needle not in s: raise SystemExit('docs cache target missing')
          p.write_text(s.replace(needle,repl,1),encoding='utf-8')
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests docs
          git commit -m "Persist web precompile cache across server restarts [persistent-web-cache-patched]"
          git push origin HEAD:session-defaults-role-restoration
