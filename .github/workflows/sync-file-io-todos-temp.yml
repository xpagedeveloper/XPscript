name: Sync File IO TODOs Temp

on:
  push:
    branches: [todo-cross-platform-file-io-portability]
    paths:
      - '.github/workflows/sync-file-io-todos-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync verified TODO status
        shell: python
        run: |
          from pathlib import Path

          detail = Path('todo/cross-platform-runtime-todo.md')
          text = detail.read_text(encoding='utf-8')
          replacements = {
            '- [>] `FileCopy` preserves Unix executable permission bits explicitly where supported': '- [x] `FileCopy` preserves Unix executable permission bits; runtime-verified on Linux and macOS by `Cross Platform File IO Portability`',
            '- [>] `Name` remains a real filesystem move/rename and does not silently fall back to copy+delete after a cross-filesystem failure, preserving atomicity/ownership/link semantics': '- [x] `Name` same-filesystem move/rename runtime-verified on Windows/Linux/macOS and remains a real filesystem operation without copy+delete fallback\n- [ ] runtime-verify cross-filesystem `Name` failure/behavior separately on supported OSes',
            '- [>] delete-while-open semantics intentionally remain OS/filesystem-defined; XPScript handles do not request `FileShare.Delete` on Windows; source: `samples/file-delete-open-semantics.xps`': '- [x] delete-while-open semantics runtime-verified: Windows blocks deletion for the open XPScript handle while Linux/macOS permit Unix-style unlink; source: `samples/file-delete-open-semantics.xps`',
            '- [>] source: `samples/file-charset-bom.xps` verifies the expected 3-byte UTF-8 BOM and 2-byte UTF-16LE BOM size deltas': '- [x] `samples/file-charset-bom.xps` runtime-verified on Windows/Linux/macOS for 3-byte UTF-8 BOM and 2-byte UTF-16LE BOM size deltas',
            '- [ ] runtime-verify Unix permissions/executable bits on Linux/macOS': '- [x] runtime-verify Unix executable-bit preservation on Linux/macOS\n- [ ] runtime-verify broader Unix permission/ownership semantics on Linux/macOS',
            '- [ ] runtime-verify same-filesystem and cross-filesystem `Name` behavior on supported OSes': '- [x] runtime-verify same-filesystem `Name` behavior on Windows/Linux/macOS',
            '- [ ] runtime-verify delete-while-open behavior, which differs between Windows and Unix-like systems': '- [x] runtime-verify delete-while-open behavior on Windows/Linux/macOS',
            '- [ ] runtime-verify charset/BOM handling on Windows/Linux/macOS': '- [x] runtime-verify charset/BOM handling on Windows/Linux/macOS',
            '- [ ] verify Latin-1 explicitly on Windows/Linux/macOS': '- [x] verify exact Latin-1 byte identity on Windows/Linux/macOS',
            '- [>] newline generation uses target runtime `Environment.NewLine`/`TextWriter.WriteLine`, preserving CRLF on Windows and LF on Unix-like systems; runtime verification remains required': '- [x] newline generation uses target runtime `Environment.NewLine`/`TextWriter.WriteLine`; exact CRLF on Windows and LF on Linux/macOS runtime-verified',
            '- [>] source: `samples/file-io-portability.xps`': '- [x] source: `samples/file-io-portability.xps` runtime-verified on Windows/Linux/macOS',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'detailed TODO anchor not found: {old}')
              text = text.replace(old, new, 1)
          detail.write_text(text, encoding='utf-8')

          runtime = Path('todo/runtime-reference-todo.md')
          text = runtime.read_text(encoding='utf-8')
          old = '- [ ] validate file-I/O portability across Windows, Linux and macOS: path separators, roots/drives, case sensitivity, permissions, symlinks, file sharing, delete-open-file semantics, rename/move behavior, newline handling, charset/BOM and binary identity'
          new = '- [-] validate file-I/O portability across Windows, Linux and macOS: text round-trip, charset/BOM, Latin-1 byte identity, newline behavior, FileCopy executable bits, same-filesystem rename and delete-open semantics are runtime-verified; case sensitivity, roots/drives/UNC/long paths, symlinks, broader permissions, cross-filesystem rename, file sharing and locking remain open in `todo/cross-platform-runtime-todo.md`'
          if old not in text:
              raise SystemExit('runtime file portability TODO anchor not found')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit TODO updates
        shell: bash
        run: |
          git config user.name "xpagedeveloper"
          git config user.email "fredrik@xpagedeveloper.com"
          git add todo/runtime-reference-todo.md todo/cross-platform-runtime-todo.md
          git commit -m "Mark verified cross-platform file IO semantics"
          git push
