name: One-shot package patch implementation

on:
  push:
    branches:
      - feature/application-dependency-security
    paths:
      - .github/workflows/oneshot-package-patching.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/application-dependency-security
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Wire patch store into compiler and CLI
        run: |
          python <<'PY'
          from pathlib import Path

          program = Path('src/XPScript.Cli/Program.cs')
          text = program.read_text()
          needle = '        "security" => await XPScript.Cli.ApplicationDependencyCommand.RunSecurityAsync(args[1..]),\n'
          if '"patch" => await XPScript.Cli.PackagePatchCommand.RunAsync' not in text:
              assert needle in text
              text = text.replace(needle, needle + '        "patch" => await XPScript.Cli.PackagePatchCommand.RunAsync(args[1..]),\n', 1)
          program.write_text(text)

          env = Path('src/XPScript.Compiler/CompilerBuildEnvironment.cs')
          text = env.read_text()
          constants = '''    private const string AvaloniaVersion = "12.0.3";\n    private const string AvaloniaWebViewVersion = "12.0.1";\n    private const string MicrosoftDataSqliteVersion = "10.0.11";\n    private const string MicrosoftDataSqlClientVersion = "7.0.2";\n    private const string MySqlConnectorVersion = "2.6.2";\n    private const string NpgsqlVersion = "10.0.3";\n\n'''
          text = text.replace(constants, '', 1)
          marker = '        ConfigureGeneratedDependencies(startInfo, root);\n'
          insertion = '''        var patchSource = ApplicationPackagePatchStore.ActivePackageSource;\n        if (patchSource is not null && startInfo.ArgumentList.Count > 0 &&\n            (startInfo.ArgumentList[0].Equals("build", StringComparison.OrdinalIgnoreCase) ||\n             startInfo.ArgumentList[0].Equals("restore", StringComparison.OrdinalIgnoreCase) ||\n             startInfo.ArgumentList[0].Equals("publish", StringComparison.OrdinalIgnoreCase)))\n            startInfo.ArgumentList.Add("-p:RestoreAdditionalProjectSources=" + patchSource);\n'''
          if 'RestoreAdditionalProjectSources=' not in text:
              assert marker in text
              text = text.replace(marker, marker + insertion, 1)

          old_ui = '    <PackageReference Include=\\"Avalonia\\" Version=\\"{AvaloniaVersion}\\" />\\n    <PackageReference Include=\\"Avalonia.Desktop\\" Version=\\"{AvaloniaVersion}\\" />\\n    <PackageReference Include=\\"Avalonia.Themes.Fluent\\" Version=\\"{AvaloniaVersion}\\" />\\n    <PackageReference Include=\\"Avalonia.Controls.WebView\\" Version=\\"{AvaloniaWebViewVersion}\\" />\\n";'
          new_ui = '    <PackageReference Include=\\"Avalonia\\" Version=\\"{ApplicationDependencyCatalog.ResolveVersion("Avalonia", ApplicationDependencyCatalog.AvaloniaVersion)}\\" />\\n    <PackageReference Include=\\"Avalonia.Desktop\\" Version=\\"{ApplicationDependencyCatalog.ResolveVersion("Avalonia.Desktop", ApplicationDependencyCatalog.AvaloniaVersion)}\\" />\\n    <PackageReference Include=\\"Avalonia.Themes.Fluent\\" Version=\\"{ApplicationDependencyCatalog.ResolveVersion("Avalonia.Themes.Fluent", ApplicationDependencyCatalog.AvaloniaVersion)}\\" />\\n    <PackageReference Include=\\"Avalonia.Controls.WebView\\" Version=\\"{ApplicationDependencyCatalog.ResolveVersion("Avalonia.Controls.WebView", ApplicationDependencyCatalog.AvaloniaWebViewVersion)}\\" />\\n";'
          text = text.replace(old_ui, new_ui, 1)
          replacements = {
              '{MicrosoftDataSqliteVersion}': '{ApplicationDependencyCatalog.ResolveVersion("Microsoft.Data.Sqlite", ApplicationDependencyCatalog.MicrosoftDataSqliteVersion)}',
              '{MicrosoftDataSqlClientVersion}': '{ApplicationDependencyCatalog.ResolveVersion("Microsoft.Data.SqlClient", ApplicationDependencyCatalog.MicrosoftDataSqlClientVersion)}',
              '{MySqlConnectorVersion}': '{ApplicationDependencyCatalog.ResolveVersion("MySqlConnector", ApplicationDependencyCatalog.MySqlConnectorVersion)}',
              '{NpgsqlVersion}': '{ApplicationDependencyCatalog.ResolveVersion("Npgsql", ApplicationDependencyCatalog.NpgsqlVersion)}'
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          env.write_text(text)

          run = Path('src/XPScript.Compiler/RunCompiler.cs')
          text = run.read_text()
          old = '''        var packageItems = usesMimeKit\n            ? "  <ItemGroup>\\n    <PackageReference Include=\\\"MimeKit\\\" Version=\\\"4.17.0\\\" />\\n  </ItemGroup>\\n"\n            : string.Empty;'''
          new = '''        var mimeKitVersion = ApplicationDependencyCatalog.ResolveVersion("MimeKit", ApplicationDependencyCatalog.MimeKitVersion);\n        var packageItems = usesMimeKit\n            ? $"  <ItemGroup>\\n    <PackageReference Include=\\\"MimeKit\\\" Version=\\\"{mimeKitVersion}\\\" />\\n  </ItemGroup>\\n"\n            : string.Empty;'''
          assert old in text
          text = text.replace(old, new, 1)
          run.write_text(text)
          PY
      - name: Build CLI
        run: dotnet build src/XPScript.Cli/XPScript.Cli.csproj -c Release --nologo
      - name: Smoke test patch command
        run: dotnet run --project src/XPScript.Cli/XPScript.Cli.csproj -c Release --no-build -- patch --help
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/XPScript.Compiler/CompilerBuildEnvironment.cs src/XPScript.Compiler/RunCompiler.cs src/XPScript.Cli/Program.cs
          git commit -m "Wire package patches into generated builds"
          git push origin HEAD:feature/application-dependency-security
