name: Archive Runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Verify Archive compiler probes
        shell: pwsh
        run: |
          dotnet run --project ./tests/ArchiveCapabilityProbe/ArchiveCapabilityProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate Archive security fixtures
        shell: pwsh
        run: |
          dotnet run --project ./tests/ArchiveSecurityFixtures/ArchiveSecurityFixtures.csproj -c Release -- ./out/archive-security-fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and run Archive suite
        shell: pwsh
        run: |
          $runtimeTimeoutMilliseconds = 30000
          $compileTimeoutMilliseconds = 60000

          function Invoke-ProcessWithTimeout([string] $fileName, [string[]] $arguments, [int] $timeoutMilliseconds, [string] $label) {
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $fileName
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            foreach ($argument in $arguments) { [void] $startInfo.ArgumentList.Add([string] $argument) }

            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            try {
              if (-not $process.Start()) { throw "Unable to start process: $label" }
              $stdoutTask = $process.StandardOutput.ReadToEndAsync()
              $stderrTask = $process.StandardError.ReadToEndAsync()
              if (-not $process.WaitForExit($timeoutMilliseconds)) {
                try { $process.Kill($true) } catch { }
                try { $process.WaitForExit() } catch { }
                Write-Error "Archive CI process timed out: $label"
                exit 124
              }
              $stdout = $stdoutTask.GetAwaiter().GetResult()
              $stderr = $stderrTask.GetAwaiter().GetResult()
              if (-not [string]::IsNullOrEmpty($stdout)) { Write-Host $stdout.TrimEnd() }
              if (-not [string]::IsNullOrEmpty($stderr)) { Write-Host $stderr.TrimEnd() }
              return [pscustomobject]@{ ExitCode = $process.ExitCode; Output = $stdout + $stderr }
            }
            finally { $process.Dispose() }
          }

          function Compile-XPScript([string] $source, [string] $name) {
            Write-Host "ARCHIVE_CI_COMPILE=$name"
            $arguments = @('run','--project','./src/XPScript.Compiler/XPScript.Compiler.csproj','-c','Release','--no-build','--',$source,'-o',"./out/$name",'--runtime=false')
            $result = Invoke-ProcessWithTimeout 'dotnet' $arguments $compileTimeoutMilliseconds "compile: $name"
            if ($result.ExitCode -ne 0) {
              Write-Error "Archive compilation failed with exit code $($result.ExitCode): $name"
              exit $result.ExitCode
            }
          }

          function Get-XPScriptExecutable([string] $name) {
            $plain = "./out/$name"
            if (Test-Path $plain -PathType Leaf) { return (Resolve-Path $plain).Path }
            $windows = "$plain.exe"
            if (Test-Path $windows -PathType Leaf) { return (Resolve-Path $windows).Path }
            throw "Compiled XPScript executable was not found for $name"
          }

          function Invoke-XPScriptExecutable([string] $exe, [string[]] $arguments, [string] $label) {
            Write-Host "ARCHIVE_CI_RUN=$label"
            return Invoke-ProcessWithTimeout $exe $arguments $runtimeTimeoutMilliseconds "run: $label"
          }

          function Run-XPScript([string] $source, [string] $name) {
            Compile-XPScript $source $name
            $exe = Get-XPScriptExecutable $name
            $result = Invoke-XPScriptExecutable $exe @() $name
            if ($result.ExitCode -ne 0) {
              Write-Error "Archive regression failed with exit code $($result.ExitCode): $name"
              exit $result.ExitCode
            }
          }

          function Expect-XPScriptFailure([string] $name, [string[]] $arguments, [string] $label) {
            $exe = Get-XPScriptExecutable $name
            $result = Invoke-XPScriptExecutable $exe $arguments "security: $label"
            if ($result.ExitCode -eq 0) { Write-Error "Archive security probe unexpectedly succeeded: $label"; exit 1 }
            if ([string]::IsNullOrWhiteSpace($result.Output)) { Write-Error "Archive security probe returned no diagnostic: $label"; exit 1 }
            if ($result.Output -match 'SharpCompress') { Write-Error "Archive security diagnostic exposed an implementation detail: $label"; exit 1 }
          }

          Run-XPScript ./demo/archive/archive-zip.xps archive-zip
          Run-XPScript ./demo/archive/archive-memory.xps archive-memory
          Run-XPScript ./demo/archive/archive-iterator.xps archive-iterator
          Run-XPScript ./demo/archive/archive-edge-cases.xps archive-edge-cases
          Run-XPScript ./demo/archive/archive-security-fixtures.xps archive-security-check

          Compile-XPScript ./demo/archive/archive-security-reject-zip.xps archive-security-reject-zip
          Expect-XPScriptFailure archive-security-reject-zip @('../../out/archive-security-fixtures/traversal.zip', '10000', '2147483647', '1000') 'path traversal'
          Expect-XPScriptFailure archive-security-reject-zip @('../../out/archive-security-fixtures/absolute-unix.zip', '10000', '2147483647', '1000') 'absolute Unix path'
          Expect-XPScriptFailure archive-security-reject-zip @('../../out/archive-security-fixtures/absolute-windows.zip', '10000', '2147483647', '1000') 'absolute Windows path'
          Expect-XPScriptFailure archive-security-reject-zip @('../../out/archive-security-fixtures/unc.zip', '10000', '2147483647', '1000') 'UNC path'
          Expect-XPScriptFailure archive-security-reject-zip @('../../out/archive-security-fixtures/symlink-entry.zip', '10000', '2147483647', '1000') 'symbolic link entry'
          Expect-XPScriptFailure archive-security-reject-zip @('../../out/archive-security-fixtures/max-entries.zip', '2', '2147483647', '1000') 'MaxEntries'
          Expect-XPScriptFailure archive-security-reject-zip @('../../out/archive-security-fixtures/max-size.zip', '10000', '100', '1000') 'MaxExtractSize'
          Expect-XPScriptFailure archive-security-reject-zip @('../../out/archive-security-fixtures/compression-ratio.zip', '10000', '2147483647', '10') 'MaxCompressionRatio'

          Compile-XPScript ./demo/archive/archive-security-reject-extended.xps archive-security-reject-extended
          Expect-XPScriptFailure archive-security-reject-extended @('../../out/archive-security-fixtures/traversal.tar') 'extended TAR path traversal'
          Expect-XPScriptFailure archive-security-reject-extended @('../../out/archive-security-fixtures/absolute.tar') 'extended TAR absolute path'
          Expect-XPScriptFailure archive-security-reject-extended @('../../out/archive-security-fixtures/symlink-entry.tar') 'extended TAR symbolic link entry'

          if (Test-Path './out/archive-security-fixtures/extraction-symlink-ready.txt') {
            Compile-XPScript ./demo/archive/archive-security-reject-extract.xps archive-security-reject-extract
            Expect-XPScriptFailure archive-security-reject-extract @() 'destination symbolic link extraction'
            if (Test-Path './out/archive-security-fixtures/outside/escape.txt') { Write-Error 'Archive extraction escaped through a destination symbolic link'; exit 1 }
          }

          Run-XPScript ./demo/archive/archive-extended-memory.xps archive-extended-memory
          Run-XPScript ./demo/archive/archive-extended-memory-write.xps archive-extended-memory-write
          Run-XPScript ./demo/archive/archive-gzip.xps archive-gzip
          Run-XPScript ./demo/archive/archive-rebuild.xps archive-rebuild
          Run-XPScript ./demo/archive/archive-targzip.xps archive-targzip
          Run-XPScript ./demo/archive/archive-compressed-tar.xps archive-compressed-tar
          Run-XPScript ./demo/archive/archive-format-detection.xps archive-format-detection
