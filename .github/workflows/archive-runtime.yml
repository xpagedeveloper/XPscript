name: Archive Runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify Archive compiler probes
        shell: pwsh
        run: |
          dotnet run --project ./tests/PreprocessorPipelineProbe/PreprocessorPipelineProbe.csproj -c Release
          dotnet run --project ./tests/ArchiveCapabilityProbe/ArchiveCapabilityProbe.csproj -c Release
      - name: Compile and run core Archive smoke tests
        shell: pwsh
        run: |
          function Run-XPScript([string] $source, [string] $name) {
            dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- $source -o "./out/$name" --framework-dependent
            if ($IsWindows) { & "./out/$name.exe" } else { & "./out/$name" }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Run-XPScript ./demo/archive/archive-zip.xps archive-zip
          Run-XPScript ./demo/archive/archive-memory.xps archive-memory
          Run-XPScript ./demo/archive/archive-iterator.xps archive-iterator

  archive-extended-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile and run extended in-memory read
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/archive/archive-extended-memory.xps -o ./out/archive-extended-memory --framework-dependent
          ./out/archive-extended-memory
      - name: Compile and run extended in-memory write
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/archive/archive-extended-memory-write.xps -o ./out/archive-extended-memory-write --framework-dependent
          ./out/archive-extended-memory-write
      - name: Compile and run GZip
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/archive/archive-gzip.xps -o ./out/archive-gzip --framework-dependent
          ./out/archive-gzip
      - name: Compile and run TAR rebuild
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/archive/archive-rebuild.xps -o ./out/archive-rebuild --framework-dependent
          ./out/archive-rebuild
      - name: Compile and run TAR.GZip
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/archive/archive-targzip.xps -o ./out/archive-targzip --framework-dependent
          ./out/archive-targzip
      - name: Compile and run compressed TAR formats
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/archive/archive-compressed-tar.xps -o ./out/archive-compressed-tar --framework-dependent
          ./out/archive-compressed-tar
      - name: Compile and run content format detection
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./demo/archive/archive-format-detection.xps -o ./out/archive-format-detection --framework-dependent
          ./out/archive-format-detection
