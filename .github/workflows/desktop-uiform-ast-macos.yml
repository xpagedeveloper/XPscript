name: AST Desktop UIForm (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ast-desktop-uiform-macos:
    name: AST generated UIForm on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build desktop parity probe
        run: dotnet build ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
      - name: Run generated AST application on macOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./out
          echo AST_MACOS_CHECKPOINT=build-ready
          timeout --kill-after=5s 180s dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release --no-build -- --ast-only 2>&1 | tee ./out/ast-uiform-macos.log
          grep -q 'DESKTOP_PARITY_AST_COMPILE_OK' ./out/ast-uiform-macos.log
          grep -q 'DESKTOP_PARITY_AST_RUNTIME_OK' ./out/ast-uiform-macos.log
          echo AST_MACOS_CHECKPOINT=generated-ast-runtime-ok
