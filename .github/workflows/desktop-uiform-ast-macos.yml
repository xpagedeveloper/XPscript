name: AST Desktop UIForm (macOS)

on:
  push:
    branches: [investigate-ast-compiler]
    paths:
      - '.github/workflows/desktop-uiform-ast-macos.yml'
      - 'src/XPScript.Compiler/**'
      - 'src/XPScript.UI.Desktop/**'
      - 'tests/DesktopUIFormLifecycleSmoke/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ast-desktop-uiform-macos:
    name: AST generated UIForm on macOS
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build desktop parity probe
        run: dotnet build ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
      - name: Run generated AST application on macOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./out
          echo AST_MACOS_CHECKPOINT=build-ready
          set +e
          python3 - <<'PY'
          import subprocess
          import sys
          command = [
              'dotnet', 'run', '--project', './tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj',
              '-c', 'Release', '--no-build', '--', '--ast-only'
          ]
          with open('./out/ast-uiform-macos.log', 'w', encoding='utf-8') as log:
              process = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT)
              try:
                  exit_code = process.wait(timeout=180)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait()
                  print('AST macOS UIForm probe timed out after 180 seconds', file=sys.stderr)
                  sys.exit(124)
          sys.exit(exit_code)
          PY
          process_status=$?
          set -e
          cat ./out/ast-uiform-macos.log
          if [ "$process_status" -ne 0 ]; then exit "$process_status"; fi
          grep -q 'DESKTOP_PARITY_AST_COMPILE_OK' ./out/ast-uiform-macos.log
          grep -q 'DESKTOP_PARITY_AST_RUNTIME_OK' ./out/ast-uiform-macos.log
          echo AST_MACOS_CHECKPOINT=generated-ast-runtime-ok
