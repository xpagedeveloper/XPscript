name: Indexed Property Compatibility

on:
  push:
    branches: [todo-indexed-properties]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Verify indexed scalar Property Get and Let
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/indexed-properties.xps -o ./out/indexed-properties.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Indexed scalar property compilation failed.' }
          $output = & ./out/indexed-properties.exe
          if ($LASTEXITCODE -ne 0) { throw "Indexed scalar property sample exited with code $LASTEXITCODE." }
          foreach ($value in @('INDEX1=first','INDEX2=second')) {
            if ($output -notcontains $value) { throw "Indexed scalar property output missing: $value" }
          }

      - name: Verify indexed object Property Get and Set
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/indexed-object-properties.xps -o ./out/indexed-object-properties.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Indexed object property compilation failed.' }
          $output = & ./out/indexed-object-properties.exe
          if ($LASTEXITCODE -ne 0) { throw "Indexed object property sample exited with code $LASTEXITCODE." }
          foreach ($value in @('OBJECT1=first-object','OBJECT2=second-object')) {
            if ($output -notcontains $value) { throw "Indexed object property output missing: $value" }
          }

      - name: Verify indexed property parameter type diagnostics
        shell: pwsh
        run: |
          $resultText = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/indexed-properties-error.xps -o ./out/indexed-properties-error.exe --framework-dependent --result-format json
          $compilerExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($compilerExitCode -eq 0) { throw 'Invalid indexed property sample unexpectedly compiled.' }
          $result = $resultText | ConvertFrom-Json
          if ($result.result -ne 'error' -or $result.errors.Count -lt 1) { throw 'Expected structured compiler diagnostics for invalid indexed property call.' }
          $diagnostics = ($result.errors | ForEach-Object { $_.description }) -join "`n"
          if ($diagnostics -notmatch 'Integer|int|convert|argument|parameter') {
            throw "Indexed property diagnostic did not describe a parameter/type mismatch: $diagnostics"
          }
