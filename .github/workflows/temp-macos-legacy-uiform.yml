name: TEMP macOS legacy UIForm

on:
  push:
    branches: [investigate-ast-compiler]
    paths:
      - '.github/workflows/temp-macos-legacy-uiform.yml'
      - 'tests/DesktopUIFormLifecycleSmoke/**'

permissions:
  contents: read

jobs:
  legacy-uiform:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build probe and compiler
        run: dotnet build ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
      - name: Compile and run legacy UIForm only
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release --no-build -- --legacy-only 2>&1 | tee legacy-uiform.log
          grep -q '^DESKTOP_PARITY_LEGACY_RUNTIME_OK$' legacy-uiform.log
