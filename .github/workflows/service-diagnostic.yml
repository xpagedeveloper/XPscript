name: Service Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ./XPScriptCompiler.slnx
      - name: Capture build
        id: build
        shell: bash
        run: |
          set +e
          dotnet build ./XPScriptCompiler.slnx -c Release --no-restore 2>&1 | tee service-build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: service-build-log
          path: service-build.log
      - name: Preserve build result
        shell: bash
        run: exit ${{ steps.build.outputs.code }}
