name: Service Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ./XPScriptCompiler.slnx
      - name: Capture build
        id: build
        shell: bash
        run: |
          set +e
          dotnet build ./XPScriptCompiler.slnx -c Release --no-restore 2>&1 | tee service-build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Compile service sample
        if: steps.build.outputs.code == '0'
        shell: bash
        run: |
          mkdir -p ./out/service-diagnostic
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/service-interval.xps -o ./out/service-diagnostic/service-interval --framework-dependent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-build-log
          path: service-build.log
      - name: Preserve build result
        if: always()
        shell: bash
        run: exit ${{ steps.build.outputs.code }}
