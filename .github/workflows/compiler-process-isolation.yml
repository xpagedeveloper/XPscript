name: Compiler Process Isolation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/XPScript.Compiler/CompilerDriver.cs'
      - 'src/XPScript.Compiler/CompilerBuildEnvironment.cs'
      - 'src/XPScript.Compiler/CompilerToolResolver.cs'
      - 'src/XPScript.Compiler/CompilerPathSecurity.cs'
      - 'src/XPScript.Compiler/CompilerOutputPublisher.cs'
      - 'tests/CompilerProcessIsolationProbe/**'
      - '.github/workflows/compiler-process-isolation.yml'

permissions:
  contents: read

jobs:
  process-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify failed-build and process-state isolation
        run: dotnet run --project ./tests/CompilerProcessIsolationProbe/CompilerProcessIsolationProbe.csproj -c Release
