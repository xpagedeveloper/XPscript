name: Security Documentation Closeout

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'tools/validate_docs.py'
      - '.github/workflows/security-documentation-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-documentation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate documentation links and references
        shell: pwsh
        run: |
          python tools/validate_docs.py
          if ($LASTEXITCODE -ne 0) { throw 'Documentation reference validation failed.' }

      - name: Verify documentation governance
        shell: pwsh
        run: |
          $index = Get-Content -Raw ./docs/index.md
          $rules = Get-Content -Raw ./docs/documentation-rules.md
          foreach ($fragment in @('getting-started.md','language.md','commands.md','evaluate.md','classes.md','web.md','uiform.md')) {
            if (-not $index.Contains($fragment)) { throw "Documentation index is missing: $fragment" }
          }
          foreach ($fragment in @('English','new command','executable','commands.md')) {
            if (-not $rules.Contains($fragment)) { throw "Documentation governance is missing: $fragment" }
          }
