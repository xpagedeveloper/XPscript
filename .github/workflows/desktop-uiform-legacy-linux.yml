name: Legacy Desktop UIForm Interaction (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-desktop-uiform:
    name: Legacy UIForm lifecycle under Xvfb
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Restore and build desktop lifecycle probe
        run: dotnet build ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
      - name: Run legacy desktop UIForm lifecycle probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./out
          echo LEGACY_UIFORM_CHECKPOINT=build-ready
          timeout --kill-after=5s 180s xvfb-run -a dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release --no-build 2>&1 | tee ./out/legacy-uiform-lifecycle.log
          grep -q 'DESKTOP_RUNTIME_LAUNCH_PARITY_OK' ./out/legacy-uiform-lifecycle.log
          echo LEGACY_UIFORM_CHECKPOINT=runtime-parity-ok
