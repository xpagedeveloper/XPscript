name: One-shot HTTP client decompression fix

on:
  push:
    branches:
      - 'fix/httpclient-automatic-decompression'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/httpclient-automatic-decompression
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Patch XPHttpClient automatic decompression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/XPScript.Compiler/NativeHttpRuntimeSource.cs')
          text = path.read_text()
          old = """            AllowAutoRedirect = false,
            UseCookies = false
"""
          new = """            AllowAutoRedirect = false,
            UseCookies = false,
            AutomaticDecompression = System.Net.DecompressionMethods.GZip |
                                     System.Net.DecompressionMethods.Deflate |
                                     System.Net.DecompressionMethods.Brotli
"""
          if old not in text:
              if 'AutomaticDecompression = System.Net.DecompressionMethods.GZip' in text:
                  raise SystemExit(0)
              raise SystemExit('Expected HttpClientHandler initializer not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify decompression flags are present
        run: |
          grep -F 'AutomaticDecompression = System.Net.DecompressionMethods.GZip' src/XPScript.Compiler/NativeHttpRuntimeSource.cs
          grep -F 'System.Net.DecompressionMethods.Deflate' src/XPScript.Compiler/NativeHttpRuntimeSource.cs
          grep -F 'System.Net.DecompressionMethods.Brotli' src/XPScript.Compiler/NativeHttpRuntimeSource.cs

      - name: Build compiler
        run: dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/XPScript.Compiler/NativeHttpRuntimeSource.cs
          git commit -m 'Enable automatic HTTP response decompression'
          git push origin HEAD:fix/httpclient-automatic-decompression
