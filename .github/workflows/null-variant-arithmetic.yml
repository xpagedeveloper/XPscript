name: Null Variant Arithmetic

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/TypeCoercionPreprocessor.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'samples/null-empty-semantics.xps'
      - '.github/workflows/null-variant-arithmetic.yml'
  push:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/TypeCoercionPreprocessor.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'samples/null-empty-semantics.xps'
      - '.github/workflows/null-variant-arithmetic.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile and verify NULL Variant arithmetic
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/null-variant-arithmetic$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/null-empty-semantics.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'NULL Variant arithmetic compilation failed.' }
          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "NULL Variant arithmetic regression exited with code $LASTEXITCODE." }
          $output | ForEach-Object { Write-Host $_ }
          foreach ($value in @(
            'NULL_PROPAGATES=True',
            'NULL_SUBTRACT_PROPAGATES=True',
            'NULL_MULTIPLY_PROPAGATES=True',
            'EMPTY_SUBTRACT_ZERO=-1',
            'EMPTY_MULTIPLY_ZERO=0',
            'ARITHMETIC_PRECEDENCE=4'
          )) {
            if ($output -notcontains $value) { throw "NULL Variant arithmetic output missing: $value" }
          }
