name: Compiler Parallel Isolation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/XPScript.Compiler/CompilerDriver.cs'
      - 'src/XPScript.Compiler/CompilerBuildEnvironment.cs'
      - 'src/XPScript.Compiler/CompilerPathSecurity.cs'
      - 'src/XPScript.Compiler/IncludeSourcePreprocessor.cs'
      - 'tests/CompilerParallelIsolationProbe/**'
      - '.github/workflows/compiler-parallel-isolation.yml'
  workflow_dispatch:

jobs:
  parallel-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify 10 parallel compiler invocations with shared include files
        run: dotnet run --project ./tests/CompilerParallelIsolationProbe/CompilerParallelIsolationProbe.csproj -c Release
