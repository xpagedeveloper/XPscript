name: Temporary DoS hardening patch

on:
  push:
    branches:
      - security/dos-hardening-2-4-5-6

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dos-hardening-2-4-5-6
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply hardening changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 2. Runtime recursion depth guard for every generated procedure/property.
          p = Path('src/XPScript.Compiler/XPScriptRecursionGuardRuntimeSource.cs')
          p.write_text(r'''namespace XPScript.Compiler;

internal static class XPScriptRecursionGuardRuntimeSource
{
    public const string Code = """
internal static class XPScriptRecursionGuard
{
    private const int DefaultMaxDepth = 256;
    private static readonly System.Threading.AsyncLocal<int> Depth = new();
    private static readonly int MaxDepth = ResolveMaxDepth();

    public static System.IDisposable Enter()
    {
        var next = checked(Depth.Value + 1);
        if (next > MaxDepth)
            throw new XPScriptRuntimeException(28, $"Maximum recursion depth of {MaxDepth} exceeded.");
        Depth.Value = next;
        return new Scope();
    }

    private static int ResolveMaxDepth()
    {
        var raw = System.Environment.GetEnvironmentVariable("XPSCRIPT_MAX_RECURSION_DEPTH");
        return int.TryParse(raw, System.Globalization.NumberStyles.None, System.Globalization.CultureInfo.InvariantCulture, out var parsed)
            && parsed is >= 16 and <= 4096
            ? parsed
            : DefaultMaxDepth;
    }

    private sealed class Scope : System.IDisposable
    {
        private int _disposed;

        public void Dispose()
        {
            if (System.Threading.Interlocked.Exchange(ref _disposed, 1) != 0) return;
            Depth.Value = System.Math.Max(0, Depth.Value - 1);
        }
    }
}
""";
}
''', encoding='utf-8')

