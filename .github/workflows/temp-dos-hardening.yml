      - name: Build compiler
        run: dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --nologo

      - name: Build web compiler
        run: dotnet build src/XPScript.Web.Compiler/XPScript.Web.Compiler.csproj -c Release --nologo

      - name: Run web dispatcher smoke test
        run: dotnet run --project tests/WebDispatcherSmoke/WebDispatcherSmoke.csproj -c Release

      - name: Commit verified patch
        shell: bash
        run: |
          rm .github/workflows/temp-dos-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Security: harden recursion and compiler resource limits"
          git push origin HEAD:security/dos-hardening-2-4-5-6
