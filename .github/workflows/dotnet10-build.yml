name: .NET 10 Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./src/LSLite.Compiler/LSLite.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/LSLite.Compiler/LSLite.Compiler.csproj --configuration Release --no-restore

      - name: Compile compatibility sample
        run: dotnet run --project ./src/LSLite.Compiler/LSLite.Compiler.csproj --configuration Release --no-build -- ./samples/compatibility.ls -o ./out/compatibility.exe --framework-dependent

      - name: Run compatibility sample
        shell: pwsh
        run: |
          $output = & ./out/compatibility.exe
          $output | ForEach-Object { Write-Host $_ }

          $expected = @(
            "LS LITE",
            "a b",
            "FF",
            "1010",
            "-1",
            "2026",
            "8",
            "11",
            "5",
            "123.5",
            "FILE-OK"
          )

          foreach ($value in $expected) {
            if ($output -notcontains $value) {
              throw "Compatibility test missing expected output: $value"
            }
          }

      - name: Verify no temporary compatibility file remains
        shell: pwsh
        run: |
          if (Test-Path ./lslite-compat.txt) {
            throw "Compatibility test did not remove its temporary file."
          }

      - name: Compile List and class sample
        run: dotnet run --project ./src/LSLite.Compiler/LSLite.Compiler.csproj --configuration Release --no-build -- ./samples/lists-classes.ls -o ./out/lists-classes.exe --framework-dependent

      - name: Run List and class sample
        shell: pwsh
        run: |
          $output = & ./out/lists-classes.exe
          $output | ForEach-Object { Write-Host $_ }

          $expected = @(
            "ADMIN=Fredrik",
            "admin:Fredrik",
            "guest:Guest",
            "GUEST-ERASED",
            "Fredrik",
            "Fno:Admin",
            "OBJECT-DELETED"
          )

          foreach ($value in $expected) {
            if ($output -notcontains $value) {
              throw "List/class test missing expected output: $value"
            }
          }

      - name: Compile advanced core language sample
        run: dotnet run --project ./src/LSLite.Compiler/LSLite.Compiler.csproj --configuration Release --no-build -- ./samples/core-language.ls -o ./out/core-language.exe --framework-dependent

      - name: Run advanced core language sample
        shell: pwsh
        run: |
          $output = & ./out/core-language.exe
          $output | ForEach-Object { Write-Host $_ }

          $expected = @(
            "BYREF=11",
            "AUTO=1:2:8",
            "MATRIX=1:1:24",
            "ARRAYREF=99",
            "REDIM=ABC",
            "SELECT=HIGH",
            "WITH-OK",
            "STATIC=1:2",
            "STATICPROC=1:2",
            "DEFTYPE=INTEGER:42",
            "DECLARE=OK",
            "GOSUB=CALLED",
            "GOSUB=RETURNED",
            "GOTO=OK",
            "ERRORFN=File not found",
            "ERR=123:expected-error",
            "RESUME=OK",
            "RESUME-CURRENT=5",
            "RESUME-LABEL=OK",
            "RESUME-NEXT=124",
            "BINARY=123456:4",
            "RANDOM=77:2"
          )

          foreach ($value in $expected) {
            if ($output -notcontains $value) {
              throw "Advanced core test missing expected output: $value"
            }
          }

          $forbidden = @(
            "GOTO=BAD",
            "RESUME-LABEL=BAD"
          )

          foreach ($value in $forbidden) {
            if ($output -contains $value) {
              throw "Advanced core test produced forbidden output: $value"
            }
          }

      - name: Verify advanced core files are removed
        shell: pwsh
        run: |
          if (Test-Path ./lslite-core.bin) { throw "Binary test file was not removed." }
          if (Test-Path ./lslite-random.bin) { throw "Random test file was not removed." }

      - name: Compile runtime and SAX sample
        run: dotnet run --project ./src/LSLite.Compiler/LSLite.Compiler.csproj --configuration Release --no-build -- ./samples/runtime-sax.ls -o ./out/runtime-sax.exe --framework-dependent

      - name: Run runtime and SAX sample
        shell: pwsh
        run: |
          $output = & ./out/runtime-sax.exe
          $output | ForEach-Object { Write-Host $_ }

          $expected = @(
            "ENV=OK",
            "FORMAT=OK",
            "FORMATDOLLAR=OK",
            "FORMATNUMBER=OK",
            "FORMATPERCENT=OK",
            "ERROR53=File not found",
            "FILEERR=53",
            "FILEERR=RESUMED",
            "SHELL=33",
            "EVALUATE=7",
            "MESSAGEBOX=1",
            "SAX=STARTDOC",
            "SAX=START:root:1",
            "SAX=ATTR:id=7:CDATA",
            "SAX=START:child:0",
            "SAX=TEXT:text:4",
            "SAX=END:child",
            "SAX=END:root",
            "SAX=ENDDOC"
          )

          foreach ($value in $expected) {
            if ($value -eq "FILEERR=53") {
              if (-not ($output | Where-Object { $_ -like "FILEERR=53:*" })) {
                throw "Runtime/SAX test missing LotusScript file error 53."
              }
              continue
            }
            if ($output -notcontains $value) {
              throw "Runtime/SAX test missing expected output: $value"
            }
          }

      - name: Compile HTTP and JSON sample
        run: dotnet run --project ./src/LSLite.Compiler/LSLite.Compiler.csproj --configuration Release --no-build -- ./samples/json-http.ls -o ./out/json-http.exe --framework-dependent

      - name: Run HTTP and JSON sample
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList './samples/http-test-server.py' -PassThru
          try {
            Start-Sleep -Seconds 2
            $output = & ./out/json-http.exe
            $output | ForEach-Object { Write-Host $_ }

            $expected = @(
              "OBJECTSIZE=2",
              "ARRAYSIZE=2",
              "ELEMENT=name:3:Fredrik",
              "POINTER=2",
              "NTH=developer",
              "ITER=admin:developer",
              "COPY={\"copy\":{\"city\":\"Linkoping\",\"country\":\"Sweden\"}}",
              "JSONCONSTANTS=OK",
              "GETCODE=200",
              "POSTCODE=200",
              "PUTCODE=200",
              "PATCHCODE=200",
              "DELETECODE=200",
              "HEADERS=OK",
              "PROXY=OK",
              "HTTPJSON=POST"
            )

            foreach ($value in $expected) {
              if ($output -notcontains $value) {
                throw "HTTP/JSON test missing expected output: $value"
              }
            }

            if (-not ($output | Where-Object { $_ -like 'GET=*\"method\": \"GET\"*' })) {
              throw "GET response did not come from the local HTTP test server."
            }
            if (-not ($output | Where-Object { $_ -like 'POST=*\"method\": \"POST\"*' })) {
              throw "POST response did not come from the local HTTP test server."
            }
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }
