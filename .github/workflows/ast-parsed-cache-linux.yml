name: AST Parsed Syntax Cache (Linux)

on:
  push:
    branches: [investigate-ast-compiler]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ast-parsed-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Run AST lexer and parsed-cache correctness probe
        run: dotnet run --project ./tests/ast-lexer/AstLexerProbe.csproj -c Release
