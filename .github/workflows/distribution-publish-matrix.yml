name: Distribution Publish Matrix

on:
  pull_request:
    paths:
      - 'src/XPScript.Cli/**'
      - 'src/XPScript.Compiler/**'
      - 'src/XPScript.Compiler.Core/**'
      - 'src/XPScript.UI.Desktop/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Web.FastCgi/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'scripts/publish-distributions.ps1'
      - 'docs/getting-started.md'
      - '.github/workflows/distribution-publish-matrix.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version used in ZIP file names. Leave empty to use the commit SHA.'
        required: false
        type: string

jobs:
  publish:
    name: publish-${{ matrix.rid }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish unified platform toolchain
        shell: pwsh
        run: ./scripts/publish-distributions.ps1 -Runtime '${{ matrix.rid }}'
      - name: Verify unified platform output
        shell: pwsh
        run: |
          $path = 'publish/xpscript'
          if (-not (Test-Path $path)) { throw "Missing publish folder: $path" }
          if (-not (Get-ChildItem $path -File -ErrorAction SilentlyContinue)) { throw "Publish folder is empty: $path" }
      - name: Create release ZIP and SHA-256 manifest
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '${{ github.sha }}'.Substring(0, 12) }
          if ($version -notmatch '^[0-9A-Za-z._-]+$') { throw 'Invalid version.' }
          $rid = '${{ matrix.rid }}'
          $releaseRoot = 'artifacts/releases'
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          $fileName = "xpscript-$version-$rid.zip"
          $zipPath = Join-Path $releaseRoot $fileName
          Compress-Archive -Path 'publish/xpscript/*' -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $fileName" | Set-Content -Path (Join-Path $releaseRoot "SHA256SUMS-$version-$rid.txt") -Encoding ascii
      - name: Upload RID release bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xpscript-release-${{ matrix.rid }}
          path: artifacts/releases/
          if-no-files-found: error
          retention-days: 14
