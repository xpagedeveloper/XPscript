name: Distribution Publish Matrix

on:
  pull_request:
    paths:
      - 'src/XPScript.Cli/**'
      - 'src/XPScript.Compiler/XPScript.Compiler.csproj'
      - 'src/XPScript.Compiler/Program.cs'
      - 'src/XPScript.Compiler.Core/**'
      - 'src/XPScript.UI.Desktop/**'
      - 'src/XPScript.Web.Cgi/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Web.FastCgi/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'scripts/publish-distributions.ps1'
      - 'docs/getting-started.md'
      - '.github/workflows/distribution-publish-matrix.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version used in ZIP file names. Leave empty to use the commit SHA.'
        required: false
        type: string

jobs:
  publish:
    name: publish-${{ matrix.rid }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish platform distributions
        shell: pwsh
        run: ./scripts/publish-distributions.ps1 -Package all -Runtime '${{ matrix.rid }}'
      - name: Verify platform distributions
        shell: pwsh
        run: |
          $required = @(
            'artifacts/distributions/compiler',
            'artifacts/distributions/desktop-runtime',
            'artifacts/distributions/cgi',
            'artifacts/distributions/fastcgi',
            'artifacts/distributions/kestrel'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing distribution folder: $path" }
            if (-not (Get-ChildItem $path -File -ErrorAction SilentlyContinue)) { throw "Distribution is empty: $path" }
          }
      - name: Create release ZIPs and SHA-256 manifest
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '${{ github.sha }}'.Substring(0, 12)
          }
          if ($version -notmatch '^[0-9A-Za-z._-]+$') {
            throw 'Version may contain only letters, numbers, dot, underscore and hyphen.'
          }

          $rid = '${{ matrix.rid }}'
          $releaseRoot = 'artifacts/releases'
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null

          $checksums = @()
          foreach ($package in @('compiler', 'desktop-runtime', 'cgi', 'fastcgi', 'kestrel')) {
            $source = "artifacts/distributions/$package/*"
            $fileName = "xpscript-$package-$version-$rid.zip"
            $zipPath = Join-Path $releaseRoot $fileName
            Compress-Archive -Path $source -DestinationPath $zipPath -Force
            $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksums += "$hash  $fileName"
          }

          $manifest = Join-Path $releaseRoot "SHA256SUMS-$version-$rid.txt"
          $checksums | Set-Content -Path $manifest -Encoding ascii
      - name: Verify release ZIPs and checksums
        shell: pwsh
        run: |
          $releaseFiles = @(Get-ChildItem 'artifacts/releases' -Filter '*.zip' -File)
          if ($releaseFiles.Count -ne 5) {
            throw "Expected 5 release ZIP files, found $($releaseFiles.Count)."
          }
          $manifest = @(Get-ChildItem 'artifacts/releases' -Filter 'SHA256SUMS-*.txt' -File)
          if ($manifest.Count -ne 1) {
            throw "Expected one SHA-256 manifest, found $($manifest.Count)."
          }
          $manifestLines = @(Get-Content $manifest[0].FullName | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($manifestLines.Count -ne 5) {
            throw "Expected 5 SHA-256 entries, found $($manifestLines.Count)."
          }
          foreach ($line in $manifestLines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Invalid SHA-256 manifest line: $line"
            }
            $expected = $matches[1]
            $fileName = $matches[2]
            $zipPath = Join-Path 'artifacts/releases' $fileName
            if (-not (Test-Path $zipPath)) {
              throw "Checksum references missing file: $fileName"
            }
            $actual = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "SHA-256 mismatch for $fileName"
            }
          }
      - name: Upload RID release bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xpscript-release-${{ matrix.rid }}
          path: artifacts/releases/
          if-no-files-found: error
          retention-days: 14
