name: Class Overload Diagnostic Redaction

on:
  pull_request:
    paths:
      - 'src/XPScript.Compiler/ClassOverloadValidator.cs'
      - 'src/XPScript.Compiler/CompilerDiagnosticRedaction.cs'
      - 'samples/diagnostic-redaction-class-overload-error.xps'
      - '.github/workflows/class-overload-diagnostic-redaction.yml'

jobs:
  class-overload-diagnostic-redaction:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify text and JSON redaction
        shell: pwsh
        run: |
          $compiler = 'src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll'
          $sample = 'samples/diagnostic-redaction-class-overload-error.xps'
          $text = & dotnet $compiler $sample --result-format text 2>&1 | Out-String
          $textExit = $LASTEXITCODE
          if ($textExit -eq 0) { throw 'Expected class overload compile failure.' }
          if ($text -match 'DO_NOT_ECHO_CLASS_OVERLOAD') { throw 'Secret literal leaked in text diagnostic.' }
          $json = & dotnet $compiler $sample --result-format json 2>&1 | Out-String
          $jsonExit = $LASTEXITCODE
          if ($jsonExit -eq 0) { throw 'Expected class overload compile failure.' }
          if ($json -match 'DO_NOT_ECHO_CLASS_OVERLOAD') { throw 'Secret literal leaked in JSON diagnostic.' }
          if ($text -notmatch "No overload") { throw 'Expected useful overload diagnostic was not preserved.' }
          $global:LASTEXITCODE = 0
