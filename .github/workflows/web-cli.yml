name: Web CLI

on:
  push:
    paths:
      - '.github/workflows/web-cli.yml'
      - 'src/XPScript.Cli/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.FastCgi/**'
      - 'tests/WebCliSmoke/**'
      - 'XPScriptCompiler.slnx'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/web-cli.yml'
      - 'src/XPScript.Cli/**'
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.FastCgi/**'
      - 'tests/WebCliSmoke/**'
      - 'XPScriptCompiler.slnx'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx
      - name: Build solution
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore
      - name: Run web hosting CLI regression
        run: dotnet run --project ./tests/WebCliSmoke/WebCliSmoke.csproj -c Release
