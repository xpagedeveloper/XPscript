name: Reorder Web and UI TODO

on:
  push:
    branches: [todo-native-http]
    paths:
      - '.github/workflows/reorder-web-ui-todo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-native-http
      - name: Update TODO ordering
        run: python ./tools/reorder-web-ui-todo.py
      - name: Commit TODO updates
        shell: bash
        run: |
          git rm .github/workflows/reorder-web-ui-todo.yml
          git rm tools/reorder-web-ui-todo.py
          git config user.name 'xpagedeveloper'
          git config user.email 'fredrik@xpagedeveloper.com'
          git add todo/runtime-reference-todo.md todo/web-runtime-server-todo.md todo/development-guidelines.md
          git commit -m 'Place web runtime before UI work'
          git push origin HEAD:todo-native-http
