name: HCL Selected Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/HclSelectedCompatibilityRuntimeSource.cs'
      - 'src/XPScript.Compiler/HclSelectedCompatibilityPreprocessor.cs'
      - 'src/XPScript.Compiler/HclPlatformStringRuntimeSource.cs'
      - 'src/XPScript.Compiler/HclPrintFormattingRuntimeSource.cs'
      - 'src/XPScript.Compiler/HclPrintFormattingPreprocessor.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'samples/hcl-selected-compatibility.xps'
      - 'samples/hcl-print-formatting.xps'
      - '.github/workflows/hcl-selected-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hcl-selected:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler and resolve target
        id: target
        shell: pwsh
        run: |
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } elseif ($env:RUNNER_ARCH -eq 'X64') { 'x64' } else { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          if ($env:RUNNER_OS -eq 'Windows') { $rid = "win-$arch"; $ext = '.exe' }
          elseif ($env:RUNNER_OS -eq 'Linux') { $rid = "linux-$arch"; $ext = '' }
          elseif ($env:RUNNER_OS -eq 'macOS') { $rid = "osx-$arch"; $ext = '' }
          else { throw "Unsupported runner OS: $env:RUNNER_OS" }
          "rid=$rid" >> $env:GITHUB_OUTPUT
          "ext=$ext" >> $env:GITHUB_OUTPUT

      - name: Verify selected compatibility functions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = "./out/hcl-selected${{ steps.target.outputs.ext }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hcl-selected-compatibility.xps --runtime '${{ steps.target.outputs.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'HCL selected sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $result = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "HCL selected sample failed.`n$result" }
          if ($result -notcontains 'HCL_SELECTED_COMPATIBILITY=OK') { throw "Success marker missing.`n$result" }

      - name: Verify Spc and Tab formatting
        shell: pwsh
        run: |
          $exe = "./out/hcl-print${{ steps.target.outputs.ext }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/hcl-print-formatting.xps --runtime '${{ steps.target.outputs.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'HCL Print sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $result = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "HCL Print sample failed.`n$result" }
          if ($result -notcontains 'SPC:   X') { throw "Spc output incorrect.`n$result" }
          if ($result -notcontains 'TAB:   X') { throw "Tab output incorrect.`n$result" }
          $wrapIndex = [Array]::IndexOf($result, 'WRAP123')
          if ($wrapIndex -lt 0 -or $wrapIndex + 1 -ge $result.Count -or $result[$wrapIndex + 1] -ne '  X') { throw "Backward Tab wrapping incorrect.`n$result" }
          if ($result -notcontains 'HCL_PRINT_FORMATTING=OK') { throw "Print success marker missing.`n$result" }
