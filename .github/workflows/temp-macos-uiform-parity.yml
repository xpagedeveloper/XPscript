name: TEMP macOS UIForm AST Legacy Parity

on:
  push:
    branches:
      - investigate-ast-compiler
    paths:
      - '.github/workflows/temp-macos-uiform-parity.yml'
      - 'tests/DesktopUIFormLifecycleSmoke/**'
      - 'src/XPScript.Compiler/**'
      - 'src/XPScript.UI.Desktop/**'

permissions:
  contents: read

jobs:
  macos-parity:
    name: macOS UIForm marker parity
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build parity probe
        run: dotnet build ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
      - name: Run and verify AST/legacy markers
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release --no-build 2>&1 | tee ./uiform-parity.log
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('./uiform-parity.log').read_text().splitlines()
          expected = [
              'DESKTOP_PARITY_AST_RUNTIME_START',
              'DESKTOP_PARITY_AST_RUNTIME_OK',
              'DESKTOP_PARITY_LEGACY_RUNTIME_START',
              'DESKTOP_PARITY_LEGACY_RUNTIME_OK',
              'DESKTOP_RUNTIME_LAUNCH_PARITY_OK',
          ]
          positions = [lines.index(item) for item in expected]
          if positions != sorted(positions):
              raise SystemExit(f'Unexpected marker order: {positions}')
          print('DESKTOP_UIFORM_AST_LEGACY_MARKER_PARITY_OK')
          PY
