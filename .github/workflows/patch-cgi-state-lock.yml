name: Patch CGI state lock

on:
  push:
    branches: [todo-web-runtime-cgi-state-persistence]
    paths:
      - '.github/workflows/patch-cgi-state-lock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-web-runtime-cgi-state-persistence
      - name: Replace platform-specific FileStream lock
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/XPScript.Web.Cgi/XpsCgiPersistentState.cs')
          text = path.read_text(encoding='utf-8')
          old = '''    private static async Task<FileStream> AcquireLockAsync(string path, TimeSpan timeout, CancellationToken cancellationToken)
    {
        var stream = new FileStream(path, FileMode.OpenOrCreate, FileAccess.ReadWrite, FileShare.ReadWrite);
        if (stream.Length == 0) stream.SetLength(1);
        var deadline = DateTimeOffset.UtcNow + timeout;
        while (true)
        {
            cancellationToken.ThrowIfCancellationRequested();
            try
            {
                stream.Lock(0, 1);
                return stream;
            }
            catch (IOException) when (DateTimeOffset.UtcNow < deadline)
            {
                await Task.Delay(25, cancellationToken).ConfigureAwait(false);
            }
            catch
            {
                stream.Dispose();
                throw;
            }
            if (DateTimeOffset.UtcNow >= deadline)
            {
                stream.Dispose();
                throw new XpsCgiException("Timed out waiting for the CGI persistent state lock.");
            }
        }
    }

    private static void ReleaseLock(FileStream stream)
    {
        try { stream.Unlock(0, 1); } catch { }
        stream.Dispose();
    }
'''
          new = '''    private static async Task<FileStream> AcquireLockAsync(string path, TimeSpan timeout, CancellationToken cancellationToken)
    {
        var deadline = DateTimeOffset.UtcNow + timeout;
        while (true)
        {
            cancellationToken.ThrowIfCancellationRequested();
            try
            {
                return new FileStream(
                    path,
                    FileMode.OpenOrCreate,
                    FileAccess.ReadWrite,
                    FileShare.None,
                    1,
                    FileOptions.None);
            }
            catch (IOException) when (DateTimeOffset.UtcNow < deadline)
            {
                await Task.Delay(25, cancellationToken).ConfigureAwait(false);
            }
            catch (UnauthorizedAccessException) when (DateTimeOffset.UtcNow < deadline)
            {
                await Task.Delay(25, cancellationToken).ConfigureAwait(false);
            }

            if (DateTimeOffset.UtcNow >= deadline)
                throw new XpsCgiException("Timed out waiting for the CGI persistent state lock.");
        }
    }

    private static void ReleaseLock(FileStream stream) => stream.Dispose();
'''
          if old not in text:
              raise SystemExit('Expected lock block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit lock portability fix
        shell: bash
        run: |
          git config user.name "xpagedeveloper"
          git config user.email "fredrik@xpagedeveloper.com"
          git add src/XPScript.Web.Cgi/XpsCgiPersistentState.cs
          git commit -m "Make CGI persistent state lock cross-platform"
          git push origin HEAD:todo-web-runtime-cgi-state-persistence
