name: Date Diagnostic Redaction

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/CompilerDiagnosticRedaction.cs'
      - 'src/XPScript.Compiler/DateComparisonValidator.cs'
      - 'samples/date-diagnostic-string-redaction-error.xps'
      - '.github/workflows/date-diagnostic-redaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  date-diagnostic-redaction:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }
      - name: Verify raw and structured diagnostic redaction
        shell: pwsh
        run: |
          $source = './samples/date-diagnostic-string-redaction-error.xps'
          foreach ($format in @('text', 'json')) {
            $output = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- $source --result-format $format 2>&1
            $exit = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            $text = $output -join "`n"
            $output | ForEach-Object { Write-Host $_ }

            if ($exit -eq 0) { throw "Expected compilation failure for format $format." }
            if ($text.Contains('DO_NOT_ECHO_DATE_DIAGNOSTIC_SECRET', [StringComparison]::Ordinal)) {
              throw "Date comparison diagnostic leaked string literal for format $format."
            }
            if (-not $text.Contains('Date cannot be compared with SecretProbe', [StringComparison]::Ordinal)) {
              throw "Date comparison diagnostic lost its useful type information for format $format."
            }
          }
