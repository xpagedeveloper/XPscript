name: Supabase PostgreSQL Real Integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supabase-postgres-real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: Supabase real PostgreSQL
    runs-on: ubuntu-latest
    env:
      SUPABASE_POSTGRES_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate PostgreSQL connection string
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_POSTGRES_URL:-}" ]; then
            echo 'SUPABASE_URL secret is missing or empty.' >&2
            exit 1
          fi
          case "$SUPABASE_POSTGRES_URL" in
            postgres://*|postgresql://*) ;;
            *) echo 'SUPABASE_URL must contain a PostgreSQL URI for this test.' >&2; exit 1 ;;
          esac

      - name: Verify Supabase PostgreSQL connection
        shell: bash
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=20

          ping_result="$(psql "$SUPABASE_POSTGRES_URL" -v ON_ERROR_STOP=1 -Atc 'select 1')"
          test "$ping_result" = "1"

          db_name="$(psql "$SUPABASE_POSTGRES_URL" -v ON_ERROR_STOP=1 -Atc 'select current_database()')"
          server_version="$(psql "$SUPABASE_POSTGRES_URL" -v ON_ERROR_STOP=1 -Atc 'show server_version')"
          current_user_name="$(psql "$SUPABASE_POSTGRES_URL" -v ON_ERROR_STOP=1 -Atc 'select current_user')"
          users_relation="$(psql "$SUPABASE_POSTGRES_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.users') is not null")"
          users_count="$(psql "$SUPABASE_POSTGRES_URL" -v ON_ERROR_STOP=1 -Atc 'select count(*) from public.users')"

          echo 'PostgreSQL connection successful.'
          echo "Database: $db_name"
          echo "Server version: $server_version"
          echo "Current user: $current_user_name"
          echo "public.users exists: $users_relation"
          echo "public.users rows: $users_count"

          if [ "$users_relation" != "t" ]; then
            echo 'Expected public.users to exist.' >&2
            exit 1
          fi

      - name: Verify PostgreSQL transaction, parameters and data types
        shell: bash
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=20

          output="$(psql "$SUPABASE_POSTGRES_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          begin;
          create temp table xpscript_ci_postgres_smoke (
            id integer primary key,
            name text not null,
            amount numeric(10,2),
            active boolean,
            note text,
            payload bytea,
            created_at timestamptz not null
          ) on commit drop;
          insert into xpscript_ci_postgres_smoke(id, name, amount, active, note, payload, created_at)
          values (1, 'Ada', 123.45, true, null, decode('01020304', 'hex'), '2026-08-28T12:34:56.123456Z');
          select
            id || '|' || name || '|' || amount || '|' || active || '|' ||
            (note is null) || '|' || encode(payload, 'base64') || '|' ||
            to_char(created_at at time zone 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.US"Z"')
          from xpscript_ci_postgres_smoke
          where id = 1;
          rollback;
          SQL
          )"

          echo "$output"
          echo "$output" | grep -F '1|Ada|123.45|true|true|AQIDBA==|2026-08-28T12:34:56.123456Z'
          echo 'SUPABASE_POSTGRES=OK'
