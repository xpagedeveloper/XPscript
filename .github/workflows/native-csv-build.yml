name: Native CSV Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/NativeCsvRuntimeSource.cs'
      - 'src/XPScript.Compiler/NativeCsvPreprocessor.cs'
      - 'src/XPScript.Compiler/UIExtensionPreprocessor.cs'
      - 'src/XPScript.Compiler/JsonNodesSerializerShimSource.cs'
      - 'samples/native-csv-regression.xps'
      - 'docs/native-csv.md'
      - '.github/workflows/native-csv-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-csv:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile Native CSV API sample
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = if ($IsWindows) { './out/native-csv-regression.exe' } else { './out/native-csv-regression' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-csv-regression.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Native CSV sample compilation failed.' }
      - name: Run and verify Native CSV API sample
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { './out/native-csv-regression.exe' } else { './out/native-csv-regression' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Native CSV regression failed.`n$output" }
          $output | ForEach-Object { Write-Host $_ }
          $required = @(
            'ROWS=2',
            'COLUMNS=3',
            'HEADER0=id',
            'HEADER1=name',
            'HEADER_FORALL=3',
            'ROW0_NAME=Fredrik',
            'ROW0_INDEX=Fredrik',
            'ROW0_NOTE=Hello; world',
            'ROW_FORALL=2',
            'COLUMN=name:Fredrik',
            'COLUMN_FORALL=3',
            'COLUMN_INDEX=Fredrik',
            'STRICT_SET=FNO',
            'MISSING_ERR=5',
            "MISSING_TEXT=CSV column name 'missing' not found.",
            'BUILT=id;name;city',
            '00123;Åsa;"Malmö; Sweden"',
            'ESCAPE="Malmö; Sweden"',
            'ENCODING=windows-1252',
            'ROUNDTRIP=Åsa:Malmö; Sweden',
            'LEADING_ZERO=00123'
          )
          foreach ($value in $required) {
            if ($output -notcontains $value) { throw "Native CSV output missing: $value`n$output" }
          }