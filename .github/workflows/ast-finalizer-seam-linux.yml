name: AST Finalizer Seam (Linux)

on:
  push:
    branches: [investigate-ast-compiler]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ast-finalizer-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Verify test-only finalizer seam generation
        shell: bash
        run: |
          set -euo pipefail
          compiler=./src/XPScript.Compiler/bin/Release/net10.0/xpscriptc.dll
          fixture=./tests/ast-compile-probe/class-lifecycle.xps
          test_output="$RUNNER_TEMP/ast-finalizer-seam"
          normal_output="$RUNNER_TEMP/ast-finalizer-normal"
          XPSCRIPT_AST_FINALIZER_TEST=1 dotnet "$compiler" ast-compile "$fixture" -o "$test_output"
          run_output=$(XPSCRIPT_AST_FINALIZER_TEST=1 dotnet "$test_output/Generated.dll")
          echo "$run_output"
          grep -F 'AST_FINALIZER_SEAM_ENABLED' <<<"$run_output" >/dev/null
          dotnet "$compiler" ast-compile "$fixture" -o "$normal_output"
          if XPSCRIPT_AST_FINALIZER_TEST=1 dotnet "$normal_output/Generated.dll" | grep -F 'AST_FINALIZER_SEAM_ENABLED' >/dev/null; then
            echo 'Finalizer test seam leaked into a normal compile.' >&2
            exit 1
          fi
          echo 'AST_FINALIZER_SEAM_GENERATION_OK'
      - name: Run Linux GC finalizer harness
        shell: bash
        env:
          XPSCRIPT_AST_FINALIZER_TEST: '1'
        run: |
          set -euo pipefail
          pwsh ./tests/ast-compile-probe/run-ast-finalizer-gc.ps1 | tee "$RUNNER_TEMP/finalizer-gc.log"
          grep -F 'AST_FINALIZER_TEST_MARKER=GcProbe;count=1;duplicate=0' "$RUNNER_TEMP/finalizer-gc.log" >/dev/null
          echo 'AST_FINALIZER_GC_OK'
