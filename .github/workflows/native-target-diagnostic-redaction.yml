name: Native Target Diagnostic Redaction

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/NativeLibraryPlatformPreprocessor.cs'
      - 'samples/native-target-diagnostic-redaction-error.xps'
      - '.github/workflows/native-target-diagnostic-redaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-target-diagnostic-redaction:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }
      - name: Verify native target diagnostic redaction
        shell: pwsh
        run: |
          $output = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-target-diagnostic-redaction-error.xps --result-format json 2>&1
          $exit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $text = $output -join "`n"
          $output | ForEach-Object { Write-Host $_ }

          if ($exit -eq 0) { throw 'Expected native target diagnostic compilation failure.' }
          if (-not $text.Contains('Declare requires a native library for the selected target runtime.', [StringComparison]::Ordinal)) {
            throw 'Expected stable native target diagnostic was not returned.'
          }
          if ($text -match 'win-(x64|arm64)|linux-(x64|arm64)|osx-(x64|arm64)') {
            throw 'Native target diagnostic exposed the selected runtime identifier.'
          }
