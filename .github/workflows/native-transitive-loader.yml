name: Native Transitive Loader Security

on:
  pull_request:
    paths:
      - 'src/XPScript.Compiler/NativeInteropRuntimeSource.cs'
      - 'samples/native-transitive-loader.xps'
      - 'tests/NativeTransitiveFixture/**'
      - '.github/workflows/native-transitive-loader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-transitive-loader:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler
        shell: pwsh
        run: |
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }

      - name: Build native transitive fixture
        shell: pwsh
        run: |
          cmake -S ./tests/NativeTransitiveFixture -B ./native-transitive-build -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build ./native-transitive-build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native transitive fixture build failed.' }

          if ($env:RUNNER_OS -eq 'Windows') {
            $helper = 'xps_native_helper.dll'
            $bad = 'xps_native_helper_bad.dll'
            $main = 'xps_native_transitive.dll'
          } elseif ($env:RUNNER_OS -eq 'Linux') {
            $helper = 'libxps_native_helper.so'
            $bad = 'libxps_native_helper_bad.so'
            $main = 'libxps_native_transitive.so'
          } elseif ($env:RUNNER_OS -eq 'macOS') {
            $helper = 'libxps_native_helper.dylib'
            $bad = 'libxps_native_helper_bad.dylib'
            $main = 'libxps_native_transitive.dylib'
          } else {
            throw "Unsupported runner OS: $env:RUNNER_OS"
          }

          $helperFile = Get-ChildItem ./native-transitive-build -Recurse -File -Filter $helper | Select-Object -First 1
          $badFile = Get-ChildItem ./native-transitive-build -Recurse -File -Filter $bad | Select-Object -First 1
          $mainFile = Get-ChildItem ./native-transitive-build -Recurse -File -Filter $main | Select-Object -First 1
          if (-not $helperFile -or -not $badFile -or -not $mainFile) { throw 'One or more native fixture files were not found.' }

          New-Item -ItemType Directory -Force ./samples/native-transitive | Out-Null
          Copy-Item -LiteralPath $helperFile.FullName -Destination (Join-Path ./samples/native-transitive $helper)
          Copy-Item -LiteralPath $mainFile.FullName -Destination (Join-Path ./samples/native-transitive $main)

          "HELPER_NAME=$helper" >> $env:GITHUB_ENV
          "TRUSTED_BUILD_SOURCE=$($helperFile.FullName)" >> $env:GITHUB_ENV
          "BAD_SOURCE=$($badFile.FullName)" >> $env:GITHUB_ENV

      - name: Compile XPScript transitive sample
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/transitive | Out-Null
          $exe = if ($env:RUNNER_OS -eq 'Windows') { './out/transitive/native-transitive-loader.exe' } else { './out/transitive/native-transitive-loader' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-transitive-loader.xps --runtime '${{ matrix.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Transitive native sample compilation failed.' }
          "APP_EXE=$((Resolve-Path -LiteralPath $exe).Path)" >> $env:GITHUB_ENV
          "APP_DIR=$((Resolve-Path -LiteralPath ./out/transitive).Path)" >> $env:GITHUB_ENV

      - name: Verify executable-local dependency wins over current directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./foreign-transitive-cwd | Out-Null
          Copy-Item -LiteralPath $env:BAD_SOURCE -Destination (Join-Path ./foreign-transitive-cwd $env:HELPER_NAME) -Force

          Push-Location ./foreign-transitive-cwd
          try {
            $result = @(& $env:APP_EXE 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Transitive sample failed with trusted helper beside executable.`n$($result -join [Environment]::NewLine)" }
            if ($result -contains 'TRANSITIVE_VALUE=9999') { throw 'Current-directory native helper hijacked the trusted executable-local dependency.' }
            if ($result -notcontains 'TRANSITIVE_VALUE=4242' -or $result -notcontains 'NATIVE_TRANSITIVE=OK') {
              throw "Expected trusted transitive helper result was not observed.`n$($result -join [Environment]::NewLine)"
            }
          } finally {
            Pop-Location
          }

      - name: Verify missing executable-local dependency does not fall back to current directory
        shell: pwsh
        run: |
          $trusted = Join-Path $env:APP_DIR $env:HELPER_NAME
          if (-not (Test-Path -LiteralPath $trusted -PathType Leaf)) { throw "Packaged trusted helper is missing: $trusted" }
          Remove-Item -LiteralPath $trusted -Force
          if (Test-Path -LiteralPath $env:TRUSTED_BUILD_SOURCE -PathType Leaf) {
            Remove-Item -LiteralPath $env:TRUSTED_BUILD_SOURCE -Force
          }

          Push-Location ./foreign-transitive-cwd
          try {
            $result = @(& $env:APP_EXE 2>&1)
            $exitCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }

          if ($result -contains 'TRANSITIVE_VALUE=9999') {
            throw "SECURITY FAILURE: native transitive dependency was loaded from current working directory.`n$($result -join [Environment]::NewLine)"
          }
          if ($exitCode -eq 0 -or $result -contains 'NATIVE_TRANSITIVE=OK') {
            throw "Expected execution to fail after removing every trusted helper copy.`n$($result -join [Environment]::NewLine)"
          }
          exit 0
