name: HTTP Security Closeout

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/NativeHttpRuntimeSource.cs'
      - 'samples/native-http-*.xps'
      - 'tests/native_http_server.py'
      - 'todo/security-review-todo.md'
      - '.github/workflows/http-security-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-security:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }

      - name: Verify HTTP security invariants
        shell: pwsh
        run: |
          $source = Get-Content -Raw ./src/XPScript.Compiler/NativeHttpRuntimeSource.cs
          foreach ($fragment in @(
            'MaxRequestBodyBytes = 8 * 1024 * 1024',
            'MaxResponseBodyBytes = 64 * 1024 * 1024',
            'AllowAutoRedirect = false',
            'TimeSpan.FromSeconds(30)',
            'double.IsNaN(value)',
            'double.IsInfinity(value)',
            'ValidateHeaderName(nameValue)',
            'ValidateHeaderValue(text)',
            "value.IndexOfAny(['\\r', '\\n', '\\0'])",
            'UriKind.Absolute',
            'Uri.UriSchemeHttp',
            'Uri.UriSchemeHttps',
            'HttpCompletionOption.ResponseHeadersRead',
            '_client.Dispose()',
            '_handler.Dispose()',
            'HTTP request failed.',
            'Invalid Content-Type header value.'
          )) {
            if (-not $source.Contains($fragment)) { throw "Missing HTTP security invariant: $fragment" }
          }

      - name: Start local HTTP regression server
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList './tests/native_http_server.py' -PassThru
          $server.Id | Set-Content ./native-http-server.pid
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $client = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 18080)
              $client.Dispose()
              exit 0
            } catch {
              Start-Sleep -Milliseconds 200
            }
          }
          throw 'Local HTTP regression server did not start.'

      - name: Verify header validation and URL scheme policy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/http-security | Out-Null
          $exe = if ($IsWindows) { './out/http-security/header-validation.exe' } else { './out/http-security/header-validation' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-http-header-validation.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'HTTP header-validation sample failed to compile.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          $exit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "HTTP header-validation sample failed at runtime.`n$output" }
          foreach ($required in @('BAD-NAME-ERR=5','BAD-VALUE-ERR=5','BAD-SCHEME-ERR=5','VALID-HEADER=OK')) {
            if ($output -notcontains $required) { throw "Missing HTTP validation marker: $required`n$output" }
          }
          foreach ($forbidden in @('BAD-NAME-NOT-REJECTED','BAD-VALUE-NOT-REJECTED','BAD-SCHEME-NOT-REJECTED')) {
            if ($output -contains $forbidden) { throw "Unsafe HTTP behavior observed: $forbidden" }
          }

      - name: Verify redirect, limits, timeout and disposal
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { './out/http-security/resource-limits.exe' } else { './out/http-security/resource-limits' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-http-resource-limits.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'HTTP resource-limit sample failed to compile.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          $exit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "HTTP resource-limit sample failed at runtime.`n$output" }
          foreach ($required in @(
            'DEFAULT_TIMEOUT=30',
            'REDIRECT_STATUS=302',
            'REDIRECT_BODY=redirect-not-followed',
            'REQUEST_BODY_LIMIT_ERR=5',
            'DECLARED_RESPONSE_LIMIT_ERR=5',
            'STREAM_RESPONSE_LIMIT_ERR=5',
            'TIMEOUT_ERR=5',
            'DISPOSED_ERR=5',
            'HTTP_RESOURCE_LIMITS=OK'
          )) {
            if ($output -notcontains $required) { throw "Missing HTTP resource marker: $required`n$output" }
          }

      - name: Verify binary and multipart responses
        shell: pwsh
        run: |
          Remove-Item ./native-http-single.bin, ./native-http-first.bin, ./native-http-second.bin -Force -ErrorAction SilentlyContinue
          $exe = if ($IsWindows) { './out/http-security/binary-files.exe' } else { './out/http-security/binary-files' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/native-http-binary-files.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'HTTP binary/multipart sample failed to compile.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          $exit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "HTTP binary/multipart sample failed at runtime.`n$output" }
          foreach ($required in @(
            'SINGLE_PARTCOUNT=1',
            'SINGLE_FILECOUNT=1',
            'MULTI_PART_COUNT=3',
            'MULTI_FILE_COUNT=2',
            'META_IS_TEXT=True',
            'META_IS_FILE=False',
            'MULTI_SECOND_NAME=second-å.bin',
            'HTTP_BINARY_FILES=OK'
          )) {
            if ($output -notcontains $required) { throw "Missing HTTP multipart marker: $required`n$output" }
          }

      - name: Stop local HTTP regression server
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./native-http-server.pid) {
            $pidValue = [int](Get-Content ./native-http-server.pid)
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }
