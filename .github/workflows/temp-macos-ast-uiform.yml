name: TEMP macOS AST UIForm

on:
  push:
    branches: [investigate-ast-compiler]
    paths:
      - '.github/workflows/temp-macos-ast-uiform.yml'
      - 'src/XPScript.Compiler/AstCompiler.cs'
      - 'tests/DesktopUIFormLifecycleSmoke/**'

permissions:
  contents: read

jobs:
  ast-uiform:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build probe and compiler
        run: dotnet build ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release
      - name: Compile and run AST UIForm only
        shell: bash
        env:
          XPSCRIPT_TRACE_AST_DESKTOP_ENTRY: '1'
        run: |
          set -euo pipefail
          dotnet run --project ./tests/DesktopUIFormLifecycleSmoke/DesktopUIFormLifecycleSmoke.csproj -c Release --no-build -- --ast-only 2>&1 | tee ast-uiform.log
          grep -q '^DESKTOP_PARITY_AST_RUNTIME_OK$' ast-uiform.log
