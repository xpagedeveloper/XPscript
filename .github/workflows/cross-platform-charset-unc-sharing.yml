name: Cross Platform Charset UNC Sharing

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/TextIoCompatibilityRuntimeSource.cs'
      - 'src/XPScript.Compiler/FileSystemPortabilityRuntimeSource.cs'
      - 'samples/file-charset-matrix.xps'
      - 'samples/file-share-holder.xps'
      - 'samples/file-share-contender.xps'
      - 'samples/file-path-argument-probe.xps'
      - 'todo/done/cross-platform-runtime-todo.md'
      - '.github/workflows/cross-platform-charset-unc-sharing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charset-sharing:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Resolve current RID
        id: rid
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } elseif ($env:RUNNER_ARCH -eq 'X64') { 'x64' } else { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          $os = if ($env:RUNNER_OS -eq 'Windows') { 'win' } elseif ($env:RUNNER_OS -eq 'Linux') { 'linux' } elseif ($env:RUNNER_OS -eq 'macOS') { 'osx' } else { throw "Unsupported runner OS: $env:RUNNER_OS" }
          "rid=$os-$arch" >> $env:GITHUB_OUTPUT
      - name: Compile charset and sharing probes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $suffix = if ($env:RUNNER_OS -eq 'Windows') { '.exe' } else { '' }
          $items = @(
            @{ Source='./samples/file-charset-matrix.xps'; Output="./out/file-charset-matrix$suffix"; Env='CHARSET_EXE' },
            @{ Source='./samples/file-share-holder.xps'; Output="./out/file-share-holder$suffix"; Env='HOLDER_EXE' },
            @{ Source='./samples/file-share-contender.xps'; Output="./out/file-share-contender$suffix"; Env='CONTENDER_EXE' },
            @{ Source='./samples/file-path-argument-probe.xps'; Output="./out/file-path-argument-probe$suffix"; Env='PATH_EXE' }
          )
          foreach ($item in $items) {
            dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- $item.Source --runtime '${{ steps.rid.outputs.rid }}' -o $item.Output --framework-dependent
            if ($LASTEXITCODE -ne 0) { throw "Compilation failed: $($item.Source)" }
            $absolute = (Resolve-Path -LiteralPath $item.Output).Path
            "$($item.Env)=$absolute" >> $env:GITHUB_ENV
          }
      - name: Verify charset aliases and exact bytes
        shell: pwsh
        run: |
          $charsetExe = $env:CHARSET_EXE
          $work = Join-Path $env:RUNNER_TEMP ('xps-charset-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $work | Out-Null
          Push-Location $work
          try {
            $result = & $charsetExe
            if ($LASTEXITCODE -ne 0 -or $result -notcontains 'CHARSET_MATRIX=OK') { throw "Charset matrix failed.`n$result" }
            if ($result -notcontains 'UNSUPPORTED_CHARSET_ERR=5') { throw "Unsupported legacy charset did not produce error 5.`n$result" }

            foreach ($name in 'charset-default.txt','charset-ansi.txt','charset-latin1.txt','charset-latin-dash.txt','charset-iso.txt') {
              $bytes = [IO.File]::ReadAllBytes((Join-Path $work $name))
              if ($bytes.Length -lt 1 -or $bytes[0] -ne 0xC5) { throw "$name is not deterministic Latin-1 (expected first byte C5)." }
            }
            foreach ($name in 'charset-utf8.txt','charset-utf8-dash.txt') {
              $bytes = [IO.File]::ReadAllBytes((Join-Path $work $name))
              if ($bytes[0] -ne 0x41 -or ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) { throw "$name must be BOM-less UTF-8." }
            }
            $bytes = [IO.File]::ReadAllBytes((Join-Path $work 'charset-utf8-bom.txt'))
            if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) { throw 'UTF-8 BOM alias did not write EF BB BF.' }

            foreach ($name in 'charset-utf16.txt','charset-unicode.txt') {
              $bytes = [IO.File]::ReadAllBytes((Join-Path $work $name))
              if ($bytes[0] -ne 0xFF -or $bytes[1] -ne 0xFE) { throw "$name must use UTF-16LE with BOM." }
            }
            $bytes = [IO.File]::ReadAllBytes((Join-Path $work 'charset-utf16le-nobom.txt'))
            if ($bytes[0] -ne 0x41 -or $bytes[1] -ne 0x00) { throw 'UTF-16LE no-BOM alias emitted an unexpected prefix.' }
            $bytes = [IO.File]::ReadAllBytes((Join-Path $work 'charset-utf16be.txt'))
            if ($bytes[0] -ne 0xFE -or $bytes[1] -ne 0xFF) { throw 'UTF-16BE must emit FE FF BOM.' }
            $bytes = [IO.File]::ReadAllBytes((Join-Path $work 'charset-utf16be-nobom.txt'))
            if ($bytes[0] -ne 0x00 -or $bytes[1] -ne 0x41) { throw 'UTF-16BE no-BOM alias emitted an unexpected prefix.' }
            $bytes = [IO.File]::ReadAllBytes((Join-Path $work 'charset-ascii.txt'))
            if ($bytes[0] -ne 0x41) { throw 'ASCII alias emitted an unexpected prefix.' }
            Write-Host 'CHARSET_EXACT_BYTES=OK'
          } finally { Pop-Location }
      - name: Verify cross-process FileShare policy
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('xps-share-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $root | Out-Null
          function Invoke-ShareScenario([string]$holderMode, [string]$contenderMode, [bool]$mustFailOnWindows) {
            $file = Join-Path $root "$holderMode-$contenderMode.dat"
            $ready = Join-Path $root "$holderMode-$contenderMode.ready"
            $stdout = Join-Path $root "$holderMode-$contenderMode.out"
            $stderr = Join-Path $root "$holderMode-$contenderMode.err"
            if ($holderMode -eq 'input') { Set-Content -LiteralPath $file -Value 'seed' -NoNewline }
            $holder = Start-Process -FilePath $env:HOLDER_EXE -ArgumentList @($holderMode,$file,$ready) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            try {
              $deadline = [DateTime]::UtcNow.AddSeconds(15)
              while (-not (Test-Path -LiteralPath $ready) -and [DateTime]::UtcNow -lt $deadline -and -not $holder.HasExited) { Start-Sleep -Milliseconds 50; $holder.Refresh() }
              if (-not (Test-Path -LiteralPath $ready)) { throw "Holder failed to become ready: $(Get-Content -Raw -ErrorAction SilentlyContinue $stderr)" }
              $result = & $env:CONTENDER_EXE $contenderMode $file
              if ($LASTEXITCODE -ne 0 -or $result -notcontains 'FILE_SHARE_CONTENDER=OK') { throw "Contender process failed.`n$result" }
              $line = $result | Where-Object { $_ -like 'OPEN_ERR=*' } | Select-Object -First 1
              if (-not $line) { throw "Missing OPEN_ERR result.`n$result" }
              $errValue = [int]($line -replace '^OPEN_ERR=', '')
              if ($env:RUNNER_OS -eq 'Windows' -and $mustFailOnWindows -and $errValue -eq 0) { throw "$holderMode/$contenderMode should be blocked by Windows FileShare policy.`n$result" }
              if (-not $mustFailOnWindows -and $errValue -ne 0) { throw "$holderMode/$contenderMode unexpectedly failed with error $errValue.`n$result" }
              Write-Host "FILE_SHARE_SCENARIO=$holderMode/$contenderMode err=$errValue"
            } finally {
              if (-not $holder.HasExited) { $holder.WaitForExit(10000) | Out-Null }
              if (-not $holder.HasExited) { $holder.Kill($true) }
              $holder.Dispose()
            }
          }
          Invoke-ShareScenario 'input' 'output' $false
          Invoke-ShareScenario 'output' 'input' $false
          Invoke-ShareScenario 'binary' 'binary' $false
          Invoke-ShareScenario 'output' 'output' $true
      - name: Verify Windows UNC path access
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shareRoot = Join-Path $env:RUNNER_TEMP ('xps-unc-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $shareRoot | Out-Null
          $shareName = 'xps' + [guid]::NewGuid().ToString('N').Substring(0,12)
          $account = "$env:USERDOMAIN\$env:USERNAME"
          New-SmbShare -Name $shareName -Path $shareRoot -FullAccess $account | Out-Null
          try {
            $unc = "\\localhost\$shareName\unc-probe.txt"
            $result = & $env:PATH_EXE create $unc
            if ($LASTEXITCODE -ne 0 -or $result -notcontains 'PATH_ARGUMENT_PROBE=OK') { throw "UNC create failed.`n$result" }
            if (-not (Test-Path -LiteralPath $unc)) { throw "UNC file was not created: $unc" }
            $result = & $env:PATH_EXE filelen $unc
            if ($LASTEXITCODE -ne 0 -or $result -notcontains 'PATH_ARGUMENT_PROBE=OK') { throw "UNC FileLen failed.`n$result" }
            Write-Host 'WINDOWS_UNC_PATH=OK'
          } finally {
            Remove-SmbShare -Name $shareName -Force -ErrorAction SilentlyContinue
          }
