name: File IO Extensions Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Verify generated file routing
        shell: pwsh
        run: |
          dotnet new console --framework net10.0 -n InspectGenerated -o ./out/inspect-generated --force
          dotnet add ./out/inspect-generated/InspectGenerated.csproj reference ./src/XPScript.Compiler/XPScript.Compiler.csproj
          @'
          using XPScript.Compiler;

          var source = File.ReadAllText("./samples/file-io-extensions.xps");
          var generated = new XPScriptTranspiler().Transpile(source, "file-io-extensions.xps", "win-x64");
          var relevant = generated.Split('\n')
              .Select((line, index) => new { Line = line.Trim(), Number = index + 1 })
              .Where(x => x.Line.Contains("LSFileRuntime.Open(", StringComparison.Ordinal) ||
                          x.Line.Contains("LSFileRuntime.Close(", StringComparison.Ordinal) ||
                          x.Line.Contains("OpenText", StringComparison.Ordinal) ||
                          x.Line.Contains("LockBytes", StringComparison.Ordinal) ||
                          x.Line.Contains("UnlockBytes", StringComparison.Ordinal))
              .ToArray();

          foreach (var item in relevant)
              Console.WriteLine($"{item.Number}: {item.Line}");

          var binaryOpen = Array.FindIndex(relevant, x => x.Line.Contains("LSFileRuntime.Open(", StringComparison.Ordinal) && x.Line.Contains("\"binary\"", StringComparison.Ordinal));
          var lockCall = Array.FindIndex(relevant, x => x.Line.Contains("LockBytes", StringComparison.Ordinal) && x.Line.Contains("XPScriptFileIO", StringComparison.Ordinal));
          if (binaryOpen < 0) throw new Exception("Generated code is missing the Binary LSFileRuntime.Open call.");
          if (lockCall < 0) throw new Exception("Generated code is missing the LockBytes call.");
          if (binaryOpen >= lockCall) throw new Exception("Generated Binary LSFileRuntime.Open must occur before LockBytes.");

          for (var i = binaryOpen + 1; i < lockCall; i++)
              if (relevant[i].Line.Contains("LSFileRuntime.Close(", StringComparison.Ordinal))
                  throw new Exception("Generated code closes the Binary file before LockBytes: " + relevant[i].Line);
          '@ | Set-Content ./out/inspect-generated/Program.cs
          dotnet run --project ./out/inspect-generated/InspectGenerated.csproj -c Release

      - name: Compile file IO sample
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-io-extensions.xps -o ./out/file-io-extensions.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'File IO extensions compilation failed.' }

      - name: Verify file Input$, Latin-1, Lock/Unlock and ChDrive
        shell: pwsh
        run: |
          $output = & ./out/file-io-extensions.exe
          foreach ($value in @(
            'FILEINPUT=ÅÄÖ',
            'LATIN1REST=-é',
            'LOCK=OK',
            'UNLOCK=OK',
            'CHDRIVE=C:\'
          )) {
            if ($output -notcontains $value) { throw "File IO output missing: $value`n$output" }
          }

      - name: Verify Lock is an operating-system file lock
        shell: pwsh
        run: |
          Remove-Item ./lock.out, ./lock.err -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath ./out/file-io-extensions.exe -ArgumentList 'hold-lock' -PassThru -RedirectStandardOutput ./lock.out -RedirectStandardError ./lock.err
          $held = $false
          for ($i = 0; $i -lt 80; $i++) {
            if ($process.HasExited) {
              $stderr = if (Test-Path ./lock.err) { Get-Content ./lock.err -Raw } else { '' }
              throw "Lock holder exited before acquiring the lock. Exit=$($process.ExitCode) stderr=$stderr"
            }
            if ((Test-Path ./lock.out) -and ((Get-Content ./lock.out -Raw) -match 'LOCKHELD')) { $held = $true; break }
            Start-Sleep -Milliseconds 50
          }
          if (-not $held) { Stop-Process -Id $process.Id -Force; throw 'Timed out waiting for XPScript OS file lock.' }

          $stream = [System.IO.File]::Open((Join-Path $PWD 'xpscript-lock-test.bin'), [System.IO.FileMode]::Open, [System.IO.FileAccess]::ReadWrite, [System.IO.FileShare]::ReadWrite)
          $blocked = $false
          try {
            try {
              $stream.Lock(0, 3)
              $stream.Unlock(0, 3)
            } catch [System.IO.IOException] {
              $blocked = $true
            }
          } finally {
            $stream.Dispose()
          }
          if (-not $blocked) { Stop-Process -Id $process.Id -Force; throw 'Second OS handle could lock the same byte range; XPScript Lock is not enforcing an OS file lock.' }

          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            $stderr = if (Test-Path ./lock.err) { Get-Content ./lock.err -Raw } else { '' }
            throw "Lock holder failed. Exit=$($process.ExitCode) stderr=$stderr"
          }
