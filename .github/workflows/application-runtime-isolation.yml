name: Application Runtime Isolation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/ApplicationRuntimeSource.cs'
      - 'tests/ApplicationRuntimeIsolationProbe/**'
      - '.github/workflows/application-runtime-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify .NET argument and Application.Args isolation
        run: dotnet run --project ./tests/ApplicationRuntimeIsolationProbe/ApplicationRuntimeIsolationProbe.csproj -c Release
