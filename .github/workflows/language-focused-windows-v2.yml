name: Language Focused Tests (Windows)
# Branch-triggered diagnostic run for the split language suite; CLI corpus retry.
# Push-trigger verification after PowerShell diagnostic interpolation fix.

on:
  push:
    branches: [investigate-ast-compiler]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-focused-windows
  cancel-in-progress: false

jobs:
  language-signatures:
    name: AST signatures and syntax
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run AST signature probe
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/ast-compile-probe/run-ast-array-signature.ps1

  language-compatibility:
    name: AST compatibility and diagnostics
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run AST compatibility corpus
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/ast-compat/run-ast-compat.ps1
      - name: Run diagnostic compatibility corpus
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/ast-compat/run-diagnostic-compat.ps1

  language-cli-shards:
    name: AST CLI shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            script: run-ast-cli.ps1
            arguments: '-Shard 1'
          - shard: 2
            script: run-ast-cli-shard-2.ps1
            arguments: ''
          - shard: 3
            script: run-ast-cli-shard-3.ps1
            arguments: ''
          - shard: 4
            script: run-ast-cli-shard-4.ps1
            arguments: ''
          - shard: 5-constructors
            script: run-ast-cli-shard-5-constructors.ps1
            arguments: ''
          - shard: 5-xpimage
            script: run-ast-image-get.ps1
            arguments: ''
          - shard: 6
            script: run-ast-cli-shard-6.ps1
            arguments: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Build AST compile probe
        shell: pwsh
        run: dotnet build ./tests/ast-compile-probe/AstCompileProbe.csproj -c Release
      - name: Run AST CLI shard ${{ matrix.shard }}
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/ast-compile-probe/${{ matrix.script }} ${{ matrix.arguments }}

  language-constructors:
    name: AST constructors
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run constructor probe
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/ast-compile-probe/run-ast-constructor.ps1

  language-destructors:
    name: AST destructors
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run destructor probe
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/ast-compile-probe/run-ast-destructor.ps1

  language-image-lifetimes:
    name: AST image lifetimes
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Run image lifetime probe
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/ast-compile-probe/run-ast-image-get.ps1

  avalonia-headless-build:
    name: Avalonia headless restore and build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build Avalonia headless probe
        shell: pwsh
        run: dotnet build ./tests/AvaloniaHeadlessInputProbe/AvaloniaHeadlessInputProbe.csproj -c Release
      - name: Upload built Avalonia probe
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-headless-probe-${{ github.run_id }}
          path: tests/AvaloniaHeadlessInputProbe/bin/Release/net10.0
          if-no-files-found: error

  avalonia-headless-run:
    name: Avalonia headless input execution
    needs: avalonia-headless-build
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Download built Avalonia probe
        uses: actions/download-artifact@v4
        with:
          name: avalonia-headless-probe-${{ github.run_id }}
          path: tests/AvaloniaHeadlessInputProbe/bin/Release/net10.0
      - name: Run Avalonia headless input probe
        shell: pwsh
        run: dotnet ./tests/AvaloniaHeadlessInputProbe/bin/Release/net10.0/AvaloniaHeadlessInputProbe.dll
