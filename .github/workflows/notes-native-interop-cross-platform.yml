name: Notes Native Interop Cross Platform

on:
  pull_request:
    paths:
      - 'src/XPScript.Compiler/NotesRuntimeCoreSource.cs'
      - 'src/XPScript.Compiler/NotesNativeApi*.cs'
      - 'src/XPScript.Compiler/NotesRuntime*.cs'
      - 'src/XPScript.Compiler/HclIsDefinedRuntimeSource.cs'
      - 'src/XPScript.Compiler/NotesViewColumnNamesPostProcessor.cs'
      - 'src/XPScript.Compiler/NotesViewNavigationPostProcessor.cs'
      - 'src/XPScript.Compiler/NotesThreadLifecyclePostProcessor.cs'
      - 'samples/notes-view-columnnames-domino-runtime-test.xps'
      - 'samples/notes-view-navigation-v1-domino-runtime-test.xps'
      - 'tests/NativeInteropSmoke/**'
      - 'docs/notes-c-api.md'
      - 'docs/notes-cross-platform-testing.md'
      - 'todo/HCLNotes.md'
      - '.github/workflows/notes-native-interop-cross-platform.yml'
  workflow_dispatch:

jobs:
  native-interop:
    name: native-interop-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --nologo
      - name: Compile Notes C API surface
        shell: bash
        run: |
          mkdir -p artifacts/notes-thread-probe
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- \
            samples/notes-c-api-surface.xps \
            --framework-dependent \
            -o artifacts/notes-thread-probe/notes-thread-probe
      - name: Compile NotesView ColumnNames regression
        shell: bash
        run: |
          mkdir -p artifacts/notes-view-columnnames
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- \
            samples/notes-view-columnnames-domino-runtime-test.xps \
            --framework-dependent \
            -o artifacts/notes-view-columnnames/notes-view-columnnames
      - name: Compile NotesView navigation V1 regression
        shell: bash
        run: |
          mkdir -p artifacts/notes-view-navigation-v1
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- \
            samples/notes-view-navigation-v1-domino-runtime-test.xps \
            --framework-dependent \
            -o artifacts/notes-view-navigation-v1/notes-view-navigation-v1
      - name: Run native interop and unmanaged memory smoke test
        run: dotnet run --project tests/NativeInteropSmoke/NativeInteropSmoke.csproj -c Release
