name: Notes Native Interop Cross Platform

on:
  pull_request:
    paths:
      - 'src/XPScript.Compiler/NotesRuntimeCoreSource.cs'
      - 'src/XPScript.Compiler/NotesNativeApi*.cs'
      - 'src/XPScript.Compiler/NotesRuntime*.cs'
      - 'tests/NativeInteropSmoke/**'
      - 'docs/notes-c-api.md'
      - '.github/workflows/notes-native-interop-cross-platform.yml'
  workflow_dispatch:

jobs:
  native-interop:
    name: native-interop-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --nologo
      - name: Run native interop and unmanaged memory smoke test
        run: dotnet run --project tests/NativeInteropSmoke/NativeInteropSmoke.csproj -c Release
