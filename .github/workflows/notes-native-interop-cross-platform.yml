name: Notes Native Interop Cross Platform

on:
  pull_request:
    paths:
      - 'src/XPScript.Compiler/NotesRuntimeCoreSource.cs'
      - 'src/XPScript.Compiler/NotesNativeApi*.cs'
      - 'src/XPScript.Compiler/NotesRuntime*.cs'
      - 'src/XPScript.Compiler/Notes*PostProcessor.cs'
      - 'src/XPScript.Compiler/HclIsDefinedRuntimeSource.cs'
      - 'src/XPScript.Compiler/NotesView*.cs'
      - 'samples/notes-*.xps'
      - 'scripts/*notes-view-cache*.ps1'
      - 'scripts/validate-notes-view-navigator-cache-policy.ps1'
      - 'tests/NativeInteropSmoke/**'
      - 'docs/notes-*.md'
      - 'todo/HCLNotes.md'
      - '.github/workflows/notes-native-interop-cross-platform.yml'
  workflow_dispatch:

jobs:
  native-interop:
    name: native-interop-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate NotesView cache policy
        shell: pwsh
        run: |
          ./scripts/validate-notes-view-navigator-cache-policy.ps1
          ./scripts/test-notes-view-cache-history-model.ps1
      - name: Build compiler
        run: dotnet build src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --nologo
      - name: Compile Notes full Domino runtime regression
        shell: bash
        run: |
          mkdir -p artifacts/notes-full-domino-runtime
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- samples/notes-full-domino-runtime-test.xps --framework-dependent -o artifacts/notes-full-domino-runtime/notes-full-domino-runtime
      - name: Compile Notes DXL importer exporter surface
        shell: bash
        run: |
          mkdir -p artifacts/notes-dxl
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- samples/notes-dxl-import-export-surface.xps --framework-dependent -o artifacts/notes-dxl/notes-dxl
      - name: Compile Notes extended object surface
        shell: bash
        run: |
          mkdir -p artifacts/notes-extended
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- samples/notes-extended-surface.xps --framework-dependent -o artifacts/notes-extended/notes-extended
      - name: Compile NotesDocument design metadata regression
        shell: bash
        run: |
          mkdir -p artifacts/notes-document-metadata
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- samples/notes-document-design-metadata-runtime-test.xps --framework-dependent -o artifacts/notes-document-metadata/notes-document-metadata
      - name: Compile Notes C API surface
        shell: bash
        run: |
          mkdir -p artifacts/notes-thread-probe
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- samples/notes-c-api-surface.xps --framework-dependent -o artifacts/notes-thread-probe/notes-thread-probe
      - name: Compile NotesView ColumnNames regression
        shell: bash
        run: |
          mkdir -p artifacts/notes-view-columnnames
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- samples/notes-view-columnnames-domino-runtime-test.xps --framework-dependent -o artifacts/notes-view-columnnames/notes-view-columnnames
      - name: Compile NotesView navigation V1 regression
        shell: bash
        run: |
          mkdir -p artifacts/notes-view-navigation-v1
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- samples/notes-view-navigation-v1-domino-runtime-test.xps --framework-dependent -o artifacts/notes-view-navigation-v1/notes-view-navigation-v1
      - name: Compile NotesView navigation V2 regression
        shell: bash
        run: |
          mkdir -p artifacts/notes-view-navigation-v2
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- samples/notes-view-navigation-v2-domino-runtime-test.xps --framework-dependent -o artifacts/notes-view-navigation-v2/notes-view-navigation-v2
      - name: Compile NotesView navigation V3 regression
        shell: bash
        run: |
          mkdir -p artifacts/notes-view-navigation-v3
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- samples/notes-view-navigation-v3-domino-runtime-test.xps --framework-dependent -o artifacts/notes-view-navigation-v3/notes-view-navigation-v3
      - name: Compile NotesView cache policy regression
        shell: bash
        run: |
          mkdir -p artifacts/notes-view-cache-policy
          dotnet run --project src/XPScript.Compiler/XPScript.Compiler.csproj -c Release -- samples/notes-view-navigator-cache-policy-compile.xps --framework-dependent -o artifacts/notes-view-cache-policy/notes-view-cache-policy
      - name: Run native interop and unmanaged memory smoke test
        run: dotnet run --project tests/NativeInteropSmoke/NativeInteropSmoke.csproj -c Release
