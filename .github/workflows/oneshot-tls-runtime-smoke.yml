name: TLS runtime smoke
on: [push]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/per-client-tls-validation
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/XPScript.Cli/XPScript.Cli.csproj -c Release
      - name: Run strict and self-signed TLS smoke
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$TMP/key.pem" -out "$TMP/cert.pem" \
            -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" >/dev/null 2>&1
          cat > "$TMP/server.py" <<'PY'
          import http.server, ssl
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body=b'{"ok":true}'
                  self.send_response(200)
                  self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length',str(len(body)))
                  self.end_headers(); self.wfile.write(body)
              def log_message(self, *args): pass
          server=http.server.HTTPServer(('127.0.0.1',18443),H)
          ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain('CERT','KEY')
          server.socket=ctx.wrap_socket(server.socket,server_side=True)
          server.serve_forever()
          PY
          sed -i "s|CERT|$TMP/cert.pem|; s|KEY|$TMP/key.pem|" "$TMP/server.py"
          python3 "$TMP/server.py" &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 1
          cat > "$TMP/tls.xps" <<'XPS'
          Option Declare
          Sub Main()
              Dim http As New XPHttpClient
              Dim response As XPHttpResponse
              Dim errCode As Integer
              Dim errText As String
              Dim notes As New NotesHTTPRequest
              Dim ai As XPAi
              Dim supa As XPHttpDbSupabase
              Dim domino As XPHttpDbDominoRest

              http.AllowPrivateNetwork = True
              http.CertificateValidation = "Strict"
              notes.CertificateValidation = "Strict"
              Set ai = New XPAi("https://127.0.0.1:18443/")
              ai.CertificateValidation = "Strict"
              Set supa = New XPHttpDbSupabase("https://127.0.0.1:18443", "test-key")
              supa.CertificateValidation = "Strict"
              Set domino = New XPHttpDbDominoRest("https://127.0.0.1:18443", "test-token", "test.nsf")
              domino.CertificateValidation = "Strict"

              On Error Resume Next
              Set response = http.Get("https://127.0.0.1:18443/")
              errCode = Err
              errText = Error$
              On Error GoTo 0

              Print "STRICT-ERR=" & CStr(errCode)
              Print "STRICT-TEXT=" & errText
              If errCode <> 1201 Then Error 9901, "Expected TLS certificate error 1201, got " & CStr(errCode)

              http.CertificateValidation = "AllowSelfSigned"
              Set response = http.Get("https://127.0.0.1:18443/")
              If response.StatusCode <> 200 Then Error 9902, "AllowSelfSigned request failed"
              Print "ALLOW-SELF-SIGNED=OK"

              http.CertificateValidation = "Insecure"
              Set response = http.Get("https://127.0.0.1:18443/")
              If response.StatusCode <> 200 Then Error 9903, "Insecure request failed"
              Print "INSECURE=OK"
              Call ai.Dispose()
          End Sub
          XPS
          dotnet src/XPScript.Cli/bin/Release/net10.0/xpscript.dll run "$TMP/tls.xps" --debug | tee "$TMP/output.txt"
          grep -q 'STRICT-ERR=1201' "$TMP/output.txt"
          grep -q 'TLS certificate validation failed' "$TMP/output.txt"
          grep -q 'ALLOW-SELF-SIGNED=OK' "$TMP/output.txt"
          grep -q 'INSECURE=OK' "$TMP/output.txt"
