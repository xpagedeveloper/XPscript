name: Security Compiler Identifier Regression

on:
  push:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/ReservedIdentifierPreprocessor.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/SourceTypeValidator.cs'
      - 'samples/reserved-identifier-error.xps'
      - 'samples/reserved-runtime-type-error.xps'
      - 'samples/reserved-multiple-identifiers-error.xps'
      - 'samples/reserved-module-multiple-identifiers-error.xps'
      - 'samples/reserved-array-dimension-commas.xps'
      - 'todo/security-review-todo.md'
      - '.github/workflows/security-identifier-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/ReservedIdentifierPreprocessor.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/SourceTypeValidator.cs'
      - 'samples/reserved-identifier-error.xps'
      - 'samples/reserved-runtime-type-error.xps'
      - 'samples/reserved-multiple-identifiers-error.xps'
      - 'samples/reserved-module-multiple-identifiers-error.xps'
      - 'samples/reserved-array-dimension-commas.xps'
      - 'todo/security-review-todo.md'
      - '.github/workflows/security-identifier-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reserved-identifiers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Verify reserved identifier diagnostics
        shell: pwsh
        run: |
          $cases = @(
            @{ Name = 'reserved-identifier-error.xps'; Line = 2 },
            @{ Name = 'reserved-runtime-type-error.xps'; Line = 1 },
            @{ Name = 'reserved-multiple-identifiers-error.xps'; Line = 4 },
            @{ Name = 'reserved-module-multiple-identifiers-error.xps'; Line = 3 }
          )

          New-Item -ItemType Directory -Force -Path ./out | Out-Null

          foreach ($case in $cases) {
            $sample = $case.Name
            $source = Join-Path './samples' $sample
            $output = Join-Path './out' ([IO.Path]::GetFileNameWithoutExtension($sample) + '.exe')
            $resultText = @(dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- $source -o $output --framework-dependent --result-format json)
            $compilerExitCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($compilerExitCode -eq 0) {
              throw "Expected reserved identifier sample '$sample' to fail compilation."
            }

            $jsonText = $resultText -join "`n"
            try { $result = $jsonText | ConvertFrom-Json }
            catch { throw "Expected valid JSON compiler diagnostics for '$sample'." }

            if ($result.result -ne 'error' -or $null -eq $result.errors -or $result.errors.Count -lt 1) {
              throw "Expected structured compiler error for '$sample'."
            }

            $diagnostic = $result.errors[0]
            $diagnostics = $result.errors | ConvertTo-Json -Depth 8
            if ($diagnostics -notmatch '(?i)reserved') {
              throw "Expected reserved identifier diagnostic for '$sample'."
            }
            if ($diagnostic.line -ne $case.Line) {
              throw "$sample mapped to line $($diagnostic.line), expected $($case.Line)."
            }
            if ($diagnostic.position -lt 1) {
              throw "$sample did not return a valid source position."
            }

            $sourceLines = Get-Content -LiteralPath $source
            $expectedCode = $sourceLines[$case.Line - 1].Trim()
            if ([string]::IsNullOrWhiteSpace($diagnostic.code) -or $diagnostic.code.Trim() -ne $expectedCode) {
              throw "$sample mapped code '$($diagnostic.code)' but expected '$expectedCode'."
            }
          }

          Write-Host 'SECURITY-RESERVED-IDENTIFIERS=OK'

      - name: Verify commas inside array dimensions remain declaration-local
        shell: pwsh
        run: |
          $source = './samples/reserved-array-dimension-commas.xps'
          $exe = if ($IsWindows) { './out/reserved-array-dimension-commas.exe' } else { './out/reserved-array-dimension-commas' }
          $resultText = @(dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- $source -o $exe --framework-dependent --result-format json)
          if ($LASTEXITCODE -ne 0) {
            $resultText | ForEach-Object { Write-Host $_ }
            throw 'Array-dimension comma regression failed to compile.'
          }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Array-dimension comma regression failed at runtime.`n$output" }
          $output | ForEach-Object { Write-Host $_ }
          if ($output -notcontains 'RESERVED-ARRAY-COMMAS=7') {
            throw "Array-dimension comma regression returned unexpected output.`n$output"
          }
