name: File IO Security Closeout

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/FileSystemPortabilityRuntimeSource.cs'
      - 'samples/file-io-portability.xps'
      - 'samples/file-path-security-negatives.xps'
      - 'samples/fileio-entry-symlink-safety.xps'
      - 'todo/security-review-todo.md'
      - '.github/workflows/file-io-security-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-io-security:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler and resolve RID
        id: target
        shell: pwsh
        run: |
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } elseif ($env:RUNNER_ARCH -eq 'X64') { 'x64' } else { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          $os = if ($env:RUNNER_OS -eq 'Windows') { 'win' } elseif ($env:RUNNER_OS -eq 'Linux') { 'linux' } elseif ($env:RUNNER_OS -eq 'macOS') { 'osx' } else { throw "Unsupported runner OS: $env:RUNNER_OS" }
          $ext = if ($env:RUNNER_OS -eq 'Windows') { '.exe' } else { '' }
          "rid=$os-$arch" >> $env:GITHUB_OUTPUT
          "ext=$ext" >> $env:GITHUB_OUTPUT
      - name: Verify File IO runtime invariants
        shell: pwsh
        run: |
          $source = Get-Content -Raw ./src/XPScript.Compiler/FileSystemPortabilityRuntimeSource.cs
          foreach ($fragment in @(
            'Path.GetFullPath(path)',
            'Share = FileShare.ReadWrite',
            'Share = FileShare.Read',
            'explicit Lock/Unlock coordination',
            'RejectLinkedPath(destination, "FileCopy", "destination")',
            'RejectLinkedPath(path, "Kill", "target")',
            'RejectLinkedPath(source, "Name", "source")',
            'RejectLinkedPath(destination, "Name", "destination")',
            'RejectLinkedPath(path, "RmDir", "target")'
          )) {
            if (-not $source.Contains($fragment)) { throw "Missing File IO invariant: $fragment" }
          }
          if ($source -match 'sandbox.*source directory') { throw 'General File IO unexpectedly introduced a source-directory sandbox.' }
      - name: Verify portable File IO runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $exe = "./out/file-io-portability${{ steps.target.outputs.ext }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-io-portability.xps --runtime '${{ steps.target.outputs.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'File IO portability sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'File IO portability sample failed.' }
      - name: Prepare link fixtures
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue ./edge-fixture, ./toctou-fixture
          New-Item -ItemType Directory -Force ./edge-fixture/real-dir | Out-Null
          Set-Content -LiteralPath ./edge-fixture/real-file.txt -Value 'real' -NoNewline
          if ($IsWindows) {
            New-Item -ItemType SymbolicLink -Path ./edge-fixture/linked-file.txt -Target ./real-file.txt | Out-Null
            New-Item -ItemType Junction -Path ./edge-fixture/linked-dir -Target (Resolve-Path ./edge-fixture/real-dir) | Out-Null
          } else {
            ln -s real-file.txt ./edge-fixture/linked-file.txt
            ln -s real-dir ./edge-fixture/linked-dir
          }
          New-Item -ItemType Directory -Force ./toctou-fixture/rmdir-target | Out-Null
          Set-Content -NoNewline -Path ./toctou-fixture/kill-target.txt -Value 'KILL_TARGET_SAFE'
          Set-Content -NoNewline -Path ./toctou-fixture/name-source-target.txt -Value 'NAME_SOURCE_TARGET_SAFE'
          Set-Content -NoNewline -Path ./toctou-fixture/name-destination-target.txt -Value 'NAME_DEST_TARGET_SAFE'
          Set-Content -NoNewline -Path ./toctou-fixture/rmdir-target/keep.txt -Value 'RMDIR_TARGET_SAFE'
          New-Item -ItemType SymbolicLink -Path ./toctou-fixture/kill-link -Target (Resolve-Path ./toctou-fixture/kill-target.txt).Path | Out-Null
          New-Item -ItemType SymbolicLink -Path ./toctou-fixture/name-source-link -Target (Resolve-Path ./toctou-fixture/name-source-target.txt).Path | Out-Null
          New-Item -ItemType SymbolicLink -Path ./toctou-fixture/name-destination-link -Target (Resolve-Path ./toctou-fixture/name-destination-target.txt).Path | Out-Null
          New-Item -ItemType SymbolicLink -Path ./toctou-fixture/rmdir-link -Target (Resolve-Path ./toctou-fixture/rmdir-target).Path | Out-Null
      - name: Verify linked path rejection
        shell: pwsh
        run: |
          $exe = "./out/file-path-security${{ steps.target.outputs.ext }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/file-path-security-negatives.xps --runtime '${{ steps.target.outputs.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Path security sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $result = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0 -or $result -notcontains 'PATH_SECURITY_NEGATIVES=OK') { throw "Path security regression failed.`n$result" }
      - name: Verify entry TOCTOU safety
        shell: pwsh
        run: |
          $exe = "./out/fileio-entry-safety${{ steps.target.outputs.ext }}"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/fileio-entry-symlink-safety.xps --runtime '${{ steps.target.outputs.rid }}' -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Entry safety sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }
          $result = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0 -or $result -notcontains 'TOCTOU_ENTRY_SAFETY=DONE') { throw "Entry safety regression failed.`n$result" }
          if ((Get-Content -Raw ./toctou-fixture/kill-target.txt) -ne 'KILL_TARGET_SAFE') { throw 'Kill affected symlink target.' }
          if ((Get-Content -Raw ./toctou-fixture/name-source-target.txt) -ne 'NAME_SOURCE_TARGET_SAFE') { throw 'Name affected source symlink target.' }
          if ((Get-Content -Raw ./toctou-fixture/name-destination-target.txt) -ne 'NAME_DEST_TARGET_SAFE') { throw 'Name affected destination symlink target.' }
          if ((Get-Content -Raw ./toctou-fixture/rmdir-target/keep.txt) -ne 'RMDIR_TARGET_SAFE') { throw 'RmDir affected directory symlink target.' }
