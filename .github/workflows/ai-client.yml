name: XPAi Client

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/AiRuntimeSource.cs'
      - 'src/XPScript.Compiler/AiSessionRuntimePostProcessor.cs'
      - 'src/XPScript.Compiler/AiToolRuntimeSource.cs'
      - 'src/XPScript.Compiler/AiToolCallbackValidator.cs'
      - 'src/XPScript.Compiler/AsyncHttpRuntimeSource.cs'
      - 'src/XPScript.Compiler/CallbackRuntimeSource.cs'
      - 'src/XPScript.Compiler/NativeHttpJsonPreprocessor.cs'
      - 'src/XPScript.Compiler/ReservedIdentifierPreprocessor.cs'
      - 'src/XPScript.Compiler/SourceLineContinuationPreprocessor.cs'
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'src/XPScript.Web.Compiler/**'
      - 'tests/WebCompilerSmoke/**'
      - 'samples/xpai.xps'
      - 'tools/xpai_mock_server.py'
      - 'docs/ai.md'
      - 'docs/commands.md'
      - 'docs/index.md'
      - 'todo/ai-client-todo.md'
      - 'README.md'
      - '.github/workflows/ai-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj

      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore

      - name: Verify AITool callback compile-time validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/xpai | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false

          $missing = @'
          Option Declare
          Sub Main()
              Dim tool As New AITool("test")
              Call tool.AddFunction("run", "Run test", "MissingHandler")
          End Sub
          '@
          $missingPath = './out/xpai/missing-tool-callback.xps'
          Set-Content -Path $missingPath -Value $missing
          $missingOutput = @(dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- $missingPath -o ./out/xpai/missing-tool-callback --framework-dependent 2>&1)
          $missingExitCode = $LASTEXITCODE
          if ($missingExitCode -eq 0) { throw 'Missing AITool callback unexpectedly compiled.' }
          if (($missingOutput -join "`n") -notmatch "AITool callback 'MissingHandler' was not found") {
            throw "Missing callback diagnostic was not emitted.`n$missingOutput"
          }

          $arity = @'
          Option Declare
          Function ExistingHandler(call As Variant) As Variant
              ExistingHandler = "ok"
          End Function
          Sub Main()
              Dim tool As New AITool("test")
              Call tool.AddFunction("run", "Run test", "ExistingHandler", "context")
          End Sub
          '@
          $arityPath = './out/xpai/wrong-tool-callback-arity.xps'
          Set-Content -Path $arityPath -Value $arity
          $arityOutput = @(dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- $arityPath -o ./out/xpai/wrong-tool-callback-arity --framework-dependent 2>&1)
          $arityExitCode = $LASTEXITCODE
          if ($arityExitCode -eq 0) { throw 'Wrong-arity AITool callback unexpectedly compiled.' }
          if (($arityOutput -join "`n") -notmatch "AITool callback 'ExistingHandler' must accept 2 parameter") {
            throw "Callback arity diagnostic was not emitted.`n$arityOutput"
          }

      - name: Compile and run XPAi regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/xpai | Out-Null
          $exe = if ($IsWindows) { './out/xpai/xpai.exe' } else { './out/xpai/xpai' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/xpai.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'XPAi sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $exe }

          $python = if (Get-Command python3 -ErrorAction SilentlyContinue) { 'python3' } else { 'python' }
          $server = Start-Process -FilePath $python -ArgumentList './tools/xpai_mock_server.py', '18765' -PassThru
          try {
            $serverReady = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($server.HasExited) { throw 'XPAi mock server exited before becoming ready.' }
              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                $client.Connect('127.0.0.1', 18765)
                $serverReady = $true
                break
              }
              catch {
                Start-Sleep -Milliseconds 500
              }
              finally {
                $client.Dispose()
              }
            }
            if (-not $serverReady) { throw 'XPAi mock server did not become ready.' }

            $env:XPSCRIPT_AI_ENDPOINT = 'http://127.0.0.1:18765/custom/chat'
            $env:XPSCRIPT_AI_COMPAT_BASE = 'http://127.0.0.1:18765'
            $output = @(& $exe 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "XPAi regression failed.`n$output" }
            $output | ForEach-Object { Write-Host $_ }

            $required = @(
              'STATUS=200',
              'TOOLS=2',
              'TOOL-HAS=True',
              'TOOL-FIRST=retrieval',
              'TOOL-CONTEXT=tenant-a',
              'TOOL-TIMEOUT=12',
              'TOOL-REMOVE=True',
              'TOOLS-AFTER-REMOVE=1',
              'TOOLS-AFTER-CLEAR=0',
              'TOOL-FUNCTIONS=1',
              'TOOL-HAS-FUNCTION=True',
              'TOOL-HANDLER=weather:get_weather:Stockholm:metric:tenant-42',
              'TOOL-FINAL=Stockholm weather fetched',
              'SESSION-FIRST=SESSION-FIRST',
              'SESSION-ID-1=session-response-1',
              'SESSION-HAS-1=True',
              'SESSION-CONTINUE=SESSION-CONTINUE',
              'SESSION-ID-2=session-response-2',
              'SESSION-AFTER-NEW=False',
              'SESSION-TOOLS=1',
              'SESSION-NEW=SESSION-FIRST',
              'SESSION-ID-NEW=session-response-1',
              'PRESET-OPENAI=https://api.openai.com/v1/chat/completions',
              'PRESET-CLAUDE=https://api.anthropic.com/v1/chat/completions',
              'PRESET-OPENROUTER=https://openrouter.ai/api/v1/chat/completions',
              'PRESET-AZURE=https://xpscript-test.openai.azure.com/openai/v1/chat/completions',
              'PRESET-AZURE-PROVIDER=Azure',
              'OPENAI-COMPAT=OK',
              'OPENROUTER-COMPAT=OK',
              'AZURE-COMPAT=OK',
              'HTTP-ASYNC=http-77:200:{"message": "async-ok"}',
              'HTTP-ASYNC-DONE=True',
              'SUCCESS=True',
              'MODEL=mock-model',
              'TEXT=Hello response',
              'TOKENS=7',
              'RAWEXTRA=True',
              'CHUNK=Hello ',
              'CHUNK=stream',
              'STREAM=Hello stream',
              'COLLECTED=Hello stream',
              'CALLBACK=request-42:7:Hello ',
              'CALLBACK=request-42:7:stream',
              'STREAM-CONTEXT=Hello stream',
              'PROVIDER-ERROR=XPAi request failed with HTTP status 401.',
              'XPAI=OK'
            )
            foreach ($value in $required) {
              if ($output -notcontains $value) { throw "XPAi output missing: $value`n$output" }
            }
            if (($output -join "`n") -match 'XPAI_SECRET_MARKER') { throw 'XPAi leaked the API key in output.' }
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
