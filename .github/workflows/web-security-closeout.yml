name: Web Security Closeout

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'tests/WebSecurityCloseoutSmoke/**'
      - 'docs/web-runtime-security-review.md'
      - 'todo/runtime-reference-todo.md'
      - '.github/workflows/web-security-closeout.yml'
  push:
    branches:
      - 'todo-web-runtime-security-closeout'
      - 'todo-web-runtime-cookie-completeness'
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'tests/WebSecurityCloseoutSmoke/**'
      - 'docs/web-runtime-security-review.md'
      - 'todo/runtime-reference-todo.md'
      - '.github/workflows/web-security-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore security closeout regression
        run: dotnet restore ./tests/WebSecurityCloseoutSmoke/WebSecurityCloseoutSmoke.csproj
      - name: Run security closeout regression
        run: dotnet run --project ./tests/WebSecurityCloseoutSmoke/WebSecurityCloseoutSmoke.csproj -c Release
