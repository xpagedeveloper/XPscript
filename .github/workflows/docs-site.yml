name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - '.github/workflows/docs-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-site:
    name: Build documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install documentation dependencies
        run: npm install --no-audit --no-fund

      - name: Audit existing documentation
        run: npm run docs:audit

      - name: Build static documentation
        run: npm run build

      - name: Verify generated links
        run: npm run docs:links

      - name: Prepare documentation preview artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          rm -rf docs-preview
          mkdir -p docs-preview
          cp -R docs-site/dist/. docs-preview/
          touch docs-preview/.nojekyll
          cat > docs-preview/README.md <<'EOF'
          # Generated documentation preview

          This directory is generated from `docs/` by the Astro documentation build on `main`.

          Do not edit these files manually. They are regenerated automatically when documentation sources change.

          Useful generated pages:

          - `functions/index.html`
          - `functions/string/index.html`
          - `functions/string/len/index.html`
          - `functions/string/mid/index.html`
          - `functions/string/replace/index.html`
          - `functions/string/strtoken/index.html`
          EOF

      - name: Upload documentation preview artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: docs-preview
          if-no-files-found: error
