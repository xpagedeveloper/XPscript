name: Parameterless Procedure Header Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify parameterless procedure headers
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/parameterless-procedure-headers.xps -o ./out/parameterless-procedure-headers.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Parameterless procedure header sample compilation failed.' }
          $output = & ./out/parameterless-procedure-headers.exe
          foreach ($value in @('SUB=OK','FUNCTION=7','CLASS_FUNCTION=9','PROPERTY=11')) {
            if ($output -notcontains $value) { throw "Parameterless procedure output missing: $value`n$output" }
          }
      - name: Verify malformed parameterless procedure headers remain invalid
        shell: pwsh
        run: |
          $output = dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/parameterless-procedure-header-error.xps -o ./out/parameterless-procedure-header-error.exe --framework-dependent 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Malformed parameterless procedure header unexpectedly compiled.`n$output" }
          if (($output -join "`n") -notmatch 'Unsupported') { throw "Expected explicit compiler diagnostic for malformed header.`n$output" }
