name: UI Runtime Core

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/UIExtensionPreprocessor.cs'
      - 'src/XPScript.Compiler/UIExtensionRuntimeSource.cs'
      - 'src/XPScript.Compiler/UIExtensionDesktopPostProcessor.cs'
      - 'src/XPScript.Compiler/UIForm*PostProcessor.cs'
      - 'src/XPScript.Compiler/UIListViewRuntimeSource.cs'
      - 'src/XPScript.Compiler/UIListView*PostProcessor.cs'
      - 'src/XPScript.Compiler/CompilerBuildEnvironment.cs'
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.UI.Desktop/**'
      - 'src/XPScript.UI.Browser/**'
      - 'src/XPScript.Compiler/NativeHttpJsonPreprocessor.cs'
      - 'src/XPScript.Compiler/IncrementRuntimeSource.cs'
      - 'tests/WebCompilerSmoke/**'
      - 'samples/ui-form-*.xps'
      - 'samples/ui-layout-*.xps'
      - 'samples/ui-list-view-*.xps'
      - 'samples/customer-form.xps'
      - '.github/workflows/ui-form-core.yml'
  push:
    branches:
      - main
      - 'fix-navigation-state-handoff'
      - 'todo-ui-form-*'
      - 'uiform-*'
    paths:
      - 'src/XPScript.Compiler/UIExtensionPreprocessor.cs'
      - 'src/XPScript.Compiler/UIExtensionRuntimeSource.cs'
      - 'src/XPScript.Compiler/UIExtensionDesktopPostProcessor.cs'
      - 'src/XPScript.Compiler/UIForm*PostProcessor.cs'
      - 'src/XPScript.Compiler/UIListViewRuntimeSource.cs'
      - 'src/XPScript.Compiler/UIListView*PostProcessor.cs'
      - 'src/XPScript.Compiler/CompilerBuildEnvironment.cs'
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.UI.Desktop/**'
      - 'src/XPScript.UI.Browser/**'
      - 'src/XPScript.Compiler/NativeHttpJsonPreprocessor.cs'
      - 'src/XPScript.Compiler/IncrementRuntimeSource.cs'
      - 'tests/WebCompilerSmoke/**'
      - 'samples/ui-form-*.xps'
      - 'samples/ui-layout-*.xps'
      - 'samples/ui-list-view-*.xps'
      - 'samples/customer-form.xps'
      - '.github/workflows/ui-form-core.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile and verify UIForm core
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/ui-form-core$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/ui-form-core.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'UIForm core compilation failed.' }
          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "UIForm core runtime failed with code $LASTEXITCODE." }
          $output | ForEach-Object { Write-Host $_ }
          foreach ($value in @(
            'FIRST_TITLE=First',
            'FIRST_WIDTH=640',
            'FIRST_HEIGHT=480',
            'FIRST_RESIZABLE=True',
            'FIRST_HAS_SIZE=True',
            'SECOND_TITLE=Second',
            'SECOND_WIDTH=0',
            'SECOND_HEIGHT=0',
            'SECOND_HAS_SIZE=False',
            'FIRST_CHANGED_TITLE=Changed',
            'FIRST_CHANGED_WIDTH=800',
            'FIRST_CHANGED_HEIGHT=600',
            'FIRST_CHANGED_RESIZABLE=False',
            'SECOND_STILL_TITLE=Second'
          )) {
            if ($output -notcontains $value) { throw "UIForm output missing: $value" }
          }
      - name: Compile and verify UIForm list boxes
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/ui-form-listboxes$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/ui-form-listboxes.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'UIForm list box compilation failed.' }
          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "UIForm list box runtime failed with code $LASTEXITCODE." }
          $output | ForEach-Object { Write-Host $_ }
          foreach ($value in @(
            'COUNTRY=NO',
            'MARKET_COUNT=2',
            'MARKET0=SE',
            'MARKET1=DK'
          )) {
            if ($output -notcontains $value) { throw "UIForm list box output missing: $value" }
          }
      - name: Compile and verify UIForm structural elements
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/ui-form-structural-elements$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/ui-form-structural-elements.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'UIForm structural element compilation failed.' }
          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "UIForm structural element runtime failed with code $LASTEXITCODE." }
          $output | ForEach-Object { Write-Host $_ }
          if ($output -notcontains 'FIELD_COUNT=5') { throw 'UIForm structural element count is incorrect.' }
      - name: Compile UIForm action and layout samples
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          foreach ($sample in @('ui-form-actions', 'ui-layout-reactive')) {
            $program = "./out/$sample$extension"
            dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- "./samples/$sample.xps" -o $program --framework-dependent
            if ($LASTEXITCODE -ne 0) { throw "$sample compilation failed." }
          }
      - name: Compile and verify UIListView core
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/ui-list-view-core$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/ui-list-view-core.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'UIListView core compilation failed.' }
          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "UIListView core runtime failed with code $LASTEXITCODE." }
          $output | ForEach-Object { Write-Host $_ }
          foreach ($value in @(
            'TITLE=Customers',
            'ROWS=2',
            'COLUMNS=2',
            'ROW0_NAME=Kalle',
            'SELECTED_INDEX=1',
            'SELECTED_NAME=Anna',
            'SELECTED_KEY=1002',
            'SELECTED_AFTER_CLEAR=-1'
          )) {
            if ($output -notcontains $value) { throw "UIListView output missing: $value" }
          }
      - name: Compile UIListView desktop sample
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/ui-list-view-desktop$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/ui-list-view-desktop.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'ui-list-view-desktop compilation failed.' }
      - name: Compile web UI samples through XpsWebCompiler
        shell: pwsh
        run: |
          dotnet run --project ./tests/WebCompilerSmoke/WebCompilerSmoke.csproj -c Release -- ./samples/ui-list-view-web.xps ./samples/customer-form.xps
          if ($LASTEXITCODE -ne 0) { throw 'Web UI sample compilation failed.' }
