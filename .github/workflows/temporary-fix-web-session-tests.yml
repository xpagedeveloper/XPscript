name: Temporary update web status tests
on:
  push:
    branches: [web-session-roles-status]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: web-session-roles-status
      - shell: python
        run: |
          from pathlib import Path
          p=Path('tests/WebFastCgiSmoke/Program.cs')
          s=p.read_text()
          s=s.replace('if (!getOutput.Contains("Status: 201\\r\\n", StringComparison.Ordinal)) throw new Exception("FastCGI status was not serialized.");', 'if (!getOutput.Contains("Status: 201 Created by XPScript\\r\\n", StringComparison.Ordinal)) throw new Exception("FastCGI status code/message was not serialized.");')
          s=s.replace('if (!headOutput.Contains("Status: 201\\r\\n", StringComparison.Ordinal)) throw new Exception("FastCGI HEAD status was not serialized.");', 'if (!headOutput.Contains("Status: 201 Created by XPScript\\r\\n", StringComparison.Ordinal)) throw new Exception("FastCGI HEAD status code/message was not serialized.");')
          s=s.replace('        context.Response.StatusCode = 201;\n', '        context.Response.SetStatus(201, "Created by XPScript");\n')
          p.write_text(s)
          Path('.github/workflows/temporary-fix-web-session-tests.yml').unlink()
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Verify FastCGI custom status messages"
          git push origin HEAD:web-session-roles-status
