name: Apply Core Error Wrapper Fix

on:
  push:
    branches:
      - todo-security-verification-reconcile
    paths:
      - '.github/workflows/apply-core-error-wrapper-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-security-verification-reconcile
      - name: Patch control keyword classification
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/XPScript.Compiler/CoreCompatibilityTranspiler.cs')
          text = path.read_text(encoding='utf-8')
          old = 'if (Regex.IsMatch(t, @"^(Dim|Static|If|ElseIf|Else|End\\s+If|For|Next|ForAll|End\\s+ForAll|While|Wend|Do|Loop|Exit\\b)", RegexOptions.IgnoreCase)) return false;'
          new = 'if (Regex.IsMatch(t, @"^(?:(?:Dim|Static|If|ElseIf|Else|For|Next|ForAll|While|Wend|Do|Loop|Exit)\\b|End\\s+(?:If|ForAll)\\b)", RegexOptions.IgnoreCase)) return false;'
          if old not in text:
              raise SystemExit('Expected IsProtectableStatement pattern not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/XPScript.Compiler/CoreCompatibilityTranspiler.cs
          git commit -m 'Fix On Error keyword prefix classification'
          git push origin HEAD:todo-security-verification-reconcile
