name: Null Array List Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'samples/null-array-list-runtime.xps'
      - 'src/XPScript.Compiler/CoreCompatibilityRuntimeSource.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'src/XPScript.Compiler/TypeCoercionPreprocessor.cs'
      - 'src/XPScript.Compiler/OperatorArrayCompatibilityRuntimeSource.cs'
      - 'todo/null-empty-nothing-semantics.md'
      - '.github/workflows/null-array-list-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release
      - name: Verify normal runtime Array and List Null semantics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out | Out-Null
          $output = if ($IsWindows) { './out/null-array-list-runtime.exe' } else { './out/null-array-list-runtime' }
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/null-array-list-runtime.xps -o $output --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Null Array/List runtime sample compilation failed.' }
          if (-not $IsWindows) { chmod +x $output }
          $result = @(& $output 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Null Array/List runtime sample failed.`n$result" }
          $result | ForEach-Object { Write-Host $_ }
          $required = @(
            'ARRAY_EMPTY=True',
            'ARRAY_NULL=True',
            'ARRAY_NULL_TYPE=NULL',
            'ARRAY_MUTATE_TO_NULL=True',
            'ARRAY_MUTATE_TO_EMPTY=True',
            'REDIM_EMPTY=True',
            'REDIM_NULL=True',
            'REDIM_NEW_EMPTY=True',
            'LIST_EMPTY=True',
            'LIST_NULL=True',
            'LIST_NULL_TYPE=NULL',
            'LIST_MUTATE_TO_NULL=True',
            'LIST_MUTATE_TO_EMPTY=True',
            'NULL_ARRAY_LIST_RUNTIME=OK'
          )
          foreach ($value in $required) {
            if ($result -notcontains $value) { throw "Null Array/List output missing: $value`n$result" }
          }
          $joined = $result -join "`n"
          if ($joined -match 'DBNull|NullSentinel|LSRef') {
            throw "Internal NULL/object-reference representation leaked through Array/List output.`n$result"
          }
