name: Web CSRF

on:
  pull_request:
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'tests/WebCsrfSmoke/**'
      - '.github/workflows/web-csrf.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'tests/WebCsrfSmoke/**'
      - '.github/workflows/web-csrf.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx
      - name: Build solution
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore
      - name: Run CSRF regression
        run: dotnet run --project ./tests/WebCsrfSmoke/WebCsrfSmoke.csproj -c Release
