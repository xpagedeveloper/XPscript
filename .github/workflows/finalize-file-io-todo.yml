name: Finalize File IO Verification

on:
  push:
    branches: [todo-file-io-verification]
    paths:
      - '.github/workflows/finalize-file-io-todo.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-file-io-verification
      - name: Mark verified File IO TODO items complete
        shell: pwsh
        run: |
          $path = 'todo/runtime-reference-todo.md'
          $text = Get-Content $path -Raw
          $replacements = @{
            '- [>] file `Input$(count, #fileNumber)` distinct from interactive input' = '- [x] file `Input$(count, #fileNumber)` distinct from interactive input; verified by `File IO Extensions Compatibility`'
            '- [>] OS `Lock` / `Unlock` with Binary byte ranges, Random record ranges and sequential whole-file semantics' = '- [x] OS `Lock` / `Unlock` with Binary byte ranges, Random record ranges and sequential whole-file semantics; verified from a second operating-system file handle'
            '- [>] `ChDrive`' = '- [x] `ChDrive` on Windows; cross-platform non-Windows semantics remain tracked under section 14'
            '- [>] explicit Latin-1 regression source' = '- [x] explicit Latin-1 regression source; verified by `samples/file-io-extensions.xps`'
            'File input and interactive input are distinct APIs. `Lock/Unlock` must be verified from a second operating-system file handle when tests are re-enabled.' = 'File input and interactive input are distinct APIs. `Lock/Unlock` is regression-tested from a second operating-system file handle on Windows; cross-platform lock portability remains tracked under section 14.'
          }
          foreach ($key in $replacements.Keys) {
            if (-not $text.Contains($key)) { throw "Expected TODO text not found: $key" }
            $text = $text.Replace($key, $replacements[$key])
          }
          Set-Content $path $text -NoNewline
      - name: Restore File IO workflow to manual-only
        shell: pwsh
        run: |
          $path = '.github/workflows/file-io-extensions-build.yml'
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, '(?ms)^on:\r?\n  workflow_dispatch:\r?\n  push:\r?\n    branches: \[todo-file-io-verification\]\r?\n    paths:\r?\n      - ''\.github/workflows/file-io-extensions-build\.yml''\r?\n', "on:`n  workflow_dispatch:`n")
          Set-Content $path $text -NoNewline
      - name: Commit finalization and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name 'xpagedeveloper'
          git config user.email 'fredrik@xpagedeveloper.com'
          git rm .github/workflows/finalize-file-io-todo.yml
          git add todo/runtime-reference-todo.md .github/workflows/file-io-extensions-build.yml
          git commit -m 'Complete File IO verification TODO'
          git push origin HEAD:todo-file-io-verification
