name: Web Graceful Shutdown

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.FastCgi/**'
      - 'tests/WebGracefulShutdownSmoke/**'
      - '.github/workflows/web-graceful-shutdown.yml'
  push:
    branches: ['todo-web-runtime-graceful-shutdown']
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Kestrel/**'
      - 'src/XPScript.Web.FastCgi/**'
      - 'tests/WebGracefulShutdownSmoke/**'
      - '.github/workflows/web-graceful-shutdown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore shutdown regression
        run: dotnet restore ./tests/WebGracefulShutdownSmoke/WebGracefulShutdownSmoke.csproj
      - name: Run graceful shutdown regression
        run: dotnet run --project ./tests/WebGracefulShutdownSmoke/WebGracefulShutdownSmoke.csproj -c Release
