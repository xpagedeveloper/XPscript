name: Web Runtime Objects

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Web.Runtime/XpsWebRequest.cs'
      - 'src/XPScript.Web.Runtime/XpsWebResponse.cs'
      - 'src/XPScript.Web.Runtime/XpsWebServer.cs'
      - 'src/XPScript.Web.Runtime/XpsWebRuntimeObjects.cs'
      - 'src/XPScript.Web.Compiler/XpsWebCompiler.cs'
      - 'src/XPScript.Web.Compiler/XpsWebDispatcher.cs'
      - 'tests/WebObjectsSmoke/**'
      - '.github/workflows/web-runtime-objects.yml'
      - 'XPScriptCompiler.slnx'
  push:
    branches: ['todo-web-runtime-objects']
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'src/XPScript.Web.Compiler/**'
      - 'tests/WebObjectsSmoke/**'
      - '.github/workflows/web-runtime-objects.yml'
      - 'XPScriptCompiler.slnx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx

      - name: Build solution
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore

      - name: Run Request Response Server XPScript regression
        run: dotnet run --project ./tests/WebObjectsSmoke/WebObjectsSmoke.csproj -c Release
