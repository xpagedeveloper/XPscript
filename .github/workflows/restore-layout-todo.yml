name: Restore Layout TODO

on:
  push:
    branches: [todo-if-layouts]
    paths:
      - '.github/workflows/restore-layout-todo.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-if-layouts
          fetch-depth: 0
      - name: Restore full TODO from main and apply layout audit
        shell: pwsh
        run: |
          git checkout origin/main -- todo/runtime-reference-todo.md
          python ./tools/restore-and-expand-layout-todo.py
      - name: Commit repaired TODO
        shell: bash
        run: |
          git rm .github/workflows/restore-layout-todo.yml
          git rm tools/restore-and-expand-layout-todo.py
          git config user.name 'xpagedeveloper'
          git config user.email 'fredrik@xpagedeveloper.com'
          git add todo/runtime-reference-todo.md
          git commit -m 'Expand statement layout audit TODO'
          git push origin HEAD:todo-if-layouts
