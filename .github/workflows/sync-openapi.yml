name: Sync OpenAPI fixtures

on:
  push:
    paths:
      - ".github/workflows/sync-openapi.yml"
      - "test/openapi/download-openapi.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download OpenAPI specifications
        run: bash test/openapi/download-openapi.sh
      - name: Commit downloaded specifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/openapi
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "test: add OpenAPI fixtures"
          git push
