name: Notes Runtime Fixture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notes-runtime-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-fixture:
    name: Validate Notes runtime fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate DXL fixture contract
        shell: pwsh
        run: ./scripts/validate-notes-runtime-fixture.ps1
