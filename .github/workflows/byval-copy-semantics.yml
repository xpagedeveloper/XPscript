name: ByVal Copy Semantics

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/ParameterPassingPreprocessor.cs'
      - 'src/XPScript.Compiler/ParameterPassingPostProcessor.cs'
      - 'src/XPScript.Compiler/EvaluateByValSyntaxPreprocessor.cs'
      - 'src/XPScript.Compiler/EvaluateArgumentRuntimeSource.cs'
      - 'src/XPScript.Compiler/AdvancedXPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/XPScriptListRuntimeSource.cs'
      - 'src/XPScript.Compiler/CoreCompatibilityRuntimeSource.cs'
      - 'src/XPScript.Compiler/EvaluateCollectionIsolationRuntimeSource.cs'
      - 'src/XPScript.Compiler/FileSystemPortabilityPostProcessor.cs'
      - 'samples/byval-copy-semantics.xps'
      - '.github/workflows/byval-copy-semantics.yml'
  push:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/ParameterPassingPreprocessor.cs'
      - 'src/XPScript.Compiler/ParameterPassingPostProcessor.cs'
      - 'src/XPScript.Compiler/EvaluateByValSyntaxPreprocessor.cs'
      - 'src/XPScript.Compiler/EvaluateArgumentRuntimeSource.cs'
      - 'src/XPScript.Compiler/AdvancedXPScriptTranspiler.cs'
      - 'src/XPScript.Compiler/XPScriptListRuntimeSource.cs'
      - 'src/XPScript.Compiler/CoreCompatibilityRuntimeSource.cs'
      - 'src/XPScript.Compiler/EvaluateCollectionIsolationRuntimeSource.cs'
      - 'src/XPScript.Compiler/FileSystemPortabilityPostProcessor.cs'
      - 'samples/byval-copy-semantics.xps'
      - '.github/workflows/byval-copy-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  byval-copy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build compiler
        shell: pwsh
        run: |
          dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Compiler build failed.' }
      - name: Verify default ByRef and explicit ByVal semantics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/byval-copy | Out-Null
          $exe = if ($IsWindows) { './out/byval-copy/byval-copy.exe' } else { './out/byval-copy/byval-copy' }
          & dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/byval-copy-semantics.xps -o $exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Parameter passing semantics sample failed to compile.' }
          if (-not $IsWindows) { chmod +x $exe }
          $output = @(& $exe 2>&1)
          $runtimeExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $output | ForEach-Object { Write-Host $_ }
          if ($runtimeExitCode -ne 0) { throw "Parameter passing semantics sample failed at runtime with exit code $runtimeExitCode." }
          foreach ($marker in 'BYREF-SUB=OK','BYVAL-SUB=OK','BYREF-FUNCTION=OK','BYVAL-FUNCTION=OK','BYREF-EVALUATE=OK','BYVAL-EVALUATE=OK') {
            if ($output -notcontains $marker) { throw "Missing parameter-passing regression marker: $marker" }
          }
