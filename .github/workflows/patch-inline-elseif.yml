name: Patch Inline ElseIf

on:
  push:
    branches: [todo-if-layouts]
    paths:
      - 'tools/patch-inline-elseif.py'
      - '.github/workflows/patch-inline-elseif.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: todo-if-layouts
      - name: Apply inline ElseIf patch
        run: python ./tools/patch-inline-elseif.py
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'xpagedeveloper'
          git config user.email 'fredrik@xpagedeveloper.com'
          git add src/XPScript.Compiler/AdvancedXPScriptTranspiler.cs
          git commit -m 'Support inline ElseIf statements'
          git push origin HEAD:todo-if-layouts
