name: Null String Concatenation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Compiler/TypeCoercionPreprocessor.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'samples/null-string-concatenation.xps'
      - '.github/workflows/null-string-concatenation.yml'
      - 'todo/null-empty-nothing-semantics.md'
  push:
    branches:
      - 'todo-null-string-concatenation'
    paths:
      - 'src/XPScript.Compiler/TypeCoercionPreprocessor.cs'
      - 'src/XPScript.Compiler/TypeCoercionRuntimeSource.cs'
      - 'samples/null-string-concatenation.xps'
      - '.github/workflows/null-string-concatenation.yml'
      - 'todo/null-empty-nothing-semantics.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore compiler
        shell: pwsh
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        shell: pwsh
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Compile and verify NULL string concatenation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/null-string | Out-Null
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $program = "./out/null-string/null-string$extension"
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/null-string-concatenation.xps -o $program --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'NULL string fixture compilation failed.' }
          $output = & $program
          if ($LASTEXITCODE -ne 0) { throw "NULL string fixture exited with code $LASTEXITCODE." }
          $output | ForEach-Object { Write-Host $_ }
          foreach ($value in @(
            'NULL_LEFT=right',
            'NULL_RIGHT=left',
            'NULL_BOTH=True',
            'EMPTY_LEFT=right',
            'EMPTY_RIGHT=left'
          )) {
            if ($output -notcontains $value) { throw "NULL string output missing: $value" }
          }
