name: Compiler Output Safety

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/XPScript.Compiler/CompilerOutputPublisher.cs'
      - 'src/XPScript.Compiler/CompilerSecureFileCopy.cs'
      - 'src/XPScript.Compiler/CompilerPathSecurity.cs'
      - 'src/XPScript.Compiler/CompilerDriver.cs'
      - 'tests/CompilerOutputSafetyProbe/**'
      - '.github/workflows/compiler-output-safety.yml'

permissions:
  contents: read

jobs:
  output-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify compiler output and dependency safety
        run: dotnet run --project ./tests/CompilerOutputSafetyProbe/CompilerOutputSafetyProbe.csproj -c Release
