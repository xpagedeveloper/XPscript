name: Statement Separator Colon Temp

on:
  push:
    branches: [todo-statement-separator-colon]
    paths:
      - '.github/workflows/statement-separator-colon-temp.yml'
      - 'samples/statement-separator-colon.xps'
      - 'src/XPScript.Compiler/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ./src/XPScript.Compiler/XPScript.Compiler.csproj
      - name: Build compiler
        run: dotnet build ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-restore
      - name: Verify colon statement separator
        shell: pwsh
        run: |
          dotnet run --project ./src/XPScript.Compiler/XPScript.Compiler.csproj -c Release --no-build -- ./samples/statement-separator-colon.xps -o ./out/statement-separator-colon.exe --framework-dependent
          if ($LASTEXITCODE -ne 0) { throw 'Colon statement separator sample compilation failed.' }
          $output = & ./out/statement-separator-colon.exe
          foreach ($value in @('COLON-A','COLON-B','VALUE=2','STRING=A:B:C','ALT=A:B:C','BRACE=A:B:C','COMMENT=OK','IF-A','IF-B','ELSE-A','ELSE-B','ELSEIF-A','ELSEIF-B','LABEL=OK','INLINE-LABEL=OK','ERL-BEFORE','COLON-ERL=31')) {
            if ($output -notcontains $value) { throw "Colon separator output missing: $value`n$output" }
          }
          foreach ($bad in @('LABEL-BAD','IF-BAD','IF-BAD-2','ELSEIF-BAD','ERL-AFTER-BAD')) {
            if ($output -contains $bad) { throw "Unexpected colon separator output: $bad`n$output" }
          }
