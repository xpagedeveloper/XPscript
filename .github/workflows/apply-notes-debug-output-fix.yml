name: Apply Notes debug output fix

on:
  push:
    branches:
      - fix/debug-notes-output

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[notes-debug-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply targeted source changes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          # The unified CLI must distinguish explicit --info from --debug.
          cli = Path('src/XPScript.Cli/Program.cs')
          text = cli.read_text(encoding='utf-8')
          marker = 'if (args.Length == 0 || args[0] is "--help" or "-h")\n'
          insertion = '''ConfigureRuntimeDiagnosticEnvironment(args);\n\n'''
          if insertion not in text:
              if marker not in text:
                  raise SystemExit('CLI Program.cs startup marker not found')
              text = text.replace(marker, insertion + marker, 1)
          helper_marker = 'static async Task<int> RunWebAsync(string[] commandArgs)\n'
          helper = '''static void ConfigureRuntimeDiagnosticEnvironment(string[] arguments)\n{\n    if (arguments.Length == 0 || !arguments[0].Equals("run", StringComparison.OrdinalIgnoreCase))\n        return;\n\n    var separator = Array.IndexOf(arguments, "--");\n    var optionCount = separator < 0 ? arguments.Length : separator;\n    var explicitInfo = arguments.Take(optionCount).Any(value => value.Equals("--info", StringComparison.OrdinalIgnoreCase));\n    Environment.SetEnvironmentVariable("XPSCRIPT_RUNTIME_INFO", explicitInfo ? "1" : null);\n}\n\n'''
          if helper not in text:
              if helper_marker not in text:
                  raise SystemExit('CLI Program.cs helper marker not found')
              text = text.replace(helper_marker, helper + helper_marker, 1)
          cli.write_text(text, encoding='utf-8')

          # Keep direct XPScript.Compiler execution consistent with the unified CLI.
          compiler_program = Path('src/XPScript.Compiler/Program.cs')
          text = compiler_program.read_text(encoding='utf-8')
          marker = 'if (ShouldWriteBanner(args))\n'
          insertion = '''ConfigureRuntimeDiagnosticEnvironment(args);\n\n'''
          if insertion not in text:
              if marker not in text:
                  raise SystemExit('Compiler Program.cs startup marker not found')
              text = text.replace(marker, insertion + marker, 1)
          helper_marker = 'static bool ShouldWriteBanner(string[] arguments)\n'
          helper = '''static void ConfigureRuntimeDiagnosticEnvironment(string[] arguments)\n{\n    if (arguments.Length == 0 || !arguments[0].Equals("run", StringComparison.OrdinalIgnoreCase))\n        return;\n\n    var separator = Array.IndexOf(arguments, "--");\n    var optionCount = separator < 0 ? arguments.Length : separator;\n    var explicitInfo = arguments.Take(optionCount).Any(value => value.Equals("--info", StringComparison.OrdinalIgnoreCase));\n    Environment.SetEnvironmentVariable("XPSCRIPT_RUNTIME_INFO", explicitInfo ? "1" : null);\n}\n\n'''
          if helper not in text:
              if helper_marker not in text:
                  raise SystemExit('Compiler Program.cs helper marker not found')
              text = text.replace(helper_marker, helper + helper_marker, 1)
          compiler_program.write_text(text, encoding='utf-8')

          # XPscript-owned Notes diagnostics must never leak outside detailed debug mode.
          files = [
              'src/XPScript.Compiler/NotesNativeApiBaseSource.cs',
              'src/XPScript.Compiler/NotesNativeApiDatabaseSource.cs',
              'src/XPScript.Compiler/NotesRuntimeCoreSource.cs',
          ]
          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = text.replace('Console.Error.WriteLine("DEBUG ', 'XPScriptRuntimeDebugTrace.WriteLine("DEBUG ')
              p.write_text(text, encoding='utf-8')

          # HCL Notes emits the non-indexed FT warning natively. Silence native stderr only
          # around FTSearch unless explicit --info and --debug are both active.
          search = Path('src/XPScript.Compiler/NotesNativeApiSearchSource.cs')
          text = search.read_text(encoding='utf-8')
          old = '            var status = Resolve<FTSearchDelegate>("FTSearch")(db, ref searchHandle, collection, queryText.Pointer, options, limit, 0, out var count, 0, out results);'
          new = '            using var nativeStandardError = XPScriptRuntimeDebugTrace.SuppressNativeStandardErrorUnlessDetailed();\n            var status = Resolve<FTSearchDelegate>("FTSearch")(db, ref searchHandle, collection, queryText.Pointer, options, limit, 0, out var count, 0, out results);'
          if old not in text:
              raise SystemExit('FTSearch native call marker not found')
          text = text.replace(old, new, 1)
          search.write_text(text, encoding='utf-8')

          # Remove this one-shot workflow from the resulting branch.
          Path('.github/workflows/apply-notes-debug-output-fix.yml').unlink()

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[notes-debug-applied] Gate Notes diagnostics by info and debug"
          git push origin HEAD:fix/debug-notes-output
