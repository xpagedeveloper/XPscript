name: Import OpenAPI fixtures
on:
  push:
    branches: [test-openapi-import-class-skeletons]
    paths: [".github/workflows/import-openapi-test-branch.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-openapi-import-class-skeletons
      - run: bash test/openapi/download-openapi.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/openapi
          git diff --cached --quiet && exit 0
          git commit -m "test: add OpenAPI fixtures"
          git push origin HEAD:test-openapi-import-class-skeletons
