name: Web Runtime Core

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'tests/WebRuntimeSmoke/**'
      - 'docs/web-runtime-architecture.md'
      - 'docs/web-runtime-security-review.md'
      - 'todo/web-runtime-server-todo.md'
      - '.github/workflows/web-runtime-core.yml'
      - 'XPScriptCompiler.slnx'
  push:
    branches: ['todo-web-runtime-*']
    paths:
      - 'src/XPScript.Web.Runtime/**'
      - 'tests/WebRuntimeSmoke/**'
      - 'docs/web-runtime-architecture.md'
      - 'docs/web-runtime-security-review.md'
      - 'todo/web-runtime-server-todo.md'
      - '.github/workflows/web-runtime-core.yml'
      - 'XPScriptCompiler.slnx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ./XPScriptCompiler.slnx

      - name: Build solution
        run: dotnet build ./XPScriptCompiler.slnx -c Release --no-restore

      - name: Run web runtime smoke and security regression
        run: dotnet run --project ./tests/WebRuntimeSmoke/WebRuntimeSmoke.csproj -c Release
