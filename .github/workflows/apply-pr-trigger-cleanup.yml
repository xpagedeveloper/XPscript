name: Apply PR Trigger Cleanup

on:
  push:
    branches: [workflow-pr-trigger-cleanup]
    paths:
      - '.github/workflows/apply-pr-trigger-cleanup.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: workflow-pr-trigger-cleanup

      - name: Rewrite workflow PR triggers
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.github/workflows')

          post_merge_only = {
              'dotnet10-build.yml',
              'branding-regression.yml',
              'security-concurrent-compile-regression.yml',
              'cross-platform-all-rid-compile.yml',
          }

          narrow = {
              'include-source-mapping.yml': [
                  "      - 'src/XPScript.Compiler/Include*.cs'",
                  "      - 'src/XPScript.Compiler/SourcePreprocessor*.cs'",
                  "      - 'src/XPScript.Compiler/CompilerDriver.cs'",
              ],
              'include-dependency-discovery.yml': [
                  "      - 'src/XPScript.Compiler/Include*.cs'",
                  "      - 'src/XPScript.Compiler/SourcePreprocessor*.cs'",
                  "      - 'src/XPScript.Compiler/CompilerDriver.cs'",
              ],
              'include-source-files.yml': [
                  "      - 'src/XPScript.Compiler/Include*.cs'",
                  "      - 'src/XPScript.Compiler/SourcePreprocessor*.cs'",
                  "      - 'src/XPScript.Compiler/CompilerDriver.cs'",
              ],
              'direct-script-execution.yml': [
                  "      - 'src/XPScript.Compiler/Program.cs'",
                  "      - 'src/XPScript.Compiler/CompilerDriver.cs'",
                  "      - 'src/XPScript.Compiler/Direct*.cs'",
              ],
              'control-flow-errors-build.yml': [
                  "      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'",
                  "      - 'src/XPScript.Compiler/SourceTypeValidator.cs'",
              ],
              'parameterless-procedure-build.yml': [
                  "      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'",
              ],
              'if-elseif-layout-verification.yml': [
                  "      - 'src/XPScript.Compiler/XPScriptTranspiler.cs'",
              ],
              'evaluate-runtime-compatibility.yml': [
                  "      - 'src/XPScript.Compiler/XPScriptEvaluate*.cs'",
                  "      - 'src/XPScript.Compiler/Evaluate*.cs'",
                  "      - 'src/XPScript.Compiler/FileSystemPortabilityPostProcessor.cs'",
              ],
          }

          fs_specific = {
              'cross-platform-path-security.yml',
              'cross-platform-file-io-platform-semantics.yml',
              'cross-platform-file-io-portability.yml',
              'cross-platform-charset-unc-sharing.yml',
              'cross-platform-filesystem-edge.yml',
          }

          def remove_pr_block(text):
              lines = text.splitlines()
              out = []
              i = 0
              while i < len(lines):
                  if lines[i] == '  pull_request:':
                      i += 1
                      while i < len(lines) and (lines[i].startswith('    ') or lines[i] == ''):
                          i += 1
                      continue
                  out.append(lines[i])
                  i += 1
              text = '\n'.join(out) + '\n'
              if '\n  push:' not in text:
                  text = text.replace('on:\n', 'on:\n  push:\n    branches: [main]\n', 1)
              elif 'main' not in text.split('  push:',1)[1].split('\n  ',1)[0]:
                  section = text.split('  push:',1)[1].split('\n  ',1)[0]
                  if 'branches:' not in section:
                      text = text.replace('  push:\n', '  push:\n    branches: [main]\n', 1)
                  else:
                      text = re.sub(r'(  push:\n(?:    .*\n)*?    branches:\s*\[)([^\]]*)(\])', lambda m: m.group(1) + (m.group(2) + ', main' if m.group(2).strip() else 'main') + m.group(3), text, count=1)
              return text

          changed = []
          for path in root.glob('*.yml'):
              name = path.name
              if name == 'apply-pr-trigger-cleanup.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              if name in post_merge_only:
                  text = remove_pr_block(text)

              if name in narrow and "      - 'src/XPScript.Compiler/**'" in text:
                  text = text.replace("      - 'src/XPScript.Compiler/**'", '\n'.join(narrow[name]))

              if name in fs_specific:
                  text = text.replace("      - 'src/XPScript.Compiler/FileSystemPortabilityPostProcessor.cs'\n", '')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          policy = root / 'pr-workflow-scope.yml'
          policy.write_text("""name: PR Workflow Scope\n\non:\n  pull_request:\n    branches: [main]\n    paths:\n      - '.github/workflows/**'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  scope-audit:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n      - name: Reject broad feature PR triggers\n        shell: python\n        run: |\n          from pathlib import Path\n          allowed = {'required-pr-gate.yml'}\n          offenders = []\n          for path in Path('.github/workflows').glob('*.yml'):\n              if path.name in allowed:\n                  continue\n              text = path.read_text(encoding='utf-8')\n              if '  pull_request:' in text and \"- 'src/XPScript.Compiler/**'\" in text:\n                  offenders.append(path.name)\n          if offenders:\n              raise SystemExit('Broad compiler PR path filters are not allowed: ' + ', '.join(sorted(offenders)))\n          print('PR-WORKFLOW-SCOPE=OK')\n""", encoding='utf-8')
          changed.append(str(policy))
          Path('workflow-cleanup-files.txt').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print('\n'.join(changed))

      - name: Upload rewritten workflows
        uses: actions/upload-artifact@v4
        with:
          name: scoped-workflows
          path: |
            .github/workflows
            workflow-cleanup-files.txt
          if-no-files-found: error
